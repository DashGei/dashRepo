                <h5>Chapter 5, Creating a Character</h5>

                <h2>Who Are You?</h2>

                <p>There are many places to start when creating a character, but the method this book recommends ensures
                    that your character is fun for you, your party, and the DM. This section is tailored primary to my
                    (Awesomecool Dashiell Geiser's) tastes, but most fantasy TTRPG tables generally function similar to
                    mine.</p>

                <p>Communicate and consider with your DM and fellow players what you want the general mood and genre to
                    be for the game. My personal favorite is somewhere between the Resident Evil and Metal Gear series.
                </p>

                <p>First, I recommend choosing a personality for your character which you believe would be fun for you
                    and the rest of the table. Not all character ideas are built for the table, extremely ideological,
                    anti-social, or chaotic characters can easily create schisms at the table which make it difficult to
                    continue the game. Remember that creating a mechanically sound and competent character is quite
                    easy, but making a character that fits your table is more of an investment.</p>

                <p>The method which I (Awesomecool Dashiell Geiser) find best for testing whether or not your character
                    will be enjoyable at the table is this:</p>

                <h3>Dash's Really Awesome Method of Character Personality and Background and Origin and Such</h3>

                <p>Imagine yourself at a party or other social gathering. You should be able to imagine yourself
                    interacting with your character, and later deciding that although you had a nice talk, you can't see
                    yourself interacting with them much intentionally. They might have been a little too socially
                    awkward, self absorbed, loud, or maybe nothing totally clicked.</p>

                <p>This ensures that your character will be able to function well with the other people at your table,
                    but it also means your character won't just be yourself. Never make a character that would not join
                    up with your other party members.</p>

                <p>Never create a character who would refuse to work alongside the rest of the party.</p>

                <p><strong>Next,</strong> choose your character's background. Why are they looking out for adventure? Do
                    they seek to indiscriminately aid the good people of the world? Do they require money to pursue a
                    personal goal? Are they looking for a person or artifact?</p>

                <p>Your character's personality is also important at this step, what led to them behaving they way they
                    do? Why do they react to the world in their own unique way? Think about the answers to some of the
                    following questions:</p>

                <ul>
                    <li>Who raised you and how?</li>

                    <li>What was your proudest moment?</li>

                    <li>What was your most shameful?</li>

                    <li>What organizations have you interacted with?</li>

                    <li>Are you friend or foe to them?</li>

                    <li>What keeps you going when things get tough?</li>
                </ul>

                <p><strong>Choose four experiences</strong> that best align with your character's background.</p>

                <p>You can choose an experience more than once if it benefits you to do so.</p>

                <h3>Experiences</h3>

                <ul>
                    <li><strong>Handy.</strong> You gain proficiency in one Tool of your choice.</li>
                    <a>|</a>
                    <li><strong>Speaker.</strong> You learn one language of your choice.</li>
                    <a>|</a>
                    <li><strong>Scholar.</strong> You learn to read and write in one language you know.</li>
                    <a>|</a>
                    <li><strong>Devotee.</strong> Choose a deity. The party cannot have a negative standing with that
                        deity.</li>
                    <a>|</a>
                    <li><strong>One Contact.</strong> Work with your GM to establish one specific person or family in a
                        city or region of your choice. This person owes you a minor favor and is generally willing to
                        help you with information, shelter, or a small risk.</li>
                    <a>|</a>
                    <li><strong>Membership.</strong> Work with your DM to choose an organization (Temple, Guild, ).
                        Members recognize you as one of their own and generally provide basic lodging, meals, local
                        information, or professional advice when reasonable.</li>
                    <a>|</a>
                    <li><strong>Military Service.</strong> You once served in an organized military force. You have
                        Advantage on checks to identify military ranks, procedures, insignia, and tactics.</li>
                    <a>|</a>
                    <li><strong>Alchemist.</strong> You add 1d6 to Intelligence or Medicine checks to identify a potion,
                        oil, or alchemical substance by sight or smell.</li>
                    <a>|</a>
                    <li><strong>Natural Affinity.</strong> You add 1d6 to Wisdom (Animal Handling) checks with four
                        beasts of your choice.</li>
                    <a>|</a>
                    <li><strong>Strong Swimmer.</strong> You have a swimming speed equal to your walking speed.</li>
                    <a>|</a>
                    <li><strong>Sea Legs.</strong> You add 1d6 to checks to avoid falling or being knocked Prone on a
                        moving ship or slippery surface.</li>
                    <a>|</a>
                    <li><strong>Weather Eye.</strong> After observing the sky and wind for 10 minutes, you can
                        accurately predict natural weather conditions for the next 12 hours or determine if the weather
                        is unnatural.</li>
                    <a>|</a>
                    <li><strong>Streetwise.</strong> You add 1d6 to Charisma checks to gather rumors or locate someone
                        willing to buy or sell illegal goods.</li>
                    <a>|</a>
                    <li><strong>Bluff.</strong> You add 1d6 to Charisma (Deception) checks to bluff during games or
                        tense social situations.</li>
                    <a>|</a>
                    <li><strong>Haggle.</strong> You add 1d6 to Charisma checks to negotiate prices when buying or
                        selling goods.</li>
                    <a>|</a>
                    <li><strong>Fair Price.</strong> You automatically know the approximate market value of any common
                        trade good. For rare or exotic items, you have Advantage on checks to estimate their value.</li>
                    <a>|</a>
                    <li><strong>Scout's Eye.</strong> While scouting ahead as the lead traveler, you add 1d6 to
                        Perception checks to detect ambushes or hazards.</li>
                    <a>|</a>
                    <li><strong>Experienced Performer.</strong> You must already have the Hobby Performer experience.
                        Gain proficiency with one musical instrument of your choice. Whenever you roll below an 8 on the
                        d20 for a Performance check, treat the roll as an 8.</li>
                    <a>|</a>
                    <li><strong>Captivate.</strong> When you perform for at least 1 minute, up to six intelligent
                        creatures watching you have Disadvantage on Perception checks to notice anything other than your
                        performance until you stop or they are interrupted.</li>
                    <a>|</a>
                    <li><strong>Sacred Texts.</strong> You add 1d6 to Intelligence checks to recall information about
                        your religion's history, important figures, and myths.</li>
                    <a>|</a>
                    <li><strong>Smith.</strong> During a Long Rest, you can construct a temporary forge, provided you
                        have access to roughly sufficient materials.</li>
                    <a>|</a>
                    <li><strong>Worldwise.</strong> You add 1d6 to Charisma and Intelligence checks to understand and
                        navigate differences in rural customs and etiquette.</li>
                    <a>|</a>
                    <li><strong>Squire's Aid.</strong> Another creature can halve the time required for you to don Heavy
                        Armor by using the Help action.</li>
                    <a>|</a>
                    <li><strong>Chivalric Court.</strong> You don't have Disadvantage on Charisma checks when
                        interacting with hostile nobles, knights, or other members of the gentry. You are fluent in the
                        etiquette of courts, feasts, and duels.</li>
                    <a>|</a>
                    <li><strong>Watchful.</strong> You add 1d6 to Perception checks while keeping watch during a Long or
                        Short Rest.</li>
                    <a>|</a>
                    <li><strong>Hobby Performer.</strong> You gain proficiency with one musical instrument. You may use
                        Dexterity or Wisdom instead of Charisma when making Performance checks, but you roll 3d4 instead
                        of a d20.</li>
                    <a>|</a>
                    <li><strong>Home Ground.</strong> Choose a terrain type (forest, mountains, swamp, desert, and so
                        on). While in that terrain, you cannot become lost except by magical means, and you add 1d6 to
                        checks made to find food, water, or shelter.</li>
                    <a>|</a>
                    <li><strong>Pathfinder.</strong> While traveling through the wilderness, your group moves at a
                        normal pace without suffering penalties to Stealth or Perception, and creatures tracking your

                    <a>|</a>
                    <li><strong>Befriend the Unnatural.</strong> You can use Animal Handling checks on any creature with
                        an Intelligence of -4 or lower.</li>
                    <a>|</a>
                    <li><strong>Alert.</strong> Even while performing another travel activity, such as foraging,
                        navigating, or tracking, you remain alert to danger.</li>
                    <a>|</a>
                    <li><strong>Hunter.</strong> While tracking creatures, you also learn their exact number, their

                    <a>|</a>
                    <li><strong>Mimic.</strong> You can accurately mimic the sounds (but not speech) of creatures you
                        have heard. A creature hearing the imitation makes an Insight check against your Mental DC. If
                        you are imitating the sounds of a beast, that check has Disadvantage.</li>

                <h2>Class and Attributes</h2>

                <p>This step determines the majority of how your character interacts mechanically with the world and in
                    combat.</p>

                <h2>Choose a Class</h2>

                <p>This system contains fourteen classes. When choosing a class, simply pick the one that sounds the
                    most enjoyable to play.</p>


                <p>Class diversity is not required for a successful party, though it is generally helpful to have at
                    least one character representing two different roles.</p>

                <p>Also consider the source of each class's power. <strong>Martial</strong> classes rely entirely on
                    physical prowess and have no spellcasting. <strong>Mystics</strong> use limited spellcasting to
                    enhance their other abilities. <strong>Spellcasters</strong> primarily interact with the world
                    through magic.</p>

                <p>These roles are intended only to give a general sense of how each class plays. It is easy to
                    build a
                    defensive Fighter or Spellblade, and a Wizard or Cleric can deal just as much damage as a Rogue
                    by
                    choosing offensive spells and subclasses.</p>
                <h2>Fighting Styles</h2>

                <p>A Fighting Style represents the techniques, training, and battlefield habits that define how
                    your
                    character approaches challenges.</p>

                <p>All characters choose a Fighting Style at 1st level. Your choice grants a passive benefit
                    immediately along with a permanent Health Bonus which increases your maximum Hit Points at
                    1st
                    level and whenever you gain a level.</p>

                <p>At 7th level, your Fighting Style grants a special feat. This feat does not count against your
                    Feats
                    Known, does not require a Feat Slot to use, and can be used even if it does not appear on your
                    class
                    feat list or if your class does not normally use feats.</p>

                <p>You must still obey the normal limit of activating no more than one feat on your turn.</p>

                <h3>Fighting Style Requirements</h3>

                <p>Many Fighting Styles require specific equipment or circumstances to gain their benefits.</p>

                <p>If a Fighting Style lists a requirement, you gain its benefits only while meeting that
                    requirement.
                </p>

                <p>For example, a character with the Dueling Fighting Style gains its benefits only while one hand
                    remains free, while a character with the Polearm Fighting Style gains its benefits only while
                    wielding a weapon with the Reach property.</p>

                <h2>Ability Scores</h2>

                <p>Ability Scores represent your character's capabilities and failings.</p>

                <p>To determine your character's Ability Scores, purchase one value for each of your five abilities
                    using the table below. You have 13 purchasing points to spend, and the lowest score you can
                    choose

                <p>Pay attention to the Physical and Mental modifiers used by your chosen class, as these are

                <p>A <strong>Physical Modifier</strong> is either Strength or Dexterity.</p>

                <p>A <strong>Mental Modifier</strong> is Intelligence, Wisdom, or Charisma.</p>

                <p>Ability Scores are an essential part of the rules, but they can also help define your character's
                    appearance and personality. Once you've assigned your scores, consider what they imply about
                    your
                    character. A very strong character with low Charisma might look and behave very differently from
                    a
                    charming character with little physical strength. The descriptive tables that follow provide
                    inspiration for portraying characters with particularly high or low Ability Scores.</p>

                <h2>Race</h2>

                <p>After determining your background and experiences, choose a race for your character. Each race
                    grants
                    unique features and helps define your character's appearance.</p>

                <p>When selecting a race, consider choosing one that reinforces your character's personality and
                    story.
                    For example, a larger-than-life Paladin devoted to Sol might be enhanced by being an Orc, while
                    a
                    practical naturalist may feel especially grounded as a Moor Elf or Human, leading to more
                    meaningful
                    interactions with the world. the list of races can be found <a href="races.html">Here</a></p>

                <h2>Build Your Character!</h2>

                <p>You now have everything you need to begin building your character. Grab a character sheet and
                    follow
                    these steps.</p>

                <ol>
                    <li>Fill in each of the five Ability Scores at the top of your character sheet.</li>
                    <a>|</a>
                    <li>Locate the section of your class sheet that displays your starting class features.</li>
                    <a>|</a>
                    <li>Mark your class's Physical and Mental Modifiers with an X beneath the appropriate abilities.
                    </li>
                    <a>|</a>
                    <li>Choose your class's Fighting Style. This determines part of your starting Hit Points.</li>
                    <a>|</a>
                    <li>Calculate your 1st-level Hit Points.</li>
                    <a>|</a>
                    <li>Record your armor and weapon proficiencies.</li>
                    <a>|</a>
                    <li>Mark your saving throw proficiencies by adding your Ability Modifier and your Proficiency
                        Bonus
                        where applicable.</li>
                    <a>|</a>
                    <li>Mark your class skill proficiencies alongside those gained from your background.</li>
                    <a>|</a>
                    <li>Fill in the Ability Scores you purchased.</li>
                    <a>|</a>
                    <li>Calculate your skill bonuses by adding the appropriate Ability Modifier and your Proficiency
                        Bonus if you are proficient.</li>
                    <a>|</a>
                    <li>
                        <strong>Calculate your Physical and Mental DCs.</strong>

                        <p><strong>Physical DC</strong> = 8 + Proficiency Bonus + Physical Modifier</p>

                        <p><strong>Mental DC</strong> = 8 + Proficiency Bonus + Mental Modifier</p>
                    </li>
                    <a>|</a>
                    <li>
                        <strong>Calculate your attack bonuses.</strong>

                        <p><strong>Melee Attack Bonus</strong> = Strength + Proficiency Bonus</p>

                        <p><strong>Ranged Attack Bonus</strong> = Dexterity + Proficiency Bonus</p>

                        <p><strong>Spell Attack Bonus</strong> = Mental Modifier + Proficiency Bonus</p>
                    </li>
                    <a>|</a>
                    <li>If your class grants spellcasting at 1st level, record your spellcasting features. Your
                        class
                        table shows the spells available at each level and specifies which spell list you use.</li>
                </ol>
                <strong>Your character is done!</strong>
