                <h5>Mordschlag</h5>

                <p>Mordschlag is a tabletop roleplaying game of heroic adventure, tactical combat, and hard-won
                    victories.</p>

                <p>In Mordschlag, players take the roles of adventurers exploring dangerous lands, confronting powerful
                    enemies, uncovering ancient mysteries, and shaping the world through their actions. One player
                    serves as the Dungeon Master (DM), describing the world, portraying its inhabitants, and
                    adjudicating the rules.</p>

                <p>Mordschlag focuses heavily on tactical decision making, teamwork, and active participation throughout
                    the entire round of combat. Positioning, timing, and cooperation are just as important as raw power.
                </p>

                <p>Whether you are a veteran of tabletop games or entirely new to the hobby, this book contains
                    everything you need to create a character and begin playing.</p>

                <hr>

                <h2>What You Need to Play</h2>

                <p>To play Mordschlag, you will need:</p>

                <ul>
                    <li>This Player's Handbook</li>
                </ul>

                <ul>
                    <li>A character sheet</li>
                </ul>

                <ul>
                    <li>Pencils and erasers</li>
                </ul>

                <ul>
                    <li>A set of polyhedral dice (d2, d4, d6, d8, d10, d12, and d20)</li>
                </ul>

                <ul>
                    <li>A group of players and a Dungeon Master</li>
                </ul>

                <p>Most groups consist of four to six players and one Dungeon Master.</p>

                <hr>

                <h2>How the Game Works</h2>

                <p>The three main pillars of play are social interaction, exploration, and combat. Whichever one
                    you're experiencing, the game unfolds according to this basic pattern:</p>

                <ol>
                    <li><strong>The Dungeon Master Describes a Scene.</strong> The DM tells the players where their
                        adventurers are and what's around them (how many doors lead out of a room, what's on a table,
                        and so on).</li>

                    <li><strong>The Players Describe What Their Characters Do.</strong> Typically, the characters stick
                        together as they travel through a dungeon or another environment. Sometimes different
                        adventurers do different things: one adventurer might search a treasure chest while a second
                        examines a mysterious symbol engraved on a wall and a third keeps watch for monsters. Outside
                        combat, the DM ensures that every character has a chance to act and decides how to resolve their
                        activity. In combat, the characters take turns.</li>

                    <li><strong>The DM Narrates the Results of the Adventurers' Actions.</strong> Sometimes resolving a
                        task is easy. If an adventurer walks across a room and tries to open a door, the DM might say
                        the door opens and describe what lies beyond. But the door might be locked, the floor might hide
                        a trap, or some other circumstance might make it challenging for an adventurer to complete a
                        task. In those cases, the DM might ask the player to roll a die to help determine what happens.
                        Describing the results often leads to another decision point, which brings the game back to step
                        1.</li>
                </ol>

                <p>This pattern holds during every game session (each time you sit down to play D&amp;D), whether the
                    adventurers are talking to a noble, exploring a ruin, or fighting a dragon. In certain
                    situations-particularly combat-the action is more structured, and everyone takes turns.</p>

                <h2>Campaigns</h2>

                <p>A campaign is a series of adventures with a consistent group of adventurers following the narrative.
                </p>

                <p>Some campaigns are episodic, where each adventure is its own tale and not much besides the player
                    characters links it to the next one. Other campaigns involve long-running plots, a cast of recurring
                    NPCs, and themes that span multiple adventures, leading toward a climactic conclusion.</p>

                <p>As with adventures, a DM might create a campaign from scratch, assemble a campaign from published
                    adventures, or mix homemade material with published material. And the campaign might take place in a
                    world of the DM's creation or in a published campaign setting, such as the Forgotten Realms or
                    Greyhawk (the latter is described in the Dungeon Master's Guide).</p>

                <h2>What Comes Next?</h2>

                <p>The next chapters introduce the core rules that govern characters and the world around them.</p>

                <p>You will learn how ability scores work, how to resolve actions, and how to create your own character
                    before selecting a class and beginning your adventures.</p>

                <h5>Chapter 2, Dice, Ability Scores, and Proficiency</h5>

                <h2>Dice</h2>

                <p>Mordschlag uses the following polyhedral dice:</p>

                <ul>
                    <li>d2</li>
                </ul>

                <ul>
                    <li>d4</li>
                </ul>

                <ul>
                    <li>d6</li>
                </ul>

                <ul>
                    <li>d8</li>
                </ul>

                <ul>
                    <li>d10</li>
                </ul>

                <ul>
                    <li>d12</li>
                </ul>

                <ul>
                    <li>d20</li>
                </ul>

                <p>Whenever the rules instruct you to roll a die, the notation indicates both the number of dice and the
                    type of die rolled.</p>

                <p><strong>Examples:</strong></p>

                <ul>
                    <li>1d6 means one six-sided die.</li>
                </ul>

                <ul>
                    <li>2d8 means two eight-sided dice.</li>
                </ul>

                <ul>
                    <li>3d4 means three four-sided dice.</li>
                </ul>

                <p>If a rule tells you to add a modifier, add that value to the result after rolling.</p>

                <p><strong>Example:</strong></p>

                <p>A weapon deals 1d8 + 2 damage. If the d8 shows a 5, the total damage is 7.</p>

                <p>If a rule tells you to multiply by a modifier, you roll a number of dice equal to the modifier.</p>

                <p><strong>Example:</strong></p>

                <p>A feature dictates you roll Proficiency Bonus x 1d2. You roll a number of dice equal to your
                    proficiency bonus. It may also be written as PB x 1d2 in shorthand.</p>

                <hr>

                <h2>The d20 Test</h2>

                <p>The 20-sided die (d20) is the most important die you'll use in the game. It's central to the core
                    mechanic-called D20 Tests-the game uses to determine whether creatures succeed or fail at the things
                    they attempt during the game. You roll a d20 whenever your character tries to do something that the
                    DM decides has a reasonable chance of both success and failure. The higher your roll, the more
                    likely it is that you succeed.</p>

                <ol>
                    <li><strong>Roll 1d20.</strong> You always want to roll high. If the roll has Advantage or
                        Disadvantage, you roll two d20s, but you use the number from only one of them-the higher one if
                        you have Advantage or the lower one if you have Disadvantage.</li>

                    <li>
                        <strong>Add Modifiers.</strong> Add these modifiers to the number rolled on the d20:

                        <ul>
                            <li><strong>The Relevant Ability Modifier.</strong> This chapter and the rules glossary
                                explain which ability modifiers to use for various D20 Tests.</li>
                        </ul>

                        <ul>
                            <li><strong>Your Proficiency Bonus If Relevant.</strong> Each creature has a Proficiency
                                Bonus, a number added when making a D20 Test that uses something, such as a skill, in
                                which the creature has proficiency.</li>
                        </ul>

                        <ul>
                            <li><strong>Circumstantial Bonuses and Penalties.</strong> A class feature, a spell, or
                                another rule might give a bonus or penalty to the die roll.</li>
                        </ul>
                    </li>

                    <li><strong>Compare the Total to a Target Number.</strong> If the total of the d20 and its modifiers
                        equals or exceeds the target number, the D20 Test succeeds. Otherwise, it fails. The Dungeon
                        Master determines target numbers and tells players whether their rolls are successful. The
                        target number for an ability check or a saving throw is called a Difficulty Class (DC). The
                        target number for an attack roll is called an Armor Class (AC), which appears on a character
                        sheet or in a stat block.</li>
                </ol>

                <hr>

                <h2>Ability Scores</h2>

                <p>Every character possesses five ability scores.</p>

                <p>These scores-sometimes called modifiers-represent a character's natural talents and aptitudes.</p>

                <table class="styled-table">
                    <thead>
                        <tr>
                            <th>Ability</th>
                            <th>Description</th>
                        </tr>
                    </thead>
                    <tr>
                        <td>Strength</td>
                        <td>Physical power, endurance, toughness, and athletic ability.</td>
                    </tr>
                    <tr>
                        <td>Dexterity</td>
                        <td>Agility, coordination, reflexes, and precision.</td>
                    </tr>
                    <tr>
                        <td>Intelligence</td>
                        <td>Reasoning, memory, education, and knowledge.</td>
                    </tr>
                    <tr>
                        <td>Wisdom</td>
                        <td>Awareness, intuition, perception, and insight.</td>
                    </tr>
                    <tr>
                        <td>Charisma</td>
                        <td>Confidence, force of personality, leadership, and presence.</td>
                    </tr>
                </table>

                <p>Ability scores usually range from -1 to +5.</p>

                <p>The higher an ability score, the more capable a character is in tasks related to that ability.</p>

                <hr>

                <h2>Physical and Mental Modifiers</h2>

                <p>Many features will reference your Physical or Mental modifier. These are your character's most
                    significant abilities. When a feature asks you to add your Physical or Mental modifier, you
                    reference the appropriate ability score.</p>

                <p><strong>Example:</strong></p>

                <p>A Paladin uses Charisma as their Mental Modifier. Their Aura of Zeal feature states that enemies
                    have a penalty to attack rolls equal to the Paladin's Mental Modifier, so a monster subtracts the
                    Paladin's Charisma score from their attack rolls, likely causing the attack to miss.</p>

                <hr>

                <h2>Ability Checks</h2>

                <p>When you attempt a task with a chance of failure, the Dungeon Master may ask for an ability check.
                </p>

                <p>To make an ability check:</p>

                <ol>
                    <li>Roll a d20.</li>
                    <li>Add the appropriate ability modifier.</li>
                    <li>Add your Proficiency Bonus if you are proficient in the relevant skill or tool.</li>
                    <li>Compare the result to the DC.</li>
                </ol>

                <p><strong>Example:</strong></p>

                <p>A character attempting to climb a cliff might make a Strength (Athletics) check.</p>

                <hr>

                <h2>Difficulty Classes</h2>

                <p>The Dungeon Master determines the Difficulty Class of a task.</p>

                <p><strong>Meets it beats it!</strong> If a roll totals the DC or exceeds the DC, the roll succeeds.</p>

                <p>Typical DCs are shown below.</p>

                <table class="styled-table">
                    <thead>
                        <tr>
                            <th>Difficulty</th>
                            <th>DC</th>
                        </tr>
                    </thead>
                    <tr>
                        <td>Easy</td>
                        <td>5</td>
                    </tr>
                    <tr>
                        <td>Moderate</td>
                        <td>10</td>
                    </tr>
                    <tr>
                        <td>Hard</td>
                        <td>15</td>
                    </tr>
                    <tr>
                        <td>Very Hard</td>
                        <td>20</td>
                    </tr>
                    <tr>
                        <td>Nearly Impossible</td>
                        <td>25</td>
                    </tr>
                </table>

                <p>Note that an ability score of 0 represents the average mortal, so a task with a DC of 10 should have
                    a 50/50 chance of success for the average person.</p>

                <hr>
                <h2>Saving Throws</h2>

                <p>A saving throw-also called a save-represents an attempt to evade or resist a threat, such as a fiery
                    explosion, a blast of poisonous gas, or a spell trying to invade your mind. You don’t normally
                    choose to make a save; you must make one because your character or a monster (if you’re the DM) is
                    at risk. A save’s result is detailed in the effect that caused it.</p>

                <p>If you don’t want to resist the effect, you can choose to fail the save without rolling.</p>

                <h4>Ability Modifier</h4>

                <p>Saving throws are named for the ability modifiers they use: a Strength saving throw, a Wisdom saving
                    throw, and so on. Different saving throws are used to resist different kinds of effects, as shown on
                    the Saving Throw Examples table. You add your Proficiency Bonus to your saving throw if you have
                    proficiency in that kind of save.</p>

                <h4>Saving Throw Examples</h4>

                <table class="styled-table">
                    <thead>
                        <tr>
                            <th>Ability</th>
                            <th>Make a Save To...</th>
                        </tr>
                    </thead>
                    <tr>
                        <td>Strength</td>
                        <td>Resist a force or toxin</td>
                    </tr>
                    <tr>
                        <td>Dexterity</td>
                        <td>Dodge out of harm’s way</td>
                    </tr>
                    <tr>
                        <td>Intelligence</td>
                        <td>Recognize an illusion as fake</td>
                    </tr>
                    <tr>
                        <td>Wisdom</td>
                        <td>Resist a mental assault</td>
                    </tr>
                    <tr>
                        <td>Charisma</td>
                        <td>Assert your identity</td>
                    </tr>
                </table>

                <p>Some class features and spells refer to a Physical DC or Mental DC.</p>

                <p>These values are calculated as follows:</p>

                <p><strong>Physical DC = 8 + Proficiency Bonus + Physical Modifier</strong></p>

                <p><strong>Mental DC = 8 + Proficiency Bonus + Mental Modifier</strong></p>

                <hr>

                <h2>Attack Rolls</h2>

                <p>An attack roll determines whether an attack successfully strikes a target.</p>

                <p>To make an attack roll:</p>

                <ol>
                    <li>Roll a d20.</li>
                    <li>Add the appropriate modifier.</li>
                    <li>Add your Proficiency Bonus if you are proficient with the attack.</li>
                    <li>Compare the result to the target's Armor Class.</li>
                </ol>

                <p>If the attack roll equals or exceeds the target's Armor Class, the attack hits.</p>

                <p>Otherwise, the attack misses.</p>

                <p>Attack rolls are covered in greater detail in the Combat chapter.</p>

                <hr>
                <h2>Advantage and Disadvantage</h2>

                <p>Advantage reflects the positive circumstances surrounding a d20 roll, while Disadvantage reflects
                    negative circumstances.</p>

                <p>You usually acquire Advantage or Disadvantage through the use of special abilities and actions. The
                    DM can also decide that circumstances grant Advantage or impose Disadvantage.</p>

                <h4>Roll Two D20s</h4>

                <p>When a roll has either Advantage or Disadvantage, roll a second d20 when you make the roll. Use the
                    higher of the two rolls if you have Advantage, and use the lower roll if you have Disadvantage. For
                    example, if you have Disadvantage and roll an 18 and a 3, use the 3. If you instead have Advantage
                    and roll those numbers, use the 18.</p>

                <p>If multiple sources of Advantage and Disadvantage apply to the same roll, they cancel each other out.
                    A roll can never benefit from more than one instance of Advantage or suffer from more than one
                    instance of Disadvantage.</p>

                <p>When you have Advantage or Disadvantage and something in the game lets you reroll or replace the d20,
                    you can reroll or replace only one die, not both. You choose which one.</p>

                <hr>

                <h2>Proficiency Bonus</h2>

                <p>Your Proficiency Bonus represents your training and experience. Proficiency Bonus is sometimes
                    written as (PB). Your proficiency bonus increases as your character levels and gains experience.</p>

                <p>You add your Proficiency Bonus whenever you make a roll involving something in which you are
                    proficient.</p>

                <p>Examples include:</p>

                <ul>
                    <li>Proficient skills.</li>
                </ul>

                <ul>
                    <li>Proficient saving throws.</li>
                </ul>

                <ul>
                    <li>Proficient weapons.</li>
                </ul>

                <ul>
                    <li>Proficient tools.</li>
                </ul>

                <p>Your Proficiency Bonus increases as you gain levels.</p>

                <table class="styled-table">
                    <thead>
                        <tr>
                            <th>Level</th>
                            <th>Proficiency Bonus</th>
                        </tr>
                    </thead>
                    <tr>
                        <td>1-5</td>
                        <td>+2</td>
                    </tr>
                    <tr>
                        <td>6-9</td>
                        <td>+3</td>
                    </tr>
                    <tr>
                        <td>10-13</td>
                        <td>+4</td>
                    </tr>
                    <tr>
                        <td>14-17</td>
                        <td>+5</td>
                    </tr>
                    <tr>
                        <td>18-20</td>
                        <td>+6</td>
                    </tr>
                </table>

                <p>Your proficiency bonus is also added whenever you calculate your DCs:</p>

                <p><strong>Physical DC = 8 + Proficiency Bonus + Physical Modifier</strong></p>

                <p><strong>Mental DC = 8 + Proficiency Bonus + Mental Modifier</strong></p>

                <h3>Skill Proficiencies</h3>

                <p>Most ability checks involve using a skill, which represents a category of things creatures try to do
                    with an ability check. The descriptions of the actions you take (see Actions in chapter 4) specify
                    which skill applies if you make an ability check for that action, and many other rules note when a
                    skill is relevant. The DM has the ultimate say on whether a skill is relevant in a situation.</p>

                <p>If a creature is proficient in a skill, the creature applies its Proficiency Bonus to ability checks
                    involving that skill. Without proficiency in a skill, a creature can still make ability checks
                    involving that skill but doesn’t add its Proficiency Bonus. For example, if a character tries to
                    climb a cliff, the DM might ask for a Strength (Athletics) check. If the character has Athletics
                    proficiency, the character adds their Proficiency Bonus to the Strength check. If the character
                    lacks that proficiency, they make the check without adding their Proficiency Bonus.</p>

                <h4>Determining Skills</h4>

                <p>A character’s starting skill proficiencies are determined at character creation, and a monster’s
                    skill proficiencies appear in its stat block.</p>

                <hr>

                <h2>Round Down</h2>

                <p>Whenever a rule instructs you to divide a number and the result is not a whole number, round down
                    unless the rule states otherwise.</p>

                <p><strong>Example:</strong></p>

                <p>Half of 7 is 3.</p>

                <h5>Chapter 3, Adventuring</h5>

                <p>Not every challenge can be solved with steel or spell craft.</p>

                <p>As adventurers travel through dangerous lands, explore forgotten ruins, negotiate with powerful
                    figures, and survive hostile environments, they will face countless obstacles that cannot be
                    overcome through combat alone.</p>

                <p>This chapter explains the rules used during exploration, travel, social interaction, resting, and
                    other aspects of adventuring.</p>

                <hr>

                <h2>Ability Checks</h2>

                <p>Whenever a character attempts an action with a meaningful chance of failure, the Dungeon Master may
                    call for an ability check.</p>

                <p>To make an ability check:</p>

                <ol>
                    <li>Roll a d20.</li>
                    <li>Add the appropriate ability modifier.</li>
                    <li>Add your Proficiency Bonus if applicable.</li>
                    <li>Compare the result to the Difficulty Class (DC).</li>
                </ol>

                <p>The Dungeon Master determines which ability and skill apply to the task.</p>

                <p>If an ability check's DC is not met, the check fails. For some checks, failing may mean the ability
                    check simply takes a much longer time than desired.</p>

                <p><strong>Example:</strong></p>

                <p>Churchill the Fighter is running from a horde of zombies and must push a heavy shelf in front of the
                    doorway. The DC is 15 and Churchill's roll totals 12, but Churchill is very strong and it would be
                    unreasonable for him to be unable to move the bookshelf. Instead of him being totally incapable,
                    Churchill might realize that it will take him around a minute longer to move the bookshelf than he
                    has time left.</p>

                        <td>Stealth</td>
                        <td>Dexterity</td>
                    </tr>
                    <tr>
                        <td>Survival</td>
                        <td>Wisdom</td>
                    </tr>
                </table>

                <p>The Dungeon Master may pair a skill with a different ability when appropriate.</p>

                <p><strong>Example:</strong></p>

                <p>A character attempting to intimidate a crowd through physical presence may make a Strength
                    (Intimidation) check.</p>

                <hr>

                <h2>Group Checks</h2>

                <p>Sometimes the entire party attempts the same task. When this occurs, the Dungeon Master may call for
                    a group check.</p>

                <p>Each participating character makes the appropriate ability check. If at least half of the group
                    succeeds, the group succeeds. A natural 20 counts as two successes.</p>

                <p>Group checks are most commonly used for:</p>

                <ul>
                    <li>Sneaking as a party.</li>
                </ul>

                <ul>
                    <li>Traversing dangerous terrain.</li>
                </ul>

                <ul>
                    <li>Enduring environmental hazards.</li>
                </ul>

                <ul>
                    <li>Conducting lengthy searches.</li>
                </ul>

                <hr>

                <h2>Working Together, Two at a Time</h2>

                <p>Two or more characters can cooperate when attempting a task.</p>

                <p>If one character assists another and the Dungeon Master determines the assistance is meaningful, the
                    acting character gains Advantage on the check.</p>

                <p>Usually only one creature can provide assistance to a given check.</p>

                <p>Typically no more than two players may attempt an ability check, and the DM may require that they
                    wait 10 minutes before they get the chance to make another attempt.</p>

                <hr>

                <h2>Social Interaction</h2>

                <p>Roleplaying is, literally, the act of playing out a role. In this case, it’s you as a player
                    determining how your character thinks, acts, and talks. Roleplaying is part of every aspect of the
                    game, and it comes to the fore during social interactions.</p>

                <p>The DM uses an NPC’s personality and your character’s actions and attitudes to determine how an NPC
                    reacts. A cowardly bandit might buckle under threats of imprisonment. A stubborn merchant refuses to
                    help if the characters badger her. A vain dragon laps up flattery.</p>

                <p>When interacting with an NPC, pay attention to the DM’s portrayal of the NPC’s personality. You might
                    be able to learn an NPC’s goals and then use that information to influence the NPC.</p>

                <p>If you offer NPCs something they want or play on their sympathies, fears, or goals, you can form
                    friendships, ward off violence, or learn a key piece of information. On the other hand, if you
                    insult a proud warrior or speak ill of a noble’s allies, your efforts to convince or deceive will
                    likely fail.</p>

                <p>Players are encouraged to describe what their characters say and how they approach a conversation
                    before the DM determines whether they make a roll or not.</p>

                <p>When a roll is required skills include:</p>

                <ul>
                    <li>Deception</li>
                </ul>

                <ul>
                    <li>Insight</li>
                </ul>

                <ul>
                    <li>Intimidation</li>
                </ul>

                <ul>
                    <li>Persuasion</li>
                </ul>

                <p>The circumstances of the interaction often matter as much as the result of the roll. A high roll
                    doesn't mean a creature will act against their beliefs or nature.</p>

                <hr>

                <h2>Exploration</h2>

                <p>Exploration encompasses everything characters do while investigating the world around them.</p>

                <p>Examples include:</p>

                <ul>
                    <li>Searching rooms.</li>
                </ul>

                <ul>
                    <li>Interacting with mortals.</li>
                </ul>

                <ul>
                    <li>Tracking creatures.</li>
                </ul>

                <ul>
                    <li>Following trails.</li>
                </ul>

                <ul>
                    <li>Navigating wilderness.</li>
                </ul>

                <ul>
                    <li>Investigating mysteries.</li>
                </ul>

                <p>During exploration, players should describe their actions as specifically as possible.</p>

                <p>The more information the players provide, the more information the Dungeon Master can provide in
                    return.</p>

                <hr>

                <h2>Actions</h2>

                <p>Most activities in and out of combat require actions. A creature has two actions to use on their
                    turn, and regains these actions when their next turn starts. If you are looking for a comprehensive
                    list of actions, look inside the rules glossary.</p>

                <p>Actions have different costs. For example, the attack action costs one action, and so does the dash
                    action, so you can dash and attack to use all of your actions in one turn.</p>

                <p>If an action requires you to use more than the two actions you get on your turn, such as some spell
                    casting or firearms, the cost is spread throughout multiple turns. If an action costs 3 total
                    actions, you use two actions on one turn, and then must use one action on your next turn to complete
                    the action.</p>

                <h2>Search Action</h2>

                <p><strong>Cost:</strong> 2 Actions</p>

                <p>When you take the Search action, you make a Wisdom check to discern something that isn’t obvious. The
                    Search table suggests which skills are applicable when you take this action, depending on what
                    you’re trying to detect.</p>

                <h2>Influence Action</h2>

                <p><strong>Cost:</strong> 1 Action</p>

                <p>With the Influence action, you urge a monster to do something. Describe or roleplay how you’re
                    communicating with the monster. Are you trying to deceive, intimidate, amuse, or gently persuade?
                    The DM then determines whether the monster feels willing, unwilling, or hesitant due to your
                    interaction; this determination establishes whether an ability check is necessary, as explained
                    below.</p>

                <p><strong><em>Willing.</em></strong> If your urging aligns with the monster’s desires, no ability check
                    is necessary; the monster fulfills your request in a way it prefers.</p>

                <p><strong><em>Unwilling.</em></strong> If your urging is repugnant to the monster or counter to its
                    alignment, no ability check is necessary; it doesn’t comply.</p>

                <p><strong><em>Hesitant.</em></strong> If you urge the monster to do something that it is hesitant to
                    do, you must make an ability check, which is affected by the monster’s attitude: Indifferent,
                    Friendly, or Hositle, each of which is defined in this glossary. The Influence Checks table
                    suggests which ability check to make based on how you’re interacting with the monster. The DM
                    chooses the check, which has a default DC equal to 15 or the monster’s Intelligence score, whichever
                    is higher. On a successful check, the monster does as urged. On a failed check, you must wait 24
                    hours (or a duration set by the DM) before urging it in the same way again.</p>

                <h2>Utilize Action</h2>

                <p><strong>Cost:</strong> 1 or 2 Actions.</p>

                <p>Interact with an object that requires more than a normal interaction.</p>

                <p>Examples include:</p>

                <ul>
                    <li>Activating a mechanism.</li>
                </ul>

                <ul>
                    <li>Administering a potion.</li>
                </ul>

                <ul>
                    <li>Manipulating a complex object.</li>
                </ul>

                <p>The amount of actions required depends on the complexity of what you are trying to do. The DM has the
                    final say on how many actions an interaction takes.</p>

                <hr>

                <h2>Travel</h2>

                <p>Adventurers often spend days or weeks journeying between destinations.</p>

                <p>During travel, the Dungeon Master determines:</p>

                <ul>
                    <li>Travel pace.</li>
                </ul>

                <ul>
                    <li>Terrain difficulty.</li>
                </ul>

                <ul>
                    <li>Weather conditions.</li>
                </ul>

                <ul>
                    <li>Random encounters.</li>
                </ul>

                <ul>
                    <li>Resource consumption.</li>
                </ul>

                <p>Travel provides opportunities for roleplaying, exploration, and unexpected discoveries.</p>

                <h4>Travel Pace</h4>

                <p>While traveling outside combat, a group can move at a Fast, Normal, or Slow pace, as shown on the
                    Travel Pace table. The table states how far the party can move in a period of time; if riding horses
                    or other mounts, the group can move twice that distance for 1 hour, after which the mounts need a
                    Short or Long rest before they can move at that increased pace again. The Dungeon Master's Guide
                    has rules that affect which pace you can choose in certain types of terrain.</p>

                <hr>

                <h2>Vision and Light</h2>

                <p>The ability to perceive surroundings depends on available light.</p>

                <p>The Dungeon Master determines whether an area is:</p>

                <ul>
                    <li><strong>Clear</strong> - A clear area such as a lit room or grassy plain, is clear.</li>
                </ul>

                <ul>
                    <li><strong>Dim</strong> - A dim area is Lightly Obscured, and might be a foggy or poorly lit room.
                    </li>
                </ul>

                <ul>
                    <li><strong>Dark</strong> - A creature trying to see in a dark area is Blinded.</li>
                </ul>

                <p>Some species possess abilities that allow them to see more effectively in darkness.</p>

                <p>Visibility may also be affected by:</p>

                <ul>
                    <li>Rain.</li>
                </ul>

                <ul>
                    <li>Smoke.</li>
                </ul>

                <ul>
                    <li>Dense vegetation.</li>
                </ul>

                <ul>
                    <li>Magical effects.</li>
                </ul>

                <hr>

                <h2>Falling</h2>

                <p>A falling creature takes 1d6 Physical Damage for every 10 feet fallen, to a maximum of 20d6.</p>

                <p>The creature lands Prone unless a rule states otherwise.</p>

                <hr>

                <h2>Tools</h2>

                <p>Certain tasks require specialized equipment.</p>

                <p>If a character is proficient with the relevant tool, they add their Proficiency Bonus to checks made
                    using that tool.</p>

                <p>Examples include:</p>

                <ul>
                    <li>Herbalism Kits.</li>
                </ul>

                <ul>
                    <li>Smith's Tools.</li>
                </ul>

                <ul>
                    <li>Thieves' Tools.</li>
                </ul>

                <ul>
                    <li>Musical Instruments.</li>
                </ul>

                <p>Tool proficiencies are described in the Equipment chapter.</p>

                <hr>

                <h2>Resting</h2>

                <p>Adventurers require rest to recover from injury, exhaustion, and the rigors of travel.</p>

                <p>There are two types of rest: Short Rest and Long Rest.</p>

                <hr>

                <h2>Short Rest</h2>

                <p>A short rest is a period of downtime lasting at least one hour. A creature can only take two short
                    rests per long rest.</p>

                <p>During a short rest, characters may:</p>

                <ul>
                    <li>Recover class resources that recharge on a short rest.</li>
                </ul>

                <ul>
                    <li>Benefit from features that activate during a short rest.</li>
                </ul>

                <p>Class features determine exactly what resources are recovered.</p>

                <hr>

                <h2>Long Rest</h2>

                <p>A long rest is a period of extended downtime lasting at least eight hours.</p>

                <p>A character who completes a long rest gains the following benefits:</p>

                <ul>
                    <li>Regains all lost hit points.</li>
                </ul>

                <ul>
                    <li>Regains all expended spell slots.</li>
                </ul>

                <ul>
                    <li>Recovers resources restored by a long rest.</li>
                </ul>

                <ul>
                    <li>Reduces their Exhaustion by 2.</li>
                </ul>

                <p>A character can benefit from only one long rest within a 24-hour period.</p>

                <hr>

                <h2>Exhaustion</h2>

                <p>Exhaustion represents accumulated fatigue, grave injury, stress, and hardship.</p>

                <p>Being at 0 hit points, some abilities, environmental hazards, and effects can cause Exhaustion.</p>

                <p>A creature gains the unconscious condition when it starts its turn with 8 points of Exhaustion.</p>

                <p>A creature dies when it reaches 10 Exhaustion.</p>

                <p>Exhaustion is primarily removed through resting.</p>

                <p>A short rest reduces Exhaustion by 2.</p>

                <p>A long rest reduces Exhaustion by 2.</p>

                <p>Some features and abilities may remove additional Exhaustion.</p>

                <p>The specific effects of Exhaustion are detailed in the Conditions appendix.</p>

                <hr>

                <h2>Downtime</h2>

                <p>Between adventures, characters may spend time pursuing personal goals.</p>

                <p>Examples include:</p>

                <ul>
                    <li>Religious Pursuits.</li>
                </ul>

                <ul>
                    <li>Training.</li>
                </ul>

                <ul>
                    <li>Crafting.</li>
                </ul>

                <ul>
                    <li>Building relationships.</li>
                </ul>

                <ul>
                    <li>Managing organizations.</li>
                </ul>

                <p>Specific downtime activities are described in chapter 8.</p>

                <hr>

                <h2>The Dungeon Master's Role</h2>

                <p>Not every situation can be covered by a rule.</p>

                <p>When unusual circumstances arise, the Dungeon Master decides:</p>

                <ul>
                    <li>Whether a roll is required.</li>
                </ul>

                <ul>
                    <li>Which ability applies.</li>
                </ul>

                <ul>
                    <li>Which skill applies.</li>
                </ul>

                <ul>
                    <li>The DC of the task.</li>
                </ul>

                <ul>
                    <li>The consequences of success or failure.</li>
                </ul>

                <p>The rules provide structure, but the Dungeon Master's judgment remains an essential part of the game.
                </p>

                <h5>Chapter 4, Combat</h5>
                <p>Danger is an unavoidable part of an adventurer's life.</p>

                <p>Bandits, monsters, rival warriors, and ancient horrors all threaten those who seek their way in the
                    world. When words fail and violence begins, the game enters combat.</p>

                <p>Combat in Mordschlag is fast-paced, tactical, and highly interactive. Positioning, teamwork,
                    reactions, and resource management all play important roles in determining victory.</p>

                <p>This chapter explains the rules governing combat.</p>

                <hr>

                <h2>The Order of Combat</h2>

                <p>A typical combat encounter is a clash between two sides: a flurry of weapon swings, feints, parries,
                    footwork, and spellcasting. The game organizes combat into a cycle of rounds and turns. A round
                    represents about 6 seconds in the game world. During a round, each participant in a battle takes a
                    turn. The order of turns is determined at the beginning of combat when everyone rolls Initiative.
                    Once everyone has taken a turn, the fight continues to the next round if neither side is defeated.
                </p>

                <h2>Combat Step by Step</h2>

                <p>Combat unfolds in these steps:</p>

                <ol>
                    <li><strong>Establish Positions.</strong> The Dungeon Master determines where all the characters and
                        monsters are located.</li>

                    <li><strong>Roll Initiative.</strong> Everyone involved in the combat encounter rolls Initiative,
                        determining the order of combatants’ turns.</li>

                    <li><strong>Take Turns.</strong> Each participant in the battle takes a turn in Initiative order.
                        When everyone involved in the combat has had a turn, the round ends. Repeat this step until the
                        fighting stops.</li>
                </ol>

                <h2>Initiative</h2>

                <p>Initiative determines the order of turns during combat. When combat starts, every participant rolls
                    Initiative by making a Dexterity check that determines their place in the Initiative order. The DM
                    rolls for monsters. For a group of identical creatures, the DM makes a single roll, so each member
                    of the group has the same Initiative.</p>

                <p><strong><em>Surprise!</em></strong> If a combatant is surprised by combat starting, that combatant
                    has Disadvantage on their Initiative roll. For example, if an ambusher starts combat while hidden
                    from a foe who is unaware that combat is starting, that foe is surprised.</p>

                <p><strong><em>Initiative Order.</em></strong> A combatant’s check total is called their Initiative
                    count, or Initiative for short. The DM ranks the combatants, from highest to lowest Initiative. This
                    is the order in which they act during each round. The Initiative order remains the same from round
                    to round.</p>

                <p><strong><em>Ties.</em></strong> If a tie occurs, the tied creatures each roll 1d10, the one with the
                    higher roll goes first.</p>

                <h2>Your Turn</h2>

                <p><strong>On your turn, you can move a distance up to your Speed and take two actions.</strong></p>

                <p>The main combat actions you can take are listed in “Actions" later in this chapter. A character’s
                    features and a monster’s stat block also provide action options. “Movement” later in this chapter
                    gives the rules for movement. If you are looking for a comprehensive list of actions, look inside
                    the rules glossary.</p>

                <p><strong><em>Communicating.</em></strong> You can communicate however you are able-through brief
                    utterances and gestures-as you take your turn. Doing so does not require an action on your part.</p>

                <p>Extended communication, such as a detailed explanation of something or an attempt to persuade a foe,
                    requires an action. The Influence action is the main way you try to influence a monster.</p>

                <p><strong><em>Interacting with Things.</em></strong> You can interact with one object or feature of the
                    environment for free. For example, you could open a door during your turn as you stride toward a
                    foe.</p>

                <p>If you want to interact with a second object, you need to take the Utilize action. Some magic items
                    and other special objects always require an action to use, as stated in their descriptions.</p>

                <p><strong><em>Doing Nothing on Your Turn.</em></strong> You can forgo moving, taking an action, or
                    doing anything at all on your turn. If you can’t decide what to do, consider taking the defensive
                    Dodge action.</p>

                <hr>

                <h2>Movement</h2>

                <p>On your turn, you can move a distance equal to your Speed or less. Or you can decide not to move.
                </p>

                <p>Your movement can include Climbing, Crawling, Teleportation, Jumping, and Swimming (each
                    explained in the Rules Glossary). These different modes of movement can be combined with your
                    regular movement, or they can constitute your entire move.</p>

                <p>However you’re moving with your Speed, you deduct the distance of each part of your move from it
                    until it's used up or until you are done moving, whichever comes first.</p>

                <h3>Playing on a Grid</h3>

                <p>If you play using a square grid and miniatures or other tokens, follow these rules.</p>

                <p><strong><em>Squares.</em></strong> Each square represents 5 feet.</p>

                <p><strong><em>Speed.</em></strong> Rather than moving foot by foot, move square by square on the grid,
                    using your Speed in 5-foot segments. You can translate your Speed into squares by dividing it by 5.
                    For example, a Speed of 30 feet translates into 6 squares. If you use a grid often, consider writing
                    your Speed in squares on your character sheet.</p>

                <p><strong><em>Entering a Square.</em></strong> To enter a square, you must have enough movement left to
                    pay for entering. It costs 1 square of movement to enter an unoccupied square that’s adjacent to
                    your space (orthogonally or diagonally adjacent). A square of Difficult Terrain costs 2 squares to
                    enter. Other effects might make a square cost even more.</p>

                <p><strong><em>Corners.</em></strong> Diagonal movement can’t cross the corner of a wall, a large tree,
                    or another terrain feature that fills its space.</p>

                <p><strong><em>Ranges.</em></strong> To determine the range on a grid between two things-whether
                    creatures or objects-count squares from a square adjacent to one of them and stop counting in the
                    space of the other one. Count by the shortest route.</p>

                <h3>Creature Size</h3>

                <p>A creature belongs to a size category, which determines the width of the square space the creature
                    occupies on a map, as shown on the Creature Size and Space table. That table lists the sizes from
                    smallest (Tiny) to largest (Gargantuan). A creature’s space is the area that it effectively controls
                    in combat and the area it needs to fight effectively.</p>

                <p>A character’s size is determined by species, and a monster’s size is specified in the monster’s stat
                    block.</p>

                <h2>Difficult Terrain</h2>

                <p>Difficult terrain slows movement.</p>

                <p>Each foot of movement through difficult terrain costs an additional foot of movement.</p>

                <p>Examples include:</p>

                <ul>
                    <li>Rubble</li>
                </ul>

                <ul>
                    <li>Deep snow</li>
                </ul>

                <ul>
                    <li>Thick undergrowth</li>
                </ul>

                <ul>
                    <li>Knee height water</li>
                </ul>

                <p>Multiple sources of difficult terrain do not stack unless a feature states otherwise. The Dungeon
                    Master determines whether terrain restricts movement.</p>

                <hr>

                <h2>Actions and Reactions</h2>

                <p>Most activities in and out of combat require actions. A creature has two actions to use on their
                    turn, and regains these actions when their next turn starts.</p>

                <p>Actions have different costs; for example, the Attack action costs one action, and so does the Dash
                    action, allowing you to Dash and Attack to use both of your actions on the same turn.</p>

                <p>If an action requires more than the two actions you receive on your turn, such as some spellcasting
                    or firearm actions, its cost is spread across multiple turns. If an action costs three actions, you
                    spend two actions on one turn and the remaining action on your next turn to complete it.</p>

                <p>A creature has one Reaction, which can only be used when its triggering condition is met.</p>

                <hr>

                <h2>Attack Action</h2>

                <p><strong>Cost:</strong> 1 Action</p>

                <p>When you take the Attack action, you make an attack. Some other actions and Reactions also allow you
                    to make an attack. Whether you strike with a melee weapon, fire a ranged weapon, or make an attack
                    roll as part of a spell, every attack follows this structure:</p>

                <ol>
                    <li><strong>Choose a Target.</strong> Pick a target within your attack's range: a creature, an
                        object, or a location.</li>

                    <li><strong>Determine Modifiers.</strong> The DM determines whether the target has Cover and
                        whether you have Advantage or Disadvantage against the target. Spells, special abilities, and
                        other effects may also grant bonuses or penalties to your attack roll.</li>

                    <li><strong>Resolve the Attack.</strong> Make the attack roll. On a hit, roll damage unless the
                        attack specifies otherwise. Some attacks cause additional effects instead of or in addition to
                        damage.</li>
                </ol>

                <hr>

                <h2>Attack Rolls</h2>

                <p>When making an attack with a weapon, unarmed strike, or spell:</p>

                <ol>
                    <li>Roll a d20.</li>

                    <li>Add the relevant modifier.</li>

                    <li>Add your Proficiency Bonus if you are proficient with the weapon.</li>

                    <li>Compare the result to the target's Armor Class.</li>
                </ol>

                <p>If the result equals or exceeds the target's Armor Class, the attack hits.</p>

                <hr>

                <h2>Armor Class</h2>

                <p>A creature's Armor Class represents how well the creature avoids being wounded in combat. A
                    character's AC is determined during character creation, while a monster's AC appears in its stat
                    block.</p>

                <p><strong><em>Calculating AC.</em></strong> All creatures begin with the same base Armor Class
                    calculation:</p>

                <p><strong>Base AC</strong> = 10 + the creature's Dexterity modifier</p>

                <p>A creature's AC can then be modified by armor, magic items, spells, and other effects.</p>

                <p><strong><em>Only One Base AC.</em></strong> Some spells and class features provide alternate methods
                    of calculating Armor Class. If a creature has multiple base AC calculations available, it must
                    choose one. Only one base calculation can apply at a time.</p>

                <h2>Magic Action</h2>

                <p><strong>Cost:</strong> Varies</p>

                <p>When you take the Magic Action, you cast a spell.</p>

                <p>The number of actions required depends on the spell slot used.</p>

                <table class="styled-table">
                    <thead>
                        <tr>
                            <th>Spell Type</th>
                            <th>Cost</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Cantrip</td>
                            <td>1 Action</td>
                        </tr>
                        <tr>
                            <td>Primary Slot Spell</td>
                            <td>2 Actions</td>
                        </tr>
                        <tr>
                            <td>Secondary Slot Spell</td>
                            <td>2 Actions</td>
                        </tr>
                        <tr>
                            <td>Tertiary Slot Spell</td>

                        </tr>
                    </tbody>
                </table>

                <p>After casting a spell, you gain the Fatigued condition until the start of your next turn.</p>

                <p>Some class features modify or ignore this penalty.</p>

                <p>Rules for spellcasting are explained in Chapter 8.</p>

                <hr>

                <h2>Dash Action</h2>

                <p><strong>Cost:</strong> 1 Action</p>

                <p>When you take the Dash action, your Speed increases by 15 feet until the start of your next turn.</p>

                <hr>

                <h2>Disengage Action</h2>

                <p><strong>Cost:</strong> 2 Actions</p>

                <p>Creatures cannot take the Attack action against you with Reactions, such as Opportunity Attacks or
                    Riposte.</p>

                <hr>

                <h2>Dodge Action</h2>

                <p><strong>Cost:</strong> 2 Actions</p>

                <p>When you take the Dodge action, until the start of your next turn:</p>

                <ul>
                    <li>Attack rolls against you have Disadvantage.</li>
                </ul>

                <ul>
                    <li>You have Advantage on Dexterity saving throws.</li>
                </ul>

                <hr>

                <h2>Help Action</h2>

                <p><strong>Cost:</strong> 2 Actions</p>

                <p>When you take the Help action, choose one of the following options.</p>

                <p><strong><em>Assist an Ability Check.</em></strong> Choose one of your skill or tool proficiencies and
                    one ally who is close enough for you to assist verbally or physically. That ally gains Advantage on
                    the next ability check they make using the chosen skill or tool before the start of your next turn.
                    The DM determines whether your assistance is possible.</p>

                <p><strong><em>Assist an Attack Roll.</em></strong> Distract an enemy within 5 feet of you, granting one
                    ally Advantage on the next attack roll they make against that enemy before the start of your next
                    turn. Alternatively, you may assist an adjacent ally, granting them Advantage on their next attack
                    roll before the start of your next turn.</p>

                <hr>

                <h2>Hide Action</h2>

                <p><strong>Cost:</strong> 2 Actions</p>

                <p>When you take the Hide action, attempt to conceal yourself. You must succeed on a DC 15 Dexterity
                    (Stealth) check while you are Heavily Obscured or behind Three-Quarters Cover or Total Cover,
                    and you must be outside every enemy's line of sight.</p>

                <p>On a successful check, you gain the Invisible condition while hidden. Record the total of your
                    check, which becomes the DC for creatures attempting to locate you with a Wisdom (Perception)
                    check.</p>

                <p>You immediately stop being hidden if you make a sound louder than a whisper, an enemy finds you, you
                    make an attack roll, or you cast a spell with a Verbal component.</p>

                <hr>

                <h2>Ready Action</h2>

                <p><strong>Cost:</strong> 2 Actions</p>

                <p>Prepare a single action with a cost of one action and specify a trigger.</p>

                <p>When the trigger occurs before the start of your next turn, you may immediately perform the chosen
                    action as a Reaction.</p>

                <p>If the trigger never occurs, the prepared action is lost.</p>

                <hr>

                <h2>Free Interactions</h2>

                <p>Certain minor activities require no action.</p>

                <p>Examples include:</p>

                <ul>
                    <li>Drawing a weapon.</li>
                </ul>

                <ul>
                    <li>Opening an unlocked door.</li>
                </ul>

                <ul>
                    <li>Picking up a small object.</li>
                </ul>

                <ul>
                    <li>Speaking briefly.</li>
                </ul>

                <p>The Dungeon Master determines whether an interaction is sufficiently minor.</p>

                <hr>

                <h2>Critical Hits</h2>

                <p>If you roll a 20 on the d20 for an attack roll, you score a Critical Hit. The attack automatically
                    hits regardless of modifiers or the target's Armor Class.</p>

                <p>A Critical Hit allows you to roll all of the attack's damage dice twice, then add the results
                    together before applying any relevant modifiers.</p>

                <p><strong>Example:</strong></p>

                <p>A Ranger wielding a longsword rolls a natural 20 on an attack roll. They roll 2d8 instead of 1d8 for
                    the longsword's damage and 4d4 instead of 2d4 from Hunter's Mark. They then add their Strength
                    modifier once as normal.</p>

                <p>Note that critical rolls only apply to attack rolls, not saving throws or ability checks.</p>

                <hr>

                <h2>Damage</h2>

                <p>Successful attacks and harmful effects deal damage.</p>

                <h4>Damage Types</h4>

                        </tr>
                        <tr>
                            <td>Fire</td>
                            <td>Flames, unbearable heat</td>
                        </tr>
                        <tr>
                            <td>Force</td>

                        </tr>
                        <tr>
                            <td>Lightning</td>
                            <td>Electricity</td>
                        </tr>
                        <tr>
                            <td>Necrotic</td>
                            <td>Life-draining energy</td>
                        </tr>
                        <tr>
                            <td>Physical</td>

                        </tr>
                        <tr>
                            <td>Poison</td>

                        </tr>

                        </tr>

                        </tr>

                        </tr>
                    </tbody>
                </table>

                <p>When damage is taken, reduce the target's Hit Points by the amount dealt.</p>

                <hr>

                <h2>Immunity, Resistance, and Vulnerability</h2>

                <p>Some creatures possess Resistance or Vulnerability.</p>

                <p>Resistance halves incoming damage of the specified type.</p>

                <p>Vulnerability doubles incoming damage of the specified type.</p>

                <p>Apply Resistance before Vulnerability unless a feature states otherwise.</p>

                <hr>

                <h2>Reactions</h2>

                <p>Certain special abilities, spells, and situations allow you to take a special action called a
                    Reaction. A Reaction is an instant response to a trigger, which can occur on your turn or another
                    creature's turn.</p>

                <p>When you take a Reaction, you can't take another one until the start of your next turn. If your
                    Reaction interrupts another creature's turn, that creature continues its turn immediately afterward.
                </p>

                <p>A Reaction occurs immediately after its trigger unless its description states otherwise.</p>

                <hr>

                <h2>Cover</h2>

                <p>Obstacles can provide protection from attacks and effects.</p>

                <p>The Dungeon Master determines whether a target has cover.</p>

                <p>Typical cover categories include:</p>

                <table class="styled-table">
                    <thead>
                        <tr>
                            <th>Cover</th>
                            <th>Effect</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Half Cover</td>
                            <td>+2 AC</td>
                        </tr>
                        <tr>
                            <td>Three-Quarters Cover</td>
                            <td>+5 AC</td>
                        </tr>
                        <tr>
                            <td>Total Cover</td>
                            <td>Cannot be targeted directly</td>
                        </tr>
                    </tbody>
                </table>

                <hr>

                <h2>Hit Points</h2>

                <p>Hit Points represent durability and the will to live. Creatures with more Hit Points are more
                    difficult to kill. Your Hit Point maximum is the number of Hit Points you have when uninjured.</p>

                <p>Your current Hit Points can be any number from your maximum down to 0, which is the lowest your Hit
                    Points can go.</p>

                <p>Whenever you take damage, subtract it from your Hit Points. Losing Hit Points has no effect on your
                    capabilities until you reach 0 Hit Points.</p>

                <p>If you have half your Hit Points or fewer, you're Bloodied. This has no game effect on its own but
                    may trigger other abilities or effects.</p>

                <p>Rules for Death Saves are detailed later in this chapter.</p>

                <hr>

                <h2>Healing and Temporary Hit Points</h2>

                <h4>Healing</h4>

                <p>When a feature restores Hit Points, the creature regains Hit Points equal to the amount healed, up to
                    its Hit Point maximum.</p>

                <p><strong>Example:</strong> If you receive 8 Hit Points of healing while at 14 Hit Points with a
                    maximum of 20, you regain only 6 Hit Points.</p>

                <h4>Temporary Hit Points</h4>

                <p>If you have Temporary Hit Points and take damage, those points are lost first. Any remaining damage
                    is then applied to your Hit Points.</p>

                <p><strong>Example:</strong> If you have 5 Temporary Hit Points and take 7 damage, you lose the 5
                    Temporary Hit Points and then lose 2 Hit Points.</p>

                <p>Temporary Hit Points last until they are depleted or you finish a Long Rest.</p>

                <p>Temporary Hit Points cannot be combined. If you gain Temporary Hit Points while you already have
                    some, choose whether to keep the existing amount or gain the new amount.</p>

                <p><strong>Example:</strong> If you have 10 Temporary Hit Points and gain 12 more, you may have either
                    10 or 12 Temporary Hit Points, not 22.</p>

                <h2>Dropping to 0 Hit Points</h2>

                <p>When you start your turn with 0 Hit Points, you begin dying and must make a Death Saving Throw.</p>

                <p>Make a d20 saving throw. Unlike other saving throws, this roll isn't tied to an ability score.</p>

                <p><strong>20-16:</strong> You start your turn as normal.</p>

                <p><strong>15-11:</strong> You start your turn with one Action.</p>

                <p><strong>10-5:</strong> You start your turn with no Actions and gain one level of Exhaustion.</p>

                <p><strong>4-1:</strong> You start your turn with no Actions, gain two levels of Exhaustion, and fall
                    Prone at the end of your turn.</p>

                <p>Once per turn, whenever you take damage while at 0 Hit Points, you gain one level of Exhaustion.</p>

                <p><strong>Aiding a Dying Character.</strong> A creature can use an Action to make a DC 10 Medicine
                    check. On a success, the dying creature has Advantage on its next Death Saving Throw.</p>

                <hr>

                <h2>Stabilizing a Creature</h2>

                <p>A creature within reach can attempt to stabilize an unconscious creature.</p>

                <p>The Dungeon Master may require a Wisdom (Medicine) check.</p>

                <p>A stabilized creature remains at 0 Hit Points but no longer makes Death Saving Throws.</p>

                <hr>

                <h2>Summary</h2>

                <p>Combat follows a simple structure:</p>

                <ol>
                    <li>Roll Initiative.</li>

                    <li>Take turns.</li>

                    <li>Move and spend Actions.</li>

                    <li>Use Reactions when opportunities arise.</li>

                    <li>Continue until the encounter ends.</li>
                </ol>

                <h5>Chapter 5, Creating a Character</h5>

                <h2>Who Are You?</h2>

                <p>There are many places to start when creating a character, but the method this book recommends helps
                    ensure that your character is enjoyable for you, your party, and the Dungeon Master. This section is
                    tailored primarily to my (Awesomecool Dashiell Geiser's) tastes, but most fantasy tabletop RPG
                    groups function similarly.</p>

                <p>Before creating your character, discuss with your Dungeon Master and fellow players what kind of game
                    everyone wants to play. Consider the tone, themes, and genre of the campaign. My personal favorite
                    falls somewhere between the Resident Evil and Metal Gear series.</p>

                <p>First, choose a personality for your character that you believe will be enjoyable for both you and
                    the rest of the table. Not every character concept works well in a cooperative game. Extremely
                    ideological, antisocial, or chaotic characters can easily create conflicts that make it difficult
                    for the campaign to continue.</p>

                <p>Creating a mechanically effective character is relatively easy. Creating one who naturally fits into
                    the group is a much more valuable investment.</p>

                <h3>Dash's Really Awesome Method of Character Personality and Background and Origin and Such</h3>

                <p>Imagine yourself at a party or another social gathering. You should be able to picture yourself
                    having a pleasant conversation with your character while also deciding afterward that you probably
                    wouldn't intentionally spend much more time with them. They may be a little socially awkward,
                    self-absorbed, loud, or perhaps you simply wouldn't quite click.</p>

                <p>This helps ensure that your character functions well alongside the other people at the table while
                    still feeling like their own person instead of simply being yourself.</p>

                <p>Never create a character who would refuse to work alongside the rest of the party.</p>

                <p><strong>Next,</strong> choose your character's background. Why are they seeking adventure? Do they
                    travel to help those in need? Do they require wealth to accomplish a personal goal? Are they
                    searching for a person, a place, or a powerful artifact?</p>

                <p>Your character's personality is also shaped by their past. Consider what experiences made them who
                    they are today and why they react to the world the way they do.</p>

                <p>Some helpful questions include:</p>

                <ul>
                    <li>Who raised you, and how?</li>
                </ul>

                <ul>
                    <li>What was your proudest moment?</li>
                </ul>

                <ul>
                    <li>What was your greatest shame?</li>
                </ul>

                <ul>
                    <li>What organizations have you interacted with?</li>
                </ul>

                <ul>
                    <li>Are you considered a friend or an enemy by them?</li>
                </ul>

                <ul>
                    <li>What keeps you going when things become difficult?</li>
                </ul>

                <h3>Experiences</h3>

                <ul>
                    <li><strong>Handy.</strong> You gain proficiency in one Tool of your choice.</li>
                    <a>|</a>
                    <li><strong>Speaker.</strong> You learn one language of your choice.</li>
                    <a>|</a>
                    <li><strong>Scholar.</strong> You learn to read and write in one language you know.</li>
                    <a>|</a>
                    <li><strong>Devotee.</strong> Choose a deity. The party cannot have a negative standing with that
                        deity.</li>
                    <a>|</a>
                    <li><strong>One Contact.</strong> Work with your GM to establish one specific person or family in a
                        city or region of your choice. This person owes you a minor favor and is generally willing to
                        help you with information, shelter, or a small risk.</li>
                    <a>|</a>
                    <li><strong>Guild Membership.</strong> Work with your DM to choose a guild or trade organization.
                        Members recognize you as one of their own and generally provide basic lodging, meals, local
                        information, or professional advice when reasonable.</li>
                    <a>|</a>
                    <li><strong>Temple Standing.</strong> Choose a religion or temple organization. Members of that
                        faith generally provide you food, shelter, and basic assistance when able, provided you do not
                        act against the interests of the faith.</li>
                    <a>|</a>
                    <li><strong>Military Service.</strong> You once served in an organized military force. You have
                        Advantage on checks to identify military ranks, procedures, insignia, and tactics.</li>
                    <a>|</a>
                    <li><strong>Illicit Contact.</strong> Work with your GM to establish one fence or black-market
                        trader. This contact is generally willing to buy unusual goods or smuggle items and people.</li>
                    <a>|</a>
                    <li><strong>Alchemist.</strong> You add 1d6 to Intelligence or Medicine checks to identify a potion,
                        oil, or alchemical substance by sight or smell.</li>
                    <a>|</a>
                    <li><strong>Natural Affinity.</strong> You add 1d6 to Wisdom (Animal Handling) checks with four
                        beasts of your choice.</li>
                    <a>|</a>
                    <li><strong>Strong Swimmer.</strong> You have a swimming speed equal to your walking speed.</li>
                    <a>|</a>
                    <li><strong>Sea Legs.</strong> You add 1d6 to checks to avoid falling or being knocked Prone on a
                        moving ship or slippery surface.</li>
                    <a>|</a>
                    <li><strong>Weather Eye.</strong> After observing the sky and wind for 10 minutes, you can
                        accurately predict natural weather conditions for the next 12 hours or determine if the weather
                        is unnatural.</li>
                    <a>|</a>
                    <li><strong>Streetwise.</strong> You add 1d6 to Charisma checks to gather rumors or locate someone
                        willing to buy or sell illegal goods.</li>
                    <a>|</a>

                    <a>|</a>

                    <a>|</a>

                    <a>|</a>

                        Armor by using the Help action.</li>
                    <a>|</a>
                    <li><strong>Chivalric Court.</strong> You don't have Disadvantage on Charisma checks when
                        interacting with hostile nobles, knights, or other members of the gentry. You are fluent in the
                        etiquette of courts, feasts, and duels.</li>
                    <a>|</a>
                    <li><strong>Watchful.</strong> You add 1d6 to Perception checks while keeping watch during a Long or
                        Short Rest.</li>
                    <a>|</a>
                    <li><strong>Hobby Performer.</strong> You gain proficiency with one musical instrument. You may use
                        Dexterity or Wisdom instead of Charisma when making Performance checks, but you roll 3d4 instead
                        of a d20.</li>
                    <a>|</a>
                    <li><strong>Home Ground.</strong> Choose a terrain type (forest, mountains, swamp, desert, and so
                        on). While in that terrain, you cannot become lost except by magical means, and you add 1d6 to
                        checks made to find food, water, or shelter.</li>
                    <a>|</a>
                    <li><strong>Pathfinder.</strong> While traveling through the wilderness, your group moves at a
                        normal pace without suffering penalties to Stealth or Perception, and creatures tracking your
                        group have Disadvantage on their checks.</li>
                    <a>|</a>
                    <li><strong>Befriend the Unnatural.</strong> You can use Animal Handling checks on any creature with
                        an Intelligence of -4 or lower.</li>
                    <a>|</a>
                    <li><strong>Alert.</strong> Even while performing another travel activity, such as foraging,
                        navigating, or tracking, you remain alert to danger.</li>
                    <a>|</a>
                    <li><strong>Hunter.</strong> While tracking creatures, you also learn their exact number, their
                        sizes, and how long ago they passed through the area.</li>
                    <a>|</a>
                    <li><strong>Mimic.</strong> You can accurately mimic the sounds (but not speech) of creatures you
                        have heard. A creature hearing the imitation makes an Insight check against your Mental DC. If
                        you are imitating the sounds of a beast, that check has Disadvantage.</li>
                </ul>

                <hr>

                <h2>Class and Attributes</h2>

                <p>This step determines the majority of how your character interacts mechanically with the world and in
                    combat.</p>

                <h2>Choose a Class</h2>

                <p>This system contains fourteen classes. When choosing a class, simply pick the one that sounds the
                    most enjoyable to play.</p>


                <p>Class diversity is not required for a successful party, though it is generally helpful to have at
                    least one character representing two different roles.</p>

                <p>Also consider the source of each class's power. <strong>Martial</strong> classes rely entirely on
                    physical prowess and have no spellcasting. <strong>Mystics</strong> use limited spellcasting to
                    enhance their other abilities. <strong>Spellcasters</strong> primarily interact with the world
                    through magic.</p>
