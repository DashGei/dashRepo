                    <li>The party rejects honest labor.</li>
                </ul>

                <h3>Boons</h3>

                <p><strong>Minor Boon (FP 3-5): Between the Hammer and the Anvil.</strong> Mentorship ability checks to
                    learn Tool (Artisan's Tools only) or Weapon proficiencies have advantage.</p>

                <p><strong>Boon (FP 6-9): Masterwork.</strong> Crafting an object takes half the time.</p>

                <p><strong>Major Boon (FP 10): Sharp Minds and Blades.</strong> Party members add 2d6 to Intelligence
                    checks dealing with tools, weapons, or masonry.</p>

                <h3>Woes</h3>

                <p><strong>Minor Woe (FP -3 to -4): Dull.</strong> Mentorship ability checks to learn Tool (Artisan's
                    Tools only) or Weapon proficiencies have disadvantage.</p>

                <p><strong>Greater Woe (FP -5): Cold Forge.</strong> Crafting an object takes double the time.</p>

                <h2>Chronicle</h2>

                <p><em>The Hierophant, Patron of Scrolls</em></p>

                <p>Before kingdoms built monuments of stone, Chronicle preserved them in ink. Every treaty, every map,
                    every family lineage, and every hero's final words pass across parchment. He teaches that memory is
                    civilization's greatest defense against repeating its failures.</p>

                <p><strong>Domains:</strong> History, writing, records, memory, scholarship<br>
                    <strong>Worship Method:</strong> Discipline (recording, preserving, and sharing knowledge.)
                </p>

                <h3>Favor Criteria</h3>

                <ul>
                    <li>The party records an important event, discovery, or battle in writing.</li>
                    <li>A party member spends downtime copying or translating a written work.</li>
                    <li>Two or more party members share parts of their people's history.</li>
                    <li>The party saves an important record or piece of knowledge.</li>
                </ul>

                <h3>Disfavor Criteria</h3>

                <ul>
                    <li>The party deliberately destroys books, records, or historical artifacts without necessity.</li>
                    <li>They knowingly spread false history for personal gain.</li>
                    <li>They allow important knowledge to be permanently lost.</li>
                </ul>

                <h3>Boons</h3>

                <p><strong>Minor Boon (FP 3-5): Written Twice.</strong> Mentorship ability checks to learn Languages and
                    Skill proficiencies have Advantage.</p>

                <p><strong>Boon (FP 6-9): Living Record.</strong> Once per long rest, a party member may perfectly
                    recall any conversation, document, symbol, or scene the party has witnessed within the last month.
                    The recollection includes details the players themselves may have forgotten, subject to the DM's
                    notes.</p>

                <p><strong>Major Boon (FP 10): Chronicle's Lesson.</strong> Once per week (resetting on Hephdach), after
                    completing a long rest, two willing party members may each exchange one Skill Proficiency they
                    possess with the other until their next long rest. Neither gains a proficiency they already possess.
                </p>

                <h3>Woes</h3>

                <p><strong>Minor Woe (FP -3 to -4): Fade.</strong> Once per day, when a party member attempts to recall
                    an important detail, the DM may omit one meaningful piece of information they would otherwise
                    remember.</p>

                <p><strong>Greater Woe (FP -5): Forgotten Names.</strong> Mentorship ability checks to learn Languages
                    and Skill proficiencies have Disadvantage.</p>

                <hr>

                <h2>Keep</h2>

                <p><em>The Star, Patron of Dreams</em></p>

                <p>Each star in the night sky represents the memory of a great or terrible person, and all the entropy
                    associated with them. When a mortal sleeps, their soul briefly drifts to this world. Some remember
                    only fragments upon waking; others return carrying impossible ideas, forgotten memories, or glimpses
                    of futures that may never come to pass. Keep urges his followers to look within themselves and find
                    what they must pursue.</p>

                <p><strong>Domains:</strong> Dreams, hope, prophecy, sleep, imagination<br>
                    <strong>Worship Method:</strong> Ideals (embracing dreams and inspiration.)
                </p>

                <h3>Favor Criteria</h3>

                <ul>
                    <li>The party encourages another creature to pursue a hope or ambition.</li>
                    <li>A party member journals their dreams.</li>
                    <li>Two or more party members discuss what they hope their futures will become.</li>
                </ul>

                <h3>Disfavor Criteria</h3>

                <ul>
                    <li>The party crushes another creature's aspirations.</li>
                    <li>They abandon hope despite meaningful opportunity remaining.</li>
                    <li>A party member knowingly betrays their own deeply held ideals.</li>
                </ul>

                <h3>Boons</h3>

                <p><strong>Minor Boon (FP 3-5): Awakened.</strong> The party cannot be surprised during long rests.</p>

                <p><strong>Boon (FP 6-9): Stars Yet Unwritten.</strong> Once per week (resetting on Same'ih), after
                    completing a long rest, the party may ask the DM one question about a significant choice they expect
                    to face before their next long rest. The answer comes as a symbolic shared dream. It is truthful,
                    but never literal, and reveals possibility rather than certainty.</p>

                <p><strong>Major Boon (FP 10): Tomorrow's Dream.</strong> Once per long rest, the party can cast
                    <em>Dream</em> as a ritual spell.
                </p>

                <h3>Woes</h3>

                <p><strong>Minor Woe (FP -3 to -4): Restless Night.</strong> Once per day, when a party member completes
                    a long rest, they awaken remembering unsettling dreams. The first Wisdom or Charisma saving throw
                    they make that day suffers a 1d4 penalty.</p>

                <p><strong>Greater Woe (FP -5): Living Bad Dreams.</strong> Once per week (resetting on Same'ih), one
                    player has a nightmare involving a damage type during a long rest. The following day, the first time
                    that character takes damage of that type, they have vulnerability to it.</p>

                <hr>

                <h2>Mil</h2>

                <p><em>The Fool, Patron of the Fey</em></p>

                <p>No one agrees whether Mil is the oldest of the Fey or simply the strongest. They wander the Feywild
                    wearing a different face every season, inspiring great fear and wonder alike. Mil's creations are
                    known by their beguiling behavior and terrifying actions unto those who offend them.</p>

                <p><strong>Domains:</strong> Fey, curiosity, whimsy, transformation, revelry, Firbolgs<br>
                    <strong>Worship Method:</strong> Ideals (embracing wonder, curiosity, and joyful unpredictability.)
                </p>

                <h3>Favor Criteria</h3>

                <ul>
                    <li>The party chooses the more interesting path over the safer or more practical one.</li>
                    <li>A party member plays a harmless prank.</li>
                    <li>The party accepts hospitality from Fey.</li>
                    <li>The party repays kindness with an unexpected act of generosity or delight.</li>
                </ul>

                <h3>Disfavor Criteria</h3>

                <ul>
                    <li>The party destroys something beautiful simply because it is inconvenient.</li>
                    <li>They reject curiosity.</li>
                    <li>A party member knowingly breaks a promise made to a Fey.</li>
                </ul>

                <h3>Boons</h3>

                <p><strong>Minor Boon (FP 3-5): Fey Friends.</strong> Party members never suffer disadvantage when
                    making Charisma (Persuasion) checks.</p>

                <p><strong>Boon (FP 6-9): Mil's Masquerade.</strong> When an Enchantment spell cast by a party member
                    dictates that the target knows it was enchanted, they do not know until they finish a long rest.</p>

                <p><strong>Major Boon (FP 10): Mine Now!</strong> Once per week (resetting on Frejdag), a party member
                    can steal a person's name for one day if the creature reads it aloud in full. While their name is
                    stolen, the party member can either choose to have that person charmed or steal their appearance as
                    if with the <em>Alter Self</em> spell.</p>

                <h3>Woes</h3>

                <p><strong>Minor Woe (FP -3 to -4): Humor Me.</strong> Once per day, when a party member makes a saving
                    throw against an Enchantment spell, that roll has 1d4 subtracted.</p>

                <p><strong>Greater Woe (FP -5): What's His Face.</strong> Once per week (resetting on Frejdag), the DM
                    secretly chooses one party member. Until their next long rest, creatures cannot remember that
                    creature's name.</p>

                <hr>

                <h2>Meddle</h2>

                <p><em>Justice, Patron of Fate</em></p>

                <p>In the year 920 the great elvish king was desperately looking for ways to save his kingdom, his last
                    hope being a seamstress of Meddle in a far-off village. After pleading for days, he eventually
                    resorted to the only method he knew, but before his hand could reach the hilt of his sword, the last
                    of his great capital and body had crumbled to dust.</p>

                <p><strong>Domains:</strong> Fate, consequence, destiny, Divination<br>
                    <strong>Worship Method:</strong> Ideals (accepting the consequences of one's choices and ensuring
                    that actions receive their due.)
                </p>

                <h3>Favor Criteria</h3>

                <ul>
                    <li>A party member gets their fortune told.</li>
                    <li>The party ensures that a wronged creature receives meaningful justice.</li>
                    <li>The party fulfills a costly promise despite having an easy opportunity to escape it.</li>
                    <li>Two or more party members openly acknowledge one another's mistakes and choose a fair
                        resolution.</li>
                    <li>The party restores balance between two feuding groups.</li>
                </ul>

                <h3>Disfavor Criteria</h3>

                <ul>
                    <li>The party knowingly allows a grievous injustice to stand for personal convenience.</li>
                    <li>A party member shifts blame they know belongs to themselves.</li>
                    <li>The party attempts to manipulate fate via fiendish or celestial entities.</li>
                    <li>The party dissuades an NPC from following what they believe is their fate.</li>
                </ul>

                <h3>Boons</h3>

                <p><strong>Minor Boon (FP 3-5): Weal.</strong> Once per long rest, after a party member rolls a natural
                    1 on an attack roll, ability check, or saving throw, they gain Advantage on the next d20 test they
                    make before the end of their turn.</p>

                <p><strong>Boon (FP 6-9): In the Cards.</strong> Subsequent castings of the <em>Augury</em> spell do not
                    have the normal 25% cumulative penalty as long as a spell slot was spent when the spell was cast.
                    Additionally, <em>Augury</em> now affects the next 2 hours, and the <em>Intuition</em> feat can be
                    used three times before a long rest.</p>

                <p><strong>Major Boon (FP 10): Through Her Eyes.</strong> Once per week (resetting on Lucae),
                    immediately after a creature within 60 feet succeeds on an attack roll, saving throw, or ability
                    check through magical assistance, luck manipulation, or Legendary Resistance, the party may invoke
                    Meddle's judgment. The creature must immediately repeat the roll without those benefits and use the
                    new result.</p>

                <h3>Woes</h3>

                <p><strong>Minor Woe (FP -3 to -4): Woe.</strong> Once per long rest, after a party member rolls a
                    natural 20 on an attack roll, ability check, or saving throw, they have Disadvantage on the next d20
                    test they make before the end of their turn.</p>

                <p><strong>Greater Woe (FP -5): Born Under a Bad Sign.</strong> Once per week (resetting on Lucae), the
                    DM gives a mundane sign of misfortune such as a broken mirror, black bird, red moon, etc. If the
                    party fails to recognize the omen, they have disadvantage on their next initiative roll. Regardless
                    of whether the omen is recognized, the DM does not reveal if the omen was caused by this woe.</p>

                <hr>

                <h2>Bahamut</h2>

                <p><em>Judgment, Patron of Loyalty</em></p>

                <p>Although the Dragon clans of the southern continent are constantly warring with one another, each
                    family is bound by the same oath which dictates how laws are laid, battles are fought, and robes are
                    passed on. Bahamut judges communities as individuals, believing that greatness is measured by what a
                    people build together across generations.</p>

                <p><strong>Domains:</strong> Loyalty, honor, family, Dragons<br>
                    <strong>Worship Method:</strong> Ideals (remaining steadfast to companions and honoring bonds freely
                    chosen.)
                </p>

                <h3>Favor Criteria</h3>

                <ul>
                    <li>A party member willingly places themselves in danger to protect another party member.</li>
                    <li>The party refuses to abandon an ally despite significant personal cost.</li>
                    <li>A party member invokes their ancestors before an undertaking.</li>
                    <li>Two or more party members openly express gratitude or admiration for one another.</li>
                    <li>The party reconciles after genuine disagreement.</li>
                </ul>

                <h3>Disfavor Criteria</h3>

                <ul>
                    <li>A party member knowingly betrays an ally's trust.</li>
                    <li>The party abandons a companion when rescue was reasonably possible.</li>
                    <li>The party destroys an heirloom.</li>
                    <li>A party member breaks an oath.</li>
                </ul>

                <h3>Boons</h3>

                <p><strong>Minor Boon (FP 3-5): Faithful Companions.</strong> When a creature makes a d20 test with
                    Advantage due to the Help action, they re-roll any 1s.</p>

                <p><strong>Boon (FP 6-9): Stand Together.</strong> Death saving throws gain a bonus equal to one-third
                    of the party's favor points with Bahamut as long as the dying party member is within 10 feet of a
                    party member with at least 1 hit point.</p>

                <p><strong>Major Boon (FP 10): Platinum Bond.</strong> Once per week (resetting on Lucae), the party can
                    cast the spell <em>Summon Dragon</em> as a 10-minute ritual. The dragon requires no concentration,
                    is controlled by the DM or a player who chooses to do so, and rolls its own initiative.</p>

                <h3>Woes</h3>

                <p><strong>Minor Woe (FP -3 to -4): Shunned.</strong> The party can never have Advantage when
                    interacting with Dragonborn or Dragons.</p>

                <p><strong>Greater Woe (FP -5): Divided Hearts.</strong> Once per week, the DM may declare that a
                    community or organization the party would normally find welcoming instead receives them with
                    suspicion until they prove themselves.</p>

                <h2>Tempo</h2>

                <p><em>Temperance, Patron of Time</em></p>

                <p>Tempo's followers record the erosion of rivers, the growth of trees, and the passage of kingdoms as
                    their sermons. They believe life and the world have their own rhythms, and that those who rush ahead
                    of the beat will find themselves left behind.</p>

                <p><strong>Domains:</strong> Time, aging, patience, age, cycles<br>
                    <strong>Worship Method:</strong> Discipline (respecting the natural pace of growth, change, and
                    renewal.)
                </p>

                <h3>Favor Criteria</h3>

                <ul>
                    <li>The party solves a problem through patience rather than haste.</li>
                    <li>A party member spends meaningful downtime practicing or cultivating a long-term pursuit.</li>
                    <li>Two or more party members reflect on how they have changed since beginning their journey.</li>
                    <li>The party restores something old instead of replacing it.</li>
                </ul>

                <h3>Disfavor Criteria</h3>

                <ul>
                    <li>The party's impatience directly causes harm.</li>
                    <li>They repeatedly abandon their endeavors because results are not immediate.</li>
                    <li>A party member disrespects the wisdom of elders or the perspective of youth.</li>
                </ul>

                <h3>Boons</h3>

                <p><strong>Minor Boon (FP 3-5): A Moment Longer.</strong> Party members can comfortably remain awake for
                    an additional 8 hours before risking exhaustion from lack of sleep.</p>

                <p><strong>Boon (FP 6-9): Premonition.</strong> Once per long rest, a party member may choose to roll
                    1d20 at the start of their turn. The next d20 test they make before the end of their turn uses that
                    roll.</p>

                <p><strong>Major Boon (FP 10): Borrowed Time.</strong> Once per week (resetting on Bahaphay), when a
                    party member is reduced to 0 hit points, time briefly hesitates around them and they immediately
                    take their turn, falling to 0 hit points when their turn finishes regardless of any healing received
                    during this time.</p>

                <h3>Woes</h3>

                <p><strong>Minor Woe (FP -3 to -4): Out of Step.</strong> Once per day, the first Initiative roll made
                    by a party member suffers a 1d4 penalty.</p>

                <p><strong>Greater Woe (FP -5): Take the Time.</strong> Once per week (resetting on Bahaphay), the party
                    only gets one short rest between long rests.</p>

                <hr>

                <h2>Leviathan</h2>

                <p><em>Primordial Titan of Water, the Unstoppable Force</em></p>

                <p>Leviathan is the elemental titan of all waters, from the placid surface of a forest pond to the
                    ship-cracking fury of a maelstrom. Followers of Leviathan are equal parts naturalists and sailors
                    who fear his terrible wrath, usually only quelled by a sacrifice to the waves.</p>

                <p><strong>Domains:</strong> Water, oceans, storms, the natural cycle, balance, the deep, Tritons<br>
                    <strong>Worship Method:</strong> Ideals (defending the integrity of nature, especially waters, and
                    opposing those who exploit, pollute, or unnaturally command the elements)
                </p>

                <h3>Favor Criteria</h3>

                <ul>
                    <li>The party cleanses a polluted water source or prevents an impending contamination.</li>
                    <li>They offer a meaningful gift to a body of water before a voyage (a coin, a ration, a drop of
                        their own blood).</li>
                    <li>They defeat a creature or force that seeks to control harm aquatic environments for gain.</li>
                </ul>

                <h3>Disfavor Criteria</h3>

                <ul>
                    <li>The party pollutes a body of water.</li>
                    <li>The party hunts aquatic creatures for sport.</li>
                    <li>They aid a creature or force that seeks to control harm aquatic environments for gain.</li>
                </ul>

                <h3>Boons</h3>

                <p><strong>Minor Boon (FP 3-5): Calm Waters.</strong> Once per long rest, the party can will a small
                    body of water (a lake, cove, or river stretch) to become preternaturally calm for 1 hour. Water
                    vehicles within the area gain advantage on all checks to navigate or remain upright, and seasickness
                    is suppressed entirely among the party and their allies.</p>

                <p><strong>Boon (FP 6-9): Tidal Surge.</strong> Once per week (resetting on Prydei), the DM may cast the
                    spell <em>Control Water</em> to the party's benefit.</p>

                <p><strong>Major Boon (FP 10): Children of the Sea.</strong> Once per long rest, a party member can cast
                    the spell <em>Summon Elemental</em> as a 10-minute ritual.</p>

                <h3>Woes</h3>

                <p><strong>Minor Woe (FP -3 to -4): Unsettled Seas.</strong> Once per day, whenever the party travels on
                    or near water, the water becomes unnaturally choppy. All Dexterity (Acrobatics) checks and
                    concentration saving throws made while on a boat have disadvantage until the party sets foot on dry
                    land.</p>

                <p><strong>Greater Woe (FP -5): Maelstrom’s Wrath.</strong> Once per week (resetting on Prydei), one
                    party member who enters a body of water is immediately attacked by 1d4 Water Weirds.</p>

                <hr>

                <h2>Kaori</h2>

                <p><em>Primordial Titan of Fire, Phoenix Mother</em></p>

                <p>Kaori is the elemental titan of fire. In the millennium since the war with the gods, she has been
                    largely dormant. Defeat at the hands of Sol left her wounded in body and spirit, and she now sits in
                    her elemental plane in a state of quiet melancholy. Yet she remains a titan, and those who seek
                    rebirth, renewal, or the courage to rise from ash will find her embers still warm.</p>

                <p><strong>Domains:</strong> Fire, rebirth, pyrotechnics, renewal<br>
                    <strong>Worship Method:</strong> Ideals (defending nature's right to burn and renew, and aiding
                    those who seek genuine rebirth or transformation)
                </p>

                <h3>Favor Criteria</h3>

                <ul>
                    <li>The party prevents the unnatural suppression or extinction of a natural fire (a volcanic vent, a
                        sacred flame, an eternal pyre).</li>
                    <li>They aid a creature or community seeking genuine rebirth or reinvention.</li>
                    <li>They offer something meaningful to a fire before a journey: a written regret, a lock of hair, a
                        dry branch.</li>
                    <li>Two or more party members sit vigil together through a long night, speaking of what they wish to
                        leave behind and what they hope to become.</li>
                </ul>

                <h3>Disfavor Criteria</h3>

                <ul>
                    <li>They mock or dismiss someone's sincere attempt to change or begin anew.</li>
                    <li>They use fire to torture, terrorize, or destroy.</li>
                </ul>

                <h3>Boons</h3>

                <p><strong>Minor Boon (FP 3-5): Burnin' For You.</strong> When a party member takes fire damage, they
                    add a d4 to their next attack roll before the end of their next turn.</p>

                <p><strong>Boon (FP 6-9): Phoenix Heart.</strong> When the party finishes a short rest near any flame (a
                    campfire, a candle, a torch), each member regains an additional PB x 1d4 hit points.</p>

                <p><strong>Major Boon (FP 10): From The Fires.</strong> Once per week (resetting on Prydei), when a
                    party member is reduced to 0 hit points, they regain 1 hit point immediately and have the spell
                    <em>Fire Shield</em> (warm) cast on them until the start of their next turn.
                </p>

                <h2>Ao</h2>

                <p><em>Primordial Titan of Air, Whisper</em></p>

                <p>Ao is the elemental titan and wyvern of air. Unlike Leviathan's silent depth or Kaori's wounded
                    stillness, Ao is carefree, curious, and utterly indifferent to mortal consequence. Ao has fleeting
                    memory, and the past actions of the gods bear no power over his conscious.</p>

                <p><strong>Domains:</strong> Air, wind, sky, sound, freedom, caprice<br>
                    <strong>Worship Method:</strong> Ideals (defending the open sky from those who would chain it, and
                    celebrating freedom in all its forms)
                </p>

                <h3>Favor Criteria</h3>

                <ul>
                    <li>The party destroys or disables a device or spell designed to control the weather or bind air
                        elementals.</li>
                    <li>The party plays a harmless prank.</li>
                    <li>The party defeats a creature that imprisons others.</li>
                    <li>Two or more party members spend an evening doing something just for the fun of it.</li>
                </ul>

                <h3>Disfavor Criteria</h3>

                <ul>
                    <li>The party is cruel to or harms a flying beast.</li>
                    <li>They mock the idea of being carefree.</li>
                </ul>

                <h3>Boons</h3>

                <p><strong>Minor Boon (FP 3-5): Air Dance.</strong> When a party member, ally, or object falls from a
                    height tall enough to deal fall damage, the DM rolls 1d6. On a 2-6, the spell <em>Feather Fall</em>
                    is cast on the target.</p>

                <p><strong>Boon (FP 6-9): The Wind Cries Mary.</strong> Once per week (resetting on Prydei), the DM may
                    allow the party to send a message as if by the <em>Sending</em> spell, carried on a gust of wind to
                    any creature they have met. The reply arrives within 1 minute as a soft breeze that speaks directly
                    into the recipient's ear. Additionally, the DM may use this boon to deliver a cryptic hint or rumor
                    to the party from Ao's rambling consciousness.</p>

                <p><strong>Major Boon (FP 10): Flying High Again.</strong> All party members have a hover speed equal to
                    their walking speed.</p>

                <h3>Woes</h3>

                <p><strong>Minor Woe (FP -3 to -4): Blowin' in the Wind.</strong> Once per day, when a party member
                    attempts a Dexterity (Acrobatics) check, they must subtract 1d4 from the roll.</p>

                <p><strong>Greater Woe (FP -5): Zephyr's Prank.</strong> Once per week (resetting on Prydei), the DM
                    casts the spells <em>Wind Wall</em> or <em>Control Winds</em> on the party in a way which hampers
                    them.</p>

                <hr>

                <h2>Aeon</h2>

                <p><em>Primordial Titan of Earth, the Unmovable Object</em></p>

                <p>Aeon is the oldest being in the planescape, the great stone Gaia is just an extension of themself,
                    now cast off as they reside in their extraplanar prison. The other Titans view the great Wyrm as
                    simple, but Aeon processes time at a much quicker rate than all others leading them to view all
                    things as fickle.</p>

                <p><strong>Domains:</strong> Earth, stone, mountains, stability, endurance<br>
                    <strong>Worship Method:</strong> Ideals (defending nature and the earth’s integrity)
                </p>

                <h3>Favor Criteria</h3>

                <ul>
                    <li>The party prevents a mining operation that threatens a sacred mountain, cavern, or underground
                        ecosystem.</li>
                    <li>They stop a creature or force that unnaturally destabilizes the ground (subsidence, magical
                        earthquakes, burrowing horrors that collapse settlements).</li>
                    <li>Two or more party members meditate in a cave or on bare rock for a full watch.</li>
                </ul>

                <h3>Disfavor Criteria</h3>

                <ul>
                    <li>The party deliberately collapses a cave or stone structure that holds natural beauty or homes.
                    </li>
                    <li>They desecrate an ancient menhir circle, burial cairn, or petrified forest.</li>
                    <li>The party abuses wildlife residing in caves or soil.</li>
                </ul>

                <h3>Boons</h3>

                <p><strong>Minor Boon (FP 3-5): Surefooted.</strong> Party members have Advantage on saving throws
                    against the prone condition as long as they are standing on natural stone.</p>

                <p><strong>Boon (FP 6-9): Earthen Eyes.</strong> If a party member closes their eyes and meditates
                    calmly for one hour, they gain Tremorsense out to 500 feet while doing nothing but meditating.</p>

                <p><strong>Major Boon (FP 10): Turn to Stone.</strong> Once per week (resetting on Bahaphay), the party
                    can cast the spell <em>Meld into Stone</em> as a ritual, affecting the entire party at once. While
                    merged, they can sense the vibrations of any creature moving on the stone within 100 feet.
                    Additionally, once during that merge, one party member can cast <em>Stoneskin</em> on themselves
                    without expending a spell slot.</p>

                <h3>Woes</h3>

                <p><strong>Minor Woe (FP -3 to -4): Loose Ground.</strong> Once per day, when a party member takes the
                    Dash action on natural ground, the DM may have the earth shift underfoot. The character must succeed
                    on a DC 12 Dexterity saving throw or fall prone.</p>

                <p><strong>Greater Woe (FP -5): Trembling Earth.</strong> Once per week (resetting on Prydei), when the
                    party takes a long rest in a natural cave, ruin, or overland camp, the earth shakes violently for 1
                    minute. The tremor extinguishes open flames, scatters loose gear, and forces a DC 15 Constitution
                    saving throw from each party member to gain any benefit from the rest. On a failure, the rest counts
                    as a short rest instead.</p>

                <h5>Chapter 9, Equipment</h5>

                <h2>Coins</h2>

                <p>Characters often find coins on their adventures and can spend those coins in shops, inns, and other
                    businesses. Coins come in different denominations based on the relative worth of their material. The
                    Coin Values table lists coins and how much they’re worth relative to the Gold Piece, which is the
                    game’s main coin. For example, 100 Copper Pieces are worth 1 Gold Piece.</p>

                <p>A coin weighs about a third of an ounce, so fifty coins weigh a pound.</p>

                <h3>Weapon Proficiency</h3>

                <p>Anyone can wield a weapon, but you must have proficiency with it to add your Proficiency
                    Bonus to an attack roll you make with it. A player character’s features can provide
                    weapon proficiencies. A monster is proficient with any weapon in its stat block.</p>

                <h3>Properties</h3>

                <p>Here are definitions of the properties in the Properties column of the Weapons table.</p>

                <h4>Ammunition</h4>

                <p>You can use a weapon that has the Ammunition property to make a ranged attack only if you
                    have ammunition to fire from it. The type of ammunition required is specified with the
                    weapon’s range. Each attack expends one piece of ammunition. Drawing the ammunition is
                    part of the attack (you need a free hand to load a one-handed weapon). After a fight,
                    you can spend 1 minute to recover half the ammunition (round down) you used in the
                    fight; the rest is lost.</p>

                <h4>Finesse</h4>

                <p>When making an attack with a Finesse weapon, use your choice of your Strength or
                    Dexterity modifier for the attack and damage rolls. You must use the same modifier for
                    both rolls.</p>

                <h4>Heavy</h4>

                <p>You have Disadvantage on attack rolls with a Heavy weapon if it’s a Melee weapon and
                    your Strength score isn’t at least 1 or if it’s a Ranged weapon and your Dexterity score
                    isn’t at least 1.</p>

                <h4>Light</h4>

                <p>Once per turn when you take the Attack action and miss you immediately make another
                    attack at disadvantage against the same target without spending an action. That attack
                    must be made with another held weapon with the Light property.</p>

                <h4>Range</h4>

                <p>A Range weapon has a range in parentheses after the Ammunition or Thrown property. The
                    range lists two numbers. The first is the weapon’s normal range in feet, and the second
                    is the weapon’s long range. When attacking a target beyond normal range, you have
                    Disadvantage on the attack roll. You can’t attack a target beyond the long range.</p>

                <h4>Reach</h4>

                <p>A Reach weapon adds 5 feet to your reach when you attack with it.</p>

                <h4>Thrown</h4>

                <p>If a weapon has the Thrown property, you can throw the weapon to make a ranged attack,
                    and you can draw that weapon as part of the attack. If the weapon is a Melee weapon, use
                    the same ability modifier for the attack and damage rolls that you use for a melee
                    attack with that weapon.</p>

                <h4>Two-Handed</h4>

                <p>A Two-Handed weapon requires two hands when you attack with it.</p>

                <h4>Hunker</h4>

                <p>A creature firing a Hunker weapon doesn't suffer Disadvantage from the prone condition.
                </p>

                <h4>Versatile</h4>

                <p>A Versatile weapon can be used with one or two hands. A damage value in parentheses
                    appears with the property. The weapon deals that damage when used with two hands to make
                    a melee attack.</p>

                <hr>

                <h3>Support Weapons</h3>

                <p>Employed by more organized militaries around the world. Squad weapons are expensive
                    pieces of equipment which require special training to use. A creature untrained in a
                    squad weapon is unable to use any of the features labeled with the squad weapon tag. A
                    player can use a long rest of downtime to become trained in the weapon.</p>

                <h2>Weapon Proficiency</h2>

                <p>Anyone can wield a weapon, but you must have proficiency with it to add your Proficiency Bonus to an
                    attack roll you make with it. A player character’s features can provide weapon proficiencies. A
                    monster is proficient with any weapon in its stat block.</p>

                <hr>

                <h2>Making a Weapon Attack</h2>

                <p>To make a weapon attack, choose a target within the weapon's range and make an attack roll.</p>

                <p><strong>Attack Roll = d20 + Physical Modifier + Proficiency Bonus</strong></p>

                <p>If the result equals or exceeds the target's Armor Class, the attack hits.</p>

                <p>On a hit, roll the weapon's damage die and apply any additional modifiers or effects.</p>

                <p>Unless a rule states otherwise, melee weapons use your Strength modifier and ranged weapons use your
                    Dexterity modifier.</p>

                <p>Some weapons possess the Finesse property, allowing either Strength or Dexterity to be used.</p>

                <hr>

                <h2>Improvised Weapons</h2>

                <p>An improvised weapon is an object wielded as a makeshift weapon, such as broken glass, a table leg,
                    or a frying pan. A Simple or Martial weapon also counts as an improvised weapon if it’s wielded in a
                    way contrary to its design; if you use a Ranged weapon to make a melee attack or throw a Melee
                    weapon that lacks the <a
                        href="https://www.dndbeyond.com/sources/dnd/free-rules/equipment#Thrown">Thrown</a> property,
                    the weapon counts as an improvised weapon. An improvised weapon follows the rules below.</p>

                <p><strong><em>Proficiency.</em></strong> Don’t add your Proficiency Bonus to attack rolls with an
                    improvised weapon.</p>

                <p><strong><em>Damage.</em></strong> On a hit, the weapon deals 1d4 damage of a type the DM thinks is
                    appropriate for the object.</p>

                <p><strong><em>Range.</em></strong> If you throw the weapon, it has a normal range of 20 feet and a long
                    range of 60 feet.</p>

                <p><strong><em>Weapon Equivalents.</em></strong> If an improvised weapon resembles a Simple or Martial
                    weapon, the DM may say it functions as that weapon and uses that weapon’s rules. For example, the DM
                    could treat a table leg as a Club.</p>

                <hr>

                <h2>Unarmed Strikes</h2>

                <p>Instead of using a weapon to make a melee attack, you can use a punch, kick, headbutt, or similar
                    forceful blow. In game terms, this is an Unarmed Strike - a melee attack that involves you using
                    your body to damage, grapple, or shove a target within 5 feet of you.</p>

                <p>Whenever you use your Unarmed Strike, choose one of the following options for its effect.</p>

                <p><strong><em>Damage.</em></strong> You make an attack roll against the target. Your bonus to the roll
                    equals your Strength modifier plus your Proficiency Bonus. On a hit, the target takes Bludgeoning
                    damage equal to 1 plus your Strength modifier.</p>

                <p><strong><em>Grapple.</em></strong> The target must succeed on a Strength or Dexterity saving throw
                    (it chooses which), or it has the Grappled condition. The DC for the saving throw and any escape
                    attempts equals 8 plus your Strength modifier and Proficiency Bonus. This grapple is possible only
                    if the target is no more than one size larger than you and if you have a hand free to grab it.</p>

                <p><strong><em>Shove.</em></strong> The target must succeed on a Strength or Dexterity saving throw (it
                    chooses which), or you either push it 5 feet away or cause it to have the Prone condition. The
                    DC for the saving throw equals 8 plus your Strength modifier and Proficiency Bonus. This shove is
                    possible only if the target is no more than one size larger than you.</p>

                <hr>

                <h2>Armor</h2>

                <p>The Armor table lists the game’s main armor. The table includes the cost and weight of armor, as well
                    as the following details:</p>

                <p><strong>Category.</strong> Every type of armor falls into a category: Light, Medium, or Heavy. The
                    category determines how long it takes to don or doff the armor (as shown in the table).</p>

                <p><strong>Armor Class (AC).</strong> The table’s Armor Class column tells you what your base AC is when
                    you wear a type of armor. For example, if you wear Leather Armor, your base AC is 11 plus your
                    Dexterity modifier, whereas your AC is 16 in Chain Mail.</p>

                <p><strong>Strength.</strong> If the table shows a Strength score in the Strength column for an armor
                    type, that armor reduces the wearer’s speed by 10 feet unless the wearer has a Strength score equal
                    to or higher than the listed score.</p>

                <p><strong>Stealth.</strong> If the table shows "Disadvantage" in the Stealth column for an armor type,
                    the wearer has Disadvantage on Dexterity (Stealth) checks.</p>

                <h3>Armor Training</h3>

                <p>Anyone can don armor or hold a Shield, but only those with training can use them effectively, as
                    explained below. A character’s class and other features determine the character’s armor training. A
                    monster has training with any armor in its stat block.</p>

                <h4>Light, Medium, or Heavy Armor</h4>

                <p>If you wear Light, Medium, or Heavy armor and lack training with it, you gain one point of exhaustion
                    when you finish a turn with both actions used.</p>

                <h4>Shield</h4>

                <p>You gain the Armor Class benefit of a Shield only if you have training with it.</p>

                <h2>Tools</h2>

                <p>A tool helps you make specialized ability checks, craft certain items, or both. A tool’s description
                    includes the tool’s cost and weight, as well as the following entries:</p>

                <ul>
                    <li><strong>Ability.</strong> This entry lists the ability to use when making an ability check with
                        the tool.</li>
                    <li><strong>Utilize.</strong> This entry lists things you can do with the tool when you take the
                        Utilize action. You can do one of those things each time you take the action. This entry also
                        provides the DC for the action.</li>
                    <li><strong>Craft.</strong> This entry lists what, if anything, you can craft with the tool. For
                        crafting rules, see <em>Crafting Equipment</em> later in the chapter.</li>
                    <li><strong>Variants.</strong> This entry appears if the tool has variants, which are listed. Each
                        requires a separate proficiency.</li>
                </ul>

                <h2>Tool Proficiency</h2>

                <p>If you have proficiency with a tool, add your Proficiency Bonus to any ability check you make that
                    uses the tool. If you have proficiency in a skill that’s used with that check, you have Advantage on
                    the check too.</p>

                <p>Your features might give you proficiency with a tool. A monster has proficiency with any tool in its
                    stat block.</p>

                <h2>Net (1 GP)</h2>

                <p>When you take the <strong>Attack</strong> action, you can replace one of your attacks with throwing a
                    Net.</p>

                <p>Target a creature you can see within 15 feet of yourself.</p>

                <p>The target must succeed on a Dexterity saving throw (<strong>DC = 8 + your Dexterity modifier + your
                        Proficiency Bonus</strong>) or gain the <strong>Restrained</strong> condition until it escapes.
                </p>

                <p>The target automatically succeeds if it is <strong>Huge or larger</strong>.</p>

                <p>To escape, the target or a creature within 5 feet of it must take an action and succeed on a
                    <strong>DC 10 Strength (Athletics)</strong> check.
                </p>

                <ul>
                    <li><strong>AC:</strong> 10</li>
                    <li><strong>HP:</strong> 5</li>

                </ul>

                <h2>Oil (1 SP)</h2>

                <p>You can douse a creature, object, or space with Oil or use it as fuel, as detailed below.</p>

                <h3>Dousing a Creature or an Object</h3>

                <p>When you take the <strong>Attack</strong> action, you can replace one of your attacks with throwing
                    an Oil flask.</p>

                <p>Target one creature or object within 20 feet of yourself. The target must succeed on a <strong>Phys
                        DC Dexterity</strong> saving throw or be covered in oil.</p>

                <p>If the target takes Fire damage before the oil dries (after 1 minute), the target takes an extra
                    <strong>5 Fire damage</strong> from burning oil.
                </p>

                <h3>Dousing a Space</h3>

                <p>You can take the <strong>Utilize</strong> action to pour an Oil flask on level ground to cover a
                    5-foot-square area within 5 feet of yourself.</p>

                <p>If lit, the oil burns until the end of the turn 2 rounds from when the oil was lit (12 seconds) and
                    deals <strong>5 Fire damage</strong> to any creature that enters the area or ends its turn there.
                </p>

                <p>A creature can take this damage only once per turn.</p>

                <h3>Fuel</h3>

                <p>Oil serves as fuel for Lamps and Lanterns.</p>

                <p>Once lit, a flask of Oil burns for <strong>6 hours</strong> in a Lamp or Lantern. That duration
                    doesn't need to be consecutive; you can extinguish the burning Oil (as a Utilize action) and
                    rekindle it until it has burned for a total of 6 hours.</p>

                <h2>Paper (2 SP)</h2>

                <p>One sheet of Paper can hold about <strong>250 handwritten words</strong>.</p>

                <h2>Parchment (1 SP)</h2>

                <p>One sheet of Parchment can hold about <strong>250 handwritten words</strong>.</p>

                <h2>Perfume (5 GP)</h2>

                <p>Perfume comes in a 4-ounce vial.</p>

                <p>For 1 hour after applying Perfume to yourself, you have Advantage on Charisma (Persuasion) checks
                    made to influence an <strong>Indifferent Humanoid</strong> within 5 feet of yourself.</p>

                <h2>Poison, Basic (100 GP)</h2>

                <p>As an Action, you can use a vial of Basic Poison to coat one weapon or up to three pieces of
                    ammunition.</p>

                <p>A creature that takes Physical damage from the poisoned weapon or ammunition takes an extra
                    <strong>1d4 Poison damage</strong>.
                </p>

                <p>Once applied, the poison retains potency for <strong>1 minute</strong> or until its damage is dealt,
                    whichever comes first.</p>

                <h2>Pole (5 CP)</h2>

                <p>A Pole is <strong>10 feet long</strong>.</p>

                <p>You can use it to touch something up to 10 feet away. If you must make a Strength (Athletics) check
                    as part of a High or Long Jump, you can use the Pole to vault, giving yourself Advantage on the
                    check.</p>

                <h2>Pot, Iron (2 GP)</h2>

                <p>An Iron Pot holds up to <strong>1 gallon</strong>.</p>

                <h2>Potion of Healing (50 GP)</h2>

                <p>This potion is a magic item.</p>

                <p>As an Action, you can drink it or administer it to another creature within 5 feet of yourself.</p>

                <p>The creature that drinks the magical red fluid in this vial regains <strong>2d4 + 2 Hit
                        Points</strong>.</p>

                <h2>Pouch (5 SP)</h2>

                <p>A Pouch holds up to <strong>6 pounds</strong> within <strong>one-fifth of a cubic foot</strong>.</p>

                <h2>Priest's Pack (33 GP)</h2>

                <p>A Priest's Pack contains the following items:</p>

                <ul>
                    <li>Backpack</li>
                    <li>Blanket</li>
                    <li>Holy Water</li>
                    <li>Lamp</li>
                    <li>7 days of Rations</li>
                    <li>Robe</li>
                    <li>Tinderbox</li>
                </ul>

                <h2>Quiver (1 GP)</h2>

                <p>A Quiver holds up to <strong>20 Arrows</strong>.</p>

                <h2>Ram, Portable (4 GP)</h2>

                <p>You can use a Portable Ram to break down doors.</p>

                <p>When doing so, you gain a <strong>+4 bonus</strong> to the Athletics (Strength) check.</p>

                <p>One other character can help you use the ram, giving you Advantage on this check.</p>

                <h2>Rations (5 SP)</h2>

                <p>Rations consist of travel-ready food, including:</p>

                <ul>
                    <li>Jerky</li>
                    <li>Dried fruit</li>
                    <li>Hardtack</li>
                    <li>Nuts</li>
                </ul>

                <p>See <strong>"Malnutrition"</strong> in the rules glossary for the risks of not eating.</p>

                <h2>Robe (1 GP)</h2>

                <p>A Robe has vocational or ceremonial significance.</p>

                <p>Some events and locations admit only people wearing a Robe bearing certain colors or symbols.</p>

                <h2>Rope (1 GP)</h2>

                <p>As a Utilize action, you can tie a knot with Rope if you succeed on a <strong>DC 10 Dexterity
                        (Sleight of Hand)</strong> check.</p>

                <p>The Rope can be burst with a successful <strong>DC 20 Strength (Athletics)</strong> check.</p>

                <p>You can bind an unwilling creature with the Rope only if the creature has the
                    <strong>Grappled</strong>, <strong>Incapacitated</strong>, or <strong>Restrained</strong> condition.
                </p>

                <p>If the creature's legs are bound, the creature has the <strong>Restrained</strong> condition until it
                    escapes.</p>

                <p>Escaping the Rope requires the creature to make a successful <strong>DC 15 Dexterity
                        (Acrobatics)</strong> check as an action.</p>

                <h2>Sack (1 CP)</h2>

                <p>A Sack holds up to <strong>30 pounds</strong> within <strong>1 cubic foot</strong>.</p>

                <h2>Scholar's Pack (40 GP)</h2>

                <p>A Scholar's Pack contains the following items:</p>

                <ul>
                    <li>Backpack</li>
                    <li>Book</li>
                    <li>Ink</li>
                    <li>Ink Pen</li>
                    <li>Lamp</li>
                    <li>10 flasks of Oil</li>
                    <li>10 sheets of Parchment</li>
                    <li>Tinderbox</li>
                </ul>

                <h2>Shovel (2 GP)</h2>

                <p>Working for 1 hour, you can use a Shovel to dig a hole that is <strong>5 feet on each side</strong>
                    in soil or similar material.</p>

                <h2>Signal Whistle (5 CP)</h2>

                <p>When blown as a Utilize action, a Signal Whistle produces a sound that can be heard up to <strong>600
                        feet away</strong>.</p>


                <h2>Spell Scroll (Cantrip, 30 GP, Level 1, 50 GP)</h2>

                <p>A Spell Scroll (Cantrip) or Spell Scroll (Level 1) is a magic item that bears the words of a cantrip
                    or level 1 spell, respectively, determined by the scroll's creator.</p>

                <p>If the spell is on your class's spell list, you can read the scroll and cast the spell using its
                    normal casting time and without providing any Material components.</p>

                <p>If the spell requires a saving throw or an attack roll:</p>

                <ul>
                    <li><strong>Spell Save DC:</strong> 13
                        <ul>
                            <li><strong>Spell Attack Bonus:</strong> +5</li>
                        </ul>
                    </li>
                </ul>

                <p>The scroll disintegrates when the casting is completed.</p>

                <h2>Spikes, Iron (1 GP)</h2>

                <p>Iron Spikes come in bundles of ten.</p>

                <p>As a Utilize action, you can use a blunt object, such as a Light Hammer, to hammer a spike into wood,
                    earth, or a similar material.</p>

                <p>You can do so to:</p>

                <ul>
                    <li>Jam a door shut</li>
                    <li>Tie a Rope to the Spike</li>
                    <li>Tie a Chain to the Spike</li>
                </ul>

                <h2>Spyglass (1,000 GP)</h2>

                <p>A creature using a Spyglass has Advantage on Wisdom (Perception) checks on creatures and objects if
                    they are more than 30 feet away and less than 5 miles away.</p>

                <h2>String (1 SP)</h2>

                <p>String is <strong>10 feet long</strong>.</p>

                <p>You can tie a knot in it as a Utilize action.</p>

                <h2>Tent (2 GP)</h2>

                <p>A Tent sleeps up to <strong>two Small or Medium creatures</strong>.</p>

                <h2>Tinderbox (5 SP)</h2>

                <p>A Tinderbox is a small container holding flint, fire steel, and tinder (usually dry cloth soaked in
                    light oil) used to kindle a fire.</p>

                <ul>
                    <li>Lighting a Candle, Lamp, Lantern, Torch, or anything else with exposed fuel takes an
                        <strong>Action</strong>.
                    </li>
                    <li>Lighting any other fire takes <strong>1 minute</strong>.</li>
                </ul>

                <h2>Torch (1 CP)</h2>

                <p>A Torch burns for <strong>1 hour</strong>, casting:</p>

                <ul>
                    <li><strong>Bright Light:</strong> 20-foot radius</li>
                    <li><strong>Dim Light:</strong> Additional 20 feet</li>
                </ul>

                <p>When you take the Attack action, you can attack with the Torch, using it as a <strong>Simple Melee
                        weapon</strong>.</p>

                <p>On a hit, the target takes <strong>1 d4 Fire damage</strong>.</p>

                <h2>Vial (1 GP)</h2>

                <p>A Vial holds up to <strong>4 ounces</strong>.</p>

                <h2>Waterskin (2 SP)</h2>

                <p>A Waterskin holds up to <strong>4 pints</strong>.</p>

                <p>If you don't drink sufficient water, you risk dehydration (see the rules glossary).</p>

                <hr>

                <h2>Mounts and Vehicles</h2>

                <p>A mount can help you move more quickly through the wilderness, but its primary purpose is to carry
                    gear that would otherwise slow you down.</p>

                <p>The <strong>Mounts and Other Animals</strong> table shows each animal's carrying capacity. See
                    appendix B for the animals' stat blocks.</p>

                <h2>Mounts and Cargo</h2>

                <p>An animal pulling a carriage, cart, chariot, sled, or wagon can move weight up to <strong>five times
                        its base carrying capacity</strong>, including the weight of the vehicle.</p>

                <p>If multiple animals pull the same vehicle, add their carrying capacities together.</p>

                <h2>Barding</h2>

                <p>Barding is armor designed for a mount.</p>

                <p>Any type of armor on the Armor table in this chapter can be purchased as barding.</p>

                <ul>
                    <li><strong>Cost:</strong> Four times the normal cost</li>
                    <li><strong>Weight:</strong> Twice the normal weight</li>
                </ul>

                <h2>Saddles</h2>

                <p>A saddle comes with:</p>

                <ul>
                    <li>Bit</li>
                    <li>Bridle</li>
                    <li>Reins</li>
                    <li>Any other equipment needed to use the saddle</li>
                    <li><strong>Military Saddle:</strong> Grants Advantage on ability checks made to remain mounted.
                    </li>
                    <li><strong>Exotic Saddle:</strong> Required for riding an aquatic or flying mount.</li>
                </ul>

                <h2>Large Vehicles</h2>

                <p>The <strong>Airborne and Waterborne Vehicles</strong> table provides statistics for various types of
                    large vehicles.</p>

                <p>The following notes apply.</p>

                <h2>Speed</h2>

                <p>A ship sailing against a strong wind moves at <strong>half speed</strong>.</p>

                <p>In a dead calm (no wind), waterborne ships can't move under sail and must be rowed.</p>

                <p><strong>Keelboats</strong> and <strong>Rowboats</strong> are used on lakes and rivers.</p>

                <p>If going downstream, add the speed of the current (typically <strong>3 miles per hour</strong>) to
                    the speed of the vehicle.</p>

                <p>These vehicles can't be rowed against any significant current, but they can be pulled upstream by
                    draft animals on the shores.</p>

                <p>A Rowboat can be carried and weighs <strong>100 pounds</strong>.</p>

                <h2>Crew</h2>

                <p>A ship larger than a Keelboat or Rowboat needs a crew of skilled hirelings (see
                    <strong>Services</strong>) to function.
                </p>

                <p>The minimum number of skilled hirelings needed to crew a ship depends on the type of ship, as shown
                    in the table.</p>

                <h2>Passengers</h2>

                <p>The table lists the number of Small and Medium passengers the ship can accommodate using hammocks.
                </p>

                <p>A ship outfitted with private accommodations can carry <strong>one-fifth as many passengers</strong>.
                </p>

                <p>Typical passage costs:</p>

                <ul>
                    <li>Hammock: <strong>5 SP per day</strong></li>
                    <li>Small private cabin: <strong>2 GP per day</strong></li>
                </ul>

                <p>Prices can vary from ship to ship.</p>

                <h2>Damage Threshold</h2>

                <p>If a vehicle has a damage threshold (see the rules glossary), it is noted in the table.</p>

                <h2>Ship Repair</h2>

                <p>Repairs to a damaged ship can be made while the vessel is berthed.</p>

                <p>For each <strong>1 Hit Point</strong> repaired:</p>

                <ul>
                    <li><strong>Time:</strong> 1 day</li>
                    <li><strong>Cost:</strong> 20 GP</li>
                </ul>

                <p>If repairs are made where supplies and skilled labor are abundant (such as a city shipyard), both the
                    time and cost are halved.</p>

                <h2>Services</h2>

                <p>This section outlines services and other expenses that adventurers might spend money on.</p>

                <h2>Lifestyle Expenses</h2>

                <p>Lifestyle expenses summarize the cost of living in a fantasy world.</p>

                <p>They cover:</p>

                <ul>
                    <li>Lodging</li>
                    <li>Food</li>
                    <li>Equipment maintenance</li>
                    <li>Other necessities</li>
                </ul>

                <p>At the start of each week or month (DM's choice), choose a lifestyle and pay the price to sustain it.
                </p>

                <p>Lifestyles have no inherent consequences, but the DM might take them into account when determining
                    risks or how others perceive your character.</p>

                <h3>Wretched (Free)</h3>

                <p>You survive via chance and charity.</p>

                <p>You're often exposed to natural dangers as a result of sleeping outside.</p>

                <h3>Squalid (1 SP per Day)</h3>

                <p>You spend the bare minimum for your necessities.</p>

                <p>You might be exposed to unhealthy conditions and opportunistic criminals.</p>

                <h3>Poor (2 SP per Day)</h3>

                <p>You spend frugally for your necessities.</p>

                <h3>Modest (1 GP per Day)</h3>

                <p>You support yourself at an average level.</p>

                <h3>Comfortable (2 GP per Day)</h3>

                <p>You spend modestly for your necessities and enjoy a few luxuries.</p>

                <h3>Wealthy (4 GP per Day)</h3>

                <p>You're accustomed to the finer things in life and might have servants.</p>

                <h3>Aristocratic (10 GP per Day)</h3>

                <p>You pay for the best and might have a staff that supports your lifestyle.</p>

                <p>Others notice your wealth and might encourage you to share it, either legally or otherwise.</p>

                            <td>2,000 GP</td>
                        </tr>
                        <tr>
                            <td>6th-8th</td>
                            <td>City only</td>
                            <td>20,000 GP</td>
                        </tr>
                        <tr>
                            <td>9th</td>
                            <td>City only</td>
                            <td>100,000 GP</td>
                        </tr>
                    </table>
                </div>

                <h5>Chapter 10, Rules Glossary</h5>

                <h2>Ability Check</h2>

                <p>Whenever a character attempts an action with a meaningful chance of failure, the Dungeon Master may
                    call for an ability check.</p>

                <p>To make an Ability Check, roll a d20 and add the relevant Ability Modifier. If you are proficient in
                    a relevant skill, tool, or activity, you also add your Proficiency Bonus.</p>

                <p>If the result equals or exceeds the Difficulty Class (DC) set by the Dungeon Master, the check
                    succeeds.</p>

                <p>The Dungeon Master determines which ability and skill apply to the task.</p>

                <hr>

                <h2>Ability Score</h2>

                <p>Ability Scores represent a creature's natural talents and aptitudes.</p>

                <p>The five Ability Scores are:</p>

                <ul>
                    <li>Strength</li>
                    <li>Dexterity</li>
                    <li>Intelligence</li>
                    <li>Wisdom</li>
                    <li>Charisma</li>
                </ul>

                <p>Most Ability Scores range from -1 to +5 for player characters.</p>

                <p>Your Ability Scores influence your Ability Modifiers, saving throws, skills, attacks, and class
                    features.</p>

                <hr>

                <h2>Ability Modifier</h2>

                <p>An Ability Modifier is the numerical value derived from an Ability Score.</p>

                <p>Whenever a rule refers to a Strength modifier, Dexterity modifier, Intelligence modifier, Wisdom
                    modifier, or Charisma modifier, it is referring to the modifier associated with that Ability Score.
                </p>

                <p>Ability Modifiers are added to many rolls, including Ability Checks, Attack Rolls, and Saving Throws.
                </p>

                <hr>

                <h2>Action</h2>

                <p>Most activities in and out of combat require actions. A creature has two actions to use on their
                    turn, and regains these actions when their next turn starts.</p>

                <p>Actions have different costs, for example the attack action costs one action, and so does the dash
                    action, so you can dash and attack to use all of your actions in one turn.</p>

                <p>If an action requires you to use more than the two actions you get on your turn, such as some spell
                    casting or firearms, the cost is spread throughout multiple turns. If an action costs 3 total
                    actions, you use two actions on one turn, and then must use one action on your next turn to complete
                    the action.</p>

                <hr>

                <h2>Ally</h2>

                <p>An Ally is a creature that is friendly toward you and is generally working toward the same goals.</p>

                <p>The Dungeon Master determines whether a creature counts as an ally in situations where it is unclear.
                </p>

                <hr>

                <h2>Armor Class</h2>

                <p>A creature’s Armor Class represents how well the creature avoids being wounded in combat. The AC of a
                    character is determined at character creation (see <a
                        href="https://www.dndbeyond.com/sources/dnd/phb-2024/creating-a-character">chapter 2</a>),
                    whereas the AC of a monster appears in its stat block.</p>

                <p><strong><em>Calculating AC.</em></strong> All creatures start with the same base AC calculation:</p>

                <p><strong>Base AC</strong> = 10 + the creature’s Dexterity modifier</p>

                <p>A creature’s AC can then be modified by armor, magic items, spells, and more.</p>

                <p><strong><em>Only One Base AC.</em></strong> Some spells and class features give characters a
                    different way to calculate their AC. A character with multiple features that give different ways to
                    calculate AC must choose which one to use; only one base calculation can be in effect for a
                    creature.</p>

                <hr>

                <h2>Armor Training</h2>

                <p>Armor Training represents proficiency with a category of armor.</p>

                <p>The armor categories are:</p>

                <ul>
                    <li>Light Armor</li>
                    <li>Medium Armor</li>
                    <li>Heavy Armor</li>
                    <li>Shields</li>
                </ul>

                <p>A creature benefits from armor only if it has the appropriate Armor Training.</p>

                <p>If you wear Light, Medium, or Heavy armor and lack training with it, you gain one point of exhaustion
                    when you finish a turn with both actions used.</p>

                <p>Class features, species traits, and other abilities may grant additional Armor Training</p>

                <hr>

                <h2>Friendly</h2>

                <p>A Friendly creature views you favorably. You have Advantage on an ability check to influence a
                    Friendly creature.</p>

                <hr>

                <h2>Hostile</h2>

                <p>A Hostile creature views you unfavorably. You have Disadvantage on an ability check to influence a
                    Hostile creature</p>

                <hr>

                <h2>Indifferent</h2>

                <p>An Indifferent creature has no desire to help or hinder you. Indifferent is the default attitude of a
                    monster.</p>

                <hr>

                <h2>Attunement</h2>

                <p>Some magic items require a creature to form a special bond with them before their properties can be
                    used.</p>

                <p>This bond is called Attunement.</p>

                <p>A creature can be attuned to only a limited number of items at a time, as determined by the Dungeon
                    Master or the item's rules.</p>

                <p>A creature must satisfy any requirements listed by the item in order to attune to it.</p>

                <hr>

                <h2>Blindsight</h2>

                <p>If you have Blindsight, you can see within a specific range without relying on physical sight. Within
                    that range, you can see anything that isn’t behind Total Cover even if you have the Blinded
                    condition or are in Darkness. Moreover, in that range, you can see something that has the
                    Invisible condition.</p>

                <hr>

                <h2>Bloodied</h2>

                <p>A creature is Bloodied while it has half its Hit Points or fewer remaining.</p>

                <hr>

                <h2>Breaking Objects</h2>

                <p>Objects can be harmed by attacks and by some spells, using the rules below. If an object is
                    exceedingly fragile, the DM may allow a creature to break it automatically with the Attack or
                    Utilize action.</p>

                <p><strong><em>Armor Class.</em></strong> The Object Armor Class table suggests ACs for various
                    substances.</p>

                <p><strong><em>Damage Types and Objects.</em></strong> Objects have Immunity to Poison and Psychic
                    damage. The DM might decide that some damage types are more or less effective against an object. For
                    example, Bludgeoning damage works well for smashing things but not for cutting. Paper or cloth
                    objects might have Vulnerability to Fire damage.</p>

                <p><strong><em>Damage Threshold.</em></strong> Big objects, such as castle walls, often have extra
                    resilience represented by a damage threshold.</p>

                <p><strong><em>No Ability Scores.</em></strong> An object lacks ability scores unless a rule assigns
                    scores to the object. Without ability scores, an object can’t make ability checks, and it fails all
                    saving throws.</p>

                <h2>Cantrip</h2>

                <p>A Cantrip is a simple spell that can be cast without expending a Spell Slot.</p>

                <p>Casting a Cantrip requires the Magic Action and costs one Action to cast on your turn.</p>

                <hr>

                <h2>Character Sheet</h2>

                <p>A Character Sheet contains the game statistics, features, equipment, and other information that
                    define a player character.</p>

                <hr>

                <h2>Creature</h2>

                <p>A Creature is any living, animate, or otherwise active being in the game.</p>

                <p>Player characters, monsters, animals, summoned beings, and nonplayer characters are all creatures.
                </p>

                <p>Every creature belongs to one or more creature types. A creature’s type is listed in its stat block
                    and can affect how spells, abilities, and other game effects interact with it.</p>

                <p>Common creature types include Aberration, Beast, Celestial, Construct, Dragon, Elemental, Fey, Fiend,
                    Giant, Monstrosity, Mortal, Ooze, Plant, and Undead.</p>

                <p>If an effect applies to a specific creature type, it affects only creatures of that type unless
                    stated otherwise.</p>

                <p>Objects, terrain features, and unattended equipment are not creatures unless a rule states otherwise.
                </p>

                <hr>

                <h2>Curses</h2>

                <p>Some game effects curse a creature or an object. The effect that confers a curse defines what the
                    curse does. Curses can be removed by the Remove Curse and Greater Restoration spells or other
                    magic that explicitly ends curses.</p>

                <hr>

                <h2>D20 Test</h2>

                <p>A D20 Test is any roll of a d20 made to determine success or failure.</p>

                <p>The three most common D20 Tests are:</p>

                <ul>
                    <li>Ability Checks</li>
                    <li>Attack Rolls</li>
                    <li>Saving Throws</li>
                </ul>

                <p>When making a D20 Test:</p>

                <ol>
                    <li>Roll a d20.</li>
                    <li>Add any applicable modifiers, such as an ability and/or proficiency.</li>
                    <li>Compare the result against a Difficulty Class (DC) or other target number.</li>
                </ol>

                <p>Some features modify D20 Tests by granting Advantage, Disadvantage, bonuses, or penalties.</p>

                <hr>

                <h2>Damage Threshold</h2>

                <p>A creature or an object that has a damage threshold has Immunityto all damage unless it takes an
                    amount of damage from a single attack or effect equal to or greater than its damage threshold, in
                    which case it takes that entire instance of damage. Any damage that fails to meet or exceed the
                    damage threshold is superficial and doesn’t reduce Hit Points. For example, if an object has a
                    damage threshold of 10, the object takes no damage if 9 damage is dealt to it, since that damage
                    fails to exceed the threshold. If the same object is dealt 11 damage, it takes all of that damage.
                </p>

                <hr>

                <h2>Damage Types</h2>

                <p>Every instance of damage belongs to a damage type.</p>
