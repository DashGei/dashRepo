                <p>Physical damage represents ordinary bodily harm caused by weapons, falls, natural attacks, and
                    similar sources.</p>

                <p>If an effect deals multiple damage types, each type is applied separately for the purpose of
                    Resistance, Immunity, and Vulnerability.</p>

                <hr>

                <h2>Darkvision</h2>

                <p>If you have Darkvision, you can see in Dim Light within a specified range as if it were Bright
                    Light and in Darkness within that range as if it were Dim Light. You discern colors in that
                    Darkness only as shades of gray.</p>

                <hr>

                <h2>Dead</h2>

                <p>A dead creature has no Hit Points and can’t regain them unless it is first revived by magic such as
                    the Raise Dead or Revify spell. When such a spell is cast, the spirit knows who is casting it and
                    can refuse. The spirit of a dead creature has left the body and departed for the Outer Planes, and
                    reviving the creature requires calling the spirit back.</p>

                <p>If the creature returns to life, the revival effect determines the creature’s current Hit Points.
                    Unless otherwise stated, the creature returns to life with any conditions, magical contagions, or
                    curses that were affecting it at death if the durations of those effects are still ongoing. If the
                    creature died with any Exhaustion levels, it returns with 5 fewer levels. If the creature had
                    Attunemtn to one or more magic items, it is no longer attuned to them.</p>

                <hr>

                <h2>Difficulty Class</h2>

                <p>A Difficulty Class (DC) is the target number a creature must meet or exceed to succeed on an Ability
                    Check or Saving Throw.</p>

                <p>The Dungeon Master determines most DCs.</p>

                <p>Some abilities create their own DCs, such as a character's Physical DC or Mental DC.</p>

                <p>If a roll equals the DC, it succeeds.</p>

                <hr>

                <h2>Enemy</h2>

                <p>An enemy is a creature actively opposed to you.</p>

                <p>Whether a creature is an enemy is determined by the circumstances of the game rather than creature
                    type, alignment, or faction.</p>

                <p>Effects that refer to enemies affect only creatures hostile to you.</p>

                <h2>Grappling</h2>

                <p>A creature can grapple another creature. Characters typically grapple by using an Unarmed Strike.
                    Many monsters have special attacks that allow them to quickly grapple prey. However a grapple is
                    initiated, it follows these rules.</p>

                <p><strong><em>Grappled Condition.</em></strong> Successfully grappling a creature gives it the Grappled
                    condition.</p>

                <p><strong><em>One Grapple per Hand.</em></strong> A creature must have a hand free to grapple another
                    creature. Some stat blocks and game effects allow a creature to grapple using a tentacle, a maw, or
                    another body part. Whatever part a grappler uses, it can grapple only one creature at a time with
                    that part, and the grappler can’t use that part to target another creature unless it ends the
                    grapple.</p>

                <p><strong><em>Ending a Grapple.</em></strong> A Grappled creature can use its action to make a Strength
                    (Athletics) or Dexterity (Acrobatics) check against the grapple’s escape DC, ending the condition
                    on itself on a success. The condition also ends if the grappler has the Incapacitated condition or
                    if the distance between the Grappled target and the grappler exceeds the grapple’s range. In
                    addition, the grappler can release the target at any time (no action required).</p>

                <hr>

                <h2>Hazard</h2>

                <p>A Hazard is an environmental danger.</p>

                <hr>

                <h2>Burning [Hazard]</h2>

                <p>A burning creature or object takes 1d4 Fire damage at the start of each of its turns. As an action,
                    you can extinguish fire on yourself by giving yourself the Prone condition and rolling on the
                    ground. The fire also goes out if it is doused, submerged, or suffocated.</p>

                <hr>

                <h2>Dehydration [Hazard]</h2>

                <p>A creature requires an amount of water per day based on its size, as shown in the Water Needs per Day
                    table. A creature that drinks less than half the required water for a day gains 1 Exhaustion
                    level at the day’s end. Exhaustion caused by dehydration can’t be removed until the creature drinks
                    the full amount of water required for a day.</p>

                <h2>Falling [Hazard]</h2>

                <p>A creature that falls takes 1d6 Bludgeoning damage at the end of the fall for every 10 feet it fell,
                    to a maximum of 20d6. When the creature lands, it has the Prone condition unless it avoids
                    taking any damage from the fall.</p>

                <p>A creature that falls into water or another liquid can use its Reaction to make a DC 15 Strength
                    (Athletics) or Dexterity (Acrobatics) check to hit the surface head or feet first. On a
                    successful check, any damage resulting from the fall is halved.</p>

                <hr>

                <h2>Malnutrition [Hazard]</h2>

                <p>A creature needs an amount of food per day based on its size, as shown in the Food Needs per Day
                    table. A creature that eats but consumes less than half the required food for a day must succeed on
                    a DC 10 Strength saving throw or gain 2 Exhaustion levels at the day’s end. A creature that eats
                    nothing for 5 days automatically gains 3 Exhaustion levels at the end of the fifth day as well as an
                    additional level at the end of each subsequent day without food.</p>

                <p>Exhaustion caused by malnutrition can’t be removed until the creature eats the full amount of food
                    required for a day.</p>

                <hr>

                <h2>Suffocation [Hazard]</h2>

                <p>A creature can hold its breath for 1 minute in combat or 2 minutes out of combat before suffocation
                    begins. When a creature runs out of breath or is choking, it gains 2 Exhaustion levels at the
                    end of each of its turns. When a creature can breathe again, it removes all levels of Exhaustion it
                    gained from suffocating.</p>

                <hr>

                <h2>Illusions</h2>

                <p>Spells and other effects sometimes create magical illusions. Such an effect defines what the illusion
                    does and which senses or mental faculties it deceives.</p>

                <p>If an illusion manifests in space, the illusion is insubstantial and weightless, yet it seems to be
                    affected by the environment as if the illusion were real unless the effect that created it specifies
                    otherwise. For example, a visual illusion of a creature casts shadows and reflections, and wind
                    appears to affect the illusory creature. Similarly, an audible illusion echoes in an echoey space.
                </p>

                <hr>

                <h2>Immunity</h2>

                <p>If you have Immunity to a damage type or a condition, it doesn’t affect you in any way.</p>

                <hr>

                <h2>Improvised Weapons</h2>

                <p>An improvised weapon is an object wielded as a makeshift weapon, such as broken glass, a table leg,
                    or a frying pan. A Simple or Martial weapon also counts as an improvised weapon if it’s wielded in a
                    way contrary to its design; if you use a Ranged weapon to make a melee attack or throw a Melee
                    weapon that lacks the Thrown property, the weapon counts as an improvised weapon. An improvised
                    weapon follows the rules below.</p>

                <p><strong><em>Proficiency.</em></strong> Don’t add your Proficiency Bonus to attack rolls with an
                    improvised weapon.</p>

                <p><strong><em>Damage.</em></strong> On a hit, the weapon deals 1d4 damage of a type the DM thinks is
                    appropriate for the object.</p>

                <p><strong><em>Range.</em></strong> If you throw the weapon, it has a normal range of 20 feet and a long
                    range of 60 feet.</p>

                <p><strong><em>Weapon Equivalents.</em></strong> If an improvised weapon resembles a Simple or Martial
                    weapon, the DM may say it functions as that weapon and uses that weapon’s rules. For example, the DM
                    could treat a table leg as a Club.</p>

                <hr>

                <h2>Initiative</h2>

                <p>Initiative determines the order of turns during combat. The combat rules in chapter 1 explain how to
                    roll Initiative.</p>

                <p>Sometimes a DM might have combatants use their Initiative scores instead of rolling Initiative. Your
                    Initiative score equals 10 plus your Dexterity modifier. If you have @Advantage on Initiative rolls,
                    increase your Initiative score by 5. If you have @Disadvantage on those rolls, decrease that score
                    by 5.</p>

                <h2>Monster</h2>

                <p>A monster is a creature controlled by the DM, even if the creature is benevolent.</p>

                <hr>

                <h2>Nonplayer Character</h2>

                <p>A nonplayer character (NPC) is a monster that has a personal name and a distinct personality.</p>

                <hr>

                <h2>Object</h2>

                <p>An object is a nonliving, distinct thing. Composite things, like buildings, comprise more than one
                    object.</p>

                <hr>

                <h2>Occupied Space</h2>

                <p>A space is occupied if a creature is in it or if it is completely filled by objects.</p>

                <hr>

                <h2>Passive Perception</h2>

                <p>Passive Perception is a score that reflects a creature’s general awareness of its surroundings. The
                    DM uses this score when determining whether a creature notices something without consciously making
                    a Wisdom (@Perception) check.</p>

                <p>A creature’s Passive Perception equals 10 plus the creature’s Wisdom (@Perception) check bonus. If
                    the creature has @Advantage on such checks, increase the score by 5. If the creature has
                    @Disadvantage on them, decrease the score by 5. For example, a level 1 character with a Wisdom of 15
                    and proficiency in Perception has a Passive Perception of 14 (10 + 2 + 2). If that character has
                    Advantage on Wisdom (@Perception) checks, the score becomes 19.</p>

                <hr>

                <h2>Per Day</h2>

                <p>If a rule says you can use something a certain number of times per day, that means you must finish a
                    Long Rest to use it again after you run out of uses.</p>

                <hr>

                <h2>Player Character</h2>

                <p>A player character is a character controlled by a player.</p>

                <hr>

                <h2>Possession</h2>

                <p>Some effects cause a creature to be possessed by another creature or entity. A possessing effect
                    defines how the possession operates. Possession can be prevented by the @Protection from Good and
                    Evil spell and ended by the @Dispel Evil and Good spell.</p>

                <hr>

                <h2>Proficiency</h2>

                <p>If you have proficiency with something, you can add your Proficiency Bonus to any D20 Test you make
                    using that thing. A creature might have proficiency in a skill or saving throw or with a weapon or
                    tool.</p>

                <hr>

                <h2>Reach</h2>

                <p>Reach is the distance from which a creature can make melee attacks or otherwise affect nearby
                    creatures.</p>

                <p>A creature has a reach of 5 feet unless a rule says otherwise.</p>

                <hr>

                <h2>Reaction</h2>

                <p>A Reaction is a special action taken in response to a trigger defined in the Reaction’s description.
                    You can take a Reaction on another creature’s turn, and if you take it on your turn, you can do so
                    even if you also take an Action. Once you take a Reaction, you can’t take another one until the
                    start of your next turn.</p>

                <hr>

                <h2>Resistance</h2>

                <p>If you have Resistance to a damage type, damage of that type is halved against you (round down).
                    Resistance is applied only once to an instance of damage.</p>

                <hr>

                <h2>Ritual</h2>

                <p>If you have a spell prepared that has the Ritual tag, you can cast that spell as a Ritual. The Ritual
                    version of a spell takes 10 minutes longer to cast than normal. It also doesn’t expend a spell slot,
                    which means the ritual version of a spell can’t be cast at a higher level.</p>

                <hr>

                <h2>Round Down</h2>

                <p>Whenever you divide or multiply a number in the game, round down if you end up with a fraction, even
                    if the fraction is one-half or greater. Some rules make an exception and tell you to round up.</p>

                <hr>

                <h2>Saving Throw</h2>

                <p>A Saving Throw (sometimes called a save) is a D20 Test made to resist a harmful effect.</p>

                <p>To make a Saving Throw:</p>

                <ol>
                    <li>Roll a d20.</li>
                    <li>Add the relevant modifiers.</li>
                    <li>Compare the result against the effect's Difficulty Class.</li>
                </ol>

                <p>If the result equals or exceeds the DC, the Saving Throw succeeds.</p>

                <p>The ability score used for a Saving Throw is determined by the effect creating it. So a Physical DC
                    Strength save requires a Saving Throw using the Strength ability.</p>

                <hr>

                <h2>Shape-Shifting</h2>

                <p>If an effect, such as Wild Shape or the @Polymorph spell, lets you shape-shift, its description
                    specifies what happens to you. Unless that description says otherwise, any ongoing effects on
                    you—conditions, spells, curses, and the like—carry over from one form to the other. You revert to
                    your true form if you die.</p>

                <hr>

                <h2>Short Rest</h2>

                <p>A Short Rest is a 1-hour period of downtime, during which a creature does nothing more strenuous than
                    reading, talking, eating, or standing watch. To start a Short Rest, you must have at least 1 Hit
                    Point. A creature can only benefit from a Short Rest twice per Long Rest.</p>

                <p><strong><em>Benefits of the Rest.</em></strong> When you finish the rest, you gain the following
                    benefits:</p>

                <p><strong><em>Healing.</em></strong> You heal a number of Hit Points Equal to half of your Hit Point
                    maximum.</p>

                <p><strong><em>Exhaustion Relief.</em></strong> If you have any Exhaustion levels, you remove 2 of them.
                </p>

                <p><strong>Special Feature.</strong> Some features are recharged by a Short Rest. If you have such a
                    feature, it recharges in the way specified in its description.</p>

                <p><strong><em>Interrupting the Rest.</em></strong> A Short Rest is stopped by the following
                    interruptions:</p>

                <ul>
                    <li>Rolling @Initiative.</li>
                    <li>Casting a spell other than a cantrip</li>
                    <li>Taking any damage</li>
                </ul>

                <p>An interrupted Short Rest confers no benefits.</p>

                <hr>

                <h2>Simultaneous Effects</h2>

                <p>If two or more things happen at the same time on a turn, the person at the game table—player or
                    DM—whose turn it is decides the order in which those things happen. For example, if two effects
                    occur at the start of a player character’s turn, the player decides which of the effects happens
                    first.</p>

                <hr>

                <h2>Size</h2>

                <p>Every creature belongs to a size category.</p>

                <p>The size categories are:</p>

                <ul>
                    <li>Tiny</li>
                    <li>Small</li>
                    <li>Medium</li>
                    <li>Large</li>
                    <li>Huge</li>
                    <li>Gargantuan</li>
                </ul>

                <p>A creature's size affects the space it occupies, what it can carry, and how certain abilities
                    interact with it.</p>

                <hr>

                <h2>Skill</h2>

                <p>A skill is an area of specialization associated with an ability check.</p>

                <p>When a rule calls for a skill check, make an Ability Check using the associated skill. If you have
                    Proficiency in that skill, add your Proficiency Bonus to the D20 Test.</p>

                <p>Skills can be used with different abilities if the DM determines that another ability is more
                    appropriate.</p>

                <hr>

                <h2>Stable</h2>

                <p>A Stable creature is at 0 Hit Points but is no longer dying. If a Stable creature takes damage, it is
                    no longer Stable and resumes making Death Saving Throws as normal.</p>

                <p>You can take the [[Help]] action to try to stabilize a creature with 0 Hit Points, which requires a
                    successful DC 10 Wisdom ([[Medicine]]) check.</p>

                <hr>

                <h2>Stat Block</h2>

                <p>A Stat Block contains the game statistics for a creature.</p>

                <p>A typical stat block includes information such as Armor Class, Hit Points, Speed, ability scores,
                    attacks, traits, and special abilities.</p>

                <p>Monsters, NPCs, and many summoned creatures use stat blocks.</p>

                <hr>

                <h2>Surprise</h2>

                <p>If a creature is caught unawares by the start of combat, that creature is surprised, which causes it
                    to have @Disadvantage on its Initiative roll.</p>

                <hr>

                <h2>Swimming</h2>

                <p>A creature can move through water using a Swim Speed.</p>

                <p>A creature without a Swim Speed can still swim, but the Dungeon Master may require Ability Checks or
                    treat the movement as Difficult Terrain.</p>

                <hr>

                <h2>Target</h2>

                <p>A Target is a creature, object, point, or area affected by an attack, spell, ability, or other
                    effect.</p>

                <hr>

                <h2>Telepathy</h2>

                <p>Telepathy is a magical ability that allows a creature to communicate mentally with another creature
                    within a specified range. Unless a rule states otherwise, the contacted creature doesn’t need to
                    share a language with the telepath to understand this communication, but the contacted creature must
                    be able to understand at least one language or be telepathic itself to understand.</p>

                <p>A telepath doesn’t need to see a contacted creature, and the telepath can start or end the telepathic
                    contact at any time (no action required). Telepathic contact can’t be initiated and is immediately
                    broken if either the telepath or the other creature has the @Incapacitated condition. Telepathic
                    contact is also broken if the contacted creature is no longer within the telepathy’s range or if the
                    telepath contacts a different creature within range.</p>

                <p>A creature without telepathy can receive telepathic messages but can’t initiate a telepathic
                    conversation. Once a telepathic conversation starts, the non-telepath can communicate mentally to
                    the telepath until the telepathic connection ends.</p>

                <hr>

                <h2>Temporary Hit Points</h2>

                <p>Some spells and other effects confer Temporary Hit Points, which are a buffer against losing actual
                    [[Hit Points]], as explained below.</p>

                <p><strong><em>Lose Temporary Hit Points First.</em></strong> If you have Temporary Hit Points and take
                    damage, those points are lost first, and any leftover damage carries over to your Hit Points. For
                    example, if you have 5 Temporary Hit Points and take 7 damage, you lose those points and then lose 2
                    Hit Points.</p>

                <p><strong><em>Duration.</em></strong> Temporary Hit Points last until they’re depleted or you finish a
                    [[Long Rest]].</p>

                <p><strong><em>They Don’t Stack.</em></strong> Temporary Hit Points can’t be added together. If you have
                    Temporary Hit Points and receive more of them, you decide whether to keep the ones you have or to
                    gain the new ones. For example, if a spell grants you 12 Temporary Hit Points when you already have
                    10, you can have 12 or 10, not 22.</p>

                <p><strong><em>They’re Not Hit Points or Healing.</em></strong> Temporary Hit Points can’t be added to
                    your Hit Points, healing can’t restore them, and receiving Temporary Hit Points doesn’t count as
                    healing. Because Temporary Hit Points aren’t Hit Points, a creature can be at full Hit Points and
                    receive Temporary Hit Points. If you have 0 Hit Points, receiving Temporary Hit Points doesn’t
                    restore you to consciousness. Only true healing can save you.</p>

                <hr>

                <h2>Tremorsense</h2>

                <p>A creature with Tremorsense can pinpoint the location of creatures and moving objects within a
                    specific range, provided that the creature with Tremorsense and anything it is detecting are both in
                    contact with the same surface (such as the ground, a wall, or a ceiling) or the same liquid.</p>

                <p>Tremorsense can’t detect creatures or objects in the air, and it doesn’t count as a form of sight.
                </p>

                <hr>

                <h2>Truesight</h2>

                <p>If you have Truesight, your vision is enhanced within a specified range. Within that range, your
                    vision pierces through the following:</p>

                <p><strong>Darkness.</strong> You can see in normal and magical [[Rules/Common
                    Terms/Darkness|Darkness]].</p>

                <p><strong>Invisibility.</strong> You see creatures and objects that have the [[Invisible]] condition.
                </p>

                <p><strong>Visual Illusions.</strong> Visual illusions appear transparent to you, and you automatically
                    succeed on saving throws against them.</p>

                <p><strong>Transformations.</strong> You discern the true form of any creature or object you see that
                    has been transformed by magic.</p>

                <hr>

                <h2>Unarmed Strike</h2>

                <p>Instead of using a weapon to make a melee attack, you can use a punch, kick, headbutt, or similar
                    forceful blow. In game terms, this is an Unarmed Strike - a melee attack that involves you using
                    your body to damage, grapple, or shove a target within 5 feet of you.</p>

                <p>Whenever you use your Unarmed Strike, choose one of the following options for its effect.</p>

                <p><strong><em>Damage.</em></strong> You make an attack roll against the target. Your bonus to the roll
                    equals your Strength modifier plus your Proficiency Bonus. On a hit, the target takes Bludgeoning
                    damage equal to 1 plus your Strength modifier.</p>

                <p><strong><em>Grapple.</em></strong> The target must succeed on a Strength or Dexterity saving throw
                    (it chooses which), or it has the [[Grappled]] condition. The DC for the saving throw and any escape
                    attempts equals 8 plus your Strength modifier and Proficiency Bonus. This grapple is possible only
                    if the target is no more than one size larger than you and if you have a hand free to grab it.</p>

                <p><strong><em>Shove.</em></strong> The target must succeed on a Strength or Dexterity saving throw (it
                    chooses which), or you either push it 5 feet away or cause it to have the [[Prone]] condition. The
                    DC for the saving throw equals 8 plus your Strength modifier and Proficiency Bonus. This shove is
                    possible only if the target is no more than one size larger than you.</p>

                <hr>

                <h2>Unoccupied Space</h2>

                <p>A space is unoccupied if no creatures are in it and it isn’t completely filled by objects.</p>

                <hr>

                <h2>Unwilling Creature</h2>

                <p>An Unwilling Creature is a creature that does not consent to an effect.</p>

                <p>If an effect can move, teleport, transform, or otherwise affect an unwilling creature, the effect
                    will specify any Saving Throw, Attack Roll, or other requirement needed for the effect to succeed.
                </p>

                <p>If an effect does not state that it can affect an unwilling creature, it affects only willing
                    creatures.</p>

                <hr>

                <h2>Attack Action</h2>

                <p>Cost: 1 Action</p>

                <p>When you take the Attack action, you make an attack. Some other actions and Reactions also let you
                    make an attack. Whether you strike with a Melee weapon, fire a Ranged weapon, or make an attack roll
                    as part of a spell, an attack has the following structure:</p>

                <ol>
                    <li><strong>Choose a Target.</strong> Pick a target within your attack’s range: a creature, an
                        object, or a location.</li>
                    <li><strong>Determine Modifiers.</strong> The DM helps you determine whether the target has @Cover
                        (later in the chapter) and whether you have @Advantage or @Disadvantage against the target. In
                        addition, spells, special abilities, and other effects can apply penalties or bonuses to your
                        attack roll.</li>
                    <li><strong>Resolve the Attack.</strong> Make the attack roll, as detailed later in this chapter. On
                        a hit, you roll damage unless the particular attack has rules that specify otherwise. Some
                        attacks cause special effects in addition to or instead of damage.</li>
                </ol>

                <p>Immediately after resolving the Attack action, a player has the fatigued condition until the start of
                    their next turn.</p>

                <hr>

                <h2>Dash Action</h2>

                <p>Cost: 1 Action</p>

                <p>When you take the Dash action, your Speed increases by 15 feet until the start of your next turn.</p>

                <hr>

                <h2>Disengage Action</h2>

                <p>Cost: 2 Actions</p>

                <p>Creatures cannot take the Attack action against you with reactions, such as with the Opportunity
                    Attack or Riposte features.</p>

                <hr>

                <h2>Dodge Action</h2>

                <p>Cost: 2 Actions</p>

                <p>When you take the Dodge action, you gain the following benefits: until the start of your next turn,
                    any attack roll made against you has Disadvantage, and you make Dexterity saving throws with
                    Advantage</p>

                <hr>

                <h2>Help Action</h2>

                <p>Cost: 2 Actions</p>

                <p>When you take the Help action, you do one of the following.</p>

                <p><strong><em>Assist an Ability Check.</em></strong> Choose one of your skill or tool proficiencies and
                    one ally who is near enough for you to assist verbally or physically when they make an ability
                    check. That ally has @Advantage on the next ability check they make with the chosen skill or tool.
                    This benefit expires if the ally doesn’t use it before the start of your next turn. The DM has final
                    say on whether your assistance is possible.</p>

                <p><strong><em>Assist an Attack Roll.</em></strong> You momentarily distract an enemy within 5 feet of
                    you, giving Advantage to the next attack roll by one of your allies against that enemy until the
                    start of your next turn. Alternatively you can take the Help action on an ally within 5 feet giving
                    them Advantage on the next attack roll they make before the start of your next turn.</p>

                <h2>Hide Action</h2>

                <p>Cost: 2 Actions</p>

                <p>With the Hide action, you try to conceal yourself. To do so, you must succeed on a DC 15 Dexterity
                    (@Stealth) check while you’re @Heavily Obscured or behind @Three-Quarters Cover or @Total Cover, and
                    you must be out of any enemy’s line of sight; if you can see a creature, you can discern whether it
                    can see you.</p>

                <p>On a successful check, you have the @Invisible condition while hidden. Make note of your check’s
                    total, which is the DC for a creature to find you with a Wisdom (@Perception) check.</p>

                <p>You stop being hidden immediately after any of the following occurs: you make a sound louder than a
                    whisper, an enemy finds you, you make an attack roll, or you cast a spell with a Verbal component.
                </p>

                <hr>

                <h2>Influence Action</h2>

                <p>Cost: 1 Action</p>

                <p>With the Influence action, you urge a monster to do something. Describe or roleplay how you’re
                    communicating with the monster. Are you trying to deceive, intimidate, amuse, or gently persuade?
                    The DM then determines whether the monster feels willing, unwilling, or hesitant due to your
                    interaction; this determination establishes whether an ability check is necessary, as explained
                    below.</p>

                <p><strong><em>Willing.</em></strong> If your urging aligns with the monster’s desires, no ability check
                    is necessary; the monster fulfills your request in a way it prefers.</p>

                <p><strong><em>Unwilling.</em></strong> If your urging is repugnant to the monster or counter to its
                    alignment, no ability check is necessary; it doesn’t comply.</p>

                <p><strong><em>Hesitant.</em></strong> If you urge the monster to do something that it is hesitant to
                    do, you must make an ability check, which is affected by the monster’s attitude: @Indifferent,
                    @Friendly, or @Hositle, each of which is defined in this glossary. The Influence Checks table
                    suggests which ability check to make based on how you’re interacting with the monster. The DM
                    chooses the check, which has a default DC equal to 15 or the monster’s Intelligence score, whichever
                    is higher. On a successful check, the monster does as urged. On a failed check, you must wait 24
                    hours (or a duration set by the DM) before urging it in the same way again.</p>

                <hr>

                <h2>Magic Action</h2>

                <p>The Magic Action allows you to cast spells and use magical abilities.</p>

                <p>The number of Actions required depends on the effect being used:</p>

                <ul>
                    <li>Cantrips require 1 Action.</li>
                    <li>Spells cast with a Primary Slot require 1 Action.</li>
                    <li>Spells cast with a Secondary Slot require 2 Actions.</li>
                    <li>Spells cast with a Tertiary Slot require preparation before they can be cast.</li>
                </ul>

                <p>Immediately after resolving the Magic action, a player has the fatigued condition until the start of
                    their next turn.</p>

                <p>The complete rules for spellcasting are described in the @Magic chapter.</p>

                <hr>

                <h2>Ready Action</h2>

                <p>Cost: 2 Actions</p>

                <p>You prepare a single action with a cost of one action and specify a trigger.</p>

                <p>When the trigger occurs before the start of your next turn, you may immediately perform the chosen
                    action as a reaction.</p>

                <p>If the trigger never occurs, the action is lost.</p>

                <hr>

                <h2>Search Action</h2>

                <p>Cost: 2 Actions</p>

                <p>The Search Action allows you to actively look for something.</p>

                <p>Make either:</p>

                <ul>
                    <li>A Wisdom (Perception) check, or</li>
                    <li>An Intelligence (Investigation) check.</li>
                </ul>

                <p>The Dungeon Master determines which skill is appropriate based on what you are attempting to find.
                </p>

                <p>The Search Action can reveal hidden creatures, concealed objects, clues, hazards, tracks, or other
                    information.</p>

                <hr>

                <h2>Study</h2>

                <p>Cost: 1 Action</p>

                <p>When you take the Study action, you make an Intelligence check to study your memory, a book, a clue,
                    or another source of knowledge and call to mind an important piece of information about it.</p>

                <p>The Areas of Knowledge table suggests which skills are applicable to various areas of knowledge.</p>

                <h3>Areas of Knowledge</h3>

                <h2>Utilize Action</h2>

                <p>Cost: 1 or 2 Actions</p>

                <p>The Utilize Action allows you to interact with an object that requires more effort than a simple
                    interaction.</p>

                <p>Examples include:</p>

                <ul>
                    <li>Pulling a lever</li>
                    <li>Opening a heavy door</li>
                    <li>Applying a potion to another creature</li>
                    <li>Activating a device</li>
                    <li>Lighting a torch</li>
                </ul>

                <p>The Dungeon Master determines whether an interaction requires the Utilize Action.</p>

                <h2>Advantage</h2>

                <p>If you have Advantage on a [[D20 Test]], roll two d20s and use the lower roll. If multiple situations
                    affect a roll and they all grant Advantage on it, you still roll only two d20s.</p>

                <p>If circumstances cause a roll to have both Advantage and [[Disadvantage]], the roll has neither of
                    them, and you roll one d20. This is true even if multiple circumstances impose Disadvantage and only
                    one grants Advantage or vice versa. In such a situation, you have neither Advantage nor
                    Disadvantage.</p>

                <p>When you have Advantage or Disadvantage and something in the game lets you reroll or replace the d20,
                    you can reroll or replace only one die, not both. You choose which one.</p>

                <hr>

                <h2>Disadvantage</h2>

                <p>If you have Disadvantage on a [[D20 Test]], roll two d20s and use the lower roll. If multiple
                    situations affect a roll and they all grant Disdvantage on it, you still roll only two d20s.</p>

                <p>If circumstances cause a roll to have both [[Advantage]] and Disadvantage, the roll has neither of
                    them, and you roll one d20. This is true even if multiple circumstances impose Disadvantage and only
                    one grants Advantage or vice versa. In such a situation, you have neither Advantage nor
                    Disadvantage.</p>

                <p>When you have Advantage or Disadvantage and something in the game lets you reroll or replace the d20,
                    you can reroll or replace only one die, not both. You choose which one.</p>

                <hr>

                <h2>Expertise</h2>

                <p>Expertise represents exceptional training and mastery in a skill.</p>

                <p>When you have Expertise in a skill, double your @Proficiency Bonus when making Ability Checks using
                    that skill.</p>

                <p>If your Proficiency Bonus changes, your Expertise bonus changes as well.</p>

                <p>You cannot benefit from Expertise in the same skill more than once.</p>

                <hr>

                <h2>Physical Modifier</h2>

                <p>Many abilities, feats, and class features refer to your Physical Modifier.</p>

                <p>Your Physical Modifier is determined by your class and represents the physical attribute that class
                    relies on most heavily.</p>

                <p>Depending on your class, your Physical Modifier may be Strength or Dexterity. Your class description
                    specifies which ability score can be used as your Physical Modifier.</p>

                <p>Whenever a rule refers to your Physical Modifier, use the modifier associated with that ability
                    score.</p>

                <hr>

                <h2>Mental Modifier</h2>

                <p>Many abilities, spells, and class features refer to your Mental Modifier.</p>

                <p>Your Mental Modifier is determined by your class and represents the mental attribute that class
                    relies on most heavily.</p>

                <p>Depending on your class, your Mental Modifier may be Intelligence, Wisdom, or Charisma. Your class
                    description specifies which ability score can be used as your Mental Modifier.</p>

                <p>Whenever a rule refers to your Mental Modifier, use the modifier associated with that ability score.
                </p>

                <hr>

                <h2>Physical DC</h2>

                <p>Some abilities require creatures to resist physical techniques, maneuvers, or supernatural effects
                    tied to physical prowess.</p>

                <p>Your Physical DC equals:</p>

                <p><strong>8 + your Proficiency Bonus + your Physical Modifier</strong></p>

                <p>When a feature calls for a Physical DC Saving Throw, the feature specifies which ability score is
                    used for the save.</p>

                <p>For example, a feat might require a creature to make a Physical DC Strength Saving Throw or a
                    Physical DC Dexterity Saving Throw.</p>

                <hr>

                <h2>Mental DC</h2>

                <p>Some abilities require creatures to resist magical, social, spiritual, or psychological effects.</p>

                <p>Your Mental DC equals:</p>

                <p><strong>8 + your Proficiency Bonus + your Mental Modifier</strong></p>

                <p>When a feature calls for a Mental DC Saving Throw, the feature specifies which ability score is used
                    for the save.</p>

                <p>For example, a spell might require a creature to make a Mental DC Wisdom Saving Throw, while another
                    effect might require a Mental DC Charisma Saving Throw.</p>

                <h2>Attack Roll</h2>

                <p>An Attack Roll determines whether an attack hits a target.</p>

                <p>To make an Attack Roll, roll a d20 and add any applicable modifiers. If the total equals or exceeds
                    the target's @Armor Class, the attack hits.</p>

                <p>Attack Rolls can be made with weapons, spells, or other abilities that specify an attack.</p>

                <p>Unless otherwise stated, Attack Rolls are affected by @Advantage and @Disadvantage.</p>

                <hr>

                <h2>Cover</h2>

                <p>Obstacles can protect creatures from attacks and other effects.</p>

                <p>The Dungeon Master determines whether a target has Cover.</p>

                <p>Typical categories of Cover are shown below.</p>

                <div class="table-scroll">
                    <table class="styled-table">
                        <thead>
                            <tr>
                                <th>Cover</th>
                                <th>Effect</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Half Cover</td>
                                <td>+2 Armor Class</td>
                            </tr>
                            <tr>
                                <td>Three-Quarters Cover</td>
                                <td>+5 Armor Class</td>
                            </tr>
                            <tr>
                                <td>Total Cover</td>
                                <td>Cannot be targeted directly</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <p>A creature can benefit from Cover only when the obstacle lies between it and the source of the attack
                    or effect.</p>

                <hr>

                <h2>Critical Hit</h2>

                <p>If you roll a 20 on the d20 for an attack roll, you score a Critical Hit, and the attack hits
                    regardless of any modifiers or the target’s AC. A Critical Hit lets you roll extra dice for the
                    attack’s damage against the target. Roll all of the attack’s damage dice twice and add them
                    together. Then add any relevant modifiers.</p>

                <hr>

                <h2>Critical Range</h2>

                <p>Critical Range determines which Attack Rolls can become Critical Hits.</p>

                <p>Most creatures have a Critical Range of 20, meaning only a roll of 20 on the d20 can score a Critical
                    Hit.</p>

                <p>Some features expand this range. For example, a Critical Range of 19–20 means that a roll of 19 or 20
                    can score a Critical Hit.</p>

                <p>A roll must still hit the target in order to become a Critical Hit.</p>

                <hr>

                <h2>Death Saving Throw</h2>

                <p>When you start your turn at 0 Hit Points, you must make a Death Saving Throw.</p>

                <p>Roll a d20. This roll is not modified by any ability score unless a feature specifically says
                    otherwise.</p>

                <p>The result determines how much of your turn you can take and whether you gain levels of @Exhaustion.
                </p>

                <div class="table-scroll">
                    <table class="styled-table">
                        <thead>
                            <tr>
                                <th>Roll</th>
                                <th>Effect</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>20–16</td>
                                <td>You take your turn normally.</td>
                            </tr>
                            <tr>
                                <td>15–11</td>
                                <td>You begin your turn with one action.</td>
                            </tr>
                            <tr>
                                <td>10–5</td>
                                <td>You begin your turn with one action and gain 1 level of Exhaustion.</td>
                            </tr>
                            <tr>
                                <td>4–1</td>
                                <td>You begin your turn with no actions, gain 2 levels of Exhaustion, and fall @Prone at
                                    the
                                    end of your turn.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <p>Once per turn, when you take damage while at 0 Hit Points, you gain 1 level of Exhaustion.</p>

                <p>A creature dies when it reaches 10 levels of Exhaustion.</p>

                <hr>

                <h2>Difficult Terrain</h2>

                <p>If a space is Difficult Terrain, every foot of movement in that space costs 1 extra foot. For
                    example, moving 5 feet through Difficult Terrain costs 10 feet of movement. Difficult Terrain isn’t
                    cumulative; either a space is Difficult Terrain or it isn’t.</p>

                <p>A space is Difficult Terrain if the space contains any of the following or something similar:</p>

                <ul>
                    <li>A creature that isn’t Tiny or your ally</li>
                    <li>Furniture that is sized for creatures of your size or larger</li>
                    <li>Heavy snow, ice, rubble, or undergrowth</li>
                    <li>Liquid that’s between shin- and waist-deep</li>
                    <li>A narrow opening sized for a creature one size smaller than you</li>
                    <li>A slope of 20 degrees or more</li>
                </ul>

                <hr>

                <h2>Healing</h2>

                <p>Healing restores lost Hit Points.</p>

                <p>When a creature regains Hit Points, its current Hit Points increase by the amount healed, up to its
                    Hit Point maximum.</p>

                <p>A creature at 0 Hit Points that regains any amount of Hit Points immediately stops making Death
                    Saving Throws and is no longer dying.</p>

                <p>Healing has no effect on a creature that has died unless a feature specifically states otherwise.</p>

                <p>Healing cannot increase a creature's Hit Points beyond its maximum.</p>

                <hr>

                <h2>Hit Points</h2>

                <p>Hit Points represent a creature's durability, endurance, and will to continue fighting.</p>

                <p>A creature's Hit Point maximum is the greatest number of Hit Points it can have.</p>

                <p>Current Hit Points can range from that maximum down to 0.</p>

                <p>Whenever a creature takes damage, it loses Hit Points equal to the damage dealt.</p>

                <p>A creature suffers no penalties from lost Hit Points unless a rule states otherwise.</p>

                <p>When a creature reaches half its Hit Point maximum or fewer, it becomes @Bloodied.</p>

                <p>When a creature reaches 0 Hit Points, it begins making @Death Saving Throws at the start of its
                    turns.</p>

                <hr>

                <h2>Improvised Weapons</h2>

                <p>An Improvised Weapon is an object not designed to be used as a weapon but used as one anyway.</p>

                <p>Examples include chairs, bottles, frying pans, rocks, and similar objects.</p>

                <p>The Dungeon Master determines whether an object can be used as an Improvised Weapon and what
                    properties it has.</p>

                <p>Unless otherwise determined by the Dungeon Master, an Improvised Weapon deals 1d4 physical damage.
                </p>

                <p>A weapon used in a way it was not designed for may also be treated as an Improvised Weapon.</p>

                <hr>

                <h2>Knock Out</h2>

                <p>When you reduce a creature to 0 Hit Points with a melee attack, you can choose to knock it out rather
                    than kill it.</p>

                <p>The creature falls Unconscious and is Stable.</p>

                <p>The creature remains unconscious until it regains Hit Points, finishes a Short Rest, or another
                    effect awakens it.</p>

                <p>The Dungeon Master determines whether certain creatures can be knocked unconscious in this way.</p>

                <hr>

                <h2>Movement</h2>

                <p>Movement allows a creature to change its position.</p>

                <p>During its turn, a creature can move up to its available @Speed.</p>

                <p>Movement can be split before, between, and after actions.</p>

                <p>Different forms of movement use the appropriate Speed, such as walking, climbing, swimming,
                    burrowing, or flying.</p>

                <p>Movement may be affected by terrain, conditions, spells, and other effects.</p>

                <hr>

                <h2>Vulnerability</h2>

                <p>Vulnerability increases incoming damage.</p>

                <p>If a creature has Vulnerability to a damage type, it takes double damage from that type.</p>

                <p>Apply Vulnerability after all other damage modifiers unless a rule states otherwise.</p>

                <p>Multiple instances of Vulnerability to the same damage type do not stack.</p>

                <hr>

                <h2>Weapon</h2>

                <p>A Weapon is an item designed primarily for combat.</p>

                <p>Weapons are divided into categories and possess various properties that determine how they function.
                </p>

                <p>A weapon's statistics include its damage die, damage type, and properties.</p>

                <p>A creature must be wielding a weapon to make attacks with it unless a rule states otherwise.</p>

                <p>Weapon statistics are presented in the Weapons chapter.</p>

                <hr>

                <h2>Weapon Attack</h2>

                <p>A Weapon Attack is an attack made using a weapon or an Unarmed Strike.</p>

                <p>To make a Weapon Attack, make an @Attack Roll using the modifier specified by the weapon or attack.
                </p>

                <p>On a hit, the target takes the weapon's damage plus any applicable modifiers.</p>

                <p>A Weapon Attack can be melee or ranged.</p>

                <p>Features that affect Weapon Attacks apply to both melee and ranged Weapon Attacks unless they specify
                    otherwise.</p>

                <h2>Condition</h2>

                <p>A Condition is a temporary or ongoing effect that alters a creature's capabilities.</p>

                <p>Conditions are typically caused by spells, feats, monster abilities, hazards, or other game effects.
                </p>

                <p>A creature suffers the effects of a Condition until the Condition ends. If multiple effects impose
                    the same Condition, the Condition's effects do not stack unless stated otherwise.</p>

                <p>The Conditions are described below.</p>

                <hr>

                <h2>Blinded</h2>

                <p>While you have the Blinded condition, you experience the following effects.</p>

                <p><strong><em>Can’t See.</em></strong> You can’t see and automatically fail any ability check that
                    requires sight.</p>

                <p><strong><em>Attacks Affected.</em></strong> Attack rolls against you have @Advantage, and your attack
                    rolls have @Disadvantage</p>

                <hr>

                <h2>Charmed</h2>

                <p>While you have the Charmed condition, you experience the following effects.</p>

                <p><strong><em>Can’t Harm the Charmer.</em></strong> You can’t attack the charmer or target the charmer
                    with damaging abilities or magical effects.</p>

                <p><strong><em>Social Advantage.</em></strong> The charmer has @Advantage on any ability check to
                    interact with you socially.</p>

                <hr>

                <h2>Deafened</h2>

                <p>While you have the Deafened condition, you experience the following effect.</p>

                <p><strong><em>Can’t Hear.</em></strong> You can’t hear and automatically fail any ability check that
                    requires hearing.</p>

                <hr>

                <h2>Exhaustion</h2>

                <p>Exhaustion represents mounting physical and mental strain.</p>

                <p>A creature can have up to 10 levels of Exhaustion.</p>

                <p>When a creature makes any roll with a d20, they reduce their roll by their level of exhaustion.</p>

                <p>For every 2 levels of Exhaustion a creature has its speed is reduced by 5 feet.</p>

                <p>When a creature starts its turn with 8 levels of Exhaustion is has the Unconscious condition until
                    the start of its next turn.</p>

                <p>When a creature reaches 10 levels of Exhaustion, it dies.</p>

                <p>Unless a rule states otherwise, a @Short Rest or @Long Rest removes 2 levels of Exhaustion.</p>

                <hr>

                <h2>Fatigued</h2>

                <p>A creature with the Fatigued condition suffers the following effects:</p>

                <p><strong>Attack Rolls Effected</strong>. You do not add ability modifiers or extra dice to attack
                    rolls.</p>

                <p><strong>DCs Effected</strong>. You do not add ability modifiers when calculating saving throw DCs.
                </p>

                <p><strong>Damage Rolls Effected</strong>. You do not add ability modifiers or extra dice to damage
                    rolls.</p>

                <p>The Fatigued condition is always removed when a creature starts their turn.</p>

                <hr>

                <h2>Frightened</h2>

                <p>While you have the Frightened condition, you experience the following effects.</p>

                <p><strong><em>Ability Checks and Attacks Affected.</em></strong> You have @Disadvantage on @ability
                    checks and @attack rolls while the source of fear is within line of sight.</p>

                <p><strong><em>Can’t Approach.</em></strong> You can’t willingly move closer to the source of fear.</p>

                <hr>

                <h2>Grappled</h2>

                <p>While you have the Grappled condition, you experience the following effects.</p>

                <p><strong><em>Speed 0.</em></strong> Your @Speed is 0 and can’t increase.</p>

                <p><strong><em>Attacks Affected.</em></strong> You have @Disadvantage on attack rolls against any target
                    other than the grappler.</p>

                <p><strong><em>Movable.</em></strong> The grappler can drag or carry you when it moves, but every foot
                    of movement costs it 1 extra foot unless you are Tiny or two or more sizes smaller than it.</p>

                <hr>

                <h2>Incapacitated</h2>

                <p>While you have the Incapacitated condition, you experience the following effects.</p>

                <p><strong><em>Inactive.</em></strong> You can’t take any @Actions or @Reactions.</p>

                <p><strong><em>No Concentration.</em></strong> Your @Concentration is broken.</p>

                <p><strong><em>Speechless.</em></strong> You can’t speak.</p>

                <p><strong><em>Surprised.</em></strong> If you’re Incapacitated you are also @Suprised.</p>

                <hr>

                <h2>Invisible</h2>

                <p>While you have the Invisible condition, you experience the following effects.</p>

                <p><strong><em>Surprise.</em></strong> If you’re Invisible when you roll @Initiative, you have
                    @Advantage on the roll.</p>

                <p><strong><em>Concealed.</em></strong> You aren’t affected by any effect that requires its target to be
                    seen unless the effect’s creator can somehow see you. Any equipment you are wearing or carrying is
                    also concealed.</p>

                <p><strong><em>Attacks Affected.</em></strong> Attack rolls against you have @Disadvantage, and your
                    attack rolls have Advantage. If a creature can somehow see you, you don’t gain this benefit against
                    that creature.</p>

                <hr>

                <h2>Paralyzed</h2>

                <p>While you have the Paralyzed condition, you experience the following effects.</p>

                <p><strong><em>Incapacitated.</em></strong> You have the @Incapacitated condition.</p>

                <p><strong><em>Speed 0.</em></strong> Your @Speed is 0 and can’t increase.</p>

                <p><strong><em>Saving Throws Affected.</em></strong> You automatically fail Strength and Dexterity
                    @saving throw.</p>

                <p><strong><em>Attacks Affected.</em></strong> Attack rolls against you have @Advantage.</p>

                <p><strong><em>Automatic Critical Hits.</em></strong> Any attack roll that hits you is a @Critical Hit
                    if the attacker is within 5 feet of you.</p>

                <hr>

                <h2>Petrified</h2>

                <p>While you have the Petrified condition, you experience the following effects.</p>

                <p><strong><em>Turned to Inanimate Substance.</em></strong> You are transformed, along with any
                    nonmagical objects you are wearing and carrying, into a solid inanimate substance (usually stone).
                    Your weight increases by a factor of ten, and you cease aging.</p>

                <p><strong><em>Incapacitated.</em></strong> You have the @Incapacitated condition.</p>

                <p><strong><em>Speed 0.</em></strong> Your @Speed is 0 and can’t increase.</p>

                <p><strong><em>Attacks Affected.</em></strong> Attack rolls against you have @Advantage.</p>

                <p><strong><em>Saving Throws Affected.</em></strong> You automatically fail Strength and Dexterity
                    @saving throws.</p>

                <p><strong><em>Resist Damage.</em></strong> You have @Resistance to all damage.</p>

                <p><strong><em>Poison Immunity.</em></strong> You have @Immunity to the @Poisoned condition.</p>

                <hr>

                <h2>Poisoned</h2>

                <p>While you have the Poisoned condition, you experience the following effect.</p>

                <p><strong><em>Ability Checks and Attacks Affected.</em></strong> You have @Disadvantage on attack rolls
                    and ability checks.</p>

                <hr>

                <h2>Prone</h2>

                <p>While you have the Prone condition, you experience the following effects.</p>

                <p><strong><em>Restricted Movement.</em></strong> Your only movement options are to crawl or to spend an
                    amount of movement equal to half your @Speed (round down) to right yourself and thereby end the
                    condition. If your Speed is 0, you can’t right yourself.</p>

                <p><strong><em>Attacks Affected.</em></strong> You have @Disadvantage on attack rolls. An attack roll
                    against you has @Advantage if the attacker is within 5 feet of you. Otherwise, that attack roll has
                    Disadvantage.</p>

                <hr>

                <h2>Restrained</h2>

                <p>While you have the Restrained condition, you experience the following effects.</p>

                <p><strong><em>Speed 0.</em></strong> Your @Speed is 0 and can’t increase.</p>

                <p><strong><em>Attacks Affected.</em></strong> Attack rolls against you have @Advantage, and your attack
                    rolls have @Disadvantage.</p>

                <p><strong><em>Saving Throws Affected.</em></strong> You have Disadvantage on Dexterity saving throws.
                </p>

                <hr>

                <h2>Stunned</h2>

                <p>While you have the Stunned condition, you experience the following effects.</p>

                <p><strong><em>Incapacitated.</em></strong> You have the @Incapacitated condition.</p>

                <p><strong><em>Saving Throws Affected.</em></strong> You automatically fail Strength and Dexterity
                    @saving throws.</p>

                <p><strong><em>Attacks Affected.</em></strong> Attack rolls against you have @Advantage.</p>

                <hr>

                <h2>Unconscious</h2>

                <p>While you have the Unconscious condition, you experience the following effects.</p>

                <p><strong><em>Inert.</em></strong> You have the @Incapacitated and @Prone conditions, and you drop
                    whatever you’re holding. When this condition ends, you remain Prone.</p>

                <p><strong><em>Speed 0.</em></strong> Your @Speed is 0 and can’t increase.</p>

                <p><strong><em>Attacks Affected.</em></strong> @Attack rolls against you have @Advantage.</p>

                <p><strong><em>Saving Throws Affected.</em></strong> You automatically fail Strength and Dexterity
                    @saving throws.</p>

                <p><strong><em>Automatic Critical Hits.</em></strong> Any attack roll that hits you is a @Critical Hit
                    if the attacker is within 5 feet of you.</p>

                <p><strong><em>Unaware.</em></strong> You’re unaware of your surroundings..</p>

                <h2>Burrow Speed</h2>

                <p>A creature that has a Burrow Speed can use that speed to move through sand, earth, mud, or ice. The
                    creature can’t burrow through solid rock unless the creature has a trait that allows it to do so.
                </p>

                <hr>

                <h2>Climbing speed</h2>

                <p>While you’re climbing, each foot of movement costs 1 extra foot (2 extra feet in @Difficult Terrain).
                    You ignore this extra cost if you have a @Climb and use it to climb.</p>

                <p>At the DM’s option, climbing a slippery surface or one with few handholds might require a successful
                    DC 15 Strength (@Athletics) check.</p>

                <hr>

                <h2>Crawling speed</h2>

                <p>While you’re crawling, each foot of movement costs 1 extra foot</p>

                <hr>

                <h2>Fly Speed</h2>

                <p>A creature with a Fly Speed can move through the air.</p>

                <p>A Fly Speed can be used to travel through the air. While you have a Fly Speed, you can stay aloft
                    until you land, fall, or die.</p>

                <p>If a flying creature is knocked Prone, has its Speed reduced to 0, or otherwise loses the ability to
                    fly, it falls unless it has the @Hover trait.</p>

                <hr>

                <h2>Hover</h2>

                <p>A creature with Hover can remain airborne without moving.</p>

                <p>If a hovering creature's Speed becomes 0 or it is otherwise unable to move, it remains suspended
                    unless a feature specifically causes it to fall.</p>

                <p>A creature with Hover can still fall if it is knocked unconscious or if the effect granting Hover
                    ends.</p>

                <hr>

                <h2>Jumping</h2>

                <p>When you jump, you make either a Long Jump (horizontal) or a High Jump (vertical).</p>

                <p><strong><em>High Jump.</em></strong> When you make a High Jump, you leap into the air a number of
                    feet equal to 3 plus your Strength modifier (minimum of 0 feet) if you move at least 10 feet on foot
                    immediately before the jump. When you make a standing High Jump, you can jump only half that
                    distance. Either way, each foot of the jump costs a foot of movement.</p>

                <p>You can extend your arms half your height above yourself during the jump. Thus, you can reach a
                    distance equal to the height of the jump plus 1½ times your height.</p>

                <p><strong><em>Long Jump.</em></strong> When you make a Long Jump, you leap horizontally a number of
                    feet up to your Strength score if you move at least 10 feet immediately before the jump. When you
                    make a standing Long Jump, you can leap only half that distance. Either way, each foot you jump
                    costs a foot of movement.</p>

                <p>If you land in [[Difficult Terrain]], you must succeed on a DC 10 Dexterity ([[Acrobatics]]) check or
                    have the [[Prone]] condition.</p>

                <p>This Long Jump rule assumes that the height of the jump doesn’t matter, such as a jump across a
                    stream or chasm. At your DM’s option, you must succeed on a DC 10 Strength ([[Athletics]]) check to
                    clear a low obstacle (no taller than a quarter of the jump’s distance), such as a hedge or low wall.
                    Otherwise, you hit the obstacle.</p>

                <hr>

                <h2>Speed</h2>

                <p>A creature has a Speed, which is the distance in feet the creature can cover when it moves on its
                    turn.</p>

                <p><strong><em>Special Speeds.</em></strong> Some creatures have special speeds, such as a
                    [[Burrowing|Burrow]] Speed, [[Climbing|Climb]] Speed, [[Flying|Fly]] Speed, or [[Swimming|Swim]]
                    Speed. If you have more than one speed, choose which one to use when you move; you can switch
                    between the speeds during your move. Whenever you switch, subtract the distance already moved from
                    the new speed. The result determines how much farther you can move. If the result is 0 or less, you
                    can’t use the new speed during the current move. For example, if you have a Speed of 30 and a Fly
                    Speed of 40, you could fly 10 feet, walk 10 feet, and leap into the air to fly 20 feet more.</p>

                <p><strong><em>Changes to Your Speeds.</em></strong> If an effect increases or decreases your Speed for
                    a time, any special speed you have increases or decreases by an equal amount for the same duration.
                    For example, if your Speed is reduced to 0 and you have a Climb Speed, your Climb Speed is also
                    reduced to 0. Similarly, if your Speed is halved and you have a Fly Speed, your Fly Speed is also
                    halved.</p>

                <hr>

                <h2>Swimming</h2>

                <p>A Swim Speed can be used to swim without expending the extra movement normally associated with
                    swimming.</p>

                <p>While you’re swimming, each foot of movement costs 1 extra foot (2 extra feet in [[Difficult
                    Terrain]]). You ignore this extra cost if you have a Swim Speed and use it to swim. At the DM’s
                    option, moving any distance in rough water might require a successful DC 15 Strength ([[Athletics]])
                    check.</p>

                <hr>

                <h2>Teleportation</h2>

                <p>While teleporting, a creature chooses and end point within sight and expends teleportation speed to
                    instantly appear at that point.</p>

                <p>A teleporting creature does not provoke Reactions triggered by movement unless a feature specifically
                    states otherwise.</p>

                <p>Unless a teleportation effect states otherwise, the destination must be an unoccupied space capable
                    of supporting the creature. If no valid destination exists, the teleportation fails.</p>

                <h2>Bright Light</h2>

                <p>Bright Light allows creatures to see normally.</p>

                <p>Most daylight, torches, lanterns, and other strong light sources create Bright Light.</p>

                <p>Creatures in Bright Light can perceive their surroundings without penalty unless another effect
                    applies.</p>

                <hr>

                <h2>Darkness</h2>

                <p>Darkness creates an area where vision is severely limited.</p>

                <p>An area of Darkness is [[Heavily Obscured]].</p>

                <hr>

                <h2>Darkvision</h2>

                <p>Darkvision allows a creature to see in Darkness.</p>

                <p>A creature with Darkvision can see in Darkness within a specified range as though it were @Dim Light.
                </p>

                <p>Darkvision does not allow a creature to perceive color in Darkness unless a feature states otherwise.
                </p>

                <p>If a creature's Darkvision has a maximum range, it cannot benefit from it beyond that distance.</p>

                <hr>

                <h2>Dim Light</h2>

                <p>Dim Light creates an area of limited visibility.</p>

                <p>Examples include twilight, moonlight, fog, and the outer edge of many light sources.</p>

                <p>Areas of Dim Light are considered @Lightly Obscured.</p>

                <hr>

                <h2>Heavily Obscured</h2>

                <p>A Heavily Obscured area blocks vision almost entirely.</p>

                <p>Examples include Darkness, dense fog, thick smoke, or similar effects.</p>

                <p>A creature effectively cannot see through a Heavily Obscured area unless it possesses a special sense
                    or feature that allows it to do so.</p>

                <p>The Dungeon Master determines whether a particular effect creates a Heavily Obscured area.</p>

                <hr>

                <h2>Lightly Obscured</h2>

                <p>A Lightly Obscured area partially hinders vision.</p>

                <p>Examples include Dim Light, light foliage, falling snow, or similar effects.</p>

                <p>A creature can still see through a Lightly Obscured area, though details may be harder to discern.
                </p>

                <p>The Dungeon Master determines whether a particular effect creates a Lightly Obscured area.</p>

                <hr>

                <h2>Attitude</h2>

                <p>A creature's Attitude reflects how it currently feels toward another creature.</p>

                <p>Attitude is primarily used when resolving social interactions, negotiations, requests, and similar
                    situations.</p>

                <p>A creature's Attitude may change based on its experiences, goals, beliefs, and how it is treated.</p>

                <p>The three standard Attitudes are @Friendly, @Indifferent, and @Hostile.</p>

                <p>The Dungeon Master determines a creature's Attitude and whether it changes.</p>

                <hr>

                <h2>Carrying Capacity</h2>

                <p>Your size and Strength score determine the maximum weight in pounds that you can carry, as shown in
                    the Carrying Capacity table. The table also shows the maximum weight you can drag, lift, or push.
                </p>

                <p>While dragging, lifting, or pushing weight in excess of the maximum weight you can carry, your Speed
                    can be no more than 5 feet.</p>

                <h4>Carrying Capacity</h4>
