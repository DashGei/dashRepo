                <p>These roles are intended only to give a general sense of how each class plays. It is easy to
                    build a
                    defensive Fighter or Spellblade, and a Wizard or Cleric can deal just as much damage as a Rogue
                    by
                    choosing offensive spells and subclasses.</p>
                <h2>Fighting Styles</h2>

                <p>A Fighting Style represents the techniques, training, and battlefield habits that define how
                    your
                    character approaches challenges.</p>

                <p>All characters choose a Fighting Style at 1st level. Your choice grants a passive benefit
                    immediately
                    and helps shape your character's role throughout the campaign.</p>

                <p>A Fighting Style also grants a permanent Health Bonus, which increases your maximum Hit Points at
                    1st
                    level and whenever you gain a level.</p>

                <p>At 7th level, your Fighting Style grants a special feat. This feat does not count against your
                    Feats
                    Known, does not require a Feat Slot to use, and can be used even if it does not appear on your
                    class
                    feat list or if your class does not normally use feats.</p>

                <p>You must still obey the normal limit of activating no more than one feat on your turn.</p>

                <h3>Fighting Style Requirements</h3>

                <p>Many Fighting Styles require specific equipment or circumstances to gain their benefits.</p>

                <p>If a Fighting Style lists a requirement, you gain its benefits only while meeting that
                    requirement.
                </p>

                <p>For example, a character with the Dueling Fighting Style gains its benefits only while one hand
                    remains free, while a character with the Polearm Fighting Style gains its benefits only while
                    wielding a weapon with the Reach property.</p>

                <p>Ability Scores are an essential part of the rules, but they can also help define your character's
                    appearance and personality. Once you've assigned your scores, consider what they imply about
                    your
                    character. A very strong character with low Charisma might look and behave very differently from
                    a
                    charming character with little physical strength. The descriptive tables that follow provide
                    inspiration for portraying characters with particularly high or low Ability Scores.</p>

                <h2>Race</h2>

                <p>After determining your background and experiences, choose a race for your character. Each race
                    grants
                    unique features and helps define your character's appearance.</p>

                <p>When selecting a race, consider choosing one that reinforces your character's personality and
                    story.
                    For example, a larger-than-life Paladin devoted to Sol might be enhanced by being an Orc, while
                    a
                    practical naturalist may feel especially grounded as a Moor Elf or Human, leading to more
                    meaningful
                    interactions with the world. the list of races can be found at the top nav bar or <a
                        href="races.html">Here</a></p>

                <h2>Build Your Character!</h2>

                <p>You now have everything you need to begin building your character. Grab a character sheet and
                    follow
                    these steps.</p>

                <ol>
                    <li>Fill in each of the five Ability Scores at the top of your character sheet.</li>
                    <a>|</a>
                    <li>Locate the section of your class sheet that displays your starting class features.</li>
                    <a>|</a>
                    <li>Mark your class's Physical and Mental Modifiers with an X beneath the appropriate abilities.
                    </li>
                    <a>|</a>
                    <li>Choose your class's Fighting Style. This determines part of your starting Hit Points.</li>
                    <a>|</a>
                    <li>Calculate your 1st-level Hit Points.</li>
                    <a>|</a>
                    <li>Record your armor and weapon proficiencies.</li>
                    <a>|</a>
                    <li>Mark your saving throw proficiencies by adding your Ability Modifier and your Proficiency
                        Bonus
                        where applicable.</li>
                    <a>|</a>
                    <li>Mark your class skill proficiencies alongside those gained from your background.</li>
                    <a>|</a>
                    <li>Fill in the Ability Scores you purchased.</li>
                    <a>|</a>
                    <li>Calculate your skill bonuses by adding the appropriate Ability Modifier and your Proficiency
                        Bonus if you are proficient.</li>
                    <a>|</a>
                    <li>
                        <strong>Calculate your Physical and Mental DCs.</strong>

                        <p><strong>Physical DC</strong> = 8 + Proficiency Bonus + Physical Modifier</p>

                        <p><strong>Mental DC</strong> = 8 + Proficiency Bonus + Mental Modifier</p>
                    </li>
                    <a>|</a>
                    <li>
                        <strong>Calculate your attack bonuses.</strong>

                        <p><strong>Melee Attack Bonus</strong> = Strength + Proficiency Bonus</p>

                        <p><strong>Ranged Attack Bonus</strong> = Dexterity + Proficiency Bonus</p>

                        <p><strong>Spell Attack Bonus</strong> = Mental Modifier + Proficiency Bonus</p>
                    </li>
                    <a>|</a>
                    <li>If your class grants spellcasting at 1st level, record your spellcasting features. Your
                        class
                        table shows the spells available at each level and specifies which spell list you use.</li>

                <h5>Chapter 6, Martial Classes and Feats</h5>

                <h2>Martial Feats</h2>

                <p>Martial Feats represent specialized techniques, combat maneuvers, and trained abilities that martial
                    characters can perform in battle.</p>

                <p>Unlike spells, Martial Feats are fueled by Feat Slots. You expend Feat Slots to activate powerful
                    abilities and regain all expended Feat Slots when you finish a Short Rest.</p>

                <p>Martial Feats are divided into four tiers. As you gain levels, you unlock access to more powerful
                    feats and gain additional Feat Slots to fuel them.</p>

                <hr>

                <h2>Feat Slots</h2>

                <p>Feat Slots represent your endurance, training, and ability to perform exceptional techniques under
                    pressure.</p>

                <p>Whenever you activate a feat that requires a Feat Slot, you expend one of your available slots. You
                    regain all expended Feat Slots when you finish a Short Rest.</p>

                <h2>Learning Feats</h2>

                <p>As you gain levels, you learn Martial Feats from your class feat list.</p>

                <p>Each feat belongs to one of four tiers.</p>

                <p>Whenever you prepare a new feat, you may choose any feat from a tier you have access to.</p>

                <p>Some class features, subclasses, and Fighting Styles grant additional feats. Unless stated
                    otherwise, these feats do not count against your Feats Prepared.</p>

                <hr>

                <h2>Using a Feat</h2>

                <p>Each feat describes when and how it can be activated.</p>

                <p>A feat may require an Action, a Reaction, an attack, or another trigger. If a feat does not specify
                    an Action cost, activating it requires no Action.</p>

                <p>Unless a feat states otherwise, activating it costs one Feat Slot.</p>

                <h3>One Feat Per Turn</h3>

                <p>You cannot activate more than one feat during your turn.</p>

                <p>Feats activated as Reactions on your own turn or another creature's turn do not count toward this
                    limit.</p>

                <h3>Feat Saving Throws</h3>

                <p>Some feats require a target to make a saving throw.</p>

                <p>When a feat calls for a saving throw, it uses either your Physical DC or your Mental DC, as
                    specified in the feat's description.</p>

                <p>A feat that lists <strong>Physical DC Strength</strong> means the target makes a Strength saving
                    throw against your Physical DC.</p>

                <p>A feat that lists <strong>Mental DC Wisdom</strong> means the target makes a Wisdom saving throw
                    against your Mental DC.</p>

                <p>All expended Feat Slots are regained when you finish a Short Rest.</p>

                <h5>Chapter 7, Spell Classes and Spellcasting</h5>

                <h2>Magic</h2>

                <p>Magic is one of the most powerful forces in the world. Whether it comes from divine faith,
                    rigorous study, primal spirits, or forbidden bargains, magic allows creatures to shape
                    reality in ways impossible through ordinary means.</p>

                <p>Many classes gain the ability to cast spells. These spells can heal wounds, unleash
                    destructive energy, manipulate the battlefield, gather information, or alter the world
                    itself. While the source of magical power varies between classes, all spellcasting follows
                    the same fundamental rules.</p>

                <p>Every spell belongs to a level, ranging from simple magical techniques known as Cantrips to
                    powerful spells cast using Tertiary Slots. More powerful magic often requires greater
                    preparation, concentration, and commitment from the caster.</p>

                <p>The sections that follow explain the universal rules for spellcasting, including spell slots,
                    preparing spells, concentration, and the Magic Action. Your class determines which spells
                    you can learn, how many spell slots you possess, and which ability score you use to cast
                    your spells.</p>

                <hr>

                <h2>Learning and Preparing Spells</h2>

                <p>Each spellcasting class learns and prepares spells differently.</p>

                <p>Some classes maintain a list of known spells that rarely changes. Other classes prepare
                    spells from a larger list whenever they finish a Long Rest.</p>

                <p>Your class determines how many spells you know or prepare, as well as which spells are
                    available to you.</p>

                <p>Regardless of how you learn your spells, a spell must be known or prepared before you can
                    cast it.</p>

                <hr>

                <h2>Spellcasting Ability</h2>

                <p>Magic is shaped through force of mind, faith, instinct, study, or personality. Every
                    spellcasting class uses a Mental Modifier to determine the strength of its spells.</p>

                <p>Your class determines which ability score serves as your Mental Modifier.</p>

                <p>Many spells require a target to make a saving throw against your magic. The Difficulty Class
                    for these saving throws is called your Spell Save DC.</p>

                <p><strong>Spell Save DC = 8 + your Proficiency Bonus + your Mental Modifier</strong></p>

                <p>Some spells require you to make an attack roll. Your Spell Attack Modifier is calculated as
                    follows:</p>

                <p><strong>Spell Attack Modifier = your Proficiency Bonus + your Mental Modifier</strong></p>

                <p>Whenever a spell refers to your spellcasting ability, use the Mental Modifier specified by
                    your class.</p>

                <hr>

                <h2>Cantrips</h2>

                <p>Cantrips are simple spells that can be cast repeatedly without expending magical resources.
                </p>

                <p>A Cantrip requires 1 action to cast unless its description states otherwise.</p>

                <p>Because Cantrips do not consume spell slots, they form the foundation of many spellcasters'
                    magical abilities and can be used whenever the situation demands.</p>

                <p>Although Cantrips are the weakest form of magic, experienced spellcasters often rely on them
                    throughout their careers.</p>

                <hr>

                <h2>Casting Spells with Spell Slots</h2>

                <p>Unlike Cantrips, most spells require the expenditure of a spell slot. Every spell has a
                    level, and the spell slot used to cast it determines the level at which the spell is cast.
                </p>

                <p>When you cast a spell using a spell slot, the spell is automatically cast at the level of
                    that slot. If the spell has an "At Higher Levels" entry, apply any additional effects
                    described there.</p>

                <p>For example, if your Primary Slots are 2nd-level slots and you cast <em>Burning Hands</em>,
                    the spell is cast as a 2nd-level spell and gains the benefits listed in its "At Higher
                    Levels" entry.</p>

                <p>You may choose to cast a spell at its base level instead. When you do so, ignore any benefits
                    granted by casting the spell at a higher level.</p>

                <p>Some spells gain additional damage, duration, targets, or other benefits when cast at a
                    higher level. These improvements are described in the spell's text.</p>

                <p>If a spell does not include an "At Higher Levels" entry, casting it using a higher-level slot
                    typically provides no additional benefit.</p>

                <h4>Example</h4>

                <p>A 6th level Druid has 2nd-level Secondary Slots and has prepared <em>Cure Wounds</em>.</p>

                <p>When they cast <em>Cure Wounds</em> using a Secondary Slot, they may either:</p>

                <ul>
                    <li>Cast the spell as a 2nd-level spell and apply its higher-level benefits.</li>
                    <li>Cast the spell as a 1st-level spell and ignore its higher-level benefits.</li>
                </ul>

                <p>In either case, the Secondary Slot is expended when the spell is cast.</p>

                <h3>Example</h3>

                <p>A Wizard has 2nd-level Primary Slots and prepares <em>Burning Hands</em>.</p>

                <p>When they cast <em>Burning Hands</em> using a Primary Slot, they may choose one of the
                    following:</p>

                <ul>
                    <li>Cast the spell as a 2nd-level spell, gaining the benefits listed in its "At Higher
                        Levels" entry.</li>
                    <li>Cast the spell as a 1st-level spell, ignoring any higher-level benefits.</li>
                </ul>

                <p>The spell still expends a Primary Slot regardless of which option is chosen.</p>

                <hr>

                <h2>Primary Slots</h2>

                <p>Primary Slots represent a spellcaster's most accessible magical power. These spells can be
                    cast reliably and frequently throughout an adventuring day.</p>

                <p>To cast a spell using a Primary Slot, you must expend a Primary Slot of the spell's level or
                    higher.</p>

                <p>Casting a spell with a Primary Slot requires 2 actions unless the spell states otherwise.</p>

                <p>Once a Primary Slot is expended, it cannot be used again until you finish a Long Rest.</p>

                <p>Your class determines how many Primary Slots you possess and the level of spells that can be
                    cast using them.</p>

                <hr>

                <h2>Secondary Slots</h2>

                <p>Secondary Slots represent more potent magical power.</p>

                <p>To cast a spell using a Secondary Slot, you must expend a Secondary Slot of the spell's level
                    or higher.</p>

                <p>Casting a spell with a Secondary Slot requires 2 actions unless the spell states otherwise.
                </p>

                <p>Once a Secondary Slot is expended, it cannot be used again until you finish a Long Rest.</p>

                <p>Your class determines how many Secondary Slots you possess and the level of spells that can
                    be cast using them.</p>

                <p>While Secondary Slots are less common than Primary Slots, they often provide access to some
                    of a spellcaster's most impactful abilities.</p>

                <hr>

                <h2>Tertiary Slots</h2>

                <p>Tertiary Slots represent the pinnacle of your magical power. Such spells require preparation
                    before they can be unleashed.</p>

                <p>To cast a spell using a Tertiary Slot, you must first charge the spell.</p>

                <h3>Charging a Spell</h3>

                <p>As an action, choose a spell you know or have prepared that can be cast using a Tertiary
                    Slot. The spell becomes charged, but no spell slot is expended yet.</p>

                <p>Charging a spell is not a subtle thing, and requires an incredible amount of control while
                    the arcane energy is formed. Because of this, it immediately drops the Invisible condition
                    if you have it, and creatures within 100 feet are alerted via sound and sight to your
                    actions.</p>

                <h3>Casting a Charged Spell</h3>

                <p>At the start of one of your turns while the spell remains charged, you may spend 2 actions to
                    cast it.</p>

                <p>When the spell is cast, the Tertiary Slot is expended.</p>

                <h3>Holding Power</h3>

                <p>You can maintain a charged spell for a number of turns equal to your Mental Modifier, with a
                    minimum of 1 turn.</p>

                <p>For each turn you continue holding the spell before casting it, the spell is automatically
                    cast as though using a spell slot one level higher.</p>

                <p>A spell cannot be upcast beyond the 9th level in this way.</p>

                <h3>Taking Damage</h3>

                <p>Whenever you take damage while charging a spell, you must make a Concentration Check as
                    described later in this chapter, failing this check causes the spell to fade and you must
                    begin the process again.</p>

                <h2>Magic</h2>

                <p>Magic is one of the most powerful forces in the world. Whether it comes from divine faith,
                    rigorous study, primal spirits, or forbidden bargains, magic allows creatures to shape
                    reality in ways impossible through ordinary means.</p>

                <p>Many classes gain the ability to cast spells. These spells can heal wounds, unleash
                    destructive energy, manipulate the battlefield, gather information, or alter the world
                    itself. While the source of magical power varies between classes, all spellcasting follows
                    the same fundamental rules.</p>

                <p>Every spell belongs to a level, ranging from simple magical techniques known as Cantrips to
                    powerful spells cast using Tertiary Slots. More powerful magic often requires greater
                    preparation, concentration, and commitment from the caster.</p>

                <p>The sections that follow explain the universal rules for spellcasting, including spell slots,
                    preparing spells, concentration, and the Magic Action. Your class determines which spells
                    you can learn, how many spell slots you possess, and which ability score you use to cast
                    your spells.</p>

                <hr>

                <h2>Learning and Preparing Spells</h2>

                <p>Each spellcasting class learns and prepares spells differently.</p>

                <p>Some classes maintain a list of known spells that rarely changes. Other classes prepare
                    spells from a larger list whenever they finish a Long Rest.</p>

                <p>Your class determines how many spells you know or prepare, as well as which spells are
                    available to you.</p>

                <p>Regardless of how you learn your spells, a spell must be known or prepared before you can
                    cast it.</p>

                <hr>

                <h2>Spellcasting Ability</h2>

                <p>Magic is shaped through force of mind, faith, instinct, study, or personality. Every
                    spellcasting class uses a Mental Modifier to determine the strength of its spells.</p>

                <p>Your class determines which ability score serves as your Mental Modifier.</p>

                <p>Many spells require a target to make a saving throw against your magic. The Difficulty Class
                    for these saving throws is called your Spell Save DC.</p>

                <p><strong>Spell Save DC = 8 + your Proficiency Bonus + your Mental Modifier</strong></p>

                <p>Some spells require you to make an attack roll. Your Spell Attack Modifier is calculated as
                    follows:</p>

                <p><strong>Spell Attack Modifier = your Proficiency Bonus + your Mental Modifier</strong></p>

                <p>Whenever a spell refers to your spellcasting ability, use the Mental Modifier specified by
                    your class.</p>

                <hr>

                    magical abilities and can be used whenever the situation demands.</p>

                <p>Although Cantrips are the weakest form of magic, experienced spellcasters often rely on them
                    throughout their careers.</p>

                <ul>

                <hr>

                <h2>Tertiary Slots</h2>

                <p>Tertiary Slots represent the pinnacle of your magical power. Such spells require preparation
                    before they can be unleashed.</p>

                <p>To cast a spell using a Tertiary Slot, you must first charge the spell.</p>

                <h3>Charging a Spell</h3>

                <p>As an Action, choose a spell you know or have prepared that can be cast using a Tertiary
                    Slot. The spell becomes charged, but no spell slot is expended yet.</p>

                <p>Charging a spell is not subtle and requires an incredible amount of control while arcane
                    energy is gathered. Because of this, you immediately lose the Invisible condition if you
                    have it, and creatures within 100 feet are alerted to your actions by both sight and sound.
                </p>

                <h3>Casting a Charged Spell</h3>

                <p>At the start of one of your turns while the spell remains charged, you may spend 2 Actions to
                    cast it.</p>

                <p>When the spell is cast, the Tertiary Slot is expended.</p>

                <h3>Holding Power</h3>

                <p>You can maintain a charged spell for a number of turns equal to your Mental Modifier, with a
                    minimum of 1 turn.</p>

                <p>For each turn you continue holding the spell before casting it, the spell is automatically
                    cast as though using a spell slot one level higher.</p>

                <p>A spell cannot be upcast beyond 9th level in this way.</p>

                <h3>Taking Damage</h3>

                <p>Whenever you take damage while charging a spell, you must make a Concentration Check, as
                    described later in this chapter. On a failure, the spell fades and you must begin the
                    charging process again.</p>

                <hr>

                <h2>Preparing Spells</h2>

                <p>Some spellcasting classes prepare their spells after a Long Rest.</p>

                <p>When you finish a Long Rest, you choose a number of spells from your class's spell list to prepare.
                    The number of spells you can prepare is determined by your class.</p>

                <p>Only prepared spells can be cast.</p>

                <p>A prepared spell remains available until you change your prepared spells during a future Long Rest.
                </p>

                <p>Classes that prepare spells can adapt their magical abilities to different situations by changing
                    which spells they have prepared.</p>

                <hr>

                <h2>Ritual Casting</h2>

                <p>Some spells possess the Ritual tag.</p>

                <p>A spell with the Ritual tag can be cast without expending a spell slot if you have a feature that
                    allows Ritual Casting.</p>

                <p>Casting a spell as a ritual increases its casting time by 10 minutes.</p>

                <p>A spell cast as a ritual functions normally in all other respects.</p>

                <p>Because rituals do not consume spell slots, they are commonly used for utility magic, exploration,
                    and information gathering when time is available.</p>

                <hr>

                <h2>Concentration</h2>

                <p>Certain spells and magical effects require concentration to maintain.</p>

                <p>A creature can concentrate on only one effect at a time. If you begin concentrating on a new effect,
                    your previous concentration immediately ends. You can also end concentration at any time, even if it
                    isn't your turn.</p>

                <p>Concentration ends if:</p>

                <ul>
                    <li>You become incapacitated.</li>
                </ul>

                <ul>
                    <li>You choose to end it.</li>
                </ul>

                <ul>
                    <li>You fail a Concentration Check.</li>
                </ul>

                <h3>Concentration Checks</h3>

                <p>Whenever you take damage while concentrating, you must make a saving throw. The Ability Score used
                    for this saving throw is your Mental Modifier.</p>

                <p>The DC equals 10 or half the damage taken, whichever is higher.</p>

                <p>On a failed save, your concentration ends immediately.</p>

                <hr>

                <h2>Magic Action</h2>

                <p>Casting a spell requires the Magic Action.</p>

                <p>When you take the Magic Action, you cast a spell and resolve its effects as described in the spell's
                    text. After resolving a spell cast through the Magic Action, you gain the Fatigued condition.</p>

                <p>While Fatigued, you do not add your Ability Modifier to:</p>

                <ul>
                    <li>Spell attack rolls.</li>
                </ul>

                <ul>
                    <li>The calculation of your Spell Save DC.</li>
                </ul>

                <p>The Fatigued condition lasts until the start of your next turn.</p>

                <hr>

                <h2>How Are Spells Cast?</h2>

                <p>How a mortal (or other being) casts their spells depends on their spellcasting ability, also called a
                    Mental Modifier, along with their spellcasting class.</p>

                <p><strong>Druids and those who manipulate natural forces</strong> cast their spells through their
                    connection with the Primordial Titans of the world and the continuation of their symbiotic
                    relationship.</p>

                <p><strong>Clerics and other divine casters</strong> cast their spells by calling upon powerful beings
                    from other planes and borrowing a fraction of their magical ability.</p>

                <p><strong>Wizards and other studious mages</strong> cast spells by mentally reciting intricate
                    heuristics, each becoming more complex as the spells grow in power.</p>

                <p><strong>Warlocks</strong> gain their power from an outside source similar to Clerics and Druids, but
                    theirs is typically more transactional or unintentional. A Warlock may draw upon an ancestral
                    bloodline to cast spells of raw magic, invoke a pact made with a Devil, or reluctantly recite spells
                    from a tome they are cursed never to be rid of.</p>

                <hr>

                <p>In every case, a caster must draw upon some aspect of their mind that enhances their magic, called a
                    Mental Modifier.</p>

                <h3>Intelligence</h3>

                <p>Intelligence casting revolves around a studious Bard, Cleric, or Wizard's ability to perform the
                    mental processes required to replicate complex spells, rituals, or art forms.</p>

                <p>Intelligence casters can often point to passages in journals they have written that detail the
                    precise methods they use to cast their spells. These techniques are usually incomprehensible to
                    other mortals.</p>

                <h3>Wisdom</h3>

                <p>Wisdom casting involves a mortal's innate connection to the Weave or to a higher being, allowing them
                    to channel that power into spells. While often difficult to explain, a skilled Wisdom caster is
                    deeply attuned to the source of their magic.</p>

                <h3>Charisma</h3>

                <p>Creatures with exceptional force of personality cause the Weave itself to bend around them. A skilled
                    Charisma caster commands, persuades, or coaxes the Weave into forming the spells they desire.</p>

                <hr>

                <h2>The Weave</h2>

                <p>The Weave is an imperceptible fabric that exists primarily within its own dimension while overlapping
                    the mortal world.</p>

                <p>Arcane spellcasters such as Wizards, Bards, and many Warlocks can be seen subtly tugging at strands
                    of the Weave as they shape their spells.</p>

                <hr>

                <h2>Spellcasters in the World</h2>

                <p>Although the Planescape is filled with magic, the average person on Gaia may witness true magic only
                    once or twice each year.</p>

                <p>Roughly one percent of mortals possess magical ability, and most villages have an elder cleric or
                    shaman roughly equivalent to a 3rd- or 4th-level spellcaster.</p>

                <p>The following examples describe approximately how long it takes a person of average intelligence,
                    faith, or force of personality to master spells of increasing power.</p>

                <p>Player characters are exceptional individuals and do not follow these timelines. Their magical
                    abilities develop far more rapidly than those of ordinary mortals.</p>

                <p><strong>Cantrips:</strong> The average person can learn to cast most Cantrips after about 5 years of
                    study.</p>

                <p><strong>2nd-Level Spells:</strong> The average person can learn to cast most 2nd-level spells after
                    about 5 additional years of study.</p>

                <p><strong>3rd-Level Spells:</strong> The average person can learn to cast most 3rd-level spells after
                    about 10 additional years of study.</p>

                <p><strong>4th-Level Spells:</strong> The average person can learn to cast most 4th-level spells after
                    about 10 additional years of study.</p>

                <p><strong>5th-Level Spells:</strong> The average person can learn to cast most 5th-level spells after
                    about 10 additional years of study. Even among disciplined spellcasters, this is often the highest
                    level of magical mastery attained.</p>

                <p><strong>6th-9th Level Spells:</strong> Spells of these levels are effectively unattainable for the
                    overwhelming majority of mortals. Only four mortals are capable of casting 9th-level spells.</p>

                <h5>Chapter 8, Exploration, Party Progression, and Cohesion</h5>

                <p>To keep the game running as smoothly as possible, it is important to delegate which parts of the game
                    are tracked by which players and who is responsible for knowing particular rules.</p>

                <p>Sometimes a session may include an extended period of time between social or combat encounters.
                    During these periods, characters have time to explore the world, build connections, and work on
                    their equipment.</p>

                <p>This chapter also covers the features and mechanics the entire party gains access to as they become
                    seasoned adventurers.</p>

                <hr>

                <h2>Leveling Up</h2>

                <p>When the party accomplishes a great task or reaches a major milestone in the story, the Dungeon
                    Master allows the party to level up, usually the next time they finish a Long Rest.</p>

                <hr>

                <h2>Level 2, Crafting Equipment</h2>

                <p>Using the following rules, characters can craft nonmagical items, Potions of Healing, and Spell
                    Scrolls.</p>

                <h2>Crafting Nonmagical Items</h2>

                <p>To craft a nonmagical item, you need tools, raw materials, and time. If you meet all of these
                    requirements, you create the item, which can then be used or sold at its normal price.</p>

                <h3>Tools</h3>

                <p>The Equipment chapter's <strong>Tools</strong> section lists the tools required to craft specific
                    items. The Dungeon Master determines the required tools for items not listed there.</p>

                <p>Some tools, particularly those used for metalworking, may also require access to an appropriate
                    workstation such as a forge.</p>

                <p>You must possess proficiency with the required tool to craft the item. Anyone assisting you must also
                    be proficient with that tool.</p>

                <h3>Raw Materials</h3>

                <p>Crafting an item requires raw materials worth half of its purchase price, rounded down.</p>

                <p>For example, crafting Plate Armor requires 750 GP worth of raw materials because it normally sells
                    for 1,500 GP.</p>

                <p>The Dungeon Master determines whether suitable materials are available.</p>

                <h3>Time</h3>

                <p>To determine the crafting time, divide the item's purchase price in GP by 10, rounding fractions up.
                    Each crafting day represents 8 hours of work.</p>

                <p>For example, crafting a Crossbow, which costs 50 GP, requires 5 days.</p>

                <p>If an item requires multiple days to complete, those days do not need to be consecutive.</p>

                <p>Characters may combine their efforts to reduce crafting time. Divide the required time by the number
                    of characters working on the item. Normally only one character can assist, although the Dungeon
                    Master may allow additional helpers.</p>

                <h2>Brewing Potions of Healing</h2>

                <p>A character proficient with a <strong>Herbalism Kit</strong> can brew a <strong>Potion of
                        Healing</strong>.</p>

                <p>Doing so requires:</p>

                <ul>
                    <li>A Herbalism Kit.</li>
                </ul>

                <ul>
                    <li>25 GP worth of raw materials.</li>
                </ul>

                <ul>
                    <li>1 day (8 hours) of work.</li>
                </ul>

                <p>Upon completion, you create one <strong>Potion of Healing</strong>.</p>

                <h2>Scribing Spell Scrolls</h2>

                <p>A spellcaster can transfer one of their spells to a <strong>Spell Scroll</strong> using the following
                    rules.</p>

                <h3>Time and Cost</h3>

                <p>Scribing a scroll requires both time and gold based on the spell's level, as shown in the Spell
                    Scroll Costs table.</p>

                <p>Each day of inscription requires 8 hours of work. If the process takes multiple days, they do not
                    need to be consecutive.</p>

                <h3>Prerequisites</h3>

                <p>To scribe a scroll, you must have proficiency in the Arcana skill or with Calligrapher's Supplies,
                    and you must have the spell prepared on every day spent scribing.</p>

                <p>You must also provide any required Material components. Components consumed by the spell are consumed
                    only when the scroll is completed.</p>

                <p>The completed scroll uses your Spell Save DC and Spell Attack Modifier.</p>

                <h3>Cantrips</h3>

                <p>If the spell being scribed is a Cantrip, the scroll functions as though it were cast by a caster of
                    your level.</p>

                <h2>Level 4, Mentorship</h2>

                <p>When the party reaches 4th level, its members can begin sharing their skills and knowledge with one
                    another.</p>

                <p>During a Long Rest, one party member (the Mentor) can teach another party member (the Student).</p>

                <h2>Mentorship Process</h2>

                <ol>
                    <li><strong>Initiation.</strong> At the start of a Long Rest, the Mentor and Student declare they
                        are spending the rest engaged in focused training.</li>

                    <li><strong>Teaching.</strong> The Mentor selects one proficiency or minor ability they possess from
                        the list below. The Student must not already possess that proficiency or ability.</li>

                    <li><strong>Rest Completion.</strong> At the end of the Long Rest, the Student makes an ability
                        check using the Mentoring Ability listed below. The DC is reduced by the Mentor's Intelligence
                        Modifier.
                        <ul>
                            <li><strong>Success.</strong> The Student immediately gains the taught feature.</li>
                        </ul>
                        <ul>
                            <li><strong>Failure.</strong> The Student retains partial training and gains Advantage on
                                the next attempt to learn the same feature from the same Mentor. After three failed
                                attempts, they cannot attempt to learn that feature from that Mentor again until they
                                gain a level.</li>
                        </ul>
                    </li>
                </ol>

                <h2>What Can Be Taught?</h2>

                <table class="styled-table">
                    <thead>
                        <tr>
                            <th>Category</th>
                            <th>Examples</th>
                            <th>Mentoring Ability</th>
                            <th>Mentoring DC</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td><strong>Language</strong></td>
                            <td>One language the Mentor speaks and writes.</td>
                            <td>Intelligence</td>
                            <td>21</td>
                        </tr>
                        <tr>
                            <td><strong>Tool Proficiency</strong></td>
                            <td>One tool kit, vehicle, or gaming set.</td>
                            <td>Dexterity or Intelligence (appropriate to the tool)</td>
                            <td>18</td>
                        </tr>
                        <tr>
                            <td><strong>Skill Proficiency</strong></td>
                            <td>One skill the Mentor is proficient in.</td>
                            <td>The skill's associated ability.</td>
                            <td>20</td>
                        </tr>
                        <tr>
                            <td><strong>Cantrip</strong></td>
                            <td>One Cantrip the Mentor knows.</td>
                            <td>The Mentor's Mental Modifier.</td>
                            <td>21</td>
                        </tr>
                        <tr>
                            <td><strong>Weapon Proficiency</strong></td>
                            <td>One weapon the Mentor is proficient with.</td>
                            <td>Strength or Dexterity.</td>
                            <td>18</td>
                        </tr>
                        <tr>
                            <td><strong>Martial Feat</strong></td>
                            <td>One Martial Feat from the Mentor's class list.</td>
                            <td>The Mentor's Intelligence or Wisdom Modifier.</td>
                            <td>20</td>
                        </tr>
                    </tbody>
                </table>
                <p><strong>Language</strong>: The student adds the language to their languages known, or learns to write
                    in that language if they already knew how to speak it.</p>

                <p><strong>Tool</strong>: The student has proficiency in the tool.</p>

                <p><strong>Skill</strong>: The student has half proficiency in that skill, adding half of their
                    proficiency bonus to checks made with that skill.</p>

                <p><strong>Cantrip</strong>: That student learns the cantrip, using their Mental Modifier for attack
                    rolls and spell save DC.</p>

                <p><strong>Weapon Proficiency</strong>: The student becomes proficient in the weapon.</p>

                <p><strong>Martial Feat</strong>: The student adds the learned Feat to their class's Feats known.</p>

                <p><strong>Restrictions.</strong></p>

                <ul>
                    <li>A Mentor can teach only one Student per long rest.</li>
                </ul>

                <ul>
                    <li>A Student can learn from only one Mentor per long rest.</li>
                </ul>

                <ul>
                    <li>A Student can learn at most <strong>two</strong> features through Mentorship. Once they have
                        learned two, they can still serve as a Mentor, but cannot be a Student again.</li>
                </ul>

                <ul>
                    <li>You cannot teach a feature that is granted by a class, feature, or background that you only have
                        access to temporarily (e.g., from a spell effect or ranger aspect).</li>
                </ul>

                <hr>

                <h2>Level 6, Divine Favor</h2>

                <p><strong>For many in the world of Gaia</strong>, Religion plays a communal and utilitarian role in
                    one's life. Rarely will individuals devote themselves to singular gods, or swear all of them off
                    outright.</p>

                <p>A typical peasant may pray to Gri in the morning for a safe crop, evoke Ilxi's name while gambling
                    with their friends, and then go home where an emblem of Helm sits above the door and guards against
                    evils.</p>

                <h3>Player Interactions</h3>

                <p>Just like everyone else, players can form relationships with the various gods of the world, gaining
                    boons, or possibly minor woes if they repeatedly offend some deities.</p>

                <p>Not every god prefers the same method of worship. Some gods wish only for larger and larger masses of
                    dedicated worshippers, some simply want their followers to practice their disciplines, and others
                    care solely that their ideals are spread.</p>

                <h3>Divine Favor</h3>

                <p>The party loses or gains <strong>Favor Points</strong> by supporting a deity's efforts and ideals as
                    detailed in each deity's Favor Criteria section, at the DM's discretion. Unmentioned actions that
                    the party takes may affect relationships with the gods.</p>

                <p>Favor grants the entire party small, thematic blessings. Acting against a god's principles can bring
                    minor woes. A party who makes meaningful connections with each other and the world will always bring
                    favor.</p>

                <p>When the party finishes a long rest together, they may ask the DM to reveal their current standings
                    with the gods. They may also choose to voluntarily decrease their Favor with any deity by any amount
                    at that time to make room for other relationships.</p>

                <h3>Favor Scale</h3>

                <table class="styled-table">
                    <thead>
                        <tr>
                            <th>Favor Score</th>
                            <th>Status</th>
                            <th>Effect</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>-5</td>
                            <td>Disfavored</td>
                            <td>Greater Woe</td>
                        </tr>
                        <tr>
                            <td>-4 to -3</td>
                            <td>Displeased</td>
                            <td>Minor Woe</td>
                        </tr>
                        <tr>
                            <td>0</td>
                            <td>Neutral</td>
                            <td>-</td>
                        </tr>
                        <tr>
                            <td>1 - 2</td>
                            <td>Noticed</td>
                            <td>-</td>
                        </tr>
                        <tr>
                            <td>3 - 5</td>
                            <td>Favored</td>
                            <td>Minor Boon</td>
                        </tr>
                        <tr>
                            <td>6 - 9</td>
                            <td>Honored</td>
                            <td>Boon</td>
                        </tr>
                        <tr>
                            <td>10</td>
                            <td>Champion</td>
                            <td>Major Boon</td>
                        </tr>
                    </tbody>
                </table>

                <p>Favor Points adjust at the end of a long rest or session at the DM's discretion. The party cannot
                    lose or gain more than 5 FP per session with a given god through direct offense, and minor slights
                    may not change the score at all.</p>

                <p>The party can hold a maximum of <strong>30 Favor Points</strong> invested across a maximum of 5
                    deities at any time. Negative Favor Points do not add to this total, and the party can have a
                    maximum of 10 total negative Favor Points invested. If the party would gain FP that would push their
                    total above 30, those points are lost.</p>

                <h3>Worship Methods</h3>

                <p>Every deity has a <strong>Worship Method</strong> that dictates how the party gains Favor. The DM
                    awards 1 FP when the party meaningfully fulfills the method, and occasionally 2 FP for exceptional
                    acts.</p>

                <table class="styled-table">
                    <thead>
                        <tr>
                            <th>Method</th>
                            <th>Description</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td><strong>Devotion</strong></td>
                            <td>The god grows stronger through worship. FP is earned by spreading the faith, building
                                shrines, converting others, or leading communal prayers.</td>
                        </tr>
                        <tr>
                            <td><strong>Discipline</strong></td>
                            <td>The god values the practice of a craft, skill, or way of life. FP is earned by engaging
                                in the associated discipline. Creating art, mastering a trade, or upholding a code may
                                be the best way to earn this god's favor.</td>
                        </tr>
                        <tr>
                            <td><strong>Ideals</strong></td>
                            <td>The god cares that their ideals are enacted. FP is earned by championing those ideals,
                                defeating opposing forces, or shifting a community's values.</td>
                        </tr>
                    </tbody>
                </table>

                <h3>Boons and Woes</h3>

                <p>Boons are occasional minor bonuses that the party may obtain by maintaining good relationships with
                    gods. Each god has their own set of boons. Some may give players resources to spend during the day,
                    while others may only activate when the DM chooses.</p>

                <p>Some Boons and Woes require tracking the Velthraen Calendar. Additionally, if a Boon or Woe affects
                    one party member once per day or week, it only occurs the first time that party member triggers it,
                    ignoring subsequent triggers by other party members until the Boon or Woe refreshes.</p>
