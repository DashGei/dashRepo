                <hr>

                <h2>Dying</h2>

                <p>A creature is Dying when it has 0 @Hit Points and is not @Stable.</p>

                <p>A Dying creature makes a @Death Saving Throw at the start of each of its turns.</p>

                <p>The result of the Death Saving Throw determines how many actions the creature can take and whether it
                    gains Exhaustion.</p>

                <p>A Dying creature remains at 0 Hit Points until it regains Hit Points, becomes Stable, or dies.</p>

                <p>Taking damage while Dying causes the creature to gain 1 point of Exhaustion once per turn.</p>

                <hr>

                <h2>Long Rest</h2>

                <p>A Long Rest is a period of extended downtime used for sleep, recovery, and preparation.</p>

                <p>A Long Rest requires 8 hours of uninterrupted rest, though the Dungeon Master may modify this
                    requirement based on circumstances.</p>

                <p><strong><em>Benefits of the Rest.</em></strong> When you finish the rest, you gain the following
                    benefits:</p>

                <p><strong><em>Healing.</em></strong> You regain all Hit Points, if your Hit Point maximum was reduced,
                    it returns to normal.</p>

                <p><strong>Ability Scores Restored.</strong> If any of your ability scores were reduced, they return to
                    normal.</p>

                <p><strong>Exhaustion Relief.</strong> If you have any Exhaustion levels, you remove 3 of them.</p>

                <p><strong>Special Feature.</strong> Some features are recharged by a Short Rest. If you have such a
                    feature, it recharges in the way specified in its description.</p>

                <p><strong><em>Interrupting the Rest.</em></strong> A Short Rest is stopped by the following
                    interruptions:</p>

                <ul>
                    <li>Rolling @Initiative.</li>
                    <li>Casting a spell other than a cantrip</li>
                    <li>Taking any damage</li>
                    <li>1 hour of walking or other physical exertion</li>
                </ul>

                <p>A Long Rest can be interrupted by strenuous activity, combat, travel, or other significant
                    disturbances at the Dungeon Master's discretion.</p>

                <p>You can resume a Long Rest immediately after an interruption. If you do so, the rest requires 1
                    additional hour per interruption to finish.</p>

                <hr>

                <h2>Short Rest</h2>

                <p>A Short Rest is a 1-hour period of downtime, during which a creature does nothing more strenuous than
                    reading, talking, eating, or standing watch. To start a Short Rest, you must have at least 1 Hit
                    Point. A creature can only benefit from a Short Rest twice per Long Rest.</p>

                <p><strong><em>Benefits of the Rest.</em></strong> When you finish the rest, you gain the following
                    benefits:</p>

                <p><strong><em>Healing.</em></strong> You heal a number of Hit Points Equal to half of your Hit Point
                    maximum.</p>

                <p><strong><em>Exhaustion Relief.</em></strong> If you have any Exhaustion levels, you remove 2 of them.
                </p>

                <p><strong>Special Feature.</strong> Some features are recharged by a Short Rest. If you have such a
                    feature, it recharges in the way specified in its description.</p>

                <p><strong><em>Interrupting the Rest.</em></strong> A Short Rest is stopped by the following
                    interruptions:</p>

                <ul>
                    <li>Rolling @Initiative.</li>
                    <li>Casting a spell other than a cantrip</li>
                    <li>Taking any damage</li>
                </ul>

                <p>An interrupted Short Rest confers no benefits.</p>

                <hr>

                <h2>Stable</h2>

                <p>A Stable creature at 0 hitpoints does not make @Death Saving throws, but resumes dying if they take
                    damage.</p>

                <hr>

                <h2>Cantrip</h2>

                <p>A Cantrip is a minor spell that can be cast without expending a @Spell Slot.</p>

                <p>Casting a Cantrip requires the @Magic Action and costs one action unless the spell states otherwise.
                </p>

                <p>A Cantrip's power may improve as you gain levels.</p>

                <p>Cantrips are considered spells and follow all normal rules for spells unless stated otherwise.</p>

                <hr>

                <h2>Concentration</h2>

                <p>Some spells and other effects require Concentration to remain active, as specified in their
                    descriptions. If the effect’s creator loses Concentration, the effect ends. If the effect has a
                    maximum duration, the effect’s description specifies how long the creator can concentrate on it: up
                    to 1 minute, 1 hour, or some other duration. The creator can end Concentration at any time (no
                    action required). The following factors break Concentration.</p>

                <p><strong><em>Another Concentration Effect.</em></strong> You lose Concentration on an effect the
                    moment you start casting a spell that requires Concentration or activate another effect that
                    requires Concentration.</p>

                <p><strong><em>Damage.</em></strong> If you take damage, you must succeed on a Mental Modifier saving
                    throw to maintain Concentration. The DC equals 10 or half the damage taken (round down), whichever
                    number is higher, up to a maximum DC of 30.</p>

                <p><strong><em>Incapacitated or Dead.</em></strong> Your Concentration ends if you have the
                    [[Incapacitated]] condition or you [[Dead|die]].</p>

                <hr>

                <h2>Magical Effect</h2>

                <p>A Magical Effect is any supernatural effect created by a spell, magical feature, enchanted item,
                    magical creature, or similar source.</p>

                <p>Magical Effects often create damage, healing, conditions, summoned creatures, transformations, or
                    other supernatural phenomena.</p>

                <p>A rule that refers to a Magical Effect applies regardless of whether the source is a spell, feature,
                    item, or creature ability.</p>

                <hr>

                <h2>Prepared Spell</h2>

                <p>A Prepared Spell is a spell that a character has selected and made available for casting.</p>

                <p>Many spellcasting classes prepare spells after finishing a @Long Rest.</p>

                <p>Only prepared spells can be cast unless a feature states otherwise.</p>

                <p>The number of spells a character can prepare is determined by their class.</p>

                <hr>

                <h2>Primary Spell Slot</h2>

                <p>A Primary Spell Slot represents a spellcaster's most common magical resources.</p>

                <p>Casting a spell using a Primary Spell Slot requires two actions unless a feature states otherwise.
                </p>

                <p>The level of a Primary Spell Slot depends on the caster's class and level.</p>

                <p>When a spell is cast using a Primary Spell Slot, it is automatically cast at the level of that slot
                    unless the caster chooses to cast it at a lower level.</p>

                <hr>

                <h2>Secondary Spell Slot</h2>

                <p>A Secondary Spell Slot represents a spellcaster's more powerful magical resources.</p>

                <p>Casting a spell using a Secondary Spell Slot requires two actions unless a feature states otherwise.
                </p>

                <p>The level of a Secondary Spell Slot depends on the caster's class and level.</p>

                <p>When a spell is cast using a Secondary Spell Slot, it is automatically cast at the level of that slot
                    unless the caster chooses to cast it at a lower level.</p>

                <hr>

                <h2>Tertiary Spell Slot</h2>

                <p>Tertiary Slots represent the pinnacle of your magical power. Such spells require preparation before
                    they can be unleashed.</p>

                <p>To cast a spell using a Tertiary Slot, you must first charge the spell.</p>

                <h3>Charging a Spell</h3>

                <p>As an action, choose the spell you want to cast with a Tertiary Spell slot. The spell becomes
                    charged, but no spell slot is expended yet.</p>

                <p>Charging a spell is not a subtle thing, and requires an incredible amount of control while the arcane
                    energy is formed. Because of this, it immediately drops the @Invisible condition if you have it, and
                    creatures within 100 feet are alerted via sound and sight to your actions.</p>

                <h3>Casting a Charged Spell</h3>

                <p>At the start of one of your turns while the spell remains charged, you may spend 2 actions to cast
                    it, and when the spell is cast, the Tertiary Slot is expended.</p>

                <h3>Holding Power</h3>

                <p>You can maintain a charged spell for a number of turns equal to your @Mental Modifier, with a minimum
                    of 2 turns. If you hold it for any longer the spell dissipates and you retain the spell slot.</p>

                <p>For each turn you continue holding the spell before casting it, the spell is automatically cast as
                    though using a spell slot one level higher.</p>

                <p>A spell cannot be upcast beyond the 9th level in this way.</p>

                <h3>Taking Damage</h3>

                <p>Whenever you take damage while charging a spell, you must make a Concentration Check as described
                    later in this chapter, failing this check causes the spell to fade and you must begin the process
                    again.</p>

                <hr>

                <h2>Ritual Casting</h2>

                <p>Certain spells have the Ritual tag.</p>

                <p>A spellcaster can cast a Ritual spell as a ritual if they have access to that spell and possess the
                    Ritual Casting feature.</p>

                <p>Casting a spell as a ritual does not expend a Spell Slot.</p>

                <p>Unless a feature states otherwise, casting a ritual requires 10 additional minutes beyond the spell's
                    normal casting time.</p>

                <p>A ritual spell functions normally once cast.</p>

                <hr>

                <h2>Shape-Shifting</h2>

                <p>Shape-Shifting is any effect that changes a creature's physical form.</p>

                <p>A shape-shifted creature retains its personality, memories, alignment, and other characteristics
                    unless the effect states otherwise.</p>

                <p>The specific rules governing a Shape-Shifting effect are described by the feature, spell, or ability
                    that created it.</p>

                <p>A creature with @Truesight can perceive the true form of a shape-shifted creature.</p>

                <hr>

                <h2>Spell</h2>

                <p>A Spell is a magical effect created through supernatural power, training, divine favor, primal magic,
                    or other mystical sources.</p>

                <p>Every spell includes a description explaining its effects and limitations.</p>

                <p>To cast a spell, a creature must typically expend a Spell Slot unless the spell is a @Cantrip or
                    another rule states otherwise.</p>

                <p>Spells follow the normal rules for casting, targeting, duration, range, and concentration.</p>

                <hr>

                <h2>Spell Attack</h2>

                <p>A Spell Attack is an attack made as part of casting a spell.</p>

                <p>To make a Spell Attack, roll a d20 and add your spellcasting modifier and proficiency bonus if
                    applicable.</p>

                <p>If the result equals or exceeds the target's @Armor Class, the attack hits.</p>

                <p>On a hit, the spell's effects occur as described in the spell.</p>

                <p>A Spell Attack can be melee or ranged.</p>

                <hr>

                <h2>Spell Level</h2>

                <p>A Spell Level represents a spell's relative power.</p>

                <p>Spell Levels range from 1st level to 9th level.</p>

                <p>Cantrips are not considered 1st-level spells and do not have a Spell Level.</p>

                <p>A spell's level is listed in its description.</p>

                <p>Some features interact differently with spells based on their level.</p>

                <hr>

                <h2>Spell Slot</h2>

                <p>A Spell Slot is a magical resource used to cast leveled spells.</p>

                <p>When you finish casting a spell using a Spell Slot, that slot is expended.</p>

                <p>Expended Spell Slots are restored upon completion of a Long Rest, or with certain class features.</p>

                <p>There are three categories of Spell Slot in Mordschlag:</p>

                <ul>
                    <li>@Primary Spell Slot</li>
                    <li>@Secondary Spell Slot</li>
                    <li>@Tertiary Spell Slot</li>
                </ul>

                <hr>

                <h2>Spellcasting Focus</h2>

                <p>A Spellcasting Focus is an object used to channel magical power.</p>

                <p>A creature holding an appropriate Spellcasting Focus can use it when casting spells.</p>

                <p>Different classes may use different types of Spellcasting Focus.</p>

                <p>A Spellcasting Focus can replace any material components that have no cost when a spell requires
                    them.</p>

                <p>A focus provides no benefit unless a rule specifically gives it one.</p>

                <hr>

                <h2>Upcasting</h2>

                <p>Many spells become more powerful when cast using a higher-level Spell Slot.</p>

                <p>When a spell is cast using a Spell Slot whose level exceeds the spell's minimum level, it is
                    automatically cast at the level of the slot unless the caster chooses to cast it at a lower level.
                </p>

                <p>Any improvements gained from being cast at a higher level are applied as described in the spell.</p>

                <p>For example, if a spellcaster's Primary Spell Slots are 3rd level and they cast a 1st-level spell
                    using one of those slots, the spell is normally cast as a 3rd-level spell.</p>

                <p>Some spells gain no additional benefits from being upcast. In such cases, the spell functions
                    normally.</p>

                <hr>

                <h2>Martial Feat</h2>

                <p>A Martial Feat is a special technique that can be learned by martial classes and activated during
                    play.</p>

                <p>Unless otherwise stated, activating a Martial Feat requires the expenditure of a @Feat Slot. A
                    creature knows all Feats associated with their class list, but can only prepare a limited number of
                    them to be used at any given moment.</p>

                <p>You cannot activate more than one Martial Feat on your turn. Martial Feats activated as Reactions do
                    not count toward this limit.</p>

                <hr>

                <h2>Feat Slot</h2>

                <p>A Feat Slot is a resource used to activate Martial Feats.</p>

                <p>When you activate a Martial Feat that requires a Feat Slot, you expend one available slot.</p>

                <p>You regain all expended Feat Slots when you finish a @Short Rest.</p>

                <p>The number of Feat Slots you possess is determined by your class and level.</p>

                <p>Some features allow a creature to use specific Martial Feats without expending a Feat Slot.</p>

                <hr>

                <h2>Feat Tier</h2>

                <p>Martial Feats are organized into four tiers representing increasing levels of skill and mastery.</p>

                <p>You can learn and prepare Martial Feats only from tiers you have unlocked.</p>

                <p>Higher-tier feats are generally more powerful, versatile, or specialized than lower-tier feats.</p>

                <hr>

                <h2>Area of Effect</h2>

                <p>Some features, spells, and abilities affect an area rather than a single target.</p>

                <p>An Area of Effect has a defined shape and size that determines which creatures, objects, and spaces
                    are affected.</p>

                <p>Common Area of Effect shapes include Cones, Cubes, Cylinders, Emanations, Lines, and Spheres.</p>

                <p>An area of effect has a point of origin, a location from which the effect’s energy erupts. The rules
                    for each shape specify how to position its point of origin. If all straight lines extending from the
                    point of origin to a location in the area of effect are blocked, that location isn’t included in the
                    area of effect. To block a line, an obstruction must provide @Total Cover.</p>

                <p>If the creator of an area of effect places it at an unseen point and an obstruction—such as a wall—is
                    between the creator and that point, the point of origin comes into being on the near side of the
                    obstruction.</p>

                <hr>

                <h2>Cone</h2>

                <p>A Cone is an area of effect that extends in straight lines from a point of origin in a direction its
                    creator chooses. A Cone’s width at any point along its length is equal to that point’s distance from
                    the point of origin. For example, a Cone is 15 feet wide at a point along its length that is 15 feet
                    from the point of origin. The effect that creates a Cone specifies its maximum length.</p>

                <p>A Cone’s point of origin isn’t included in the area of effect unless its creator decides otherwise.
                </p>

                <hr>

                <h2>Cube</h2>

                <p>A Cube is an area of effect that extends in straight lines from a point of origin located anywhere on
                    a face of the Cube. The effect that creates a Cube specifies its size, which is the length of each
                    side.</p>

                <p>A Cube’s point of origin isn’t included in the area of effect unless its creator decides otherwise.
                </p>

                <hr>

                <h2>Cylinder</h2>

                <p>A Cylinder is an area of effect that extends in straight lines from a point of origin located at the
                    center of the circular top or bottom of the Cylinder. The effect that creates a Cylinder specifies
                    the radius of the Cylinder’s base and the Cylinder’s height.</p>

                <p>A Cylinder’s point of origin is included in the area of effect.</p>

                <hr>

                <h2>Emanation</h2>

                <p>An Emanation is an area of effect that extends in straight lines from a creature or an object in all
                    directions. The effect that creates an Emanation specifies the distance it extends.</p>

                <p>An Emanation moves with the creature or object that is its origin unless it is an instantaneous or a
                    stationary effect.</p>

                <p>An Emanation’s origin (creature or object) isn’t included in the area of effect unless its creator
                    decides otherwise.</p>

                <hr>

                <h2>Line</h2>

                <p>A Line is an area of effect that extends from a point of origin in a straight path along its length
                    and covers an area defined by its width. The effect that creates a Line specifies its length and
                    width.</p>

                <p>A Line’s point of origin isn’t included in the area of effect unless its creator decides otherwise.
                </p>

                <hr>

                <h2>Sphere</h2>

                <p>A Sphere is an area of effect that extends in straight lines from a point of origin outward in all
                    directions. The effect that creates a Sphere specifies the distance it extends as the radius of the
                    Sphere.</p>

                <p>A Sphere’s point of origin is included in the Sphere’s area of effect.</p>
