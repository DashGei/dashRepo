                <h2>Hit Points</h2>
                <p><strong>Hit Points at 1st Level:</strong> 10 + your fighting style health bonus</p>
                <p><strong>Hit Points at Higher Levels:</strong> 5 + your fighting style health bonus per warlock level
                    after 1st</p>

                <h2>Proficiencies</h2>
                <p><strong>Armor:</strong> None</p>
                <p><strong>Weapons:</strong> Simple weapons</p>
                <p><strong>Tools:</strong> None</p>
                <p><strong>Saving Throws:</strong> Wisdom, Charisma</p>
                <p><strong>Skills:</strong> Choose two from Arcana, Deception, History, Intimidation, Investigation,
                    Nature, and Religion</p>

                <h2>Physical and Mental Modifiers</h2>
                <p>Some of your abilities will require your <strong>Mental Modifier</strong> or <strong>Physical
                        Modifier</strong>.</p>
                <p>Your <strong>Physical Modifier</strong> is your Strength or Dexterity modifier.</p>
                <p>Your <strong>Mental Modifier</strong> is your Intelligence, Wisdom, or Charisma modifier.</p>

                <h2>Fighting Style: 1</h2>
                <p><em>Your pact shapes your approach to battle.</em> You adopt a particular style of connection to your
                    Force as your specialty. Choose one of the following options. Each fighting style grants you a
                    health bonus at level 1. At level 7, your fighting style provides you with additional benefits as
                    noted in the Fighting Styles section.</p>
                <ul>
                    <li>Archery</li>
                    <li>Dueling</li>
                    <li>Skirmisher</li>
                    <li>Polearm</li>
                    <li>Thrown Weapon</li>
                    <li>Unarmed</li>
                    <li>Two-Weapon</li>
                    <li>Priest</li>
                    <li>Sage</li>
                    <li>Arcanist</li>
                    <li>Brawler</li>
                    <li>Guardian</li>
                    <li>Great Weapon</li>
                    <li>Holy Warrior</li>
                    <li>Druidic Warrior</li>
                    <li>War Mage</li>
                </ul>
                <p>The health bonus is added to your hit point maximum at 1st level and whenever you gain a level in
                    this class.</p>

                <h2>Spellcasting: 1</h2>
                <p></p>
                <p><strong>Spell Slots.</strong> The Warlock Spellcasting table (determined by your Pact Boon) shows how
                    many spell slots you have to cast your warlock spells of 1st level and higher. To cast one of these
                    spells, you must expend a slot of the spell's level or higher. You regain all expended spell slots
                    when you finish a long rest.</p>
                <p><strong>Spells Prepared.</strong> You prepare the list of warlock spells that are available for you
                    to cast. To do so, choose a number of warlock spells from your warlock spell list equal to your
                    <strong>Mental Modifier</strong> + your warlock level (minimum of one spell). The spells must be of
                    a level for which you have spell slots.</p>
                <p><strong>Spellcasting Economy.</strong> Casting a spell with a <strong>Cantrip</strong> requires one
                    action. Casting a spell with a <strong>Primary Spell Slot</strong> or <strong>Secondary Spell
                        Slot</strong> requires two actions. Casting a spell with a <strong>Tertiary Spell Slot</strong>
                    requires the charging ritual described in the core rules.</p>
                <p><strong>Spellcasting Ability.</strong> Charisma is your spellcasting ability for your warlock spells.
                    The DC for your spell saving throws equals your <strong>Mental DC</strong> (8 + your
                    <strong>Proficiency Bonus</strong> + your <strong>Mental Modifier</strong>).</p>
                <p><strong>Spellcasting Focus.</strong> You can use an arcane focus as a <strong>spellcasting
                        focus</strong> for your warlock spells.</p>

                <h2>Pact Boon: 1</h2>
                <p><em>You strike a bargain with an otherworldly force that grants you power on your own terms.</em> You
                    choose the nature of your pact, which determines the fundamental expression of your warlock
                    abilities.</p>

                <h3>Mystic Boon</h3>
                <p><strong>Cantrips.</strong> You know two cantrips of your choice from the warlock spell list.</p>
                <p><strong>Proficiencies.</strong> You gain proficiency in light armor, medium armor, shields, and
                    martial weapons.</p>
                <p><strong>Spellcasting.</strong> You use the Mystic Spell Slot Progression table. You prepare spells as
                    a mystic, drawing from the warlock spell list.</p>
                <p><strong>Mystic Invocations.</strong> You can spend <strong>Invocation Charges</strong> to activate
                    martial feats. When you learn an invocation (see the Invocations feature), you choose from the
                    martial feat list (Fighter only) rather than the invocation lists below. You must meet any tier
                    requirements as normal.</p>

                <h2>Invocations: 2</h2>
                <p><em>You learn invocations that customize your warlock abilities.</em> You learn additional
                    invocations at higher levels, as shown in the Invocations Known table.</p>
                <p><strong>Invocations Known.</strong> You learn 2 invocations of your choice at 2nd level. The
                    Invocations Known column shows when you learn more invocations. At 7th, 11th, and 17th level, you
                    gain two more invocations.</p>
                <p>When you gain a level in this class, you can replace one invocation you know with another invocation
                    of your choice.</p>
                <p><strong>Using Invocations.</strong> Invocations are divided into three categories:</p>
                <ul>
                    <li>Meta-Magic Invocations</strong> (Sorcerer Boon only) modify your spells and require
                        spending <strong>Invocation Charges</strong>.</li>
                    <li>Mystic Invocations</strong> (Mystic Boon only) are martial feats. You may select any
                        martial feat for which you meet the tier requirement. Using them requires spending
                        <strong>Invocation Charges</strong> as normal for martial feats.</li>
                    <li>Eldritch Invocations</strong> are available to both pacts and provide passive benefits
                        or new capabilities. Some Eldritch Invocations require spending <strong>Invocation
                            Charges</strong>.</li>
                </ul>
                <p><strong>Invocation Charges.</strong> You can store invocative energy channeled through your
                    spellcasting. This energy is represented by <strong>Invocation Charges</strong>.</p>
                <p><strong>Gaining Charges.</strong> When you cast a spell using a spell slot, you gain
                    <strong>Invocation Charges</strong>:</p>
                <ul>
                    <li>Casting a spell with a <strong>Primary Spell Slot</strong> grants you 1 <strong>Invocation
                            Charge</strong>.</li>
                    <li>Casting a spell with a <strong>Secondary Spell Slot</strong> grants you 2 <strong>Invocation
                            Charges</strong>.</li>
                    <li>Casting a spell with a <strong>Tertiary Spell Slot</strong> grants you 3 <strong>Invocation
                            Charges</strong>.</li>
                </ul>
                <p>You gain these charges after resolving the spell's effects.</p>
                <p><strong>Maximum Charges.</strong> You can hold a maximum number of <strong>Invocation
                        Charges</strong> equal to your <strong>Mental Modifier</strong> (minimum 1). Any charges gained
                    beyond this maximum are lost.</p>
                <p><strong>Losing Charges.</strong> Your <strong>Invocation Charges</strong> fade when you finish a
                    short or long rest.</p>

                <h2>Meta-Magic Invocations</h2>
                <p><em>Sorcerer Boon only.</em></p>
                <ul>
                    <li>Distant Spell.</strong> When you cast a spell that has a range of 5 feet or greater, you
                        can spend 1 <strong>Invocation Charge</strong> to double the range. When you cast a spell that
                        has a range of touch, you can spend 1 <strong>Invocation Charge</strong> to make the range 30
                        feet.</li>
                    <li>Empowered Spell.</strong> When you roll damage for a spell, you can spend 1
                        <strong>Invocation Charge</strong> to reroll a number of the damage dice up to your
                        <strong>Mental Modifier</strong> (minimum of one). You must use the new rolls.</li>
                    <li>Extended Spell.</strong> When you cast a spell that has a duration of 1 minute or
                        longer, you can spend 1 <strong>Invocation Charge</strong> to double the duration, up to a
                        maximum duration of 24 hours.</li>
                    <li>Heightened Spell.</strong> When you cast a spell that forces a creature to make a saving
                        throw, you can spend 3 <strong>Invocation Charges</strong> to give one target of the spell
                        disadvantage on its first saving throw against the spell.</li>
                    <li>Quickened Spell.</strong> When you cast a spell with a <strong>Primary Spell
                            Slot</strong>, you can spend 2 <strong>Invocation Charges</strong> to change the casting
                        time to 1 action for this casting.</li>
                    <li>Sculpt Spells.</strong> When you cast a spell that affects an area, you can spend 2
                        <strong>Invocation Charges</strong> to choose a number of creatures equal to your <strong>Mental
                            Modifier</strong> in that area. Those creatures automatically succeed on their saving throws
                        against the spell and take no damage if they would normally take half damage on a successful
                        save.</li>
                    <li>Seeking Spell.</strong> When you cast a spell that requires an attack roll and you miss
                        with that attack, you can spend 2 <strong>Invocation Charges</strong> to reroll the attack roll.
                        You must use the new roll.</li>
                    <li>Subtle Spell.</strong> When you cast a spell, you can spend 1 <strong>Invocation
                            Charge</strong> to cast it without any somatic or verbal components.</li>
                    <li>Transmuted Spell.</strong> When you cast a spell that deals acid, cold, fire, lightning,
                        or thunder damage, you can spend 1 <strong>Invocation Charge</strong> to change the damage type
                        to another type from that list.</li>
                    <li>Twinned Spell.</strong> When you cast a spell that targets only one creature and doesn't
                        have a range of self, you can spend <strong>Invocation Charges</strong> equal to the slot tier
                        (1, 2, or 3) to target a second creature in range with the same spell.</li>
                </ul>

                <h2>Eldritch Invocations</h2>
                <ul>
                    <li>Agonizing Blasts.</strong> When you cast a cantrip, add the number of <strong>Invocation
                            Charges</strong> you are holding to the damage it deals on a hit. This does not spend the
                        charges.</li>
                    <li>Beguiling Influence.</strong> You gain proficiency in a skill.</li>
                    <li>Devil's Sight.</strong> You can see normally in darkness, both magical and nonmagical,
                        to a distance of 120 feet.</li>
                    <li>Eldritch Mind.</strong> You can spend a <strong>Primary Spell Slot</strong> to have
                        advantage on saving throws to maintain concentration on spells.</li>
                    <li>Eyes of the Rune Keeper.</strong> You can read all writing.</li>
                    <li>Mythril Strikes.</strong> When you make a weapon attack, it can be your choice of the
                        weapon's damage type or <strong>force</strong> damage.</li>
                    <li>One with Shadows.</strong> When you are in an area of dim light or darkness, you can
                        spend 1 <strong>Invocation Charge</strong> to become invisible until you move, take an action,
                        or take damage.</li>
                    <li>Otherworldly Movement.</strong> Your speed increases by 5 feet.</li>
                    <li>Precarious Intervention.</strong> You gain resistance to one type of damage while below
                        half health. You choose this damage type when you gain this feature.</li>
                    <li>Repel.</strong> When you hit a creature with a cantrip, you can push the creature up to
                        10 feet away from you in a straight line.</li>
                    <li>Sign of the Shield.</strong> For every <strong>Invocation Charge</strong> you would gain
                        over your maximum, you gain a +1 bonus to your AC until the beginning of your next turn.</li>
                    <li>Skinmold.</strong> Your maximum hit points increase by your <strong>Proficiency
                            Bonus</strong>.</li>
                </ul>

                <h2>Otherworldly Force: 3</h2>
                <p>You choose an Otherworldly Force that grants you
                    features at 3rd level, and then again at 6th, 10th, 14th, and 20th level.</p>

                <h2>Tertiary Slots: 3</h2>
                <p><em>Sorcerer Boon only.</em></p>
                <p>You gain access to <strong>tertiary spell slots</strong>. To cast your most powerful spells, those
                    which require a <strong>Tertiary Spell Slot</strong>, you must spend an action on your turn to
                    charge the spell. At the start of your next turn, you may spend two actions to cast the spell and
                    expend the spell slot. Any time you take damage until you cast the spell, you must make a
                    concentration check. You may hold the spell for a number of turns equal to your <strong>Mental
                        Modifier</strong>, and each turn you hold the spell, you upcast it by one level.</p>

                <h2>Ability Score Improvement</h2>
                <p>At 4th, 8th, 12th, 16th, and 19th level, you can increase one ability score of your choice by 1. You
                    can't increase an ability score above 5 using this feature.</p>

                <h2>Versatile Fatigue Resistance: 5</h2>
                <p> Choose one of the following options:
                </p>
                <ul>
                    <li>Taking the <strong>Attack action</strong> does not inflict you with the
                        <strong>fatigued</strong> condition.</li>
                    <li>Taking the <strong>Magic action</strong> does not inflict you with the <strong>fatigued</strong>
                        condition.</li>
                </ul>
            </div>
        </div>
