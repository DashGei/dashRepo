                <h1>The Divine</h1>
                <h3>Level 3: Sacred Weapon</h3>
                <p>When you take the Attack action, you can use Channel Divinity to imbue one Melee
                    weapon that you are holding with positive energy. For 10 minutes or until you use this feature
                    again, you add your mental modifier to attack rolls you make with that weapon (minimum bonus of
                    +1), and each time you hit with it, you cause it to deal its normal damage type or Radiant damage.
                <p>The weapon also emits Bright Light in a 20-foot radius and Dim Light 20 feet beyond that.

                    You can end this effect early (no action required). This effect also ends if you aren’t carrying the
                    weapon.</p>
                </p>
                <h3>Level 3: Subclass Spells</h3>
                <p>When you reach a level specified in the Subclass Spells table, you thereafter always have
                    the listed spells prepared.</p>

                <h3>Level 7: Aura of Devotion</h3>
                <p>You and your allies have Immunity to the Charmed condition while in your Aura of Protection. If a
                    Charmed ally enters the aura, that condition has no effect on that ally while there.</p>
                <h3>Level 14: Smite of Protection</h3>
                <p>Your magical smite now radiates protective energy. Whenever you uise Divine Smite, you and your
                    allies have Half Cover while in your Aura of Protection. The aura has this benefit until the start
                    of your next turn.</p>
                <h3>Level 20: Holy Nimbus</h3>
                <p>As an Action, you can imbue your Aura of Protection with holy power, granting the benefits below
                    for 10 minutes or until you end them (no action required). Once you use this feature, you can’t use
                    it again until you finish a Long Rest. You can also restore your use of it by expending a Secondary
                    spell slot (no action required).</p><p>

                    Holy Ward. You have Advantage on any saving throw you are forced to make by a Fiend or an Undead.</p><p>

                    Radiant Damage. Whenever an enemy starts its turn in the aura, that creature takes Radiant damage
                    equal to your Mental modifier plus your Proficiency Bonus.</p><p>

                    Sunlight. The aura is filled with Bright Light that is sunlight.</p>


                <h1>The Tempest</h1>

                <h3>Level 3: Storm Smites</h3>
                <ul>
                    <li>
                        <p>Freezing Smites</p>
                        All radiant damage you deal via spells or features is instead dealt as cold damage. At level 9
                        you gain access to the Sleet Storm spell
                    </li>
                    <li>
                        <p>Shocking Smites</p> All radiant damage you deal via spells or features is instead dealt as
                        lightning damage. At level 9 you gain access to the Call Lightning spell
                    </li>
                    <li>
                        <p>Tempestuous Smites</p> All radiant damage you deal with spells is instead thunder damage. At
                        level 9 you gain access to the Cacophonic Shield spell
                    </li>
                </ul>

                <h3>Level 3: Channel Divinity - Storm Sentinel</h3>
                <p>With two actions, you unleash the fury of the storm. Up to 4 creatures of your choice within the area
                    of one of your Oath spells must make a Mental DC Dexterity saving throw. On a failed save, a
                    creature takes
                    2d8 damage and has its movement speed reduced by 20 feet until the end of your next turn. On a
                    successful save, a creature takes half damage and suffers no other effects. The damage type is the
                    same as your Storm Smite feature. If you choose to drop concentration on an oath spell you may also
                    use this feature as a reaction.</p>
                <p>

                    The dice count for this ability increases to 3d8 at level 7, 4d8 at level 11, 5d8 at level 15</p>
                <h3>Level 3: Subclass Spells</h3>
                <p>When you reach a level specified in the Subclass Spells table, you thereafter always have
                    the listed spells prepared. At level 9 you gain Wind Wall and one additional spell based on your
                    Storm Smites feature</p>

                <h3>Level 17:</h3>
                <p>A protective wall of wind and cloud surrounds you, filling the same area as your Aura of Zeal.
                    This wind is variable and can be tamed to a light breeze
                    at will, can be made into a light mist or flurries, can create mild charges, and can sound low
                    thunder.</p>
                <p>

                    The wind protects you and friendly creatures from the negative effects of your oath spells, magical
                    weather, natural weather, strong currents, and ambient flames.</p>
                <h3>Level 14: </h3>
                <p>Once per long rest when you cast one of your concentration based oath spells the last spell you were
                    concentrating on doesn't disappear until the start of your next turn.</p>
                <h3>Level 20: </h3>
                <p>As an Action, storms build around you, For one minute, or until you end this ability with an action
                    you gain the following benefits.</p>
                <p>

                    You may use this feature once per long rest, or regain another use with a Secondary spell slot (No
                    action required)</p>
                <p>



                    When you strike an enemy with an attack, you may choose up to 3 other creatures within 10 feet of
                    the target to take storm smite damage equal to half the amount the target took.</p>
                <p>

                    While within the radius of one of your oath spells you fade into the storm, your speed increases by
                    10 feet and you do not provoke opportunity attacks. You may also cast thunder step as an action
                    without a spell slot, the damage is the same as your storm smite feature.</p>
