                <h1>Domain of Light</h1>
                <h3>Level 3: Radiance of the Dawn</h3>
                <p>As a two-action Magic action, you present your Holy Symbol and expend a Secondary slot to emit a
                    flash of light in a 30-foot Emanation originating from yourself. Any magical Darkness—such as that
                    created by the Darkness spell—in that area is dispelled. Additionally, each creature of your choice
                    in that area must make a Constitution saving throw, taking Radiant damage equal to PB x 1d6 plus
                    your
                    Cleric level on a failed save or half as much damage on a successful one.</p>

                <p></p>

                <h3>Level 6: Warding Flare</h3>
                <p>When a creature that you can see within 30 feet of yourself makes an attack roll, you can take a
                    Reaction to impose Disadvantage on the attack roll, causing light to flare before it hits or misses.

                    You can use this feature a number of times equal to your mental modifier (minimum of once). You
                    regain all expended uses when you finish a Long Rest.</p>

                <h3>Level 14: Improved Warding Flare</h3>
                <p>You regain all expended uses of your Warding Flare when you finish a Short or Long Rest.

                    In addition, whenever you use Warding Flare, you can give the target of the triggering attack a
                    number of Temporary Hit Points equal to 2d6 plus your Mental modifier.</p>
                <h3>Level 20: Corona of Light</h3>
                <p>As a Magic action, you cause yourself to emit an aura of sunlight that lasts for 1 minute or until
                    you dismiss it (no action required). You emit Bright Light in a 60-foot radius and Dim Light for an
                    additional 30 feet. Your enemies in the Bright Light have Disadvantage on saving throws against your
                    Radiance of the Dawn and any spell that deals Fire or Radiant damage.

                    You can use this feature a number of times equal to your Mental modifier (minimum of once), and you
                    regain all expended uses when you finish a Long Rest.</p>

                <h1>Grave Domain</h1>
                <h3>Level 3: Circle of Mortality</h3>
                <p>Pull of Death. Once per turn, when you deal damage to a creature that’s missing any Hit Points by
                    casting a spell or by hitting with an attack roll, that creature takes an extra 1d4 Necrotic damage.
                    This extra damage increases to 1d10 when you reach Cleric level 11.</p>

                <p>Additionally, when you would normally roll one or more dice to restore Hit Points to a creature at 0
                    Hit Points with a spell or Channel Divinity, don’t roll those dice for the healing; instead, use the
                    highest number possible for each die. For example, instead of restoring 2d4 Hit Points to a creature
                    at 0 Hit Points with a spell, you restore 8.</p>

                <h3>Level 6: Path to the Grave</h3>
                <p>As an Action, you present your Holy Symbol and expend a Secondary slot to curse one
                    creature you can see within 30 feet of yourself until the start of your next turn. While cursed, the
                    creature has Disadvantage on attack rolls and saving throws.

                    When you or an ally you can see hits the cursed target with an attack roll, you can end the curse
                    early (no action required) to make the attack deal extra Necrotic or Radiant damage (your choice)
                    equal to your Cleric level.</p>

                <h3>Level 14: Sentinel at Death’s Door</h3>
                <p>When you or a Bloodied creature you can see within 60 feet of yourself is hit with an attack roll,
                    you
                    can take a Reaction to halve that attack’s damage (round down). If the triggering attack roll was a
                    Critical Hit, any effects triggered by a Critical Hit are canceled. </p>
                <p>You can use this feature a
                    number of times equal to your Mental modifier (minimum of once). You regain all expended uses when
                    you finish a Long Rest.</p>
                <h3>Level 20: Divine Reaper</h3>
                <p>Your deep connection to this domain renders you a hallowed harbinger of death, granting you the
                    following benefits.</p>
                <p>

                    Enhanced Necromancy. When you cast a spell of level 5 or lower from the Necromancy school that
                    targets one creature, or when you cast a spell from the Grave Domain Spells table, you can expend a
                    Secondary slot to target a second creature within the spell’s range. If the spell requires
                    costly or consumed Material components, you must provide Material components for each target.</p>
                <p>Keeper of Souls. When an enemy dies within 60 feet of you, you or one creature you can see within 60
                    feet of yourself regains Hit Points equal to twice your Cleric level. You can’t use this feature if
                    you have the Incapacitated condition. Once you use this feature, you can’t use it again until you
                    finish a Short or Long Rest, unless you expend a level 6+ spell slot (no action required) to restore
                    your use of it.</p>

                <h1>Trickery Domain</h1>
                <h3>Level 3: Blessing of the Trickster</h3>
                <p>When you take this subclass, you gain proficiency in Stealth, if you already had proficiency, you
                    gain expertise.</p>

                <h3>Level 6: Invoke Duplicity</h3>
                <p>As an Action, you can expend one Secondary slot to create a perfect visual
                    illusion of yourself in an unoccupied space you can see within 30 feet of yourself. The illusion is
                    intangible and doesn’t occupy its space. It lasts for 1 minute, but it ends early if you dismiss it
                    (no action required) or have the Incapacitated condition. The illusion is animated and mimics your
                    expressions and gestures. While it persists, you gain the following benefits.
                <p>Cast Spells. You can cast spells as though you were in the illusion’s space, but you must use your
                    own senses.</p>
                <p>Distract. When both you and your illusion are within 5 feet of a creature that can see the illusion,
                    you have Advantage on attack rolls against that creature, given how distracting the illusion is to
                    the target.</p>
                <p>Move. As an Action, you can move the illusion up to 30 feet to an unoccupied space you can see
                    that is within 120 feet of yourself.</p>

                <h3>Level 14: Trickster’s Transposition</h3>
                <p>Whenever you take the Action to create or move the illusion of your Invoke Duplicity, you can
                    teleport, swapping places with the illusion.</p>
                <h3>Level 20: Improved Duplicity</h3>
                <p>Shared Distraction. When you and your allies make attack rolls against a creature within 5 feet of
                    the illusion, the attack rolls have Advantage.</p>
                <p>Healing Illusion. When the illusion ends, you or a creature of your choice within 5 feet of it
                    regains a number of Hit Points equal to your Cleric level.</p>
