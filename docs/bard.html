                <h2>Physical and Mental Modifiers: 1</h2>
                <p>Some of your abilities will require your Mental or Physical Modifier.</p>
                <p>Your Physical Modifier is your Strength or Dexterity Modifier.</p>
                <p>Your Mental Modifier is your Intelligence, Wisdom, or Charisma Modifier.</p>


                <h2>Fighting Style: 1</h2>
                <p><em>Your combat training defines your approach to battle.</em> You adopt a particular style of
                    fighting as your specialty. Choose one of the following options. Each fighting style grants you a
                    bonus at level 1; you must be wielding one of your fighting style’s respective items to gain this
                    benefit. At level 7, your fighting style provides you with a <strong>Martial Feat</strong>. This
                    feat does not count against your Feats Prepared, and it does not require a <strong>Feat
                        Slot</strong> when you use it. You must be wielding one of your fighting style’s respective
                    items to use this feature, but you can use this feat regardless of your class.</p>
                <ul>
                    <li>Archery</li>
                    <li>Dueling</li>
                    <li>Skirmisher</li>
                    <li>Thrown Weapon</li>
                    <li>Unarmed</li>
                    <li>Two-Weapon</li>
                    <li>Priest</li>
                    <li>Sage</li>
                    <li>Arcanist</li>
                    <li>Arcane Warrior</li>
                </ul>
                <p>The health bonus is added to your hit point maximum at 1st level and whenever you gain a level in
                    this class.</p>

                <h2>Hit Points</h2>
                <p><strong>Hit Points at 1st Level:</strong> 10 + your fighting style health bonus</p>
                <p><strong>Hit Points at Higher Levels:</strong> 5 + your fighting style health bonus per Busker level
                    after 1st</p>

                <h2>Proficiencies</h2>
                <p><strong>Armor:</strong> Light armor</p>
                <p><strong>Weapons:</strong> Simple weapons, hand crossbows, light crossbows, scimitars, rapiers,
                    shortswords</p>
                <p><strong>Tools:</strong> Any 3 instruments or artisan's tools</p>
                <p><strong>Saving Throws:</strong> Dexterity, Charisma</p>
                <p><strong>Skills:</strong> Choose any three skills.</p>

                <h2>Rites Passed Down: 1</h2>
                <p>You have the ability to cast any spell as a ritual as long you can cast that spell with a Primary
                    Slot and you spend 1 gold worth of components on the ritual for each level of the spell. For example
                    at level 9 you may cast <em>Invisibility</em>

                    as a ritual if you spend 10 minutes and 2 gold of components.</p>

                <h2>Aura of Spontaneity:1</h2>
                <p>At level 1 you emenate a colorful display of personal flair which you can apparate or dismiss at
                    any
                    time. The aura fills a 15 foot sphere around you and start of your turn you can fill the
                    aura with an effect from one of your <strong>magical stories</strong> until the start of your next
                    turn, at which point you must choose a different magical story.</p>

                <h2>Spellcasting: 2</h2>
                <p>You have learned to weave music, words, and magic into a single art.</p>
                <p><strong>Cantrips</strong> You know two cantrips of your choice from the Busker
                    spell list. You learn one additional Busker cantrip of your choice at 4th, 8th,
                    12th, and 16th level</p>
                <p><strong>Spell Slots.</strong> The Busker Spellcasting table shows how many spell
                    slots you have to cast your Busker spells. You regain all expended spell slots
                    when you finish a long rest. Casting a spell with a Primary Spell Slot requires
                    one action; casting a spell with a Secondary Slot requires two actions.</p>
                <p><strong>Spellcasting Economy.</strong> Casting a spell with a Cantrip requires
                    one action. Casting a spell with a Primary or Secondary Spell Slot requires two
                    actions.</p>
                <p><strong>Spells Known.</strong> You know four Busker spells of your choice from the
                    Busker spell list. The Spells Known column of the Busker Spellcasting table shows
                    when you learn more Busker spells. Each of these spells must be of a level for
                    which you have spell slots.</p>
                <p>Whenever you gain a level in this class, you can replace one Busker spell you know
                    with another spell of your choice from the Busker spell list. The new spell must
                    be of a level for which you have spell slots.</p>
                <p><strong>Mental Modifier.</strong> Your Mental Modifier (Intelligence, Wisdom, or
                    Charisma, chosen at character creation) is your spellcasting ability for your
                    Busker spells. The DC for your spell saving throws equals your Mental DC (8 + your
                    proficiency bonus + your Mental Modifier).</p>

                <h2>Expertise: 2</h2>
                <p>Choose two of your skill proficiencies. You gain expertise in that skill.</p>

                <h2>Busker College: 3</h2>
                <p>At 3rd level, you choose a Busker College that shapes your artistic identity. Your
                    choice grants you features at 3rd level, and then again at 6th, 14th, and 20th
                    level.</p>

                <h2>Magical Secrets: 3</h2>
                <p>You have gathered magical knowledge from many disciplines. At 3rd level, you learn two 1st-level
                    spells of your choice from any class spell list. They become Bard spells for you, but they do not
                    count against your total number of Spells Known, and you can't replace these spells when you gain a
                    Bard level.

                    You learn two additional Magical Secrets of certain
                    spell levels at 5th level (2nd-level spells), at 9th level
                    (3rd-level spells), at 13th level (4th-level spells), and
                    finally at 17th level (5th-level spells) </p>

                <h2>Ability Score Improvement</h2>
                <p>At 4th, 8th, 12th, 16th, and 19th level, you can increase an ability score by
                    1</p>

                <h2>Versatile Fatigue Resistance: 5</h2>
                <p>When you reach 5th level in this class choose one of the following options.</p>
                <ul>
                    <li>When taking the attack action you do not suffer any penalties from the
                        fatigued condition.</li>
                    <li>When taking the magic action you do not suffer any penalties from the
                        fatigued condition.</li>
                </ul>

                <h2>Transmogrification: 7</h2>
                <p>You gain the ability to change the shape of your aura as an action. When you do so you can change the
                    shape into a 20 foot cone, a 35 foot long 10 foot wide line, or back to the 15 foot radius</p>



                <h2>Expertise: 10</h2>
                <p>Choose two of your skill proficiencies. You gain expertise in that skill.</p>

                <h2>Versatile Fatigue Resistance: 15</h2>
                <p>When you reach 15th level in this class you gain whichever fatigue resistance you
                    did not choose at level 5.</p>
