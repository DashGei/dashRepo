                <h1>College of the Fortune Teller</h1>
                <h3>Level 3: Deck of Many</h3>
                <p>At level 3 you can spend a short or long rest enscribing a deck of cards with magical glyphs, turning
                    it into a spellcasting focus for you. When holding this deck you can take an action to 1d12 and draw
                    a corrosponding fortune card from the table below. As an action you can target a creature within
                    your Aura of Spontaneity, at the end of that creatures next turn they must make a Mental DC Charisma
                    save or suffer the effects of the card, a creature can choose to ignore this save and be effected
                    anyway. If you draw a card while one is already held, the previous
                    card disapears back into the deck.</p>
                <p> A burned card dissapears from the deck until completion of a long rest, unless you expend a
                    primary spell slot when you burn the card. </p>

                <h3>Level 7: Major Arcana</h3>
                <p>During the completion of a long rest, you may choose to overwrite any of your cards with a spell. The
                    spell must be of lower level than your secondary spell slots, must have a casting time of standard,
                    you may only overwrite one card per spell, and you may only overwrite a number of cards equal to
                    your proficiency bonus. When you take the action to burn the card, you immediately cast the spell
                    without expending a spell slot.
                </p>
                <h3>Level 14: Unbeguiled</h3>
                <p>You gain proficiency in Wisdom saving throws</p>
                <h3>Level 20: Fate Weaving</h3>
                <p>Once per long rest you can burn all the cards in your deck and change the life course of a creature
                    within
                    30 feet. The creature must succeed a Mental DC Wisdom save or undergo a great (but possible) task of
                    your choosing or die in a way of
                    your choosing within 7 days. The DM decides if the task is reasonable, tasks may include saving
                    mortals, great charity, or giving up a throne. This effect is nullified by the Greater Restoration,
                    Wish, or level 5 Remove Curse spells. </p>

                <h1>College of the Troubador</h1>
                <h3>Level 3: Crowd Pleaser</h3>
                <p>When you roll for a Performance check, you treat a roll of 10 or lower as an 11 on the d20.
                    Additionally, when you finish a short rest you can inspire two creatures who took the short rest
                    with you. Those creatures gain a d6 die which they may add to any d20 roll until their or your next
                    long rest. They must be able to see or hear you to use the die</p>

                <h3>Level 7: Call and Response</h3>
                <p>You can cast the spell <em>Command</em> as one action as long as it is cast as a first level spell.
                </p>

                <h3>Level 14: Universally Loved</h3>
                <p>Creatures within your Aura of Sponteneity have disadvantage on attack rolls against you if they are
                    not immune to the Charmed condition.</p>

                <h3>Level 20: Words of Creation</h3>
                <p>Once per day you can cast the spell Power Word Heal or Power Word Kill without spending a spell slot.
                    When you cast
                    either spell, you can target a second creature with it if that creature is within 10 feet of the
                    first target.</p>

                <h1>College of the Crossroads</h1>

                <h3>Level 3: I Sold My Soul For Rock And Roll</h3>

                <p>When you choose this subclass you gain proficiency in battle axes, great axes, and medium armor. If
                    you already had proficiency in
                    medium armor you gain proficiency in Heavy armor.</p>
                <p>Additionally, you can treat any large enough instrument as a battle axe or great axe.</p>

                <h3>Level 3: Electric Eye</h3>
                <p>When you deal Thunder damage to an enemy you gain temporary hitpoints equal to the damage dealt up to
                    twice your level.</p>
                <p>Additionally when you use Tale of Power or Epic of Fear the damage type becomes Thunder Damage.</p>

                <p>When you hit a creature with a melee attack you may expend any number of temporary hitpoints to add
                    the same amount of lightning damage to that attack's damage roll</p>
                <h3>Level 14: Heavy Stuff</h3>
                <p>You gain resistance to Thunder and Necrotic damage.</p>

                <h1>College of the Fugue</h1>
                <h3>Level 3: Ghostly Choir</h3>
                <p>When you finish a long rest, a number of spirits up to your proficiency bonus join you.
                </p>
                <p>When a creature within your aura regains hitpoints, you can dismiss a spirit and add an additional
                    1d8 healing to that roll. You can also dismiss a spirit when a creature within 60 feet of you makes
                    an ability check, that creature then adds 1d6 to their roll.</p>
