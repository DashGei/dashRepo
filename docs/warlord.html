                <h2>Physical and Mental Modifiers</h2>
                <p>Some of your abilities will require your <strong>Mental Modifier</strong> or <strong>Physical
                        Modifier</strong>.</p>
                <p>Your <strong>Physical Modifier</strong> is your Strength or Dexterity modifier.</p>
                <p>Your <strong>Mental Modifier</strong> is your Intelligence, Wisdom, or Charisma modifier.</p>

                <h2>Fighting Style: 1</h2>
                <p><em>Your combat training defines your approach to battle.</em> You adopt a particular style of
                    fighting as your specialty. Choose one of the following options. Each fighting style grants you a
                    bonus at level 1; you must be wielding one of your fighting style's respective items to gain this
                    benefit. At level 7, your fighting style provides you with a <strong>Martial Feat</strong>. This
                    feat does not count against your Feats Prepared, and it does not require a <strong>Feat
                        Slot</strong> when you use it. You must be wielding one of your fighting style's respective
                    items to use this feature, but you can use this feat regardless of your class.</p>
                <ul>
                    <li>Archery</li>
                    <li>Dueling</li>
                    <li>Skirmisher</li>
                    <li>Polearm</li>
                    <li>Thrown Weapon</li>
                    <li>Unarmed</li>
                    <li>Two-Weapon</li>
                    <li>Priest</li>
                    <li>Sage</li>
                    <li>Arcanist</li>
                    <li>Brawler</li>
                    <li>Guardian</li>
                    <li>Great Weapon</li>
                </ul>
                <p>The health bonus is added to your hit point maximum at 1st level and whenever you gain a level in
                    this class.</p>

                <h2>Hit Points</h2>
                <p><strong>Hit Points at 1st Level:</strong> 10 + your fighting style health bonus</p>
                <p><strong>Hit Points at Higher Levels:</strong> 5 + your fighting style health bonus per warlord level
                    after 1st</p>

                <h2>Proficiencies</h2>
                <p><strong>Armor:</strong> Light armor, medium armor, shields</p>
                <p><strong>Weapons:</strong> Simple weapons, martial weapons</p>
                <p><strong>Tools:</strong> None</p>
                <p><strong>Saving Throws:</strong> Wisdom, Charisma</p>
                <p><strong>Skills:</strong> Choose three from Athletics, Deception, History, Insight, Intimidation,
                    Investigation, Medicine, Performance, and Persuasion</p>





                <h2>Leadership Dice: 1</h2>
                <p><em>Your words inspire your allies to greater feats.</em> You possess <strong>Leadership
                        Dice</strong>, which represent your tactical advantage in combat. These dice start as d6s, and
                    increase in size as shown in the Warlord Features table. You can hold a maximum number of
                    <strong>Leadership Dice</strong> equal to your <strong>Proficiency Bonus</strong>, and any unused
                    dice are lost when you finish a short or long rest.
                </p>
                <p>When a creature within 30 feet of you hits a target with an attack roll, you can spend one
                    <strong>Leadership Die</strong> and add it to their damage roll.
                </p>

                <h2>Tactical Orders: 1</h2>
                <p><em>Your commands turn the tide of battle.</em> As an <strong>action</strong>, you issue a Tactical
                    Order to a creature within 60 feet that can see or hear you. The order lasts until the start of your
                    next turn, and when its trigger occurs you gain one <strong>Leadership Die</strong>.</p>

                <h3>Reposition</h3>
                <p>The target gains the benefits of the <strong>Disengage</strong> action.</p>
                <p><em>Trigger:</em> The target moves at least 10 feet.</p>

                <h3>Opportunistic Positioning</h3>
                <p>The target gains an additional <strong>reaction</strong>.</p>
                <p><em>Trigger:</em> The target uses a reaction.</p>

                <h3>Brace</h3>
                <p>The target gains a bonus to two saving throws equal to your <strong>Mental Modifier</strong>. The
                    saving throws chosen are those tied to your <strong>Physical Modifier</strong> and <strong>Mental
                        Modifier</strong>.</p>
                <p><em>Trigger:</em> The target succeeds on any saving throw.</p>

                <h3>Hold the Line</h3>
                <p>The target gains the benefits of the <strong>Dodge</strong> action.</p>
                <p><em>Trigger:</em> An attack misses the target or they succeed on a Dexterity saving throw.</p>

                <h2>Advanced Maneuvers: 2</h2>
                <p><em>You know how to push every advantage.</em> As an <strong>action</strong>, you can declare an
                    Advanced Maneuver for a creature within 60 feet that can see or hear you. Expend one
                    <strong>Leadership Die</strong>; that creature gains one of the following benefits and regains hit
                    points equal to one roll of your <strong>Leadership Dice</strong>.
                </p>

                <h3>Directed Strike</h3>
                <p>Once on their next turn, the target can take the <strong>Attack action</strong> as a free action.</p>

                <h3>Martial Prowess</h3>
                <p>Until the end of their next turn, the target has access to all <strong>Martial Feats</strong> that
                    you know.</p>

                <h3>Hold the Line</h3>
                <p>The target can immediately move up to half its speed. When the target starts its next turn, one ally
                    within 5 feet regains the same amount of hit points as the target did from this Advanced Maneuver's
                    healing.</p>

                <h3>Helpful Words</h3>
                <p>The creature gains the benefit of the <strong>Help</strong> action.</p>

                <h2>Martial Feats: 2</h2>
                <p>You have trained in special techniques that give you an edge in combat and beyond. You gain access to
                    martial feats, as described in the <strong>Martial Feats</strong> section. You may only use one
                    <strong>Feat Slot</strong> per turn.
                </p>
                <p><strong>Feat Slots.</strong> You have 2 <strong>Feat Slots</strong>, which you expend to
                    activate your feats. You regain all expended slots when you finish a short rest. Your number of
                    <strong>Feat Slots</strong> increases as you gain levels, as shown in the Feats Progression
                    table.
                </p>
                <p><strong>Feats Prepared.</strong> You prepare 2 martial feats of your choice from your feat list. The
                    Feats Prepared column of the Feats Progression table shows when you learn more feats. Additionally,
                    when you gain a level in this class, you can replace one feat you have prepared with another feat of
                    your choice from your class feat list.</p>
                <p><strong>Feat Tier.</strong> You can learn feats of Tier 1 at level 2. At higher levels you gain
                    access to higher tiers, as shown in the table.</p>

                <h2>Warlord's Expertise: 3</h2>
                <p>Choose one of your skill proficiencies. You gain expertise in that skill.</p>

                <h2>Warlord Presence: 3</h2>
                <p><em>At 3rd level, you choose a <a href="sc_warlord.html">Warlord Presence</a> that emulates your
                        approach
                        to leadership.</em> Your choice grants you features at 3rd level, and then again at 7th, 14th,
                    and 20th
                    level.</p>

                <h2>Ability Score Improvement</h2>
                <p>At 4th, 8th, 12th, 16th, and 19th level, you can increase one ability score of your choice by 1. You
                    can't increase an ability score above 5 using this feature.</p>

                <h2>Martial Fatigue Resistance: 5</h2>
                <p>Taking the <strong>Attack action</strong> does not inflict you with the <strong>fatigued</strong>
                    condition.</p>

                <h2>Versatile Tactics: 5</h2>
                <p>Choose one of the following benefits. You may swap your choice when you finish a short or long rest.
                </p>
                <p>When you use <strong>Tactical Orders</strong>, you may spend one <strong>Leadership Die</strong> to
                    target an additional creature.</p>
                <p>When you use <strong>Advanced Maneuver</strong>, you may spend one <strong>Leadership Die</strong> to
                    target an additional creature.</p>

                <h2>Recuperate: 6</h2>
                <p><em>A moment's rest under your command revitalizes the weary.</em> When you finish a short rest, all
                    allies reduce their <strong>exhaustion</strong> levels by 1 and regain additional hit points equal
                    to two rolls of your <strong>Leadership Dice</strong>.</p>

                <h2>Advanced Leadership: 9</h2>
                <p>When a <strong>Leadership Die</strong> is rolled, if the result is lower than your <strong>Mental
                        Modifier</strong>, that number is used instead of the roll.</p>

                <h2>Unbreakable Will: 10</h2>
                <p><em>Your resolve fortifies your mind.</em> You have advantage on saving throws against the
                    <strong>charmed</strong> and <strong>frightened</strong> conditions.
                </p>

                <h2>Improved Orders: 11</h2>
                <p>When you use Hold the Line or Reposition, the target creature's speed increases by 10 feet while the
                    order is active.</p>
                <p>Additionally, when you restore hit points to a creature with a Warlord feature, the creature also
                    regains hit points equal to your <strong>Mental Modifier</strong>.</p>

                <h2>Battlefield Intuition: 13</h2>
                <p>Choose a Tier 1 feat with the Social tag. You learn this feat and can use it without expending a
                    <strong>Feat Slot</strong>.
                </p>

                <h2>Shift the Field: 15</h2>
                <p>When you use <strong>Tactical Order</strong>, you can expend one <strong>Leadership Die</strong> to
                    target an additional creature.</p>

                <h2>Tireless Leader: 17</h2>
                <p><em>You enter every fray with a plan already in motion.</em> When you roll initiative, you gain two
                    <strong>Leadership Dice</strong>.
                </p>

                <h2>Advanced Leadership II: 18</h2>
                <p>When a <strong>Leadership Die</strong> is rolled, the result is doubled.</p>
