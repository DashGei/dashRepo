                <h1>The Duelist</h1>
                <h3>Level 3: Duelist's Swagger</h3>
                <p>You gain proficiency in the Persuasion or Intimidation skill, or another skill of your choice if you
                    are already proficient in both.</p>

                <p>You also learn the Compelled Duel Feat, and if you reduce the target to 0 hit points you regain the
                    Feat slot you expended to use the feature and gain temporary hitpoints equal to your level.
                    Additionally, you cannot have Disadvantage on attacks against a compelled creature, and you know
                    where the creature is as long as it is within 30 feet of you.</p>

                <h3>Level 7: Feint</h3>
                <p>When you make an attack against a creature as part of a reaction, the attack deals an additional 1d6
                    Physical damage, this damage increases to PB x 1d6 if the creature is the target of your Compelled
                    Duel.</p>
                <p>Additionally, When your Compelled Duel is broken, the effects wear off on the end of the target's
                    next tturn.</p>

                <h3>Level 14: Cornered Fighting</h3>
                <p>You gain an additional reaction when you start your turn with half health or lower.</p>

                <h3>Level 20: Surprising Strikes</h3>
                <p>After you roll a critical hit with a weapon attack, or for the cost of one Feat slot after you hit an
                    enemy with a melee weapon attack, you can immediately make another attack with a weapon.</p>

                <h1>The Ruffian</h1>
                <h3>Level 3: Powerful Build</h3>
                <p>When you enter your offensive stance, enemies have Disadvantage any saving throws against your Feats
                    which move them, grapple them, or cause them to be prone. Additionally, when you take the Dodge
                    action you gain resistance to Physical damage for the duration of the Dodge.</p>

                <h3>Level 7: Brawling</h3>
                <p>You deal an additional 1d4 Physical damage when you hit a creature who is prone, grappled, or has
                    been moved
                    against their will since the start of your turn.</p>

                <h3>Level 14: Finisher</h3>
                <p>When you land 3 attacks in a single turn, you gain the ability to use the Grapple Strike, Pushing
                    Attack, and Trip Feats for free until the start of your next turn.</p>

                <h3>Level 20: Go Big Or Go Home</h3>
                <p>When you use Offensive Stance you can choose to reverse the effects, gaining Disadvantage on all
                    attacks, and all attacks have Disadvantage against you. When you use this feature and roll with
                    Disadvantage, if either d20 falls within your critical range, you can use that roll instead of the
                    lower result.</p>

                <h1>The Monk</h1>
                <h3>Level 3: Quivering Palm</h3>
                <p>When you hit a creature with a melee attack, you can spend a Feat Slot to instill them with invisible
                    vibrations. These vibrations are harmless and last for a week, but you have Advantage on Insight
                    checks against targets. Additionally, when you
                    hit an effected creature with 3 melee attacks in the same turn, you can end the vibrations dealing
                    PB x 1d4 Force damage to them.</p>
                <p>Only one creature can be effected by this ability at a time, and a creature can only suffer one
                    instance of this ability at a time.</p>

                <h3>Level 3: Monastic Traditions</h3>
                <p>When you choose this subclass you add your choice of two Experiences on to the ones you already know:
                <ul>
                    <li>Handy (Only Artisan's Tools)</li>
                    <li>Scholar</li>
                    <li>Membership</li>
                </ul>
                </p>

                <h3>Level 7: Enlightened Strikes</h3>
                <p>You always know where the target of your vibrations is as long as they are within a mile of you. You
                    can also add additional vibrations to a target if you use the feature again. When you do so the dice
                    size of the Force damage increases by 1 stage to a maximum of PB x 1d12. Every additional stack also
                    requires you to hit one additional strike in the same turn in order to end the vibrations. </p>
                <p>Additionally, your melee attacks can deal your choice of Force, Magical Physical, or Physical damage.
                </p>

                <h3>Level 14: Open The Third Eye</h3>
                <p>As an action you can spend a Feat slot to grant yourself the effects of the True Seeing spell for an
                    hour. When you do so you also know the creature types of all creatures within 120 feet and you can
                    sense magic out to this radius as well.</p>

                <h3>Level 20: Purity of Soul</h3>
                <p>You become immune to the Charmed, Frightend, and Poisoned Conditions. You also don't gain Exhaustion
                    from lack of food or rest, you suffer no effects from old age, and you gain the benefits of a Long
                    Rest when you take a Short Rest.</p>

                <h3>Level 20: Last Stand</h3>
                <p>As a reaction when you would be reduced to 0 hit points but not killed outright, you can move up to
                    half your movement speed and spend any amount of Feat slots. Make one weapon attack for each slot
                    spent. After you complete these attacks, you fall to 0 hit points.</p>
                <p>

                    You can use this ability once, regaining its use after completing a long rest.</p>
