                <h5>Chapter 9, Equipment</h5>

                <h2>Coins</h2>

                <p>Characters often find coins on their adventures and can spend those coins in shops, inns, and other
                    businesses. Coins come in different denominations based on the relative worth of their material. The
                    Coin Values table lists coins and how much they’re worth relative to the Gold Piece, which is the
                    game’s main coin. For example, 100 Copper Pieces are worth 1 Gold Piece.</p>

                <p>A coin weighs about a third of an ounce, so fifty coins weigh a pound.</p>

                <h2>Weapons</h2>

                <p>The Weapons table in this section shows the game’s main weapons. The table lists the cost and weight
                    of each weapon, as well as the following details:</p>

                <p><strong>Category.</strong> Every weapon falls into a category: Simple or Martial. Weapon
                    proficiencies are usually tied to one of these categories. For example, you might have proficiency
                    with Simple weapons.</p>

                <p><strong>Melee or Ranged.</strong> A weapon is classified as either Melee or Ranged. A Melee weapon is
                    used to attack a target within 5 feet, whereas a Ranged weapon is used to attack at a greater
                    distance.</p>

                <p><strong>Damage.</strong> The table lists the amount of damage a weapon deals when an attacker hits
                    with it as well as the type of that damage.</p>

                <p><strong>Properties.</strong> Any properties a weapon has are listed in the Properties column. Each
                    property is defined in the “Properties” section.</p>

                <h3>Weapon Proficiency</h3>

                <p>Anyone can wield a weapon, but you must have proficiency with it to add your Proficiency
                    Bonus to an attack roll you make with it. A player character’s features can provide
                    weapon proficiencies. A monster is proficient with any weapon in its stat block.</p>

                <h3>Properties</h3>

                <p>Here are definitions of the properties in the Properties column of the Weapons table.</p>

                <h4>Ammunition</h4>

                <p>You can use a weapon that has the Ammunition property to make a ranged attack only if you
                    have ammunition to fire from it. The type of ammunition required is specified with the
                    weapon’s range. Each attack expends one piece of ammunition. Drawing the ammunition is
                    part of the attack (you need a free hand to load a one-handed weapon). After a fight,
                    you can spend 1 minute to recover half the ammunition (round down) you used in the
                    fight; the rest is lost.</p>

                <h4>Finesse</h4>

                <p>When making an attack with a Finesse weapon, use your choice of your Strength or
                    Dexterity modifier for the attack and damage rolls. You must use the same modifier for
                    both rolls.</p>

                <h4>Heavy</h4>

                <p>You have Disadvantage on attack rolls with a Heavy weapon if it’s a Melee weapon and
                    your Strength score isn’t at least 1 or if it’s a Ranged weapon and your Dexterity score
                    isn’t at least 1.</p>

                <h4>Light</h4>

                <p>Once per turn when you take the Attack action and miss you immediately make another
                    attack at disadvantage against the same target without spending an action. That attack
                    must be made with another held weapon with the Light property.</p>

                <h4>Range</h4>

                <p>A Range weapon has a range in parentheses after the Ammunition or Thrown property. The
                    range lists two numbers. The first is the weapon’s normal range in feet, and the second
                    is the weapon’s long range. When attacking a target beyond normal range, you have
                    Disadvantage on the attack roll. You can’t attack a target beyond the long range.</p>

                <h4>Reach</h4>

                <p>A Reach weapon adds 5 feet to your reach when you attack with it.</p>

                <h4>Thrown</h4>

                <p>If a weapon has the Thrown property, you can throw the weapon to make a ranged attack,
                    and you can draw that weapon as part of the attack. If the weapon is a Melee weapon, use
                    the same ability modifier for the attack and damage rolls that you use for a melee
                    attack with that weapon.</p>

                <h4>Two-Handed</h4>

                <p>A Two-Handed weapon requires two hands when you attack with it.</p>

                <h4>Hunker</h4>

                <p>A creature firing a Hunker weapon doesn't suffer Disadvantage from the prone condition.
                </p>

                <h4>Versatile</h4>

                <p>A Versatile weapon can be used with one or two hands. A damage value in parentheses
                    appears with the property. The weapon deals that damage when used with two hands to make
                    a melee attack.</p>

                <hr>

                <h3>Support Weapons</h3>

                <p>Employed by more organized militaries around the world. Squad weapons are expensive
                    pieces of equipment which require special training to use. A creature untrained in a
                    squad weapon is unable to use any of the features labeled with the squad weapon tag. A
                    player can use a long rest of downtime to become trained in the weapon.</p>

                <h4>Sniper Kit {Squad Weapon Feature}</h4>

                <p>The crossbow comes with a pre-zeroed two-lens sight along with a folding stool.</p>

                <p>A creature wielding the weapon can take the Utilize action to set up the Heavy Crossbow,
                    which becomes fixed in place until a creature removes it with the Utilize Object action.
                </p>

                <p>A creature wielding the Heavy Crossbow while it is set up is prone. While prone in this
                    way, a creature has advantage on attack rolls using the Heavy Crossbow, ignores the
                    disadvantage on attack rolls penalty from the prone condition, and the range of the
                    weapon increases to 500/1500.</p>

                <p>A creature taking the Help action with a creature using the set up crossbow adds their
                    Wisdom modifier to the attack and damage rolls made with the crossbow.</p>

                <h4>Support Fire Kit {Squad Weapon Feature}</h4>

                <p>The crossbow comes with a folding stool and attachable top-mounted feed.</p>

                <p>A creature wielding the weapon can take the Utilize action to set up the Heavy Crossbow,
                    which becomes fixed in place until a creature removes it with the Utilize Object action.
                    While a creature is wielding the set up crossbow, they make attack rolls at Advantage.
                </p>

                <p>A creature taking the Help action with a creature using the set up crossbow gives the
                    crossbow wielder an additional attack immediately as a reaction, and an additional
                    attack as a free action on their turn.</p>

                <h4>Handcannon {Squad Weapon Feature}</h4>

                <p>You must spend two actions on your turn to fire the blunderbuss. When you do so, each
                    creature in a 30-foot Cone originating from you must succeed on a Phys DC Dexterity
                    saving throw, taking 1d10 physical damage on a failure or half as much on a successful

                    Medium creature takes 3d10 from a blunderbuss shot.</p>


                </details>
                <hr>

                <h2>Weapon Proficiency</h2>

                <p>Anyone can wield a weapon, but you must have proficiency with it to add your Proficiency Bonus to an
                    attack roll you make with it. A player character’s features can provide weapon proficiencies. A
                    monster is proficient with any weapon in its stat block.</p>

                <hr>

                <h2>Making a Weapon Attack</h2>

                <p>To make a weapon attack, choose a target within the weapon's range and make an attack roll.</p>

                <p><strong>Attack Roll = d20 + Physical Modifier + Proficiency Bonus</strong></p>

                <p>If the result equals or exceeds the target's Armor Class, the attack hits.</p>

                <p>On a hit, roll the weapon's damage die and apply any additional modifiers or effects.</p>

                <p>Unless a rule states otherwise, melee weapons use your Strength modifier and ranged weapons use your
                    Dexterity modifier.</p>

                <p>Some weapons possess the Finesse property, allowing either Strength or Dexterity to be used.</p>

                <hr>

                <h2>Improvised Weapons</h2>

                <p>An improvised weapon is an object wielded as a makeshift weapon, such as broken glass, a table leg,
                    or a frying pan. A Simple or Martial weapon also counts as an improvised weapon if it’s wielded in a
                    way contrary to its design; if you use a Ranged weapon to make a melee attack or throw a Melee
                    weapon that lacks the <a
                        href="https://www.dndbeyond.com/sources/dnd/free-rules/equipment#Thrown">Thrown</a> property,
                    the weapon counts as an improvised weapon. An improvised weapon follows the rules below.</p>

                <p><strong><em>Proficiency.</em></strong> Don’t add your Proficiency Bonus to attack rolls with an
                    improvised weapon.</p>

                <p><strong><em>Damage.</em></strong> On a hit, the weapon deals 1d4 damage of a type the DM thinks is
                    appropriate for the object.</p>

                <p><strong><em>Range.</em></strong> If you throw the weapon, it has a normal range of 20 feet and a long
                    range of 60 feet.</p>

                <p><strong><em>Weapon Equivalents.</em></strong> If an improvised weapon resembles a Simple or Martial
                    weapon, the DM may say it functions as that weapon and uses that weapon’s rules. For example, the DM
                    could treat a table leg as a Club.</p>

                <hr>

                <h2>Unarmed Strikes</h2>

                <p>Instead of using a weapon to make a melee attack, you can use a punch, kick, headbutt, or similar
                    forceful blow. In game terms, this is an Unarmed Strike - a melee attack that involves you using
                    your body to damage, grapple, or shove a target within 5 feet of you.</p>

                <p>Whenever you use your Unarmed Strike, choose one of the following options for its effect.</p>

                <p><strong><em>Damage.</em></strong> You make an attack roll against the target. Your bonus to the roll
                    equals your Strength modifier plus your Proficiency Bonus. On a hit, the target takes Bludgeoning
                    damage equal to 1 plus your Strength modifier.</p>

                <p><strong><em>Grapple.</em></strong> The target must succeed on a Strength or Dexterity saving throw
                    (it chooses which), or it has the Grappled condition. The DC for the saving throw and any escape
                    attempts equals 8 plus your Strength modifier and Proficiency Bonus. This grapple is possible only
                    if the target is no more than one size larger than you and if you have a hand free to grab it.</p>

                <p><strong><em>Shove.</em></strong> The target must succeed on a Strength or Dexterity saving throw (it
                    chooses which), or you either push it 5 feet away or cause it to have the Prone condition. The
                    DC for the saving throw equals 8 plus your Strength modifier and Proficiency Bonus. This shove is
                    possible only if the target is no more than one size larger than you.</p>

                <hr>

                <h2>Armor</h2>

                <p>The Armor table lists the game’s main armor. The table includes the cost and weight of armor, as well
                    as the following details:</p>

                <p><strong>Category.</strong> Every type of armor falls into a category: Light, Medium, or Heavy. The
                    category determines how long it takes to don or doff the armor (as shown in the table).</p>

                <p><strong>Armor Class (AC).</strong> The table’s Armor Class column tells you what your base AC is when
                    you wear a type of armor. For example, if you wear Leather Armor, your base AC is 11 plus your
                    Dexterity modifier, whereas your AC is 16 in Chain Mail.</p>

                <p><strong>Strength.</strong> If the table shows a Strength score in the Strength column for an armor
                    type, that armor reduces the wearer’s speed by 10 feet unless the wearer has a Strength score equal
                    to or higher than the listed score.</p>

                <p><strong>Stealth.</strong> If the table shows "Disadvantage" in the Stealth column for an armor type,
                    the wearer has Disadvantage on Dexterity (Stealth) checks.</p>

                <h3>Armor Training</h3>

                <p>Anyone can don armor or hold a Shield, but only those with training can use them effectively, as
                    explained below. A character’s class and other features determine the character’s armor training. A
                    monster has training with any armor in its stat block.</p>

                <h4>Light, Medium, or Heavy Armor</h4>

                <p>If you wear Light, Medium, or Heavy armor and lack training with it, you gain one point of exhaustion
                    when you finish a turn with both actions used.</p>

                <h4>Shield</h4>

                <p>You gain the Armor Class benefit of a Shield only if you have training with it.</p>

                <h2>Tools</h2>

                <p>A tool helps you make specialized ability checks, craft certain items, or both. A tool’s description
                    includes the tool’s cost and weight, as well as the following entries:</p>

                <ul>
                    <li><strong>Ability.</strong> This entry lists the ability to use when making an ability check with
                        the tool.</li>
                    <li><strong>Utilize.</strong> This entry lists things you can do with the tool when you take the
                        Utilize action. You can do one of those things each time you take the action. This entry also
                        provides the DC for the action.</li>
                    <li><strong>Craft.</strong> This entry lists what, if anything, you can craft with the tool. For
                        crafting rules, see <em>Crafting Equipment</em> later in the chapter.</li>
                    <li><strong>Variants.</strong> This entry appears if the tool has variants, which are listed. Each
                        requires a separate proficiency.</li>
                </ul>

                <h2>Tool Proficiency</h2>

                <p>If you have proficiency with a tool, add your Proficiency Bonus to any ability check you make that
                    uses the tool. If you have proficiency in a skill that’s used with that check, you have Advantage on
                    the check too.</p>

                <p>Your features might give you proficiency with a tool. A monster has proficiency with any tool in its
                    stat block.</p>

                    minutes to recover the Ball Bearings.</p>

                    <li>Tinderbox</li>
                    <li>Waterskin</li>
                </ul>

                <h2>Caltrops (1 GP)</h2>

                <p>As a <strong>Utilize</strong> action, you can spread Caltrops from their bag to cover a
                    <strong>5-foot-square area</strong> within 5 feet of yourself.
                </p>

                <p>A creature that enters this area for the first time on a turn must succeed on a <strong>DC 15
                        Dexterity saving throw</strong> or:</p>

                <ul>
                    <li>Take <strong>1 Piercing damage</strong></li>
                    <li>Have its Speed reduced to 0 until the start of its next turn</li>
                </ul>

                <p>It takes <strong>10 minutes</strong> to recover the Caltrops.</p>

                <h2>Candle (1 CP)</h2>

                <p>For <strong>1 hour</strong>, a lit Candle sheds:</p>

                <ul>
                    <li><strong>Bright Light:</strong> 5-foot radius</li>
                    <li><strong>Dim Light:</strong> Additional 5 feet</li>
                </ul>

                <h2>Case, Crossbow Bolt (1 GP)</h2>

                <p>A Crossbow Bolt Case holds up to <strong>20 Bolts</strong>.</p>

                <h2>Case, Map or Scroll (1 GP)</h2>

                <p>A Map or Scroll Case holds up to:</p>

                <ul>
                    <li>10 sheets of paper, or</li>
                    <li>5 sheets of parchment</li>
                </ul>

                <h2>Chain (5 GP)</h2>

                <p>As a <strong>Utilize</strong> action, you can wrap a Chain around an unwilling creature within 5 feet
                    of yourself that has the <strong>Grappled</strong>, <strong>Incapacitated</strong>, or
                    <strong>Restrained</strong> condition if you succeed on a <strong>DC 13 Strength
                        (Athletics)</strong> check.
                </p>

                <p>If the creature's legs are bound, the creature has the <strong>Restrained</strong> condition until it
                    escapes.</p>

                <ul>
                    <li><strong>Escape:</strong> DC 18 Dexterity (Acrobatics) check</li>
                    <li><strong>Burst Chain:</strong> DC 25 Strength (Athletics) check</li>
                </ul>

                <h2>Chest (5 GP)</h2>

                <p>A Chest holds up to <strong>12 cubic feet</strong> of contents.</p>

                <h2>Climber's Kit (25 GP)</h2>

                <p>A Climber's Kit includes boot tips, gloves, pitons, and a harness.</p>

                <p>As a <strong>Utilize</strong> action, you can use the Climber's Kit to anchor yourself.</p>

                <p>While anchored:</p>

                <ul>
                    <li>You can't fall more than 25 feet from the anchor point.</li>
                    <li>You can't move more than 25 feet away without undoing the anchor as an Action.</li>
                </ul>

                <h2>Clothes, Fine (15 GP)</h2>

                <p>Fine Clothes are made of expensive fabrics and adorned with expertly crafted details.</p>

                <p>Some events and locations admit only people wearing these clothes.</p>

                <h2>Clothes, Traveler's (2 GP)</h2>

                <p>Traveler's Clothes are resilient garments designed for travel in various environments.</p>

                <h2>Component Pouch (25 GP)</h2>

                <p>A Component Pouch is watertight and filled with compartments that hold all the free Material
                    components of your spells.</p>

                <h2>Costume (5 GP)</h2>

                <p>While wearing a Costume, you have Advantage on any ability check you make to impersonate the person
                    or type of person it represents.</p>

                <h2>Crowbar (2 GP)</h2>

                <p>Using a Crowbar gives you Advantage on Strength checks where the Crowbar's leverage can be applied.
                </p>

                <h2>Diplomat's Pack (39 GP)</h2>

                <p>A Diplomat's Pack contains:</p>

                <ul>
                    <li>Chest</li>
                    <li>Fine Clothes</li>
                    <li>Ink</li>
                    <li>5 Ink Pens</li>
                    <li>Lamp</li>
                    <li>2 Map or Scroll Cases</li>
                    <li>4 flasks of Oil</li>
                    <li>5 sheets of Paper</li>
                    <li>5 sheets of Parchment</li>
                    <li>Perfume</li>
                    <li>Tinderbox</li>
                </ul>

                <h2>Druidic Focus (Varies)</h2>

                <p>A Druidic Focus takes one of the forms in the Druidic Focuses table and is carved, tied with ribbon,
                    or painted to channel primal magic.</p>

                <p>A Druid or Ranger can use such an object as a <strong>Spellcasting Focus</strong>.</p>

                <h2>Flask (2 CP)</h2>

                <p>A Flask holds up to <strong>1 pint</strong>.</p>

                <h2>Grappling Hook (2 GP)</h2>

                <p>As a <strong>Utilize</strong> action, you can throw the Grappling Hook at a railing, ledge, or
                    another catch within 50 feet of yourself.</p>

                <p>The hook catches if you succeed on a <strong>DC 13 Dexterity (Acrobatics)</strong> check.</p>

                <p>If you tied a Rope to the hook, you can then climb it.</p>

                <h2>Healer's Kit (5 SP)</h2>

                <p>As 2 actions, expend the and make a DC 10 Wisdom (Medicine) check on a creature within 5 feet. On a
                    success, the target regains <strong>1d4 + your Medicine skill bonus</strong> hit points. If you
                    begin your turn adjacent to that creature, haven't taken damage or moved more than 5 feet since your
                    last turn, and have used your actions only to tend it, you can expend another use and 2 actions to
                    continue care: the check automatically succeeds, healing the same amount.</p>

                <h2>Holy Symbol (Varies)</h2>

                <p>A Holy Symbol takes one of the forms in the Holy Symbol table and is bejeweled or painted to channel
                    divine magic.</p>

                <p>A Cleric or Paladin can use a Holy Symbol as a <strong>Spellcasting Focus</strong>.</p>

                <p>The table indicates whether a Holy Symbol must be held, worn, or borne on fabric or a Shield.</p>

                <h2>Holy Water (25 GP)</h2>

                <p>When you take the <strong>Attack</strong> action, you can replace one of your attacks with throwing a
                    flask of Holy Water.</p>

                <p>Target one creature you can see within 20 feet of yourself.</p>

                <p>The target must succeed on a Dexterity saving throw (<strong>DC = 8 + your Dexterity modifier + your
                        Proficiency Bonus</strong>) or take <strong>2d8 Radiant damage</strong> if it is a Fiend or an
                    Undead.</p>

                <h2>Hunting Trap (5 GP)</h2>

                <p>As a <strong>Utilize</strong> action, you can set a Hunting Trap.</p>

                <p>A creature that steps on the pressure plate must succeed on a <strong>DC 13 Dexterity saving
                        throw</strong> or:</p>

                <ul>
                    <li>Take <strong>1d4 Piercing damage</strong></li>
                    <li>Have its Speed reduced to 0 until the start of its next turn</li>
                </ul>

                <p>Until freed, its movement is limited by the chain (typically 3 feet).</p>

                <p>A creature can use an action to make a <strong>DC 13 Strength (Athletics)</strong> check to free
                    itself or another creature within reach.</p>

                <p>Each failed check deals <strong>1 Piercing damage</strong> to the trapped creature.</p>

                <h2>Ink (10 GP)</h2>

                <p>Ink comes in a <strong>1-ounce bottle</strong>, providing enough ink to write about <strong>500
                        pages</strong>.</p>

                <h2>Ink Pen (2 CP)</h2>

                <p>Using Ink, an Ink Pen is used to write or draw.</p>

                <h2>Jug (2 CP)</h2>

                <p>A Jug holds up to <strong>1 gallon</strong>.</p>

                <h2>Ladder (1 SP)</h2>

                <p>A Ladder is <strong>10 feet tall</strong>.</p>

                <p>You must climb to move up or down it.</p>

                <h2>Lamp (5 SP)</h2>

                <p>A Lamp burns Oil as fuel and casts:</p>

                <ul>
                    <li><strong>Bright Light:</strong> 15-foot radius</li>
                    <li><strong>Dim Light:</strong> Additional 30 feet</li>
                </ul>

                <h2>Lantern, Bullseye (10 GP)</h2>

                <p>A Bullseye Lantern burns Oil as fuel and casts:</p>

                <ul>
                    <li><strong>Bright Light:</strong> 60-foot cone</li>
                    <li><strong>Dim Light:</strong> Additional 60 feet</li>
                </ul>

                <h2>Lantern, Hooded (5 GP)</h2>

                <p>A Hooded Lantern burns Oil as fuel and casts:</p>

                <ul>
                    <li><strong>Bright Light:</strong> 30-foot radius</li>
                    <li><strong>Dim Light:</strong> Additional 30 feet</li>
                </ul>

                <p>As an Action, you can lower the hood to reduce the light to Dim Light in a 5-foot radius, or raise it
                    again.</p>

                <h2>Lock (10 GP)</h2>

                <p>A Lock comes with a key.</p>

                <p>Without the key, a creature can use Thieves' Tools to pick the lock with a successful <strong>DC 15
                        Dexterity (Sleight of Hand)</strong> check.</p>

                <h2>Magnifying Glass (100 GP)</h2>

                <p>A Magnifying Glass grants Advantage on any ability check made to appraise or inspect a highly
                    detailed item.</p>

                <p>Lighting a fire with a Magnifying Glass requires:</p>

                <ul>
                    <li>Light as bright as sunlight</li>
                    <li>Tinder to ignite</li>
                    <li>About 5 minutes</li>
                </ul>

                <h2>Manacles (2 GP)</h2>

                <p>As a <strong>Utilize</strong> action, you can use Manacles to bind an unwilling Small or Medium
                    creature within 5 feet of yourself that has the <strong>Grappled</strong>,
                    <strong>Incapacitated</strong>, or <strong>Restrained</strong> condition if you succeed on a
                    <strong>DC 13 Dexterity (Sleight of Hand)</strong> check.
                </p>

                <p>While bound:</p>

                <ul>
                    <li>The creature has Disadvantage on attack rolls.</li>
                    <li>The creature is Restrained if the Manacles are attached to a fixed chain or hook.</li>
                </ul>

                <p>Escaping requires a <strong>DC 20 Dexterity (Sleight of Hand)</strong> check.</p>

                <p>Bursting the Manacles requires a <strong>DC 25 Strength (Athletics)</strong> check.</p>

                <p>Each set of Manacles comes with a key. Without the key, a creature can use Thieves' Tools to pick the
                    lock with a successful <strong>DC 15 Dexterity (Sleight of Hand)</strong> check.</p>

                <h2>Map (1 GP)</h2>

                <p>If you consult an accurate Map, you gain a <strong>+5 bonus</strong> to Wisdom (Survival) checks made
                    to find your way in the represented location.</p>

                <h2>Mirror (5 GP)</h2>

                <p>A handheld steel Mirror is useful for:</p>

                <ul>
                    <li>Personal cosmetics</li>
                    <li>Peeking around corners</li>
                    <li>Reflecting light as a signal</li>
                </ul>

                <h2>Net (1 GP)</h2>

                <p>When you take the <strong>Attack</strong> action, you can replace one of your attacks with throwing a
                    Net.</p>

                <p>Target a creature you can see within 15 feet of yourself.</p>

                <p>The target must succeed on a Dexterity saving throw (<strong>DC = 8 + your Dexterity modifier + your
                        Proficiency Bonus</strong>) or gain the <strong>Restrained</strong> condition until it escapes.
                </p>

                <p>The target automatically succeeds if it is <strong>Huge or larger</strong>.</p>

                <p>To escape, the target or a creature within 5 feet of it must take an action and succeed on a
                    <strong>DC 10 Strength (Athletics)</strong> check.
                </p>

                <p>The Net can also be destroyed:</p>

                <ul>
                    <li><strong>AC:</strong> 10</li>
                    <li><strong>HP:</strong> 5</li>
                    <li><strong>Immunities:</strong> Bludgeoning, Poison, and Psychic damage</li>
                </ul>

                <p>Destroying the Net frees the target and ends the effect.</p>


                <h2>Oil (1 SP)</h2>

                <p>You can douse a creature, object, or space with Oil or use it as fuel, as detailed below.</p>

                <h3>Dousing a Creature or an Object</h3>

                <p>When you take the <strong>Attack</strong> action, you can replace one of your attacks with throwing
                    an Oil flask.</p>

                <p>Target one creature or object within 20 feet of yourself. The target must succeed on a <strong>Phys
                        DC Dexterity</strong> saving throw or be covered in oil.</p>

                <p>If the target takes Fire damage before the oil dries (after 1 minute), the target takes an extra
                    <strong>5 Fire damage</strong> from burning oil.
                </p>

                <h3>Dousing a Space</h3>

                <p>You can take the <strong>Utilize</strong> action to pour an Oil flask on level ground to cover a
                    5-foot-square area within 5 feet of yourself.</p>

                <p>If lit, the oil burns until the end of the turn 2 rounds from when the oil was lit (12 seconds) and
                    deals <strong>5 Fire damage</strong> to any creature that enters the area or ends its turn there.
                </p>

                <p>A creature can take this damage only once per turn.</p>

                <h3>Fuel</h3>

                <p>Oil serves as fuel for Lamps and Lanterns.</p>

                <p>Once lit, a flask of Oil burns for <strong>6 hours</strong> in a Lamp or Lantern. That duration
                    doesn't need to be consecutive; you can extinguish the burning Oil (as a Utilize action) and
                    rekindle it until it has burned for a total of 6 hours.</p>

                <h2>Paper (2 SP)</h2>

                <p>One sheet of Paper can hold about <strong>250 handwritten words</strong>.</p>

                <h2>Parchment (1 SP)</h2>

                <p>One sheet of Parchment can hold about <strong>250 handwritten words</strong>.</p>

                <h2>Perfume (5 GP)</h2>

                <p>Perfume comes in a 4-ounce vial.</p>

                <p>For 1 hour after applying Perfume to yourself, you have Advantage on Charisma (Persuasion) checks
                    made to influence an <strong>Indifferent Humanoid</strong> within 5 feet of yourself.</p>

                <h2>Poison, Basic (100 GP)</h2>

                <p>As an Action, you can use a vial of Basic Poison to coat one weapon or up to three pieces of
                    ammunition.</p>

                <p>A creature that takes Physical damage from the poisoned weapon or ammunition takes an extra
                    <strong>1d4 Poison damage</strong>.
                </p>

                <p>Once applied, the poison retains potency for <strong>1 minute</strong> or until its damage is dealt,
                    whichever comes first.</p>

                <h2>Pole (5 CP)</h2>

                <p>A Pole is <strong>10 feet long</strong>.</p>

                <p>You can use it to touch something up to 10 feet away. If you must make a Strength (Athletics) check
                    as part of a High or Long Jump, you can use the Pole to vault, giving yourself Advantage on the
                    check.</p>

                <h2>Pot, Iron (2 GP)</h2>

                <p>An Iron Pot holds up to <strong>1 gallon</strong>.</p>

                <h2>Potion of Healing (50 GP)</h2>

                <p>This potion is a magic item.</p>

                <p>As an Action, you can drink it or administer it to another creature within 5 feet of yourself.</p>

                <p>The creature that drinks the magical red fluid in this vial regains <strong>2d4 + 2 Hit
                        Points</strong>.</p>

                <h2>Pouch (5 SP)</h2>

                <p>A Pouch holds up to <strong>6 pounds</strong> within <strong>one-fifth of a cubic foot</strong>.</p>

                <h2>Priest's Pack (33 GP)</h2>

                <p>A Priest's Pack contains the following items:</p>

                <ul>
                    <li>Backpack</li>
                    <li>Blanket</li>
                    <li>Holy Water</li>
                    <li>Lamp</li>
                    <li>7 days of Rations</li>
                    <li>Robe</li>
                    <li>Tinderbox</li>
                </ul>

                <h2>Quiver (1 GP)</h2>

                <p>A Quiver holds up to <strong>20 Arrows</strong>.</p>

                <h2>Ram, Portable (4 GP)</h2>

                <p>You can use a Portable Ram to break down doors.</p>

                <p>When doing so, you gain a <strong>+4 bonus</strong> to the Athletics (Strength) check.</p>

                <p>One other character can help you use the ram, giving you Advantage on this check.</p>

                <h2>Rations (5 SP)</h2>

                <p>Rations consist of travel-ready food, including:</p>

                <ul>
                    <li>Jerky</li>
                    <li>Dried fruit</li>
                    <li>Hardtack</li>
                    <li>Nuts</li>
                </ul>

                <p>See <strong>"Malnutrition"</strong> in the rules glossary for the risks of not eating.</p>

                <h2>Robe (1 GP)</h2>

                <p>A Robe has vocational or ceremonial significance.</p>

                <p>Some events and locations admit only people wearing a Robe bearing certain colors or symbols.</p>

                <h2>Rope (1 GP)</h2>

                <p>As a Utilize action, you can tie a knot with Rope if you succeed on a <strong>DC 10 Dexterity
                        (Sleight of Hand)</strong> check.</p>

                <p>The Rope can be burst with a successful <strong>DC 20 Strength (Athletics)</strong> check.</p>

                <p>You can bind an unwilling creature with the Rope only if the creature has the
                    <strong>Grappled</strong>, <strong>Incapacitated</strong>, or <strong>Restrained</strong> condition.
                </p>

                <p>If the creature's legs are bound, the creature has the <strong>Restrained</strong> condition until it
                    escapes.</p>

                <p>Escaping the Rope requires the creature to make a successful <strong>DC 15 Dexterity
                        (Acrobatics)</strong> check as an action.</p>

                <h2>Sack (1 CP)</h2>

                <p>A Sack holds up to <strong>30 pounds</strong> within <strong>1 cubic foot</strong>.</p>

                <h2>Scholar's Pack (40 GP)</h2>

                <p>A Scholar's Pack contains the following items:</p>

                <ul>
                    <li>Backpack</li>
                    <li>Book</li>
                    <li>Ink</li>
                    <li>Ink Pen</li>
                    <li>Lamp</li>
                    <li>10 flasks of Oil</li>
                    <li>10 sheets of Parchment</li>
                    <li>Tinderbox</li>
                </ul>

                <h2>Shovel (2 GP)</h2>

                <p>Working for 1 hour, you can use a Shovel to dig a hole that is <strong>5 feet on each side</strong>
                    in soil or similar material.</p>

                <h2>Signal Whistle (5 CP)</h2>

                <p>When blown as a Utilize action, a Signal Whistle produces a sound that can be heard up to <strong>600
                        feet away</strong>.</p>


                <h2>Spell Scroll (Cantrip, 30 GP, Level 1, 50 GP)</h2>

                <p>A Spell Scroll (Cantrip) or Spell Scroll (Level 1) is a magic item that bears the words of a cantrip
                    or level 1 spell, respectively, determined by the scroll's creator.</p>

                <p>If the spell is on your class's spell list, you can read the scroll and cast the spell using its
                    normal casting time and without providing any Material components.</p>

                <p>If the spell requires a saving throw or an attack roll:</p>

                <ul>
                    <li><strong>Spell Save DC:</strong> 13
                        <ul>
                            <li><strong>Spell Attack Bonus:</strong> +5</li>
                        </ul>
                    </li>
                </ul>

                <p>The scroll disintegrates when the casting is completed.</p>

                <h2>Spikes, Iron (1 GP)</h2>

                <p>Iron Spikes come in bundles of ten.</p>

                <p>As a Utilize action, you can use a blunt object, such as a Light Hammer, to hammer a spike into wood,
                    earth, or a similar material.</p>

                <p>You can do so to:</p>

                <ul>
                    <li>Jam a door shut</li>
                    <li>Tie a Rope to the Spike</li>
                    <li>Tie a Chain to the Spike</li>
                </ul>

                <h2>Spyglass (1,000 GP)</h2>

                <p>A creature using a Spyglass has Advantage on Wisdom (Perception) checks on creatures and objects if
                    they are more than 30 feet away and less than 5 miles away.</p>

                <h2>String (1 SP)</h2>

                <p>String is <strong>10 feet long</strong>.</p>

                <p>You can tie a knot in it as a Utilize action.</p>

                <h2>Tent (2 GP)</h2>

                <p>A Tent sleeps up to <strong>two Small or Medium creatures</strong>.</p>

                <h2>Tinderbox (5 SP)</h2>

                <p>A Tinderbox is a small container holding flint, fire steel, and tinder (usually dry cloth soaked in
                    light oil) used to kindle a fire.</p>

                <ul>
                    <li>Lighting a Candle, Lamp, Lantern, Torch, or anything else with exposed fuel takes an
                        <strong>Action</strong>.
                    </li>
                    <li>Lighting any other fire takes <strong>1 minute</strong>.</li>
                </ul>

                <h2>Torch (1 CP)</h2>

                <p>A Torch burns for <strong>1 hour</strong>, casting:</p>

                <ul>
                    <li><strong>Bright Light:</strong> 20-foot radius</li>
                    <li><strong>Dim Light:</strong> Additional 20 feet</li>
                </ul>

                <p>When you take the Attack action, you can attack with the Torch, using it as a <strong>Simple Melee
                        weapon</strong>.</p>

                <p>On a hit, the target takes <strong>1 d4 Fire damage</strong>.</p>

                <h2>Vial (1 GP)</h2>

                <p>A Vial holds up to <strong>4 ounces</strong>.</p>

                <h2>Waterskin (2 SP)</h2>

                <p>A Waterskin holds up to <strong>4 pints</strong>.</p>

                <p>If you don't drink sufficient water, you risk dehydration (see the rules glossary).</p>

                <hr>

                <h2>Mounts and Vehicles</h2>

                <p>A mount can help you move more quickly through the wilderness, but its primary purpose is to carry
                    gear that would otherwise slow you down.</p>

                <p>The <strong>Mounts and Other Animals</strong> table shows each animal's carrying capacity. See
                    appendix B for the animals' stat blocks.</p>

                <h2>Mounts and Cargo</h2>

                <p>An animal pulling a carriage, cart, chariot, sled, or wagon can move weight up to <strong>five times
                        its base carrying capacity</strong>, including the weight of the vehicle.</p>

                <p>If multiple animals pull the same vehicle, add their carrying capacities together.</p>

                <h2>Barding</h2>

                <p>Barding is armor designed for a mount.</p>

                <p>Any type of armor on the Armor table in this chapter can be purchased as barding.</p>

                <ul>
                    <li><strong>Cost:</strong> Four times the normal cost</li>
                    <li><strong>Weight:</strong> Twice the normal weight</li>
                </ul>

                <h2>Saddles</h2>

                <p>A saddle comes with:</p>

                <ul>
                    <li>Bit</li>
                    <li>Bridle</li>
                    <li>Reins</li>
                    <li>Any other equipment needed to use the saddle</li>
                    <li><strong>Military Saddle:</strong> Grants Advantage on ability checks made to remain mounted.
                    </li>

                <h2>Large Vehicles</h2>

                <p>The <strong>Airborne and Waterborne Vehicles</strong> table provides statistics for various types of
                    large vehicles.</p>

                <p>The following notes apply.</p>

                <h2>Speed</h2>

                <p>A ship sailing against a strong wind moves at <strong>half speed</strong>.</p>

                <p>In a dead calm (no wind), waterborne ships can't move under sail and must be rowed.</p>

                <p><strong>Keelboats</strong> and <strong>Rowboats</strong> are used on lakes and rivers.</p>

                <p>If going downstream, add the speed of the current (typically <strong>3 miles per hour</strong>) to
                    the speed of the vehicle.</p>

                <p>These vehicles can't be rowed against any significant current, but they can be pulled upstream by
                    draft animals on the shores.</p>

                <p>A Rowboat can be carried and weighs <strong>100 pounds</strong>.</p>

                <h2>Crew</h2>

                <p>A ship larger than a Keelboat or Rowboat needs a crew of skilled hirelings (see
                    <strong>Services</strong>) to function.
                </p>

                <p>The minimum number of skilled hirelings needed to crew a ship depends on the type of ship, as shown
                    in the table.</p>

                <h2>Passengers</h2>

                <p>The table lists the number of Small and Medium passengers the ship can accommodate using hammocks.
                </p>

                <p>A ship outfitted with private accommodations can carry <strong>one-fifth as many passengers</strong>.
                </p>

                <p>Typical passage costs:</p>

                <ul>
                    <li>Hammock: <strong>5 SP per day</strong></li>
                    <li>Small private cabin: <strong>2 GP per day</strong></li>
                </ul>

                <p>Prices can vary from ship to ship.</p>

                <h2>Damage Threshold</h2>

                <p>If a vehicle has a damage threshold (see the rules glossary), it is noted in the table.</p>

                <h2>Ship Repair</h2>

                <p>Repairs to a damaged ship can be made while the vessel is berthed.</p>

                <p>For each <strong>1 Hit Point</strong> repaired:</p>

                <ul>
                    <li><strong>Time:</strong> 1 day</li>
                    <li><strong>Cost:</strong> 20 GP</li>
                </ul>

                <p>If repairs are made where supplies and skilled labor are abundant (such as a city shipyard), both the
                    time and cost are halved.</p>

                <h2>Services</h2>

                <p>This section outlines services and other expenses that adventurers might spend money on.</p>

                <h2>Lifestyle Expenses</h2>

                <p>Lifestyle expenses summarize the cost of living in a fantasy world.</p>

                <p>They cover:</p>

                <ul>
                    <li>Lodging</li>
                    <li>Food</li>
                    <li>Equipment maintenance</li>
                    <li>Other necessities</li>
                </ul>

                <p>At the start of each week or month (DM's choice), choose a lifestyle and pay the price to sustain it.
                </p>

                <p>Lifestyles have no inherent consequences, but the DM might take them into account when determining
                    risks or how others perceive your character.</p>

                <h3>Wretched (Free)</h3>

                <p>You survive via chance and charity.</p>

                <p>You're often exposed to natural dangers as a result of sleeping outside.</p>

                <h3>Squalid (1 SP per Day)</h3>

                <p>You spend the bare minimum for your necessities.</p>

                <p>You might be exposed to unhealthy conditions and opportunistic criminals.</p>

                <h3>Poor (2 SP per Day)</h3>

                <p>You spend frugally for your necessities.</p>

                <h3>Modest (1 GP per Day)</h3>

                <p>You support yourself at an average level.</p>

                <h3>Comfortable (2 GP per Day)</h3>

                <p>You spend modestly for your necessities and enjoy a few luxuries.</p>

                <h3>Wealthy (4 GP per Day)</h3>

                <p>You're accustomed to the finer things in life and might have servants.</p>

                <h3>Aristocratic (10 GP per Day)</h3>

                <p>You pay for the best and might have a staff that supports your lifestyle.</p>

                <p>Others notice your wealth and might encourage you to share it, either legally or otherwise.</p>
