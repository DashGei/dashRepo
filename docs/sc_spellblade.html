                <h1>Order of the Bladesingers</h1>

                <h3>Level 3: Mystic Movement</h3>
                <p>While you are not wearing armor, your speed increases by 10 feet and you add your Mental Modifier to
                    your armor class.</p>

                <h3>Level 7: Slinking</h3>
                <p>When concentrating on a spell, you have the benefits of the Disengage action.</p>


                <h3>Level 14: Forsight</h3>
                <p>You add your Mental modifier to Intitiative rolls. Additionally, when you make a Strength or
                    Dexterity saving throw, you can expend an Arcanum charge to add 1d10 to the total.</p>
                <h3>Level 20:</h3>
                <p>You gain a teleport and fly speed equal to your walking speed.</p>

                <h1>Order of the Embers</h1>
                <h3>Level 3: Runes of Roiling</h3>
                <p>During a short or long rest you can carve special runes into two weapons, binding them to you. As an
                    action you can activate the runes, causing both weapons to become flame blades as in the <em>Flame
                        Blade</em> spell. The spell level is the same as your Proficiency Bonus, they do not require
                    concentration, may use your Physical or Mental modifiers for attacks, and are elligible for use with
                    Cantrip and Weave strikes.</p>
                <p>Only two weapons may have active runes at a time, and carving runes into new weapons unbinds the old
                    weapons.</p>

                <h3>Level 7: Cauterized </h3>
                <p>You have resistance to Fire damage.</p>
                <p>Additionally, when you cast a spell which restores hit points to a creature, you can spend an Arcanum
                    charge to upcast by one level..</p>


                <h3>Level 14: Snuffed</h3>
                <p>You ignore resistance to Fire damage.</p>

                <h3>Level 20: Vermillion Revival</h3>

                <p>Oncer per long rest when you are reduced to 0 hitpoints, you regain 50 hit points and creatures of
                    your choosing within 100 feet of you must make a Physical DC Dexterity saving throw, taking 10d8
                    Fire damageon a failure and half that on a sucess.</p>

                <h1>Order of the Abjurers</h1>
                <h3>Level 3: </h3>
                <p>You can use the <em>Shield</em> spell as a reaction to a visible creature within 30 feet being hit
                    with an attack roll. When cast in this way that creature gains the AC benefit instead of you.</p>

                <h3>Level 7: Spell Siphoning</h3>
                <p>When you use Arcane Reflexes, you can choose to cause the spell which caused the reaction to have
                    Disadvantage on the attack roll, or one creature to have Advantage on their saving throw against the
                    spell.</p>


                <h3>Level 14: Arcane Anchor</h3>
                <p>You always have the Counterspell and Dispel Magic spells prepared. In addition, you can cast Dispel
                    Magic as an Action, and you can add your Proficiency Bonus to its ability check.

                    When you cast either spell with a spell slot, that slot isn't expended if the spell fails to stop a
                    spell.</p>
                <h3>Level 20: Spell Resistance</h3>
                <p>You gain greater magic resistance. You have advantage on saving throws against all spells, and
                    you suffer no negative effects from spells of 3rd level or lower.</p>

                <h1>Order of the Rune Knights</h1>


                <h3>Level 3: Martial Feats</h3>
                <p>You have trained in special techniques that give you an edge in combat and beyond. You gain access to
                    martial feats, as described in the <strong>Martial Feats</strong> section. You may only use one
                    <strong>Feat Slot</strong> per turn.
                </p>
                <p><strong>Feat Slots.</strong> You have 2 <strong>Feat Slots</strong>, which you expend to
                    activate your feats. You regain all expended slots when you finish a short rest. Your number of
                    <strong>Feat Slots</strong> increases as you gain levels, as shown in the Feats Progression
                    table.
                </p>
                <p><strong>Feats Prepared.</strong> You prepare 2 martial feats of your choice from the Fighter feat
                    list. The
                    Feats Prepared column of the Feats Progression table shows when you learn more feats. Additionally,
                    when you gain a level in this class, you can replace one feat you have prepared with another feat of
                    your choice from the Fighter feat list.</p>
                <p><strong>Feat Tier.</strong> You can learn feats of Tier 1 at level 3. At higher levels you gain
                    access to higher tiers, as shown in the table.</p>

                <h3>Level 7: Enhanced Techniques</h3>
                <p>On your turn you can sacrifice a Primary spell slot to create a Feat slot, when you do this you also
                    gain 1 Aracum Charge.</p>


                <h3>Level 14: Arcane Surge</h3>
                <p>On your turn you can spend 2 Arcanum charges to make a melee attack.</p>
                <h3>Level 20: </h3>
                <p>You can spend an Arcanum charge to deal an additional 4d10 Force damage when you hit a creature with
                    a melee attack, if the attack also included a Feat the creature has Disadvantage on saving throws
                    against that Feat.</p>
