                <h1>Tactitian</h1>
                <h3>Level 3: Advanced Tactics</h3>
                <p>Once per turn, you use an Advanced Order without spending an Order, when you do so the order
                    provides no healing.</p>

                <h3>Level 7: Fluid Battle Plans</h3>
                <p>As a reaction to a creature you can see taking damage within 60 feet, you can target the creature
                    with a Tactical or Advanced Maneuver</p>
                <h3>Level 14: Inscrutable</h3>
                <p>You gain proficiency in Intelligence saving throws.</p>
                <p>Additionally, you gain the Predict Movement Advanced Maneuver: Predict Movement: You deduce where
                    they are
                    planning to move on their next turn. They can
                    choose to change their plans, but if they move
                    anywhere else, their movement speed i</ul>
                <h3>Level 20: All In The Head</h3>
                <p>Tier 1 and 2 Feats with the Mental tag no longer cost Feat slots for you.</p>

                <h1>Commander</h1>
                <h3>Level 3: Martial Prowess</h3>
                <p>When you take this subclass you gain proficiency in heavy armor. Additionally you gain one Leadership
                    Die when you hit a creature with an attack.</p>

                <h3>Level 3: Form Up!</h3>
                <p>When you roll initiative and are
                    not surprised, any number of friendly creatures
                    within 30 feet of you can move up to their speed a
                    number of feet equal to five times your Mental
                    Modifier (minimum 5 feet)</p>

                <h3>Level 7: On Your Feet!</h3>
                <p>You can use an Action and
                    expend one Order to restore the will to fight
                    in an allied creature. Choose a friendly creature
                    within 5 feet of you. That creature regains hit points
                    equal to two rolls of your Order dice.
                    When you use this feature to restore hit points to a
                    creature at 0 hit points, you may re roll a number of dice equal to your Mental Modifier. If the
                    creature is prone, it can choose to stand immediately</p>
                <h3>Level 14: </h3>
                <p>When you and any number of
                    friendly creatures within 30 feet of you make a
                    Saving Throw against the same effect, your allies
                    gain Advantage on their Saving Throw if you succeed
                    on the saving throw.</p>
                <h3>Level 20: No One Left Behind!</h3>
                <p>You can move up to your speed
                    to get within 5 feet of a creature while using your On
                    Your Feet feature. During this movement you gain
                    resistance to all damage and the target regains an
                    additional 3d12 hit points for each attack of
                    opportunity made against you during this movement.</p>

                <h1>Paragon</h1>
                <h3>Level 3: Martial Prowess</h3>
                <p>When you take this subclass you gain proficiency in heavy armor.</p>

                <h3>Level 3: Formation Fighting</h3>
                <p>Once per turn when you hit a creature with an attack, you can choose to deal extra damage equal to
                    one roll of your Order dice if the target was within 5 feet of an allied creature.</p>

                <h3>Level 7: Resolve</h3>
                <p>When you deal damage with your Formation Fighting feature, you and one ally within 5 feet of the
                    target split the extra damage amongst yourselves as healing</p>
                <h3>Level 14: With Me!</h3>
                <p>When you are reduced to zero hit
                    points, you instantly regain a number of hit points
                    equal to your Mental Modifier (minimum 1).
                    Additionally you can expend an Order, causing all creatures of your choosing within 15 feet of you
                    to regain hit points equal to one roll of your Order dice. Once you use this feature,
                    you cannot use it again until you complete a short or
                    long rest.</p>
                <h3>Level 20: Legion</h3>
                <p> When a
                    friendly creature within 60 feet of you is reduced to 0
                    hit points, but not killed outright, they can drop to 1
                    hit point instead so long as they can see or hear you.
                    Once a creature benefits from this effect, they
                    cannot benefit from it again until they complete a
                    long rest.</p>
            </div>
        </div>
