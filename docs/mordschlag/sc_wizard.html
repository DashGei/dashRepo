                <h1>The Scribe</h1>

                <<h3>Level 3: Scholarly Insights</h3>
                    <p>When you choose this subclass you add your choice of two Experiences on to the ones you already
                        know:
                    <ul>
                        <li>Handy (Only Artisan's Tools)</li>
                        <li>Scholar</li>
                        <li>Membership</li>
                    </ul>
                    <p>Additionally, adding spells to your spell book requires half the cost and time.</p>
                    </p>

                    <h1>Necromancy</h1>

                    <h3>Level 3: Necromancy Savant</h3>
                    <p>When you cast a necromancy spell with a Primary Spell Slot that would otherwise
                        cost 2 actions, the casting time is instead one action.</p>

                    <h3>Level 3: Undead Familiar</h3>
                    <p>The Find Familiar spell appears in your spellbook. When you cast the spell you
                        choose one of the normal forms for your familiar you can also choose one of the
                        following forms: Skeleton, Zombie, or Swarm of Rats (undead)</p>

                    <h3>Level 6: Raise Horde</h3>
                    <p>With two actions and a Secondary Spell Slot, you create bodies and raise them
                        from the ground, creating a swarm of undead. The swarm has the following
                        features:</p>
                    <p>The creature is an ally to you and your allies. In combat, the creature shares
                        your Initiative count, but it takes its turn immediately after yours. It obeys
                        your verbal commands if you take an action on your turn to give it any. If you
                        don’t issue any, it takes the Deathly Claws attack action against an enemy
                        creature within its range. You can only have one horde active at a time, if you
                        use this feature or take a long rest, the horde disappears.</p>

                    <h3>Level 10: Command Undead</h3>
                    <p>If your horde misses their Deathly Claws attack, it still does half damage to the
                        target.</p>

                    <h3>Level 14: Inured to Undeath</h3>
                    <p>You gain resistance to necrotic damage, and your spells ignore resistance to
                        necrotic damage.</p>

                    <h3>Level 20: Lichdom</h3>
                    <p>Your soul has corroded enough to the point where you may undergo a ritual to
                        achieve Lichdom.</p>

                    <details class="heading2">
                        <summary><strong>Lichdom Ritual and Effects</strong></summary>
                        <p>This ritual requires the casting of the spell Circle of Death at 9th-level.
                            This spell must kill a total of 313 humanoids with souls with one cast, if
                            the required amount of humanoids do not die the ritual fails and you must
                            start again.</p>
                        <p>After a successful killing of these humanoids you must concentrate on the
                            soul transfer for the next hour. During this time you have the unconscious
                            condition but can still concentrate on the ritual as if you were
                            concentrating on a spell, damage breaks concentration as normal during this
                            time.</p>
                        <p>If concentration is broken during this time, the spell Circle of Death is
                            cast centered on you at 9th-level, the ritual fails, and you must start
                            again. Any creature who is reduced to 0 hit points by this spell has their
                            soul destroyed.</p>
                        <p>If the soul transfer is completed, your soul is stored inside of a now
                            magical object.</p>
                        <p>The object must be at minimum 1000gp in value, 10 grams, and 1 inch in
                            diameter. It cannot exceed 1 metric ton, or 15 feet in diameter. Your soul
                            is stored in that object. If you die, your body appears unharmed in an
                            unoccupied space within 10 feet of that object after 24 hours. If it is
                            destroyed, your soul is destroyed along with it and you die.</p>
                        <p>When you assume Lichdom, you gain the following properties:</p>
                        <ul>
                            <li><strong>Arcane Meditation.</strong> Liches do not sleep. Instead they
                                lightly meditate, remaining conscious, for 4 hours. Once 4 hours of
                                uninterrupted meditation is met, they gain the benefits of a long
                                rest.</li>
                            <li><strong>Arcane Mind.</strong> Your intelligence modifier increases to
                                7.</li>
                            <li><strong>Armor of Undeath.</strong> You have natural armor of AC 17.</li>
                            <li><strong>Undead Nature.</strong> A lich doesn’t require air, food, drink,
                                or sleep.</li>
                            <li><strong>Resilient Form.</strong> Your hit point maximum increases to 313
                                if it was not already higher.</li>
                            <li>Damage Resistances Cold, Lightning, Necrotic</li>
                            <li>Damage Immunities Poison; Physical.</li>
                            <li>Condition Immunities Charmed, Exhaustion, Frightened, Paralyzed,
                                Poisoned</li>
                            <li>Senses Truesight 120 ft</li>
                            <li><strong>Turn Resistance.</strong> The lich has advantage on saving
                                throws against any effect that turns undead.</li>
                            <li><strong>Spell Mastery.</strong> Casting a spell with a Tertiary Slot no
                                longer requires a charge and can be cast with two actions. Choose three
                                spells of any level from any spell list, they are wizard spells for you
                                and appear in your spell book.</li>
                        </ul>
                    </details>

                    <h1>Abjuration</h1>
                    <h3>Level 3: Abjurant Savant</h3>
                    <p>When you cast a abjuration spell with a Primary Spell Slot that would otherwise
                        cost 2 actions, the casting time is instead one action.</p>
                    <h3>Level 3:</h3>
                    <p>When you cast an Abjuration spell with a spell slot, you can simultaneously use a strand of the
                        spell's magic to create a magical ward on yourself that lasts until you finish a Long Rest. The
                        ward
                        has a Hit Point maximum equal to twice your Wizard level plus your Intelligence modifier.
                        Whenever
                        you take damage, the ward takes the damage instead, and if you have any Resistances or
                        Vulnerabilities, apply them before reducing the ward’s Hit Points. If the damage reduces the
                        ward to
                        0 Hit Points, you take any remaining damage. While the ward has 0 Hit Points, it can’t absorb
                        damage, but its magic remains.</p>

                    <p>Whenever you cast an Abjuration spell with a spell slot, the ward regains a number of Hit Points
                        equal to twice the level of the spell slot. Alternatively, as a Bonus Action, you can expend a
                        spell
                        slot, and the ward regains a number of Hit Points equal to twice the level of the spell slot
                        expended.</p>
                    <p>

                        Once you create the ward, you can't create it again until you finish a Long Rest.</p>


                    <h3>Level 6: Projected Ward</h3>
                    <p>When a creature that you can see within 30 feet of yourself takes damage, you can take a Reaction
                        to
                        cause your Arcane Ward to absorb that damage. If this damage reduces the ward to 0 Hit Points,
                        the
                        warded creature takes any remaining damage. If that creature has any Resistances or
                        Vulnerabilities,
                        apply them before reducing the ward's Hit Points.</p>

                    <h3>Level 10: Spell Breaker</h3>
                    <p>You always have the Counterspell and Dispel Magic spells prepared. In addition you can add your
                        Proficiency Bonus to Dispel Magic's ability check.</p>

                    <p>When you cast either spell with a spell slot, that slot isn't expended if the spell fails to stop
                        a
                        spell.</p>

                    <h3>Level 14: Spell Resistance</h3>
                    <p>You have Advantage on saving throws against spells, and you have Resistance to the damage of
                        spells.
                    </p>

                    <h3>Level 20:</h3>
                    <p>
                    </p>

                    <h1>Illusion</h1>
                    <h3>Level 3: Illusion Savant</h3>
                    <p>When you cast a Illusion spell with a Primary Spell Slot that would otherwise
                        cost 2 actions, the casting time is instead one action.</p>
                    <h3>Level 3: Improved Illusions</h3>
                    <p>You can cast Illusion spells without providing Verbal components, and if an Illusion spell you
                        cast
                        has a range of 10+ feet, the range increases by 60 feet.</p>
                    <p>

                        You also know the Minor Illusion cantrip. If you already know it, you learn a different Wizard
                        cantrip of your choice. The cantrip doesn’t count against your number of cantrips known. You can
                        create both a sound and an image with a single casting of Minor Illusion.</p>


                    <h3>Level 6: Phantasmal Creatures</h3>
                    <p>You always have the Summon Beast and Summon Fey spells prepared. Whenever you cast either spell,
                        you
                        can change its school to Illusion, which causes the summoned creature to appear spectral. You
                        can
                        cast the Illusion version of each spell without expending a spell slot, but casting it without a
                        slot halves the creature’s Hit Points. Once you cast either spell without a spell slot, you must
                        finish a Long Rest before you can cast the spell in that way again.</p>

                    <h3>Level 10: Illusory Self</h3>
                    <p>When a creature hits you with an attack roll, you can take a Reaction to interpose an illusory
                        duplicate of yourself between the attacker and yourself. The attack automatically misses you,
                        then
                        the illusion dissipates.</p>
                    <p>

                        Once you use this feature, you can't use it again until you finish a Short or Long Rest. You can
                        also restore your use of it by expending a level 2+ spell slot (no action required).</p>

                    <h3>Level 14: Illusory Reality
                    </h3>
                    <p>You have learned to weave shadow magic into your illusions to give them a semi-reality. When you
                        cast
                        an Illusion spell with a spell slot, you can choose one inanimate, nonmagical object that is
                        part of
                        the illusion and make that object real. You can do this on your turn as a Bonus Action while the
                        spell is ongoing. The object remains real for 1 minute, during which it can't deal damage or
                        give
                        any conditions. For example, you can create an illusion of a bridge over a chasm and then make
                        it
                        real and cross it.
                    </p>

                    <h3>Level 20:</h3>
                    <p>
                    </p>

                    <h1>Evocation</h1>
                    <h3>Level 3: Evocation Savant</h3>
                    <p>When you cast a Illusion spell with a Primary Spell Slot that would otherwise
                        cost 2 actions, the casting time is instead one action.</p>
                    <h3>Level 3: Potent Cantrip</h3>
                    <p>Your damaging cantrips affect even creatures that avoid the brunt of the effect. When you cast a
                        cantrip at a creature and you miss with the attack roll or the target succeeds on a saving throw
                        against the cantrip, the target takes half the cantrip’s damage (if any) but suffers no
                        additional
                        effect from the cantrip.</p>


                    <h3>Level 6: Sculpt Spells</h3>
                    <p>You can create pockets of relative safety within the effects of your evocations. When you cast an
                        Evocation spell that affects other creatures that you can see, you can choose a number of them
                        equal
                        to 1 plus the spell's level. The chosen creatures automatically succeed on their saving throws
                        against the spell, and they take no damage if they would normally take half damage on a
                        successful
                        save.</p>

                    <h3>Level 10: Empowered Evocation</h3>
                    <p> Whenever you cast a Wizard spell from the Evocation school, you can add your Intelligence
                        modifier
                        to one damage roll of that spell.</p>


                    <h3>Level 14: Overchannel</h3>
                    <p>You can increase the power of your spells. When you cast a Wizard spell with a spell slot of
                        levels
                        1-5 that deals damage, you can deal maximum damage with that spell on the turn you cast it.
                    </p>
                    <p>The first time you do so, you suffer no adverse effect. If you use this feature again before you
                        finish a Long Rest, you take 2d12 Necrotic damage for each level of the spell slot immediately
                        after
                        you cast it. This damage ignores Resistance and Immunity. Each time you use this feature again
                        before finishing a Long Rest, the Necrotic damage per spell level increases by 1d12.</p>
