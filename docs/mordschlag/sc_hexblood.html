                <h1>The Vampire</h1>

                <h2>Level 3: A Vampire's Bite</h2>
                <p>When you hit a creature with an attack, you can bite the creature as part of that
                    attack if you expend a Feat slot.</p>
                <p>A bit creature makes a Physical DC Wisdom save on the end of their next turn, or they become charmed
                    by you for 1 minute, afterwhich they repeat the save. A second failure causes them to be charmed for
                    10 minutes. A creature charmed by you subtracts 1d8 from their attack rolls
                    while you are
                    in line of sight.</p>
                <h2>Level 7: Vampiric Aspects</h2>
                <p>You no longer require sleep, food, or drink, and you always have the effects of the Spider Climb
                    spell. Additionally while Pain Bank is active, your speed increases by 10 feet</p>
                <h2>Level 14: Vampiric Aspects II</h2>
                <p>When you use A Vampire's Bite, the next attack roll you make adds 1d8 to the result.</p>
                <p>Additionally you may spend a Feat Slot and two actions to cast the spell Polymorph on yourself. The
                    only form you may take is that of a bat, but you retain your mental statistics and can dismiss the
                    form as an action.</p>
                <h2>Level 20: Night Beast</h2>
                <p>When you start your turn in dim or dark light, your speed increases by 10 feet. </p>

                <h1>The Lycan</h1>
                <h3>Level 3: Hybrid Transformation</h3>
                <p>You learn to control the lycanthropic curse that courses through your veins. As an
                    action, you transform into a special hybrid form for up to 1 hour. You can speak, use
                    equipment, and wear armor while in this form, and can revert to your normal form as a bonus action.
                    You automatically revert to your normal form if you fall unconscious or die.</p>
                <p> Once you use this feature,
                    you must finish a short or long rest before you can use it again. While you are transformed, you
                    gain the following features:</p>
                <ul>
                    <li>Feral Might. You have advantage on Strength checks and Strength saving throws, and you have a +1
                        bonus to melee damage rolls. This bonus increases to +2 at 10th level and to +3 at 15th level.
                    </li>
                    <li>Resilient Hide. You have resistance to Physical damage from
                        nonmagical attacks not made with silvered weapons. Additionally, while you are not wearing heavy
                        armor, you have a +1 bonus to AC.</li>
                    <li>Predatory Strikes. You treat your unarmed strikes as one weapon. You can use Dexterity instead
                        of
                        Strength for the attack and damage rolls
                        of your unarmed strikes, which deal 1d6 Physical damage. This
                        damage increases to 1d8 at 11th level.
                        Additionally, when you use the Attack action to make an unarmed strike, you can make one
                        additional fatigued unarmed strike, such as with light weapons.</li>
                    <li>Bloodlust. If you start your turn with fewer hit points than half your hit point maximum, you
                        must succeed on a DC 8 Wisdom saving throw or move directly toward the nearest creature and use
                        the Attack action against that creature. If you’re concentrating on a spell or are under an
                        effect that prevents you from concentrating (such as the barbarian’s Rage feature), you
                        automatically fail this saving throw.</li>
                </ul>
                <h3>Level 7: Bark At The Moon</h3>
                <p>Your speed increases by 10 feet, and you add 10 feet to your long jump distance and 3
                    feet to your high jump distance. Your hybrid form also gains the following additional benefit.</p>
                <p>Improved Predatory Strikes. You have a +1 bonus to attack rolls made with your unarmed strike. This
                    bonus increases to +2 at 11th level and to +3 at 18th level. Additionally, while Pain Banks is
                    active, your unarmed strikes are considered
                    magical for the purpose of overcoming resistance and immunity to nonmagical attacks and damage.</p>

                <h3>Level 14: Advanced Transformation</h3>
                <p>Lycan Regeneration. At the start of each of your turns when you have at least 1 hit point but fewer
                    hit points than half your hit point maximum, you gain hit points equal to 1 + your Mental
                    modifier (minimum of 1). If you are in hybrid form, you gain these hit points before you must make
                    the saving throw for your bloodlust.</p>

                <h3>Level 20: Transformation Mastery</h3>
                <p>You have mastered your inner predator. You can use your Hybrid Transformation feature
                    an unlimited number of times, and your hybrid form lasts until you revert to your normal form, fall
                    unconscious, or die. Additionally, you can use the <em>Fear</em> Feat as an action without expending
                    a Feat slot.</p>
