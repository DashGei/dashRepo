                <h5>Chapter 4, Combat</h5>
                <p>Danger is an unavoidable part of an adventurer's life.</p>

                <p>Bandits, monsters, rival warriors, and ancient horrors all threaten those who seek their way in the
                    world. When words fail and violence begins, the game enters combat.</p>

                <p>Combat in Mordschlag is fast-paced, tactical, and highly interactive. Positioning, teamwork,
                    reactions, and resource management all play important roles in determining victory.</p>

                <p>This chapter explains the rules governing combat.</p>

                <hr>

                <h2>The Order of Combat</h2>

                <p>A typical combat encounter is a clash between two sides: a flurry of weapon swings, feints, parries,
                    footwork, and spellcasting. The game organizes combat into a cycle of rounds and turns. A round
                    represents about 6 seconds in the game world. During a round, each participant in a battle takes a
                    turn. The order of turns is determined at the beginning of combat when everyone rolls Initiative.
                    Once everyone has taken a turn, the fight continues to the next round if neither side is defeated.
                </p>

                <h2>Combat Step by Step</h2>

                <p>Combat unfolds in these steps:</p>

                <ol>
                    <li><strong>Establish Positions.</strong> The Dungeon Master determines where all the characters and
                        monsters are located.</li>

                    <li><strong>Roll Initiative.</strong> Everyone involved in the combat encounter rolls Initiative,
                        determining the order of combatants’ turns.</li>

                    <li><strong>Take Turns.</strong> Each participant in the battle takes a turn in Initiative order.
                        When everyone involved in the combat has had a turn, the round ends. Repeat this step until the
                        fighting stops.</li>
                </ol>

                <h2>Initiative</h2>

                <p>Initiative determines the order of turns during combat. When combat starts, every participant rolls
                    Initiative by making a Dexterity check that determines their place in the Initiative order. The DM
                    rolls for monsters. For a group of identical creatures, the DM makes a single roll, so each member
                    of the group has the same Initiative.</p>

                <p><strong><em>Surprise!</em></strong> If a combatant is surprised by combat starting, that combatant
                    has Disadvantage on their Initiative roll. For example, if an ambusher starts combat while hidden
                    from a foe who is unaware that combat is starting, that foe is surprised.</p>

                <p><strong><em>Initiative Order.</em></strong> A combatant’s check total is called their Initiative
                    count, or Initiative for short. The DM ranks the combatants, from highest to lowest Initiative. This
                    is the order in which they act during each round. The Initiative order remains the same from round
                    to round.</p>

                <p><strong><em>Ties.</em></strong> If a tie occurs, the tied creatures each roll 1d10, the one with the
                    higher roll goes first.</p>

                <h2>Your Turn</h2>

                <p><strong>On your turn, you can move a distance up to your Speed and take two actions.</strong></p>

                <p>The main combat actions you can take are listed in “Actions" later in this chapter. A character’s
                    features and a monster’s stat block also provide action options. “Movement” later in this chapter
                    gives the rules for movement. If you are looking for a comprehensive list of actions, look inside
                    the rules glossary.</p>

                <p><strong><em>Communicating.</em></strong> You can communicate however you are able-through brief
                    utterances and gestures-as you take your turn. Doing so does not require an action on your part.</p>

                <p>Extended communication, such as a detailed explanation of something or an attempt to persuade a foe,
                    requires an action. The Influence action is the main way you try to influence a monster.</p>

                <p><strong><em>Interacting with Things.</em></strong> You can interact with one object or feature of the
                    environment for free. For example, you could open a door during your turn as you stride toward a
                    foe.</p>

                <p>If you want to interact with a second object, you need to take the Utilize action. Some magic items
                    and other special objects always require an action to use, as stated in their descriptions.</p>

                <p><strong><em>Doing Nothing on Your Turn.</em></strong> You can forgo moving, taking an action, or
                    doing anything at all on your turn. If you can’t decide what to do, consider taking the defensive
                    Dodge action.</p>

                <hr>

                <h2>Movement</h2>

                <p>On your turn, you can move a distance equal to your Speed or less. Or you can decide not to move.
                </p>

                <p>Your movement can include Climbing, Crawling, Teleportation, Jumping, and Swimming (each
                    explained in the Rules Glossary). These different modes of movement can be combined with your
                    regular movement, or they can constitute your entire move.</p>

                <p>However you’re moving with your Speed, you deduct the distance of each part of your move from it
                    until it's used up or until you are done moving, whichever comes first.</p>

                <h3>Playing on a Grid</h3>

                <p>If you play using a square grid and miniatures or other tokens, follow these rules.</p>

                <p><strong><em>Squares.</em></strong> Each square represents 5 feet.</p>

                <p><strong><em>Speed.</em></strong> Rather than moving foot by foot, move square by square on the grid,
                    using your Speed in 5-foot segments. You can translate your Speed into squares by dividing it by 5.
                    For example, a Speed of 30 feet translates into 6 squares. If you use a grid often, consider writing
                    your Speed in squares on your character sheet.</p>

                <p><strong><em>Entering a Square.</em></strong> To enter a square, you must have enough movement left to
                    pay for entering. It costs 1 square of movement to enter an unoccupied square that’s adjacent to
                    your space (orthogonally or diagonally adjacent). A square of Difficult Terrain costs 2 squares to
                    enter. Other effects might make a square cost even more.</p>

                <p><strong><em>Corners.</em></strong> Diagonal movement can’t cross the corner of a wall, a large tree,
                    or another terrain feature that fills its space.</p>

                <p><strong><em>Ranges.</em></strong> To determine the range on a grid between two things-whether
                    creatures or objects-count squares from a square adjacent to one of them and stop counting in the
                    space of the other one. Count by the shortest route.</p>

                <h3>Creature Size</h3>

                <p>A creature belongs to a size category, which determines the width of the square space the creature
                    occupies on a map, as shown on the Creature Size and Space table. That table lists the sizes from
                    smallest (Tiny) to largest (Gargantuan). A creature’s space is the area that it effectively controls
                    in combat and the area it needs to fight effectively.</p>

                <p>A character’s size is determined by species, and a monster’s size is specified in the monster’s stat
                    block.</p>

                <hr>

                <h2>Difficult Terrain</h2>

                <p>Difficult terrain slows movement.</p>

                <p>Each foot of movement through difficult terrain costs an additional foot of movement.</p>

                <p>Examples include:</p>

                <ul>
                    <li>Rubble</li>

                    <li>Deep snow</li>

                    <li>Thick undergrowth</li>

                    <li>Knee height water</li>
                </ul>

                <p>Multiple sources of difficult terrain do not stack unless a feature states otherwise. The Dungeon
                    Master determines whether terrain restricts movement.</p>

                <hr>

                <h2>Actions and Reactions</h2>

                <p>Most activities in and out of combat require actions. A creature has two actions to use on their
                    turn, and regains these actions when their next turn starts.</p>

                <p>Actions have different costs; for example, the Attack action costs one action, and so does the Dash
                    action, allowing you to Dash and Attack to use both of your actions on the same turn.</p>

                <p>If an action requires more than the two actions you receive on your turn, such as some spellcasting
                    or firearm actions, its cost is spread across multiple turns. If an action costs three actions, you
                    spend two actions on one turn and the remaining action on your next turn to complete it.</p>

                <p>A creature has one Reaction, which can only be used when its triggering condition is met.</p>

                <hr>

                <h2>Attack Action</h2>

                <p><strong>Cost:</strong> 1 Action</p>

                <p>When you take the Attack action, you make an attack. Some other actions and Reactions also allow you
                    to make an attack. Whether you strike with a melee weapon, fire a ranged weapon, or make an attack
                    roll as part of a spell, every attack follows this structure:</p>

                <ol>
                    <li><strong>Choose a Target.</strong> Pick a target within your attack's range: a creature, an
                        object, or a location.</li>

                    <li><strong>Determine Modifiers.</strong> The DM determines whether the target has Cover and
                        whether you have Advantage or Disadvantage against the target. Spells, special abilities, and
                        other effects may also grant bonuses or penalties to your attack roll.</li>

                    <li><strong>Resolve the Attack.</strong> Make the attack roll. On a hit, roll damage unless the
                        attack specifies otherwise. Some attacks cause additional effects instead of or in addition to
                        damage.</li>
                </ol>

                <hr>

                <h2>Attack Rolls</h2>

                <p>When making an attack with a weapon, unarmed strike, or spell:</p>

                <ol>
                    <li>Roll a d20.</li>

                    <li>Add the relevant modifier.</li>

                    <li>Add your Proficiency Bonus if you are proficient with the weapon.</li>

                    <li>Compare the result to the target's Armor Class.</li>
                </ol>

                <p>If the result equals or exceeds the target's Armor Class, the attack hits.</p>

                <hr>

                <h2>Armor Class</h2>

                <p>A creature's Armor Class represents how well the creature avoids being wounded in combat. A
                    character's AC is determined during character creation, while a monster's AC appears in its stat
                    block.</p>

                <p><strong><em>Calculating AC.</em></strong> All creatures begin with the same base Armor Class
                    calculation:</p>

                <p><strong>Base AC</strong> = 10 + the creature's Dexterity modifier</p>

                <p>A creature's AC can then be modified by armor, magic items, spells, and other effects.</p>

                <p><strong><em>Only One Base AC.</em></strong> Some spells and class features provide alternate methods
                    of calculating Armor Class. If a creature has multiple base AC calculations available, it must
                    choose one. Only one base calculation can apply at a time.</p>

                <h2>Magic Action</h2>

                <p><strong>Cost:</strong> Varies</p>

                <p>When you take the Magic Action, you cast a spell.</p>

                <p>The number of actions required depends on the spell slot used.</p>

                    </table>
                </div>

                <p>After casting a spell, you gain the Fatigued condition until the start of your next turn.</p>

                <p>Some class features modify or ignore this penalty.</p>

                <p>Rules for spellcasting are explained in Chapter 8.</p>

                <hr>

                <h2>Dash Action</h2>

                <p><strong>Cost:</strong> 1 Action</p>

                <p>When you take the Dash action, your Speed increases by 15 feet until the start of your next turn.</p>

                <hr>

                <h2>Disengage Action</h2>

                <p><strong>Cost:</strong> 2 Actions</p>

                <p>Creatures cannot take the Attack action against you with Reactions, such as Opportunity Attacks or
                    Riposte.</p>

                <hr>

                <h2>Dodge Action</h2>

                <p><strong>Cost:</strong> 2 Actions</p>

                <p>When you take the Dodge action, until the start of your next turn:</p>

                <ul>
                    <li>Attack rolls against you have Disadvantage.</li>

                    <li>You have Advantage on Dexterity saving throws.</li>
                </ul>

                <hr>

                <h2>Help Action</h2>

                <p><strong>Cost:</strong> 2 Actions</p>

                <p>When you take the Help action, choose one of the following options.</p>

                <p><strong><em>Assist an Ability Check.</em></strong> Choose one of your skill or tool proficiencies and
                    one ally who is close enough for you to assist verbally or physically. That ally gains Advantage on
                    the next ability check they make using the chosen skill or tool before the start of your next turn.
                    The DM determines whether your assistance is possible.</p>

                <p><strong><em>Assist an Attack Roll.</em></strong> Distract an enemy within 5 feet of you, granting one
                    ally Advantage on the next attack roll they make against that enemy before the start of your next
                    turn. Alternatively, you may assist an adjacent ally, granting them Advantage on their next attack
                    roll before the start of your next turn.</p>

                <hr>

                <h2>Hide Action</h2>

                <p><strong>Cost:</strong> 2 Actions</p>

                <p>When you take the Hide action, attempt to conceal yourself. You must succeed on a DC 15 Dexterity
                    (Stealth) check while you are Heavily Obscured or behind Three-Quarters Cover or Total Cover,
                    and you must be outside every enemy's line of sight.</p>

                <p>On a successful check, you gain the Invisible condition while hidden. Record the total of your
                    check, which becomes the DC for creatures attempting to locate you with a Wisdom (Perception)
                    check.</p>

                <p>You immediately stop being hidden if you make a sound louder than a whisper, an enemy finds you, you
                    make an attack roll, or you cast a spell with a Verbal component.</p>

                <hr>

                <h2>Ready Action</h2>

                <p><strong>Cost:</strong> 2 Actions</p>

                <p>Prepare a single action with a cost of one action and specify a trigger.</p>

                <p>When the trigger occurs before the start of your next turn, you may immediately perform the chosen
                    action as a Reaction.</p>

                <p>If the trigger never occurs, the prepared action is lost.</p>

                <hr>

                <h2>Free Interactions</h2>

                <p>Certain minor activities require no action.</p>

                <p>Examples include:</p>

                <ul>
                    <li>Drawing a weapon.</li>

                    <li>Opening an unlocked door.</li>

                    <li>Picking up a small object.</li>

                    <li>Speaking briefly.</li>
                </ul>

                <p>The Dungeon Master determines whether an interaction is sufficiently minor.</p>

                <hr>

                <h2>Critical Hits</h2>

                <p>If you roll a 20 on the d20 for an attack roll, you score a Critical Hit. The attack automatically
                    hits regardless of modifiers or the target's Armor Class.</p>

                <p>A Critical Hit allows you to roll all of the attack's damage dice twice, then add the results
                    together before applying any relevant modifiers.</p>

                <p><strong>Example:</strong></p>

                <p>A Ranger wielding a longsword rolls a natural 20 on an attack roll. They roll 2d8 instead of 1d8 for
                    the longsword's damage and 4d4 instead of 2d4 from Hunter's Mark. They then add their Strength
                    modifier once as normal.</p>

                <p>Note that critical rolls only apply to attack rolls, not saving throws or ability checks.</p>

                <hr>

                <h2>Damage</h2>

                <p>Successful attacks and harmful effects deal damage.</p>

                <p>When damage is taken, reduce the target's Hit Points by the amount dealt.</p>

                <hr>

                <h2>Immunity, Resistance, and Vulnerability</h2>

                <p>Some creatures possess Resistance or Vulnerability.</p>

                <p>Resistance halves incoming damage of the specified type.</p>

                <p>Vulnerability doubles incoming damage of the specified type.</p>

                <p>Apply Resistance before Vulnerability unless a feature states otherwise.</p>

                <hr>

                <h2>Reactions</h2>

                <p>Certain special abilities, spells, and situations allow you to take a special action called a
                    Reaction. A Reaction is an instant response to a trigger, which can occur on your turn or another
                    creature's turn.</p>

                <p>When you take a Reaction, you can't take another one until the start of your next turn. If your
                    Reaction interrupts another creature's turn, that creature continues its turn immediately afterward.
                </p>

                <p>A Reaction occurs immediately after its trigger unless its description states otherwise.</p>

                <hr>

                <h2>Cover</h2>

                <p>Obstacles can provide protection from attacks and effects.</p>

                <p>The Dungeon Master determines whether a target has cover.</p>

                <p>Typical cover categories include:</p>

                <hr>

                <h2>Hit Points</h2>

                <p>Hit Points represent durability and the will to live. Creatures with more Hit Points are more
                    difficult to kill. Your Hit Point maximum is the number of Hit Points you have when uninjured.</p>

                <p>Your current Hit Points can be any number from your maximum down to 0, which is the lowest your Hit
                    Points can go.</p>

                <p>Whenever you take damage, subtract it from your Hit Points. Losing Hit Points has no effect on your
                    capabilities until you reach 0 Hit Points.</p>

                <p>If you have half your Hit Points or fewer, you're Bloodied. This has no game effect on its own but
                    may trigger other abilities or effects.</p>

                <p>Rules for Death Saves are detailed later in this chapter.</p>

                <hr>

                <h2>Healing and Temporary Hit Points</h2>

                <h4>Healing</h4>

                <p>When a feature restores Hit Points, the creature regains Hit Points equal to the amount healed, up to
                    its Hit Point maximum.</p>

                <p><strong>Example:</strong> If you receive 8 Hit Points of healing while at 14 Hit Points with a
                    maximum of 20, you regain only 6 Hit Points.</p>

                <h4>Temporary Hit Points</h4>

                <p>If you have Temporary Hit Points and take damage, those points are lost first. Any remaining damage
                    is then applied to your Hit Points.</p>

                <p><strong>Example:</strong> If you have 5 Temporary Hit Points and take 7 damage, you lose the 5
                    Temporary Hit Points and then lose 2 Hit Points.</p>

                <p>Temporary Hit Points last until they are depleted or you finish a Long Rest.</p>

                <p>Temporary Hit Points cannot be combined. If you gain Temporary Hit Points while you already have
                    some, choose whether to keep the existing amount or gain the new amount.</p>

                <p><strong>Example:</strong> If you have 10 Temporary Hit Points and gain 12 more, you may have either
                    10 or 12 Temporary Hit Points, not 22.</p>

                <h2>Dropping to 0 Hit Points</h2>

                <p>When you start your turn with 0 Hit Points, you begin dying and must make a Death Saving Throw.</p>

                <p>Make a d20 saving throw. Unlike other saving throws, this roll isn't tied to an ability score.</p>

                <p><strong>20-16:</strong> You start your turn as normal.</p>

                <p><strong>15-11:</strong> You start your turn with one Action.</p>

                <p><strong>10-5:</strong> You start your turn with no Actions and gain one level of Exhaustion.</p>

                <p><strong>4-1:</strong> You start your turn with no Actions, gain two levels of Exhaustion, and fall
                    Prone at the end of your turn.</p>

                <p>Once per turn, whenever you take damage while at 0 Hit Points, you gain one level of Exhaustion.</p>

                <p><strong>Aiding a Dying Character.</strong> A creature can use an Action to make a DC 10 Medicine
                    check. On a success, the dying creature has Advantage on its next Death Saving Throw.</p>

                <hr>

                <h2>Stabilizing a Creature</h2>

                <p>A creature within reach can attempt to stabilize an unconscious creature.</p>

                <p>The Dungeon Master may require a Wisdom (Medicine) check.</p>

                <p>A stabilized creature remains at 0 Hit Points but no longer makes Death Saving Throws.</p>

                <hr>

                <h2>Summary</h2>

                <p>Combat follows a simple structure:</p>

                <ol>
                    <li>Roll Initiative.</li>

                    <li>Take turns.</li>

                    <li>Move and spend Actions.</li>

                    <li>Use Reactions when opportunities arise.</li>

                    <li>Continue until the encounter ends.</li>
                </ol>
