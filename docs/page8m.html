                <h3>Boons and Woes</h3>

                <p>Boons are occasional minor bonuses that the party may obtain by maintaining good relationships with
                    gods. Each god has their own set of boons. Some may give players resources to spend during the day,
                    while others may only activate when the DM chooses.</p>

                <p>Some Boons and Woes require tracking the Velthraen Calendar. Additionally, if a Boon or Woe affects
                    one party member once per day or week, it only occurs the first time that party member triggers it,
                    ignoring subsequent triggers by other party members until the Boon or Woe refreshes.</p>

                <h2>Ea’or</h2>

                <p><em>The Lovers, Patron of Passion and Aesthetics</em></p>

                <p>Ea'or is the embodiment of the smaller, fuchsia star in the center of the planescape. Ea'or was
                    created alongside their companion god Sol when the central star was split upon arrival of the gods.
                    Ea'or is responsible for the creation of Elves, and their daughter goddess Lumiere who embodies the
                    moon.</p>

                <p><strong>Domains:</strong> Beauty, passion, twilight, Elves<br>
                    <strong>Worship Method:</strong> Discipline 
                </p>

                <h3>Favor Criteria</h3>

                <ul>
                    <li>The party commissions, restores, or protects a significant work of art.</li>

                    <li>Two or more party members share a bottle of wine in Ea’or’s name.</li>

                    <li>The party thwarts a Drow or agent(s) of Lolth.</li>
                </ul>

                <h3>Disfavor Criteria</h3>

                <ul>
                    <li>The party deliberately destroys an artwork.</li>

                    <li>They side with forces that suppress artistic freedom.</li>

                    <li>The party sides with Drow or agent(s) of Lolth.</li>
                </ul>

                <h3>Boons</h3>

                <p><strong>Minor Boon (FP 3-5): Silver Tongues.</strong> Party members re-roll any 1s on Charisma
                    (Performance) checks.</p>

                <p><strong>Boon (FP 6-9): Moonchild.</strong> Once per long rest, a party member can cast the spell
                    <em>Invisibility</em> without expending a spell slot.
                </p>

                <p><strong>Major Boon (FP 10): Ea’or’s Muse.</strong> Once per week (resetting on Same'ih), the party
                    can complete a long rest in 4 hours instead of 8 if bathed in direct moonlight. Additionally, any
                    Charisma ability checks made on the subsequent day gain a 1d4 bonus.</p>

                <h3>Woes</h3>

                <p><strong>Minor Woe (FP -3 to -4): Jaded Eye.</strong> The first Charisma check a party member makes
                    per day suffers a -1d4 penalty.</p>

                <p><strong>Greater Woe (FP -5): See How You Like It.</strong> Once per week (resetting on Same'ih), none
                    of the party's accomplishments are recognized in any meaningful way.</p>

                <hr>

                <h2>Lumiere</h2>

                <p><em>The Moon, Patron of Discipline</em></p>

                <p>Lumiere reflects her parent deity's light so that her followers may see through the night. To her and
                    her devotees, every arrow loosed, silent footstep felled, and craft perfected is a work of art unto
                    itself.</p>

                <p><strong>Domains:</strong> Discipline, archery, precision, moonlight, perfection, mastery of the self,
                    Moor Elves<br>
                    <strong>Worship Method:</strong> <strong>Discipline</strong>
                </p>

                <h3>Favor Criteria</h3>

                <ul>
                    <li>A party member spends downtime meditating, maintaining their bow, and fletching arrows.</li>

                    <li>The party completes a difficult task through patience rather than speed.</li>

                    <li>Two or more party members train together during a long rest or downtime.</li>

                    <li>A party member willingly repeats a failed attempt until they succeed instead of abandoning it.
                    </li>
                </ul>

                <h3>Disfavor Criteria</h3>

                <ul>
                    <li>A party member abandons a worthy pursuit simply because it proves difficult.</li>

                    <li>A party member knowingly neglects their equipment or training.</li>
                </ul>

                <h3>Boons</h3>

                <p><strong>Minor Boon (FP 3-5): Moonlit Meditations.</strong> Repeated failed mentorship checks no
                    longer prevent party members from learning skills until level up.</p>

                <p><strong>Boon (FP 6-9): Deft.</strong> During nighttime, party members re-roll 1s on ranged attack
                    rolls with ranged weapon attacks.</p>

                <p><strong>Major Boon (FP 10): Silver Sights.</strong> The party has the Silver Sight racial bonus. An
                    Elf receives the benefits even if they are not in moonlight.</p>

                <h3>Woes</h3>

                <p><strong>Minor Woe (FP -3 to -4): Shaken Hands.</strong> Once per day, the first time a party member
                    makes an attack roll with a ranged weapon or a Dexterity-based tool check, subtract 1d4 from the
                    roll.</p>

                <p><strong>Greater Woe (FP -5): Under a Glass Moon.</strong> During nighttime outdoors, the party has
                    Disadvantage on Perception checks that rely on sight even in lit spaces.</p>

                <hr>

                <h2>Frey</h2>

                <p><em>The World, Patron of the Hearth</em></p>

                <p>Frey is the patron god of Halflings, homely ideals, and taking in strangers from the night. It isn't
                    difficult to find signs of Frey worship and his (or sometimes her) followers are known to leave kind
                    hearted messages above fireplaces or on the beds of inns they especially enjoyed. Many tavern-esque
                    establishments leave offering tables to Frey in the middle of their main rooms.</p>

                <p><strong>Domains:</strong> Community, fertility, hospitality, Halflings<br>
                    <strong>Worship Method:</strong> Devotion 
                </p>

                <h3>Favor Criteria</h3>

                <ul>
                    <li>They defend a farmstead or common folk from a threat.</li>

                    <li>The party partakes in a communal meal or celebration in Frey’s name.</li>

                    <li>The party invites one or more NPCs over for dinner.</li>

                    <li>They convince others to honor Frey’s simple rituals.</li>
                </ul>

                <h3>Disfavor Criteria</h3>

                <ul>
                    <li>They abandon a community in need when aid was within their power.</li>

                    <li>They mock the value of hard, honest labor.</li>

                    <li>The party is exceptionally impolite to people hosting them.</li>
                </ul>

                <h3>Boons</h3>

                <p><strong>Minor Boon (FP 3-5): Hearty Meal.</strong> Once per long rest, when the party finishes a
                    short rest and consumes food, each member regains an extra 1d4 hit points.</p>

                <p><strong>Boon (FP 6-9): Kind Beginnings.</strong> Once per long rest, when the party meets a new NPC,
                    2d6 is added to the first Charisma check made with that creature.</p>

                <p><strong>Major Boon (FP 10): Cornucopia.</strong> Once per week (Resetting on Frejdag), when a party
                    member opens an unoccupied room (such as a rented chamber, an abandoned cottage, or a cleared
                    cellar), the DM may have a <em>Heroes’ Feast</em> spell appear inside, laid out moments before their
                    arrival. A card depicting a cornucopia with fine lettering reading, <em>“To my good friends, come
                        and make merry,”</em> rests plainly upon the feast.</p>

                <h3>Woes</h3>

                <p><strong>Minor Woe (FP -3 to -4): No Quarter.</strong> Once per week, when the party visits a hostel
                    or inn, that inn is closed or otherwise unaccepting of guests.</p>

                <p><strong>Greater Woe (FP -5): Bleugh.</strong> Once per week at the DM's discretion, parties must make
                    a DC 15 Strength saving throw or be poisoned by bad food for an hour upon waking.</p>

                <hr>

                <h2>Sol</h2>

                <p><em>The Sun, Patron of Valor</em></p>

                <p>Sol is the greater, golden star that warms the world and the patron god of Orcs. He appears as a
                    towering male Orc in gleaming, gilded plate, or as a colossal boar whose tusks sweep low and wide.
                    His followers champion righteousness through action, not words, and believe that the truest good is
                    a life laid down for others.</p>

                <p><strong>Domains:</strong> Righteousness, valor, self-sacrifice, dawn, Orcs<br>
                    <strong>Worship Method:</strong> Ideals 
                </p>

                <h3>Favor Criteria</h3>

                <ul>
                    <li>A party member takes a significant risk to protect an innocent or ally.</li>

                    <li>The party defeats a powerful evil without resorting to dishonorable tactics.</li>

                    <li>Two or more party members swear an oath together before a battle or important undertaking.</li>

                    <li>The party defeats or thwarts an undead or fiendish creature.</li>
                </ul>

                <h3>Disfavor Criteria</h3>

                <ul>
                    <li>The party flees a winnable fight.</li>

                    <li>They break a sworn oath or promise made in good faith.</li>

                    <li>A party member sacrifices another for personal gain or cowardice.</li>
                </ul>

                <h3>Boons</h3>

                <p><strong>Minor Boon (FP 3-5): Vigor.</strong> Once per long rest, when a party member drops below half
                    hit points, the spell <em>Heroism</em> is cast on them using that character's Mental Modifier.</p>

                <p><strong>Boon (FP 6-9): Glory Be.</strong> Once per long rest, when a party member fails a saving
                    throw against the frightened or charmed condition, the DM may allow them to succeed instead. If the
                    condition was caused by an undead or fiend, the source takes radiant damage equal to your level.</p>

                <p><strong>Major Boon (FP 10): Under the Sun.</strong> Once per long rest, one party member can cast
                    <em>Daylight</em>, or if they have direct sunlight, <em>Flame Strike</em>, without expending a spell
                    slot.
                </p>

                <h3>Woes</h3>

                <p><strong>Minor Woe (FP -3 to -4): Waning Courage.</strong> Once per day, the first time one party
                    member would gain the frightened condition, all party members within 15 feet of them must also make
                    the same saving throw or suffer the full effects.</p>

                <p><strong>Greater Woe (FP -5): Sensitive to Light.</strong> While in direct sunlight, the party no
                    longer benefits from healing during short rests. Additionally, undead, celestials, and fiendish
                    creatures have advantage on attacks against them until dusk.</p>

                <h2>Lucifer</h2>

                <p><em>The Devil, Patron of Comeuppance</em></p>

                <p>Any and all evil creatures have made a pact with Lucifer whether they know it or not. The pact
                    dictates eternal servitude and devotion, in lieu of eternal damnation. The majority of Luciferic
                    worshipers are tyrants and debt collectors, but some cults devoted to Lucifer believe they may be
                    reborn as cambions if they dedicate their lives to him.</p>

                <p><strong>Domains:</strong> Half-truths, betrayal, debts, comeuppance, Hell, Infernal Tieflings<br>
                    <strong>Worship Method:</strong> Ideals
                </p>

                <h3>Favor Criteria</h3>

                <ul>
                    <li>The party lies for meaningful gain.</li>
                    <li>The party successfully collects a debt from someone.</li>
                    <li>The party wins against a foe by underhanded tactics.</li>
                    <li>A party member traps an enemy in the words of their own promise.</li>
                    <li>The party turns an enemy’s betrayal back upon them.</li>
                </ul>

                <h3>Disfavor Criteria</h3>

                <ul>
                    <li>A party member tells the truth to an outside influence when that truth directly harms another
                        party member.</li>
                    <li>The party forgives a significant debt without extracting any payment or punishment.</li>
                    <li>A party member breaks the letter of a freely made agreement.</li>
                    <li>The party aids Demons.</li>
                </ul>

                <h3>Boons</h3>

                <p><strong>Minor Boon (FP 3-5): Sympathy for the Devil.</strong> Party members re-roll any 1s on
                    Deception checks.</p>

                <p><strong>Boon (FP 6-9): Sinister Purpose.</strong> Once per long rest, when a party member is reduced
                    to 0 hit points, the creature that damaged them becomes marked with an invisible sigil; the party
                    knows its direction for 1 hour. If the marked creature is reduced to 0 hit points before the hour
                    ends, the party member regains PB x 1d6 hit points.</p>

                <p><strong>Major Boon (FP 10): Hellish Arbiter.</strong> Once per week (resetting on Lucae), the party
                    may make a pact: When an NPC willingly signs a written agreement without magical influence, a
                    Cambion appears and writes his own name alongside the NPC's. If the NPC ever breaks this agreement
                    they are immediately reduced to 1 hit point and teleported to the party's location with the
                    Restrained condition for 1 hour as they are bound by hot iron chains. A creature bound in this way
                    is unable to verbalize anything but truths. This part of the pact must be stated in the agreement.
                </p>

                <h3>Woes</h3>

                <p><strong>Minor Woe (FP -3 to -4): Turn of the Screw.</strong> Party members never have Advantage on
                    Charisma checks against Devils.</p>

                <p><strong>Greater Woe (FP -5): Mark of the Default.</strong> A faint, infernal brand appears on the
                    party’s palms, visible only to fiends and those who deal in souls. Devils and other lawful evil
                    outsiders know if the party tells a lie to them, and their attacks add an additional 1d4 fire damage
                    to party members.</p>

                <hr>

                <h2>Yaldabaoth</h2>

                <p><em>The Tower, Patron of Chaos</em></p>

                <p>Below the blasted mountains of Hell are the endless and cyclopean labyrinths which spawn wave after
                    wave of horrid Demons. Yaldabaoth spends most of his time watching them claw at each other, though
                    occasionally he sends them to the surface to witness more exciting battles against Devils.</p>

                <p><strong>Domains:</strong> Chaos, mutiny, disease, Demons<br>
                    <strong>Worship Method:</strong> Devotion
                </p>

                <h3>Favor Criteria</h3>

                <ul>
                    <li>The party convinces enemies to turn on their leader.</li>
                    <li>The party infiltrates their enemies before defeating them.</li>
                    <li>The party turns a rigid system against itself.</li>
                    <li>They behead their enemies in the name of Yaldabaoth.</li>
                </ul>

                <h3>Disfavor Criteria</h3>

                <ul>
                    <li>The party aids Devils.</li>
                    <li>The party lets arbitrary rules prevent them from achieving their goals.</li>
                </ul>

                <h3>Boons</h3>

                <p><strong>Minor Boon (FP 3-5): Hatred.</strong> The party adds 1d4 to saving throws made against spells
                    of the Enchantment school.</p>

                <p><strong>Boon (FP 6-9): Fortified Veins.</strong> When a party member has the Poisoned condition they
                    do not have disadvantage on ability checks.</p>

                <p><strong>Major Boon (FP 10): Blanked.</strong> Once per day, when a party member lands a critical hit
                    on an enemy, that creature is affected by the <em>Crown of Madness</em> spell until the start of
                    their next turn.</p>

                <h3>Woes</h3>

                <p><strong>Minor Woe (FP -3 to -4): Mind Blight.</strong> While poisoned, a party member also has
                    disadvantage on Wisdom saving throws.</p>

                <p><strong>Greater Woe (FP -5): Ailed.</strong> Any party members with resistance or immunity to the
                    Poisoned condition no longer have that resistance or immunity.</p>

                <hr>

                <h2>Ur</h2>

                <p><em>The High Priestess, Patron of Fear</em></p>

                <p>Devils and Demons are a dime a dozen, but the rarer, more powerful children of Ur come in all shapes
                    and sizes depending on the phobia they represent. Many are powerful enough to be considered
                    demi-gods such as Lolth or Hastur, though they all originate from the plane of fear known as the
                    Shadowfell.</p>

                <p><strong>Domains:</strong> Fear, the unknown, Maels<br>
                    <strong>Worship Method:</strong> Devotion
                </p>

                <h3>Favor Criteria</h3>

                <ul>
                    <li>The party maintains a terrifying reputation.</li>
                    <li>They torment enemies before engaging.</li>
                    <li>The party exploits an enemy's phobia.</li>
                    <li>The party displays their enemies' corpses for others to see.</li>
                </ul>

                <h3>Disfavor Criteria</h3>

                <ul>
                    <li>The party succumbs to their fears.</li>
                    <li>The party panics at inopportune moments.</li>
                    <li>They permanently banish a Mael.</li>
                </ul>

                <h3>Boons</h3>

                <p><strong>Minor Boon (FP 3-5): Malefic.</strong> Party members re-roll any 1s on saving throws against
                    the Frightened condition.</p>

                <p><strong>Boon (FP 6-9): Masters of Fear.</strong> Enemies making saving throws against the Frightened
                    condition subtract 1d4 from their saving throws.</p>

                <p><strong>Major Boon (FP 10): Mind Warp.</strong> Once per week (resetting on Lucae), a party member
                    can cast the spell <em>Fear</em>.</p>

                <h3>Woes</h3>

                <p><strong>Minor Woe (FP -3 to -4): In the Shadows.</strong> When the party takes a short or long rest,
                    the DM rolls 1d12 in secret. On 1-4 nothing appears, on 5-11 two members hallucinate their fears on
                    the edge of the resting area, and on a 12 a Merrenoloth appears on the edge of the area in the
                    appearance of the party's fears.</p>

                <p><strong>Greater Woe (FP -5): Primal Fears.</strong> Any party members with resistance or immunity to
                    the Frightened condition no longer have that resistance or immunity.</p>

                <hr>

                <h2>Helm</h2>

                <p><em>Strength, Patron of Readiness</em></p>

                <p>Helm is the god of watchfulness, preparation, and the sudden storm that tests a traveler’s mettle. He
                    appears as an unreadable knight in full gothic plate, visor forever down. He speaks rarely, and only
                    to those who have proven their vigilance. He is known by condensation on cold metal, the low rumble
                    of distant thunder, the silhouette of a falcon against grey skies, and the smell of petrichor before
                    rain.</p>

                <p><strong>Domains:</strong> Watchfulness, preparedness, overland storms, raptors<br>
                    <strong>Worship Method:</strong> Discipline 
                </p>

                <h3>Favor Criteria</h3>

                <ul>
                    <li>The party posts a full watch rotation even when they believe themselves safe.</li>
                    <li>A party member maintains their equipment during downtime.</li>
                    <li>The party spots an ambush before it is sprung.</li>
                    <li>Two or more party members stand watch together and discuss their past failures, vowing to learn
                        from them.</li>
                </ul>

                <h3>Disfavor Criteria</h3>

                <ul>
                    <li>The party is caught completely unaware by an enemy.</li>
                    <li>The party dismisses a threat as paranoia.</li>
                    <li>The party becomes lost due to carelessness.</li>
                </ul>

                <h3>Boons</h3>

                <p><strong>Minor Boon (FP 3-5): Watchful Eye.</strong> Party members re-roll any 1s on Wisdom
                    (Perception) checks.</p>

                <p><strong>Boon (FP 6-9): Stormwarden.</strong> Once per week (resetting on Sulsdak), the party can cast
                    the spell <em>Glyph of Warding</em> as a ritual without components at level 3. When cast in this
                    way, the glyph is always an explosive rune which deals lightning damage.</p>

                <p><strong>Major Boon (FP 10): The Sentinel.</strong> Once per week (resetting on Sulsdak), the party
                    can cast the spell <em>Mordenkainen's Private Sanctum</em> as a ritual at level 4.</p>

                <h3>Woes</h3>

                <p><strong>Minor Woe (FP -3 to -4): Unwatched Moment.</strong> Once per day, the first time a party
                    member makes a Wisdom (Perception) check they roll with disadvantage.</p>

                <p><strong>Greater Woe (FP -5): Storm’s Ire.</strong> Once per week, when the party travels overland,
                    the DM may send a localized storm to harry them. The storm lasts 8 hours, imposing disadvantage on
                    Wisdom (Perception) checks that rely on sight or sound, extinguishing unprotected flames, and
                    halving their travel speed. The party’s first attempt to take a short rest during this storm is
                    interrupted by a sudden, deafening thunderclap.</p>

                <h2>Gri</h2>

                <p><em>The Hermit, Patron of the Harvest</em></p>

                <p>Gri walks the Shadowfell, but his hand touches the harvest fields and the lonely road alike. He is
                    the patron of autumn’s last bounty, the traveler who reaches the inn just as the door closes, and
                    the gentle guide who leads souls into the afterlife. His followers pray for full granaries, safe
                    journeys, and a peaceful death for those they love.</p>

                <p><strong>Domains:</strong> Harvest, autumn to early winter, safe travel, the process of death.<br>
                    <strong>Worship Method:</strong> Devotion
                </p>

                <h3>Favor Criteria</h3>

                <ul>
                    <li>The party leaves an offering (food, coin, or a lit candle) at a roadside shrine or crossroads.
                    </li>
                    <li>They aid a community with its harvest, or protect a harvest from ruin.</li>
                    <li>They ensure a fallen enemy or stranger receives proper burial rites.</li>
                    <li>Two or more party members share stories of lost loved ones.</li>
                    <li>The party sends an ancient undead to the afterlife.</li>
                </ul>

                <h3>Disfavor Criteria</h3>

                <ul>
                    <li>The party disturbs a grave, tomb, or funeral without cause.</li>
                    <li>They destroy a harvest or waste food in abundance.</li>
                    <li>The party raises or disturbs the dead.</li>
                </ul>

                <h3>Boons</h3>

                <p><strong>Minor Boon (FP 3-5): Pathmaker’s Blessing.</strong> Once per long rest, when the party is
                    traveling, they can roll 1d6. On a 4-6, the party completes two days of travel in half the time.</p>

                <p><strong>Boon (FP 6-9): After All.</strong> Once per long rest, the party can cast the spell <em>Speak
                        with Dead</em> as a ritual.</p>

                <p><strong>Major Boon (FP 10): Heaven Can Wait.</strong> On Frejdags, the party gains the benefits of
                    the <em>Death Ward</em> spell when they take a long rest.</p>

                <h3>Woes</h3>

                <p><strong>Minor Woe (FP -3 to -4): Bad Moon Rising.</strong> Once per day, the party’s overland travel
                    is mysteriously hindered: a sudden fog, a crumbled bridge, or other hazard delays them for 1 hour.
                </p>

                <p><strong>Greater Woe (FP -5): Children of the Grave.</strong> When the party takes a long rest, the DM
                    rolls 1d8. On an 8, a number of Will-o'-Wisps spawn in the distance equal to the party's PB x 1d2.
                </p>

                <hr>

                <h2>Ilxi</h2>

                <p><em>The Wheel, Patron of Fortune</em></p>

                <p>Ilxi came to the world and immediately became obsessed with two subjects: Humans and their fickle
                    ideals, and cats. Ilxi favors those who take bold risks, consider themselves eccentric, and live
                    life with zest.</p>

                <p><strong>Domains:</strong> Luck, illusion, Sleight of Hand, Tabaxi<br>
                    <strong>Worship Method:</strong> Ideals
                </p>

                <h3>Favor Criteria</h3>

                <ul>
                    <li>The party wins on a gamble and thanks Ilxi.</li>
                    <li>Two or more party members place bets against one another.</li>
                    <li>The party goes out of their way to aid a feline creature.</li>
                    <li>The party wins a game by misdirection.</li>
                </ul>

                <h3>Disfavor Criteria</h3>

                <ul>
                    <li>The party is cruel to a feline creature.</li>
                    <li>A party member avoids the consequences of a literal or metaphorical gamble.</li>
                </ul>

                <h3>Boons</h3>

                <p><strong>Minor Boon (FP 3-5): Fast Hands.</strong> Party members re-roll any 1s on Dexterity (Sleight
                    of Hand) checks.</p>

                <p><strong>Boon (FP 6-9): Aces High.</strong> When a party member rolls with advantage, they may re-roll
                    any 1s.</p>

                <p><strong>Major Boon (FP 10): Wheels of Confusion.</strong> Once per long rest, when a party member
                    scores a critical hit against an enemy, that enemy becomes affected by the <em>Confusion</em> spell
                    until the end of its next turn.</p>

                <h3>Woes</h3>

                <p><strong>Minor Woe (FP -3 to -4): Lullaby Letter.</strong> Once per day, when a party member makes a
                    saving throw against an Illusion spell, that roll has 1d4 subtracted from it.</p>

                <p><strong>Greater Woe (FP -5): Fool Like You.</strong> Once per long rest, when a party member rolls a
                    natural 1 on an attack roll, it hits a different creature of the DM's choice within the range of
                    that attack.</p>

                <hr>

                <h2>The Crimson King</h2>

                <p><em>The Emperor, Patron of Tyranny</em></p>

                <p>The Crimson King is the self-appointed lord of all civilization. He believes that peace is achieved
                    only through absolute authority. To him, hierarchy is the highest expression of reason, and every
                    creature belongs beneath another, and every ruler should rule without compromise. Kings, conquerors,
                    magistrates, and slavers alike invoke his name, though many never realize whose philosophy they
                    truly serve.</p>

                <p><strong>Domains:</strong> Authority, conquest, law, hierarchy, domination<br>
                    <strong>Worship Method:</strong> Ideals
                </p>

                <h3>Favor Criteria</h3>

                <ul>
                    <li>The party peacefully resolves a conflict by establishing a clear chain of command.</li>
                    <li>They successfully convince an individual or community to accept a legitimate ruler.</li>
                    <li>Two or more party members formally assign leadership responsibilities before undertaking a
                        dangerous task.</li>
                    <li>The party captures a dangerous enemy so they may face lawful judgment.</li>
                </ul>

                <h3>Disfavor Criteria</h3>

                <ul>
                    <li>The party aids a rebellion they don't believe in.</li>
                    <li>A party member openly refuses a rightful command out of pride or spite.</li>
                    <li>They free a dangerous prisoner knowing they will continue harming others.</li>
                </ul>

                <h3>Boons</h3>

                <p><strong>Minor Boon (FP 3-5): Commanding Presence.</strong> Once per long rest, a party member can use
                    the Commanding Presence feat as an action without expending a Feat Slot.</p>

                <p><strong>Boon (FP 6-9): Ordered Advance.</strong> Once per long rest, after initiative is rolled, two
                    party members may choose to swap rolls with each other.</p>

                <p><strong>Major Boon (FP 10): Crown of Iron.</strong> Once per week (resetting on Lucae), one party
                    member may cast <em>Dominate Person</em> without expending a spell slot.</p>

                <h3>Woes</h3>

                <p><strong>Minor Woe (FP -3 to -4): Banded.</strong> Once per day, one enemy can use the Help action on
                    their turn at no action cost.</p>

                <p><strong>Greater Woe (FP -5): Broken Chain.</strong> Whenever initiative is rolled, the DM may choose
                    two party members. Until the end of the first round, they cannot willingly end their turns within 10
                    feet of one another.</p>

                <hr>

                <h2>Ilmater</h2>

                <p><em>The Hanged Man, Patron of Mercy</em></p>

                <p>Ilmater bears every wound willingly so others need not suffer them. He teaches that true strength is
                    measured by compassion that is freely given, forgiveness that is sincerely offered, and burdens
                    carried without expectation of reward. His shrines are simple places where the sick are tended,
                    prisoners are fed, and even enemies receive care.</p>

                <p><strong>Domains:</strong> Mercy, compassion, endurance, healing, forgiveness<br>
                    <strong>Worship Method:</strong> Ideals
                </p>

                <h3>Favor Criteria</h3>

                <ul>
                    <li>The party spares a defeated enemy who no longer poses a threat.</li>
                    <li>A party member willingly suffers hardship so another creature does not have to.</li>
                    <li>The party provides meaningful aid to the sick, poor, or displaced without expecting payment.
                    </li>
                    <li>Two or more party members openly forgive one another for a past mistake.</li>
                    <li>The party successfully ends a conflict through reconciliation instead of violence.</li>
                </ul>

                <h3>Disfavor Criteria</h3>

                <ul>
                    <li>The party inflicts unnecessary suffering upon a helpless creature.</li>
                    <li>They refuse aid to those in desperate need despite having the means to help.</li>
                    <li>A party member seeks vengeance when justice or forgiveness would suffice.</li>
                </ul>

                <h3>Boons</h3>

                <p><strong>Minor Boon (FP 3-5): Gentle Hands.</strong> Once per long rest, when a party member restores
                    hit points to another creature, that creature also gains temporary hit points equal to the healer's
                    proficiency bonus.</p>

                <p><strong>Boon (FP 6-9): Burdens Bared.</strong> Once per long rest, when a creature within 5 feet
                    takes damage, one party member may use their reaction to take half of that damage instead. This
                    damage cannot be reduced or prevented.</p>

                <p><strong>Major Boon (FP 10): Martyr's Grace.</strong> Once per week (resetting on Same'ih), when a
                    party member would be reduced to 0 hit points, another willing party member within 60 feet may
                    choose to fall to 1 hit point instead. The original creature immediately regains hit points equal to
                    half its maximum hit points.</p>

                <h3>Woes</h3>

                <p><strong>Minor Woe (FP -3 to -4): Hardened Heart.</strong> Once per day, the first time a party member
                    restores hit points to another creature, reduce the healing by 1d4.</p>

                <p><strong>Greater Woe (FP -5): Unworthy.</strong> Whenever a party member regains hit points from a
                    spell or feature cast by another creature, the healer takes PB x 1d2 force damage.</p>

                <hr>

                <h2>Mystra</h2>

                <p><em>The Magician, Patron of the Weave</em></p>

                <p>Every spell cast draws upon Mystra's endless tapestry, whether the caster knows her name or not.
                    Mystra delights in curiosity, discovery, and the responsible pursuit of magical knowledge. She cares
                    not what her crafts are used for, as every spell is another thread woven into her endless design.
                </p>

                <p><strong>Domains:</strong> Magic, knowledge, discovery, the Weave<br>
                    <strong>Worship Method:</strong> Discipline 
                </p>

                <h3>Favor Criteria</h3>

                <ul>
                    <li>The party uncovers a previously unknown magical secret or phenomenon.</li>
                    <li>Two or more party members work together to understand an unfamiliar magical phenomenon.</li>
                    <li>The party preserves magical knowledge that would otherwise be lost.</li>
                    <li>Two or more party members spend an evening discussing magic, sharing techniques, or teaching one
                        another a skill or language.</li>
                </ul>

                <h3>Disfavor Criteria</h3>

                <ul>
                    <li>The party deliberately destroys valuable magical knowledge.</li>
                    <li>A party member uses magic recklessly when safer alternatives were readily available.</li>
                    <li>They knowingly allow dangerous magical corruption or instability to spread.</li>
                </ul>

                <h3>Boons</h3>

                <p><strong>Minor Boon (FP 3-5): Arcane Intuition.</strong> Party members re-roll any 1s on Intelligence
                    (Arcana) checks.</p>

                <p><strong>Boon (FP 6-9): Weave's Writings.</strong> Scribing scrolls takes half the time.</p>

                <p><strong>Major Boon (FP 10): Magical Discoveries.</strong> Once per week (resetting on Hephdach), the
                    party can choose one level 2 or lower spell. Each member of the party can cast that spell once
                    before their next long rest.</p>

                <h3>Woes</h3>

                <p><strong>Minor Woe (FP -3 to -4): Tangled Threads.</strong> Once per long rest when a party member
                    casts a
                    spell using a tertiary spell slot, the player must roll on the Wild Magic Surge table.</p>

                <p><strong>Greater Woe (FP -5): Frayed Strings.</strong> Oncer per week, (resetting on Bahaphay) when
                    the party takes a long rest any party members with spellcasting regain one less primary slot</p>

                <hr>

                <h2>Myrkul</h2>

                <p><em>Death, Patron of Corruption and Undeath</em></p>

                <p>Myrkul rejects death's finality, believing that every corpse, every memory, and every fragment of
                    life should continue serving his purpose. To his faithful, mortality is simply another resource
                    waiting to be exploited.</p>

                <p><strong>Domains:</strong> Undeath, decay, corruption, necromancy, remembrance<br>
                    <strong>Worship Method:</strong> Ideals
                </p>

                <h3>Favor Criteria</h3>

                <ul>
                    <li>The party willingly allies with an undead creature.</li>
                    <li>They recover an ancient corpse or relic of the dead for preservation rather than destruction.
                    </li>
                    <li>A party member willingly accepts lasting physical corruption in pursuit of a greater goal.</li>
                    <li>Two or more party members discuss what they would sacrifice to escape death.</li>
                    <li>Two or more party members speak openly about how they wish to be remembered after death.</li>
                </ul>

                <h3>Disfavor Criteria</h3>

                <ul>
                    <li>They consecrate or purify places steeped in necromantic power.</li>
                    <li>The party aids Gri's faithful in laying restless spirits to rest.</li>
                </ul>

                <h3>Boons</h3>

                <p><strong>Minor Boon (FP 3-5): Grave Stakes.</strong> Once per long rest, the first death saving throw
                    a party member makes gains an additional 1d4 bonus.</p>

                <p><strong>Boon (FP 6-9): Funeralopolis.</strong> CR 2 and lower undead are not automatically hostile to
                    the party. If their creator directed them to be hostile to all enemies or the party specifically,
                    this Boon has no effect.</p>

                <p><strong>Major Boon (FP 10): Pulled Under.</strong> Once per week (resetting on Bahaphay), when a
                    humanoid dies within 60 feet of a party member, one party member may immediately cast <em>Animate
                        Dead</em> without expending a spell slot or material components. The undead remains animated
                    until the next dawn, after which it peacefully collapses into an ordinary corpse.</p>

                <h3>Woes</h3>

                <p><strong>Minor Woe (FP -3 to -4): Rotted.</strong> Whenever a party member regains hit points
                    during a short rest, reduce the total regained by their proficiency bonus.</p>

                <p><strong>Greater Woe (FP -5): Fatal Tragedy.</strong> Once per long rest, when a party member rolls a
                    Death Saving Throw, a result of 16-20 is re-rolled.</p>

                <hr>

                <h2>Wryth</h2>

                <p><em>The Empress, Patron of Savagery</em></p>

                <p>Before cities were raised and kings crowned, Wryth ruled the wild places. She appears as a towering
                    woman draped in the hides and antlers of beasts. She teaches that civilization has dulled mortal
                    instinct. To survive is to trust body, blood, and intuition over law or comfort.</p>

                <p><strong>Domains:</strong> Wilderness, instinct, beasts, survival, primality<br>
                    <strong>Worship Method:</strong> Discipline 
                </p>

                <h3>Favor Criteria</h3>

                <ul>
                    <li>The party survives in the wilderness for at least one day without relying upon civilized
                        comforts or lodging.</li>
                    <li>A party member hunts, fishes, or forages for sustenance.</li>
                    <li>Two or more party members share a meal prepared from game they harvested themselves and thank
                        Wryth.</li>
                    <li>The party chooses instinct over convention, succeeding where careful planning would have failed.
                    </li>
                </ul>

                <h3>Disfavor Criteria</h3>

                <ul>
                    <li>The party kills beasts for sport.</li>
                    <li>They exploit nature in a way that leaves lasting devastation.</li>
                    <li>The party refuses to face a natural challenge through cowardice or needless luxury.</li>
                </ul>

                <h3>Boons</h3>

                <p><strong>Minor Boon (FP 3-5): Hunter's Respite.</strong> If the party eats food gathered from nature
                    during a long rest, the hit point maximum of all members is increased by their proficiency bonus
                    until the next long rest.</p>

                <p><strong>Boon (FP 6-9): Wild Ones.</strong> Party members gain the ability to communicate simple ideas
                    to beasts, though they have no power to understand them in turn.</p>

                <p><strong>Major Boon (FP 10): Speech of Beasts.</strong> Party members are always under the effects of
                    the <em>Speak with Animals</em> spell, though it does not show up in magical detection.
                    Additionally, a party member can cast the spell <em>Beast Sense</em> without expending a spell slot
                    once per long rest.</p>

                <h3>Woes</h3>

                <p><strong>Minor Woe (FP -3 to -4): Lost Instinct.</strong> Party members cannot have advantage on
                    Wisdom (Animal Handling) checks.</p>

                <p><strong>Greater Woe (FP -5): Stench.</strong> Beasts begin reacting uneasily to the party.
                    Non-magical beasts are initially indifferent at best and become hostile if threatened or cornered.
                </p>

                <hr>

                <h2>Hephaestus</h2>

                <p><em>The Chariot, Patron of the Forge</em></p>

                <p>Dwarves and Gnomes derive their great craftsmanship skills from their patron god Hephaestus.
                    Hephaestus is so bound to his own principles of creativity and design that he is known to have
                    cursed entire peoples who dare slight his gifts.</p>

                <p><strong>Domains:</strong> Smithing, invention, ingenuity, dedication, Dwarves, Gnomes<br>
                    <strong>Worship Method:</strong> Discipline 
                </p>

                <h3>Favor Criteria</h3>

                <ul>
                    <li>A party member repairs damaged equipment rather than replacing it.</li>
                    <li>The party carves Hephaestian runes into their equipment.</li>
                    <li>Two or more party members spend downtime working together to build, repair, or improve
                        equipment.</li>
                    <li>A party member goes the extra mile and adds personal flair to a project.</li>
                    <li>The party solves a problem through ingenuity rather than brute force.</li>
                </ul>

                <h3>Disfavor Criteria</h3>

                <ul>
                    <li>The party destroys an important work of craftsmanship unnecessarily.</li>
                    <li>They abandon useful tools or equipment through neglect.</li>
                    <li>The party rejects honest labor.</li>
                </ul>

                <h3>Boons</h3>

                <p><strong>Minor Boon (FP 3-5): Between the Hammer and the Anvil.</strong> Mentorship ability checks to
                    learn Tool (Artisan's Tools only) or Weapon proficiencies have advantage.</p>

                <p><strong>Boon (FP 6-9): Masterwork.</strong> Crafting an object takes half the time.</p>

                <p><strong>Major Boon (FP 10): Sharp Minds and Blades.</strong> Party members add 2d6 to Intelligence
                    checks dealing with tools, weapons, or masonry.</p>

                <h3>Woes</h3>

                <p><strong>Minor Woe (FP -3 to -4): Dull.</strong> Mentorship ability checks to learn Tool (Artisan's
                    Tools only) or Weapon proficiencies have disadvantage.</p>

                <p><strong>Greater Woe (FP -5): Cold Forge.</strong> Crafting an object takes double the time.</p>

                <h2>Chronicle</h2>

                <p><em>The Hierophant, Patron of Scrolls</em></p>

                <p>Before kingdoms built monuments of stone, Chronicle preserved them in ink. Every treaty, every map,
                    every family lineage, and every hero's final words pass across parchment. He teaches that memory is
                    civilization's greatest defense against repeating its failures.</p>

                <p><strong>Domains:</strong> History, writing, records, memory, scholarship<br>
                    <strong>Worship Method:</strong> Discipline 
                </p>

                <h3>Favor Criteria</h3>

                <ul>
                    <li>The party records an important event, discovery, or battle in writing.</li>
                    <li>A party member spends downtime copying or translating a written work.</li>
                    <li>Two or more party members share parts of their people's history.</li>
                    <li>The party saves an important record or piece of knowledge.</li>
                </ul>

                <h3>Disfavor Criteria</h3>

                <ul>
                    <li>The party deliberately destroys books, records, or historical artifacts without necessity.</li>
                    <li>They knowingly spread false history for personal gain.</li>
                    <li>They allow important knowledge to be permanently lost.</li>
                </ul>

                <h3>Boons</h3>

                <p><strong>Minor Boon (FP 3-5): Written Twice.</strong> Mentorship ability checks to learn Languages and
                    Skill proficiencies have Advantage.</p>

                <p><strong>Boon (FP 6-9): Living Record.</strong> Once per long rest, a party member may perfectly
                    recall any conversation, document, symbol, or scene the party has witnessed within the last month.
                    The recollection includes details the players themselves may have forgotten, subject to the DM's
                    notes.</p>

                <p><strong>Major Boon (FP 10): Chronicle's Lesson.</strong> Once per week (resetting on Hephdach), after
                    completing a long rest, two willing party members may each exchange one Skill Proficiency they
                    possess with the other until their next long rest. Neither gains a proficiency they already possess.
                </p>

                <h3>Woes</h3>

                <p><strong>Minor Woe (FP -3 to -4): Fade.</strong> Once per day, when a party member attempts to recall
                    an important detail, the DM may omit one meaningful piece of information they would otherwise
                    remember.</p>

                <p><strong>Greater Woe (FP -5): Forgotten Names.</strong> Mentorship ability checks to learn Languages
                    and Skill proficiencies have Disadvantage.</p>

                <hr>

                <h2>Keep</h2>

                <p><em>The Star, Patron of Dreams</em></p>

                <p>Each star in the night sky represents the memory of a great or terrible person, and all the entropy
                    associated with them. When a mortal sleeps, their soul briefly drifts to this world. Some remember
                    only fragments upon waking; others return carrying impossible ideas, forgotten memories, or glimpses
                    of futures that may never come to pass. Keep urges his followers to look within themselves and find
                    what they must pursue.</p>

                <p><strong>Domains:</strong> Dreams, hope, prophecy, sleep, imagination<br>
                    <strong>Worship Method:</strong> Ideals 
                </p>

                <h3>Favor Criteria</h3>

                <ul>
                    <li>The party encourages another creature to pursue a hope or ambition.</li>
                    <li>A party member journals their dreams.</li>
                    <li>Two or more party members discuss what they hope their futures will become.</li>
                </ul>

                <h3>Disfavor Criteria</h3>

                <ul>
                    <li>The party crushes another creature's aspirations.</li>
                    <li>They abandon hope despite meaningful opportunity remaining.</li>
                    <li>A party member knowingly betrays their own deeply held ideals.</li>
                </ul>

                <h3>Boons</h3>

                <p><strong>Minor Boon (FP 3-5): Awakened.</strong> The party cannot be surprised during long rests.</p>

                <p><strong>Boon (FP 6-9): Stars Yet Unwritten.</strong> Once per week (resetting on Same'ih), after
                    completing a long rest, the party may ask the DM one question about a significant choice they expect
                    to face before their next long rest. The answer comes as a symbolic shared dream. It is truthful,
                    but never literal, and reveals possibility rather than certainty.</p>

                <p><strong>Major Boon (FP 10): Tomorrow's Dream.</strong> Once per long rest, the party can cast
                    <em>Dream</em> as a ritual spell.
                </p>

                <h3>Woes</h3>

                <p><strong>Minor Woe (FP -3 to -4): Restless Night.</strong> Once per day, when a party member completes
                    a long rest, they awaken remembering unsettling dreams. The first Wisdom or Charisma saving throw
                    they make that day suffers a 1d4 penalty.</p>

                <p><strong>Greater Woe (FP -5): Living Bad Dreams.</strong> Once per week (resetting on Same'ih), one
                    player has a nightmare involving a damage type during a long rest. The following day, the first time
                    that character takes damage of that type, they have vulnerability to it.</p>

                <hr>

                <h2>Mil</h2>

                <p><em>The Fool, Patron of the Fey</em></p>

                <p>No one agrees whether Mil is the oldest of the Fey or simply the strongest. They wander the Feywild
                    wearing a different face every season, inspiring great fear and wonder alike. Mil's creations are
                    known by their beguiling behavior and terrifying actions unto those who offend them.</p>

                <p><strong>Domains:</strong> Fey, curiosity, whimsy, transformation, revelry, Firbolgs<br>
                    <strong>Worship Method:</strong> Ideals 
                </p>

                <h3>Favor Criteria</h3>

                <ul>
                    <li>The party chooses the more interesting path over the safer or more practical one.</li>
                    <li>A party member plays a harmless prank.</li>
                    <li>The party accepts hospitality from Fey.</li>
                    <li>The party repays kindness with an unexpected act of generosity or delight.</li>
                </ul>

                <h3>Disfavor Criteria</h3>

                <ul>
                    <li>The party destroys something beautiful simply because it is inconvenient.</li>
                    <li>They reject curiosity.</li>
                    <li>A party member knowingly breaks a promise made to a Fey.</li>
                </ul>

                <h3>Boons</h3>

                <p><strong>Minor Boon (FP 3-5): Fey Friends.</strong> Party members never suffer disadvantage when
                    making Charisma (Persuasion) checks.</p>

                <p><strong>Boon (FP 6-9): Mil's Masquerade.</strong> When an Enchantment spell cast by a party member
                    dictates that the target knows it was enchanted, they do not know until they finish a long rest.</p>

                <p><strong>Major Boon (FP 10): Mine Now!</strong> Once per week (resetting on Frejdag), a party member
                    can steal a person's name for one day if the creature reads it aloud in full. While their name is
                    stolen, the party member can either choose to have that person charmed or steal their appearance as
                    if with the <em>Alter Self</em> spell.</p>

                <h3>Woes</h3>

                <p><strong>Minor Woe (FP -3 to -4): Humor Me.</strong> Once per day, when a party member makes a saving
                    throw against an Enchantment spell, that roll has 1d4 subtracted.</p>

                <p><strong>Greater Woe (FP -5): What's His Face.</strong> Once per week (resetting on Frejdag), the DM
                    secretly chooses one party member. Until their next long rest, creatures cannot remember that
                    creature's name.</p>

                <hr>

                <h2>Meddle</h2>

                <p><em>Justice, Patron of Fate</em></p>

                <p>In the year 920 the great elvish king was desperately looking for ways to save his kingdom, his last
                    hope being a seamstress of Meddle in a far-off village. After pleading for days, he eventually
                    resorted to the only method he knew, but before his hand could reach the hilt of his sword, the last
                    of his great capital and body had crumbled to dust.</p>

                <p><strong>Domains:</strong> Fate, consequence, destiny, Divination<br>
                    <strong>Worship Method:</strong> Ideals 
                </p>

                <h3>Favor Criteria</h3>

                <ul>
                    <li>A party member gets their fortune told.</li>
                    <li>The party ensures that a wronged creature receives meaningful justice.</li>
                    <li>The party fulfills a costly promise despite having an easy opportunity to escape it.</li>
                    <li>Two or more party members openly acknowledge one another's mistakes and choose a fair
                        resolution.</li>
                    <li>The party restores balance between two feuding groups.</li>
                </ul>

                <h3>Disfavor Criteria</h3>

                <ul>
                    <li>The party knowingly allows a grievous injustice to stand for personal convenience.</li>
                    <li>A party member shifts blame they know belongs to themselves.</li>
                    <li>The party attempts to manipulate fate via fiendish or celestial entities.</li>
                    <li>The party dissuades an NPC from following what they believe is their fate.</li>
                </ul>

                <h3>Boons</h3>

                <p><strong>Minor Boon (FP 3-5): Weal.</strong> Once per long rest, after a party member rolls a natural
                    1 on an attack roll, ability check, or saving throw, they gain Advantage on the next d20 test they
                    make before the end of their turn.</p>

                <p><strong>Boon (FP 6-9): In the Cards.</strong> Subsequent castings of the <em>Augury</em> spell do not
                    have the normal 25% cumulative penalty as long as a spell slot was spent when the spell was cast.
                    Additionally, <em>Augury</em> now affects the next 2 hours, and the <em>Intuition</em> feat can be
                    used three times before a long rest.</p>

                <p><strong>Major Boon (FP 10): Through Her Eyes.</strong> Once per week (resetting on Lucae),
                    immediately after a creature within 60 feet succeeds on an attack roll, saving throw, or ability
                    check through magical assistance, luck manipulation, or Legendary Resistance, the party may invoke
                    Meddle's judgment. The creature must immediately repeat the roll without those benefits and use the
                    new result.</p>

                <h3>Woes</h3>

                <p><strong>Minor Woe (FP -3 to -4): Woe.</strong> Once per long rest, after a party member rolls a
                    natural 20 on an attack roll, ability check, or saving throw, they have Disadvantage on the next d20
                    test they make before the end of their turn.</p>

                <p><strong>Greater Woe (FP -5): Born Under a Bad Sign.</strong> Once per week (resetting on Lucae), the
                    DM gives a mundane sign of misfortune such as a broken mirror, black bird, red moon, etc. If the
                    party fails to recognize the omen, they have disadvantage on their next initiative roll. Regardless
                    of whether the omen is recognized, the DM does not reveal if the omen was caused by this woe.</p>

                <hr>

                <h2>Bahamut</h2>

                <p><em>Judgment, Patron of Loyalty</em></p>

                <p>Although the Dragon clans of the southern continent are constantly warring with one another, each
                    family is bound by the same oath which dictates how laws are laid, battles are fought, and robes are
                    passed on. Bahamut judges communities as individuals, believing that greatness is measured by what a
                    people build together across generations.</p>

                <p><strong>Domains:</strong> Loyalty, honor, family, Dragons<br>
                    <strong>Worship Method:</strong> Ideals
                </p>

                <h3>Favor Criteria</h3>

                <ul>
                    <li>A party member willingly places themselves in danger to protect another party member.</li>
                    <li>The party refuses to abandon an ally despite significant personal cost.</li>
                    <li>A party member invokes their ancestors before an undertaking.</li>
                    <li>Two or more party members openly express gratitude or admiration for one another.</li>
                    <li>The party reconciles after genuine disagreement.</li>
                </ul>

                <h3>Disfavor Criteria</h3>

                <ul>
                    <li>A party member knowingly betrays an ally's trust.</li>
                    <li>The party abandons a companion when rescue was reasonably possible.</li>
                    <li>The party destroys an heirloom.</li>
                    <li>A party member breaks an oath.</li>
                </ul>

                <h3>Boons</h3>

                <p><strong>Minor Boon (FP 3-5): Faithful Companions.</strong> When a creature makes a d20 test with
                    Advantage due to the Help action, they re-roll any 1s.</p>

                <p><strong>Boon (FP 6-9): Stand Together.</strong> Death saving throws gain a bonus equal to one-third
                    of the party's favor points with Bahamut as long as the dying party member is within 10 feet of a
                    party member with at least 1 hit point.</p>

                <p><strong>Major Boon (FP 10): Platinum Bond.</strong> Once per week (resetting on Lucae), the party can
                    cast the spell <em>Summon Dragon</em> as a 10-minute ritual. The dragon requires no concentration,
                    is controlled by the DM or a player who chooses to do so, and rolls its own initiative.</p>

                <h3>Woes</h3>

                <p><strong>Minor Woe (FP -3 to -4): Shunned.</strong> The party can never have Advantage when
                    interacting with Dragonborn or Dragons.</p>

                <p><strong>Greater Woe (FP -5): Divided Hearts.</strong> Once per week, the DM may declare that a
                    community or organization the party would normally find welcoming instead receives them with
                    suspicion until they prove themselves.</p>

                <h2>Tempo</h2>

                <p><em>Temperance, Patron of Time</em></p>

                <p>Tempo's followers record the erosion of rivers, the growth of trees, and the passage of kingdoms as
                    their sermons. They believe life and the world have their own rhythms, and that those who rush ahead
                    of the beat will find themselves left behind.</p>

                <p><strong>Domains:</strong> Time, aging, patience, age, cycles<br>
                    <strong>Worship Method:</strong> Discipline
                </p>

                <h3>Favor Criteria</h3>

                <ul>
                    <li>The party solves a problem through patience rather than haste.</li>
                    <li>A party member spends meaningful downtime practicing or cultivating a long-term pursuit.</li>
                    <li>Two or more party members reflect on how they have changed since beginning their journey.</li>
                    <li>The party restores something old instead of replacing it.</li>
                </ul>

                <h3>Disfavor Criteria</h3>

                <ul>
                    <li>The party's impatience directly causes harm.</li>
                    <li>They repeatedly abandon their endeavors because results are not immediate.</li>
                    <li>A party member disrespects the wisdom of elders or the perspective of youth.</li>
                </ul>

                <h3>Boons</h3>

                <p><strong>Minor Boon (FP 3-5): A Moment Longer.</strong> Party members can comfortably remain awake for
                    an additional 8 hours before risking exhaustion from lack of sleep.</p>

                <p><strong>Boon (FP 6-9): Premonition.</strong> Once per long rest, a party member may choose to roll
                    1d20 at the start of their turn. The next d20 test they make before the end of their turn uses that
                    roll.</p>

                <p><strong>Major Boon (FP 10): Borrowed Time.</strong> Once per week (resetting on Bahaphay), when a
                    party member is reduced to 0 hit points, time briefly hesitates around them and they immediately
                    take their turn, falling to 0 hit points when their turn finishes regardless of any healing received
                    during this time.</p>

                <h3>Woes</h3>

                <p><strong>Minor Woe (FP -3 to -4): Out of Step.</strong> Once per day, the first Initiative roll made
                    by a party member suffers a 1d4 penalty.</p>

                <p><strong>Greater Woe (FP -5): Take the Time.</strong> Once per week (resetting on Bahaphay), the party
                    only gets one short rest between long rests.</p>

                <hr>

                <h2>Leviathan</h2>

                <p><em>Primordial Titan of Water, the Unstoppable Force</em></p>

                <p>Leviathan is the elemental titan of all waters, from the placid surface of a forest pond to the
                    ship-cracking fury of a maelstrom. Followers of Leviathan are equal parts naturalists and sailors
                    who fear his terrible wrath, usually only quelled by a sacrifice to the waves.</p>

                <p><strong>Domains:</strong> Water, oceans, storms, the natural cycle, balance, the deep, Tritons<br>
                    <strong>Worship Method:</strong> Ideals 
                </p>

                <h3>Favor Criteria</h3>

                <ul>
                    <li>The party cleanses a polluted water source or prevents an impending contamination.</li>
                    <li>They offer a meaningful gift to a body of water before a voyage (a coin, a ration, a drop of
                        their own blood).</li>
                    <li>They defeat a creature or force that seeks to control harm aquatic environments for gain.</li>
                </ul>

                <h3>Disfavor Criteria</h3>

                <ul>
                    <li>The party pollutes a body of water.</li>
                    <li>The party hunts aquatic creatures for sport.</li>
                    <li>They aid a creature or force that seeks to control harm aquatic environments for gain.</li>
                </ul>

                <h3>Boons</h3>

                <p><strong>Minor Boon (FP 3-5): Calm Waters.</strong> Once per long rest, the party can will a small
                    body of water (a lake, cove, or river stretch) to become preternaturally calm for 1 hour. Water
                    vehicles within the area gain advantage on all checks to navigate or remain upright, and seasickness
                    is suppressed entirely among the party and their allies.</p>

                <p><strong>Boon (FP 6-9): Tidal Surge.</strong> Once per week (resetting on Prydei), the DM may cast the
                    spell <em>Control Water</em> to the party's benefit.</p>

                <p><strong>Major Boon (FP 10): Children of the Sea.</strong> Once per long rest, a party member can cast
                    the spell <em>Summon Elemental</em> as a 10-minute ritual.</p>

                <h3>Woes</h3>

                <p><strong>Minor Woe (FP -3 to -4): Unsettled Seas.</strong> Once per day, whenever the party travels on
                    or near water, the water becomes unnaturally choppy. All Dexterity (Acrobatics) checks and
                    concentration saving throws made while on a boat have disadvantage until the party sets foot on dry
                    land.</p>

                <p><strong>Greater Woe (FP -5): Maelstrom’s Wrath.</strong> Once per week (resetting on Prydei), one
                    party member who enters a body of water is immediately attacked by 1d4 Water Weirds.</p>

                <hr>

                <h2>Kaori</h2>

                <p><em>Primordial Titan of Fire, Phoenix Mother</em></p>

                <p>Kaori is the elemental titan of fire. In the millennium since the war with the gods, she has been
                    largely dormant. Defeat at the hands of Sol left her wounded in body and spirit, and she now sits in
                    her elemental plane in a state of quiet melancholy. Yet she remains a titan, and those who seek
                    rebirth, renewal, or the courage to rise from ash will find her embers still warm.</p>

                <p><strong>Domains:</strong> Fire, rebirth, pyrotechnics, renewal<br>
                    <strong>Worship Method:</strong> Ideals 
                </p>

                <h3>Favor Criteria</h3>

                <ul>
                    <li>The party prevents the unnatural suppression or extinction of a natural fire (a volcanic vent, a
                        sacred flame, an eternal pyre).</li>
                    <li>They aid a creature or community seeking genuine rebirth or reinvention.</li>
                    <li>They offer something meaningful to a fire before a journey: a written regret, a lock of hair, a
                        dry branch.</li>
                    <li>Two or more party members sit vigil together through a long night, speaking of what they wish to
                        leave behind and what they hope to become.</li>
                </ul>

                <h3>Disfavor Criteria</h3>

                <ul>
                    <li>They mock or dismiss someone's sincere attempt to change or begin anew.</li>
                    <li>They use fire to torture, terrorize, or destroy.</li>
                </ul>

                <h3>Boons</h3>

                <p><strong>Minor Boon (FP 3-5): Burnin' For You.</strong> When a party member takes fire damage, they
                    add a d4 to their next attack roll before the end of their next turn.</p>

                <p><strong>Boon (FP 6-9): Phoenix Heart.</strong> When the party finishes a short rest near any flame (a
                    campfire, a candle, a torch), each member regains an additional PB x 1d4 hit points.</p>

                <p><strong>Major Boon (FP 10): From The Fires.</strong> Once per week (resetting on Prydei), when a
                    party member is reduced to 0 hit points, they regain 1 hit point immediately and have the spell
                    <em>Fire Shield</em> (warm) cast on them until the start of their next turn.
                </p>

                <h2>Ao</h2>

                <p><em>Primordial Titan of Air, Whisper</em></p>

                <p>Ao is the elemental titan and wyvern of air. Unlike Leviathan's silent depth or Kaori's wounded
                    stillness, Ao is carefree, curious, and utterly indifferent to mortal consequence. Ao has fleeting
                    memory, and the past actions of the gods bear no power over his conscious.</p>

                <p><strong>Domains:</strong> Air, wind, sky, sound, freedom, caprice<br>
                    <strong>Worship Method:</strong> Ideals 
                </p>

                <h3>Favor Criteria</h3>

                <ul>
                    <li>The party destroys or disables a device or spell designed to control the weather or bind air
                        elementals.</li>
                    <li>The party plays a harmless prank.</li>
                    <li>The party defeats a creature that imprisons others.</li>
                    <li>Two or more party members spend an evening doing something just for the fun of it.</li>
                </ul>

                <h3>Disfavor Criteria</h3>

                <ul>
                    <li>The party is cruel to or harms a flying beast.</li>
                    <li>They mock the idea of being carefree.</li>
                </ul>

                <h3>Boons</h3>

                <p><strong>Minor Boon (FP 3-5): Air Dance.</strong> When a party member, ally, or object falls from a
                    height tall enough to deal fall damage, the DM rolls 1d6. On a 2-6, the spell <em>Feather Fall</em>
                    is cast on the target.</p>

                <p><strong>Boon (FP 6-9): The Wind Cries Mary.</strong> Once per week (resetting on Prydei), the DM may
                    allow the party to send a message as if by the <em>Sending</em> spell, carried on a gust of wind to
                    any creature they have met. The reply arrives within 1 minute as a soft breeze that speaks directly
                    into the recipient's ear. Additionally, the DM may use this boon to deliver a cryptic hint or rumor
                    to the party from Ao's rambling consciousness.</p>

                <p><strong>Major Boon (FP 10): Flying High Again.</strong> All party members have a hover speed equal to
                    their walking speed.</p>

                <h3>Woes</h3>

                <p><strong>Minor Woe (FP -3 to -4): Blowin' in the Wind.</strong> Once per day, when a party member
                    attempts a Dexterity (Acrobatics) check, they must subtract 1d4 from the roll.</p>

                <p><strong>Greater Woe (FP -5): Zephyr's Prank.</strong> Once per week (resetting on Prydei), the DM
                    casts the spells <em>Wind Wall</em> or <em>Control Winds</em> on the party in a way which hampers
                    them.</p>

                <hr>

                <h2>Aeon</h2>

                <p><em>Primordial Titan of Earth, the Unmovable Object</em></p>

                <p>Aeon is the oldest being in the planescape, the great stone Gaia is just an extension of themself,
                    now cast off as they reside in their extraplanar prison. The other Titans view the great Wyrm as
                    simple, but Aeon processes time at a much quicker rate than all others leading them to view all
                    things as fickle.</p>

                <p><strong>Domains:</strong> Earth, stone, mountains, stability, endurance<br>
                    <strong>Worship Method:</strong> Ideals (defending nature and the earth’s integrity)
                </p>

                <h3>Favor Criteria</h3>

                <ul>
                    <li>The party prevents a mining operation that threatens a sacred mountain, cavern, or underground
                        ecosystem.</li>
                    <li>They stop a creature or force that unnaturally destabilizes the ground (subsidence, magical
                        earthquakes, burrowing horrors that collapse settlements).</li>
                    <li>Two or more party members meditate in a cave or on bare rock for a full watch.</li>
                </ul>

                <h3>Disfavor Criteria</h3>

                <ul>
                    <li>The party deliberately collapses a cave or stone structure that holds natural beauty or homes.
                    </li>
                    <li>They desecrate an ancient menhir circle, burial cairn, or petrified forest.</li>
                    <li>The party abuses wildlife residing in caves or soil.</li>
                </ul>

                <h3>Boons</h3>

                <p><strong>Minor Boon (FP 3-5): Surefooted.</strong> Party members have Advantage on saving throws
                    against the prone condition as long as they are standing on natural stone.</p>

                <p><strong>Boon (FP 6-9): Earthen Eyes.</strong> If a party member closes their eyes and meditates
                    calmly for one hour, they gain Tremorsense out to 500 feet while doing nothing but meditating.</p>

                <p><strong>Major Boon (FP 10): Turn to Stone.</strong> Once per week (resetting on Bahaphay), the party
                    can cast the spell <em>Meld into Stone</em> as a ritual, affecting the entire party at once. While
                    merged, they can sense the vibrations of any creature moving on the stone within 100 feet.
                    Additionally, once during that merge, one party member can cast <em>Stoneskin</em> on themselves
                    without expending a spell slot.</p>

                <h3>Woes</h3>

                <p><strong>Minor Woe (FP -3 to -4): Loose Ground.</strong> Once per day, when a party member takes the
                    Dash action on natural ground, the DM may have the earth shift underfoot. The character must succeed
                    on a DC 12 Dexterity saving throw or fall prone.</p>

                <p><strong>Greater Woe (FP -5): Trembling Earth.</strong> Once per week (resetting on Prydei), when the
                    party takes a long rest in a natural cave, ruin, or overland camp, the earth shakes violently for 1
                    minute. The tremor extinguishes open flames, scatters loose gear, and forces a DC 15 Constitution
                    saving throw from each party member to gain any benefit from the rest. On a failure, the rest counts
                    as a short rest instead.</p>
